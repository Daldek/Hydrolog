steps_representable = "Td / dt <= 1 000 000: najwyżej milion kroków"
whole_steps = "Td = n dt dla całkowitego n, z dokładnością do 1e-9 Td: deszcz składa się z całych kroków"
curve_covers = "D_1 <= dt i D_m >= Td: krzywa sięga od kroku do czasu trwania deszczu, niczego się nie ekstrapoluje"

[rules.weighted_cn]
en_sha256 = "68175470053f85d97a7c34ee622ff14945e2367d5cbaaddaea588e96c679ddf0"
title = "Liczba CN ważona powierzchnią"
definition = "CN_w = sum(A_j CN_j) / sum(A_j), średnia ważona powierzchnią liczb CN części zlewni"
convention = "powierzchnie lub udziały w dowolnej, ale jednej jednostce; część o zerowej powierzchni nie wnosi nic"

[rules.hydrograph_volume]
en_sha256 = "902748c6ef83042920db2aa1f919ceb4ea3de89d22253a104c98aa152b43a1e7"
title = "Objętość hydrogramu"
definition = "objętość pod rzędnymi obliczona metodą trapezów: krok czasowy razy suma rzędnych, w której pierwszą i ostatnią bierze się z połową wagi, w m³"
convention = "przepływ zmienia się liniowo między rzędnymi; minuty przelicza się na sekundy według tabeli jednostek"

[rules.hydrograph_refinement]
en_sha256 = "e7dc97318c75b5d084700a2a1cebf652f291fd20352f7214e4112245f0b667b0"
title = "Zagęszczenie kroku czasowego hydrogramu"
definition = "hydrogram na kroku podzielonym na równe podkroki, z nowymi rzędnymi na odcinkach prostych między dotychczasowymi"
convention = "dotychczasowe rzędne zachowuje się dokładnie, a objętość się nie zmienia; wynik schematu liczonego na podkrokach odczytuje się z powrotem w chwilach pierwotnych rzędnych"

[rules.hydrograph_extension]
en_sha256 = "769812de7433c02389c575c2de2f8deb216557ff3e53fd969ce3283a923f3e57"
title = "Wydłużenie hydrogramu"
definition = "hydrogram z krokami dodanymi po ostatniej rzędnej, każdy z ostatnią wartością (albo z wartością podaną)"
convention = "dopływ po końcu zapisu jest równy jego ostatniej wartości, jak zakłada wydłużenie osi czasu w transformacji fali"

[rules.routing_initial_state]
en_sha256 = "10161232ced36cdfb3db40ea3a7c36e293dbf2058347c5fb79fa87cc4f1a7359"
title = "Stan początkowy transformacji fali"
definition = "odpływ w chwili pierwszej rzędnej: podany odpływ początkowy, a w przeciwnym razie pierwsza rzędna dopływu; każdy pododcinek, zbiornik lub zbiornik liniowy elementu startuje z tym odpływem w stanie ustalonym (spoczynku)"
convention = "stan ustalony na początku (HEC-HMS inicjalizuje odcinek jego dopływem); podany odpływ początkowy jest skończony i nieujemny"

[rules.routing_tail]
en_sha256 = "dcae128c1aad4a9ec7e4af206d78ba1261b11b12755cb0a9f4d5640550a9282b"
title = "Wydłużenie osi czasu transformacji fali po końcu dopływu"
definition = "najkrótsze wydłużenie osi czasu, przy utrzymanym ostatnim dopływie, po którym odpływ różni się od końcowego dopływu najwyżej o tolerancję (względem kulminacji dopływu), a woda zmagazynowana ponad ilość w stanie ustalonym nie przekracza tolerancji objętości dopływu (albo nadwyżki, z którą element startował, gdy jest ona większa); wydłużenie wynosi najwyżej dziesięciokrotność czasu trwania dopływu i co najmniej minimalną liczbę kroków"
convention = "dopływ po jego ostatniej rzędnej jest równy ostatniej wartości; odpływ, który nie ustalił się do osiągnięcia limitu, daje ostrzeżenie `tail_truncated`"

[rules.routing_tail.constants]
tail_tolerance = "Względna tolerancja ustalenia odpływu i retencji"
min_extension_steps = "Minimalna liczba kroków wydłużenia osi czasu"

[rules.routing_volume_balance]
en_sha256 = "383ca714a41d8c5df60fa211b5057a88c3f93c911032b73235e066a49e15d97f"
title = "Błąd bilansu objętości transformacji fali"
definition = "objętość dopływu na wydłużonej osi czasu (z utrzymanym ostatnim dopływem) minus objętość odpływu minus retencja na końcu plus retencja na początku, każda objętość obliczona metodą trapezów"
convention = "zero z dokładnością do zaokrągleń dla rekurencji na pierwotnym kroku; w pozostałych przypadkach błąd próbkowania metody trapezów po podziale na podkroki, błąd kwadratury ścisłego jądra (kaskada) albo interpolowanego opóźnienia"

[rules.muskingum_subreaches]
en_sha256 = "82b8d5d72be9412a10ca7a3766b939e85052f1d778c8f07c0bd8e151251f02e3"
title = "Liczba pododcinków w metodzie Muskingum"
definition = "liczby całkowite N jednakowych pododcinków, przy których wagi są nieujemne dla kroku dt, ceil(2KX/dt) <= N <= floor(2K(1 - X)/dt), każdy koniec z dokładnością do 1e-9 swojej wartości; `MuskingumReach` transformuje z N = K/dt zaokrąglonym (połowa w górę, co najmniej 1), które leży w oknie zawsze, gdy leży w nim jakakolwiek liczba całkowita, a krok, dla którego nie ma okna, dzieli na najmniejszą liczbę od 2 do 100 jednakowych podkroków, dla której okno istnieje, przy dopływie liniowym między rzędnymi"
convention = "czas przepływu przez pododcinek wynosi około jednego kroku czasowego (HEC-HMS); liczby pododcinków podanej przez wywołującego nigdy się nie zmienia: poza oknem jest odrzucana (`unstable_timestep`, ADR-0008)"

[rules.cascade_time_scale]
en_sha256 = "99aba7bcdf1086a150a4b437924f217ea143873aeb8a2b7707af07f9baa22eff"
title = "Stała retencji kaskady z długości odcinka i prędkości fali"
definition = "stała retencji jednego zbiornika wyznaczona z długości L odcinka i prędkości c fali wezbraniowej, K = L / (n c): czas przepływu L / c jest średnim opóźnieniem n K kaskady; L w km i c w m/s przeliczane według tabeli jednostek (1 km = 1000 m, 1 min = 60 s)"
convention = "K podaje się wprost albo wyznacza z L i c, nigdy oba naraz (`details.reason` `one_of`); Kalinin i Milukow przyjmują n jako L podzielone przez długość charakterystyczną Q / (T S0 c)"

[rules.muskingum_cunge_rise]
en_sha256 = "b15858da0ecf54e6da325b3f95b1e04e6acb144ea99250b52680974855bbb138"
title = "Czas wznoszenia fali w metodzie Muskingum-Cunge"
definition = "liczba kroków od rzędnej poprzedzającej pierwszą rzędną powyżej 5 % kulminacji dopływu do pierwszej kulminacji wynoszącej co najmniej połowę kulminacji dopływu; wznoszenie trwające od 1 do 9 kroków powoduje podział każdego kroku siatki na ceil(10 / wznoszenie) jednakowych podkroków (co najwyżej 100), przy dopływie liniowym między rzędnymi (uwaga `timestep_refined`)"
convention = "NEH 630 ponownie interpoluje hydrogram do dokładnie 10 przedziałów na wznoszeniu; Hydrolog dzieli krok na całkowitą liczbę podkroków, dając 10 przedziałów lub więcej, i zachowuje oryginalne rzędne; zbiorniki odcinka bez siatki są ścisłe przy każdym kroku i nie są zagęszczane"

[rules.muskingum_cunge_grid]
en_sha256 = "74a1581ac7540718c32e597ac15d1691e34bed1d7125d66cc11a7c48857379f4"
title = "Siatka obliczeniowa metody Muskingum-Cunge"
definition = "przepływem odniesienia jest kulminacja dopływu, o ile nie podano innego; krok przestrzenny NRCS dx_c = (c dt + D) / 2 przy D = Q / (T S0 c) daje ceil(L / dx_c) kroków, a liczbę tę zmienia się na najbliższą liczbę w oknie nieujemnych wag |c dt - D| <= L / N <= c dt + D, każdy koniec z dokładnością do 1e-9 swojej wartości (`hydrolog.routing.formulas.cunge.distance_step_window`); krok, dla którego w oknie nie ma liczby całkowitej, dzieli się na najmniejszą liczbę od 2 do 100 jednakowych podkroków, dla której taka liczba istnieje, przy dopływie liniowym między rzędnymi (uwagi `subreaches_adjusted`, `substeps_added`); uwaga `accuracy_limit` sygnalizuje siatkę NRCS, której Dg = D / dx przekracza exp(2,3 Cg)"
convention = "jeden przepływ odniesienia dla wszystkich kroków przestrzennych, podczas gdy WinTR-20 przyjmuje kulminację na górnym końcu każdego z nich; siatka z ujemną wagą, którą NEH dopuszcza (przykład 17-5), jest zastępowana (ADR-0008); siatka wymagająca ponad miliona rzędnych jest odrzucana (`unstable_timestep`)"

[rules.muskingum_cunge_fallback]
en_sha256 = "ace7dac95e0047cba64bc42b957cb58e8d1bdb37ed5ddc24150a8f8b4b9145eb"
title = "Zastąpienie metody Muskingum-Cunge kaskadą zbiorników liniowych"
definition = "odcinek, dla którego nie ma siatki w granicach 100 podkroków, transformuje się jako n = L / D zbiorników liniowych (zaokrąglone, połowa w górę, co najmniej 1) o K = L / (n c) kaskadą `CascadeReach` (uwaga `diffusion_dominated`)"
convention = "n zbiorników o średniej n K i wariancji n K^2 zachowuje średni czas przepływu L / c fali dyfuzyjnej oraz, na ile pozwala całkowite n, jej wariancję D L / c^2 = 2 mu L / c^3 przy mu = Q / (2 T S0) (HEC-HMS TRM, model Muskingum-Cunge, wzór 5)"

[rules.level_pool_substeps]
en_sha256 = "c20fd28e81666709526d737bb14c2b20ce303e2919220f0a1e79e894c87e51be"
title = "Podział kroku czasowego w metodzie zbiornikowej"
definition = "najdłuższy krok, na jaki tabela retencja–odpływ pozwala w danym obliczeniu, 2 min(dS/dO) / N po odcinkach od stanu ustalonego przy najmniejszym przepływie obliczenia do pierwszego wiersza, który osiąga przepływ największy, w min (warunek wstępny `timestep_within_limit` specyfikacji `level_pool`); `LevelPoolReach` dzieli dłuższy krok na najmniejszą liczbę jednakowych podkroków, które go spełniają, każdy koniec z dokładnością do 1e-9 swojej wartości, przy dopływie liniowym między rzędnymi, i odczytuje odpływ z powrotem w oryginalnych rzędnych (uwaga `timestep_refined`)"
convention = "warunek dla każdego odcinka tabeli jest ostrzejszy niż warunek NEH 630 dla całej krzywej, dt <= 2 S/O w każdym wierszu (krzywa robocza na prawo od linii równych wartości), który pozwala odpływowi przekroczyć kulminację dopływu przy tabeli o gwałtownie zmieniającym się nachyleniu (ADR-0008); ponad 100 podkroków lub więcej rzędnych niż limit jest odrzucane (`unstable_timestep`), podobnie jak odcinek bez retencji, do którego dochodzi obliczenie (`working_curve`)"

[rules.level_pool_initial_outflow]
en_sha256 = "a642cb9c306ee5cb46da32958f4f1046a4a7384df4458068347a664663c1f59b"
title = "Odpływ początkowy w metodzie zbiornikowej"
definition = "odpływ, z którym zbiorniki startują w stanie ustalonym: odpływ początkowy obliczenia (`routing_initial_state`), przyjmowany na końcu tabeli, gdy leży poza nią o co najwyżej 1e-9 największego odpływu z tabeli (co najmniej 1e-9 m³/s); dalej poza tabelą jest odrzucany (`initial_outflow_m3s`, minimum lub maksimum)"
convention = "tabela obejmuje obliczenie, nigdy nie stosuje się ekstrapolacji; wyjście poza tabelę wynika z zaokrągleń, a nie z danych"

[rules.level_pool_stage]
en_sha256 = "63f15709b0f24ab2345454ad88ee6961cb8b0ff7abe82835e7cf7e450b05e83f"
title = "Stan wody w metodzie zbiornikowej"
definition = "stan wody w ostatnim zbiorniku w każdej rzędnej: wartość z kolumny stanów wody tabeli przy retencji zbiornika, liniowo między wierszami; stan kulminacyjny i jego czas to największa wartość i pierwsza rzędna, w której wystąpiła, tak jak retencja kulminacyjna i jej czas dla retencji wszystkich zbiorników"
convention = "stan wody jest tylko raportowany i nie wchodzi do transformacji: dla zbiornika retencyjnego (jednego zbiornika obliczeniowego) to poziom wody w zbiorniku, dla pododcinków — poziom w ostatnim z nich"

[rules.junction_sum]
en_sha256 = "321db014c27e78be013faedb71b1dfb77b56ba25602d6534716b13c4ddfffe6b"
title = "Sumowanie hydrogramów w węźle sieci"
definition = "hydrogram węzła: suma jego dopływów rzędna po rzędnej na najdłuższej z ich osi czasu, przy czym krótszy hydrogram przedłuża się jego ostatnią wartością"
convention = "jeden krok czasowy i jeden początek dla wszystkich źródeł sieci, bez przepróbkowania; przedłużenie obciętego odpływu (`tail_truncated`) wartością większą od zera dodaje objętość poniżej węzła, o czym informuje ostrzeżenie z odcinka powyżej"

[rules.mean_width]
en_sha256 = "6d7458189ea4576863019cee73b8517e0333495d66930d92451ecce1fb3a02d1"
title = "Średnia szerokość zlewni"
definition = "W = A / L, średnia szerokość zlewni [km]"
convention = "L jako `length_km` z `WatershedGeometry` (odcinek prosty albo najdłuższa droga spływu); B według Baścika dzieli powierzchnię przez długość doliny Lm"

[rules.midpoint_elevation]
en_sha256 = "5d938a5e6563b893fa6b5a6c243dffb51159aba90672c4d470201c90df5645b7"
title = "Średnia wysokość zlewni jako średnia wysokości skrajnych"
definition = "H_mean = (Hmin + Hmax) / 2, średnia wysokość przyjmowana przez `TerrainAnalysis`, gdy nie podano żadnej [m n.p.m.]"
convention = "przybliżenie, z komunikatem `mean_elevation_approximated` tam, gdzie Hydrolog go zgłasza; należy preferować średnią z NMT ważoną powierzchnią (Baścik 2006, wzór 1.2.8, `HypsometricCurve.mean_elevation`)"

[rules.hypsometric_curve]
en_sha256 = "725d8811adbb9492320c4ee0b551aa1a63e5cba0ac5fd553f92a003af8027830"
title = "Krzywa hipsometryczna zlewni"
definition = "wysokości względne h/H = (t - min) / (max - min) na n równo rozmieszczonych progach t oraz względne powierzchnie a/A komórek położonych na wysokości każdego progu lub powyżej"
convention = "przekroczenie (powierzchnia powyżej), czyli procentowa krzywa hipsometryczna Strahlera; pierwsza względna powierzchnia wynosi 1"

[rules.area_weighted_mean_elevation]
en_sha256 = "befd50f207fb0ba482123e56f9cf0f465dda5bca18ade7b68cfd3eaf5fcaf665"
title = "Średnia wysokość zlewni ważona powierzchnią"
definition = "średnia wysokość komórek ważona ich powierzchniami [m n.p.m.]"
convention = "`numpy.average` z powierzchniami komórek jako wagami"

[rules.elevation_above_share]
en_sha256 = "7cf2a899d4440fe3a46c7dd90a1e04606f8634537d043e66e5f4f70ef9b8a073"
title = "Wysokość, powyżej której leży zadany udział powierzchni zlewni"
definition = "wysokość pierwszej komórki, licząc od najwyższej w dół, przy której skumulowany udział powierzchni osiąga zadany procent [m n.p.m.]"
convention = "wysokość środkowa (mediana) to ta, powyżej której leży połowa powierzchni; bez interpolacji między komórkami"

[rules.streams_of_each_order]
en_sha256 = "9228aee66b0c57b357cb86d6c5593ddfa4df1ad05d7727b9a6cfc00f1b359402"
title = "Liczba i długości cieków każdego rzędu"
definition = "liczba cieków każdego rzędu według Strahlera, ich łączne i średnie długości [km] oraz łączna długość sieci [km]"
convention = "odcinek kontynuuje ciek odcinka położonego powyżej, jeśli ten ma ten sam rząd, a w przeciwnym razie zaczyna nowy ciek; średnia długość to łączna długość odcinków danego rzędu podzielona przez liczbę jego cieków"

[rules.usda_texture_codes]
en_sha256 = "7e5f5425e3bf704d7aabba47f26cb4b315d74d582b2c095be8d63666f634632b"
title = "Kody klas uziarnienia USDA w rastrze"
definition = "klasa ze specyfikacji `usda_texture`, komórka po komórce, w postaci jej kodu 1-12 (`TEXTURE_CLASSES`)"
convention = "komórka bez danych glebowych — o zerowej sumie, z wartością NaN lub z nieskończoną zawartością — otrzymuje kod gliny (4) jako wartość zastępczą, którą `classify_hsg` maskuje jako brak danych; ujemna zawartość jest odrzucana"

[rules.texture_hsg_codes]
en_sha256 = "800fb4c6054ee0c149b94e389cce7d082568b3bd683b92f222fa5acb51c29530"
title = "Kody grup hydrologicznych gleby z kodów klas uziarnienia"
definition = "grupa ze specyfikacji `texture_hsg` dla każdego kodu uziarnienia, w postaci kodu rastra 1-4 dla A-D"
convention = "kod uziarnienia 0 (brak danych) daje 0; kod spoza zakresu 0-12 jest odrzucany"

[rules.hsg_of_amounts]
en_sha256 = "aff54afa037c11754dec68f8d583c06da7f4a43e1b0669787706f1c1eb8ea73c"
title = "Grupa hydrologiczna gleby z zawartości iłu, piasku i pyłu"
definition = "grupa ze specyfikacji `texture_hsg` dla klasy ze specyfikacji `usda_texture`, komórka po komórce, w postaci kodu rastra 1-4 dla A-D"
convention = "0 (brak danych) dla komórki z wartością NaN lub z nieskończoną zawartością, z zawartością równą znacznikowi nodata jej danych wejściowych albo ze wszystkimi trzema zawartościami równymi zeru (luka w SoilGrids); ujemna zawartość w komórce z danymi jest odrzucana"

[rules.spi_k_month_sums]
en_sha256 = "f436f706edeca4f8a046c5504e6fcb434086b5020d1058ddb533c06fc8f63a66"
title = "SPI k-miesięcznych sum opadu"
definition = "k-miesięczna suma danego miesiąca to suma sum miesięcznych k miesięcy, które się w nim kończą; jest brakiem, jeśli nie wszystkie k sum są znane; sumy każdego miesiąca kalendarzowego z okresu odniesienia są dopasowywane (`spi_gamma_fit`), gdy są znane w co najmniej 80 % jego lat, wliczając lata bez danych"
convention = "k-miesięczne sumy okresu odniesienia pozostają w obrębie jego lat (climate_indices 3.2.0 pozwala sumom jego pierwszych k - 1 miesięcy sięgać przed ten okres); każdy analizowany miesiąc otrzymuje SPI własnej sumy według dopasowania dla swojego miesiąca kalendarzowego; miesiąc, którego sum dopasowanie nie przyjmuje, nie ma SPI (komunikat `spi_not_fitted`)"

[rules.spi_k_month_sums.constants]
normal_share = "Najmniejszy udział lat okresu odniesienia z wartością"

[rules.relative_precipitation]
en_sha256 = "677f49723585f03d311271cbd7925c51c9072d9b9aba31c875de4a47612d4bda"
title = "Opad względny w procentach normy"
definition = "100 P / N: suma miesięczna w % normy swojego miesiąca kalendarzowego, suma roczna w % sumy dwunastu norm miesięcznych (klasyfikowane przez `month_precipitation_class` i `kaczorowska_class`)"
convention = "normy z okresu odniesienia; brak odsetka, gdy brak normy lub norma wynosi 0"

[rules.temperature_monthly_means]
en_sha256 = "fc5a29464f728e937c8b34500afce06bd73237a1d3bb28820f198872e8195ed1"
title = "Średnie miesięczne i roczne temperatury powietrza"
definition = "średnia z dobowych Tmean, Tmax i Tmin miesiąca, w którym brakuje mniej niż 11 dni i mniej niż 5 dni z rzędu; dla roku – średnia z jego dwunastu średnich miesięcznych, wymagająca każdej z nich"
convention = "dwanaście miesięcy ma jednakową wagę (WMO-No. 1203, 4.3.3 a, przypis 1: ważenie liczbą dni nie jest zalecane)"

[rules.temperature_normals_and_anomalies]
en_sha256 = "7fc5ab099e9c1b7267f4a5f85fc08a996b9e177d8bb497730cccfdfa8f5e2a47"
title = "Normy i anomalie temperatury powietrza"
definition = "norma Tmean miesiąca kalendarzowego: średnia z jego średnich miesięcznych w tych latach okresu odniesienia, w których one istnieją, o ile stanowią co najmniej 80 % jego lat; norma roczna – średnia z dwunastu norm miesięcznych; anomalia – średnia pomniejszona o swoją normę"
convention = "okresem odniesienia są domyślnie analizowane lata; jego lata bez danych wliczają się do jego lat"

[rules.temperature_extremes]
en_sha256 = "0a66e7f62045c76e0fe496be131fa91a07b3feee1965e25b5d012cbab1d99a6f"
title = "Ekstremalne temperatury powietrza z datami wystąpienia"
definition = "najwyższa Tmax i najniższa Tmin miesiąca, roku i całego okresu wraz z datami, z dni, które mają wartość"
convention = "ekstremum wyznacza się z tylu dni, ile jest dostępnych (WMO-No. 1203, 4.4.1 b); przy równych ekstremach – pierwsze z nich i jego data"

[rules.temperature_day_counts]
en_sha256 = "b9e0c2c181f82111f5dddd6b7919710a62e0953e532efb20f605c794e384b961"
title = "Liczby dni charakterystycznych temperatury"
definition = "liczba dni każdego rodzaju z `threshold_days` w miesiącu, w którym brakuje mniej niż 11 dni i mniej niż 5 dni z rzędu, przeskalowana do liczby dni miesiąca; dla roku – suma jego dwunastu miesięcy, wymagająca każdego z nich"
convention = "przy lukach liczba dni w miesiącu nie jest liczbą całkowitą (climdex.pcic liczy te dni, które ma)"

[rules.degree_day_sums]
en_sha256 = "08ed3248510add63ab28c6f9e492b0d0137bf9e2b74e9f02a3f04d66945797e1"
title = "Miesięczne i roczne sumy stopniodni"
definition = "suma `degree_days` wszystkich dni miesiąca, wymagająca każdego dnia; dla roku – suma jego dwunastu miesięcy, wymagająca każdego z nich"
convention = "nie wydziela się okresu wegetacyjnego ani sezonu grzewczego (Eurostat: liczone dla każdej doby i sumowane do roku)"

[rules.daily_temperature_range]
en_sha256 = "714ff531978539875a56ce5c843ad111b9eaacaa3f3e3d0a4e4c04018b2e516d"
title = "Dobowa amplituda temperatury powietrza"
definition = "DTR: Tmax - Tmin każdego dnia z obiema wartościami, jej średnia w miesiącu, w którym brakuje mniej niż 11 dni i mniej niż 5 dni z rzędu, a dla roku – średnia z jego dwunastu średnich miesięcznych"
convention = "dzień z Tmax niższą od Tmin przyjmuje się bez zmian (bez kontroli; kwestia otwarta audytu z 2026-11-18)"

[rules.spell_year]
en_sha256 = "d7c9bcb506a5cd7d778ee15eb17823e1490609ebe95c9f4d4eeabdd0a43c8b97"
title = "Przypisanie ciągu dni do roku"
definition = "ciąg (`spell_lengths`) liczy się w całości w roku swojego ostatniego dnia: ciąg obejmujący początek roku nie jest dzielony, a rok leżący w całości wewnątrz ciągu, który kończy się później, nie ma najdłuższego ciągu"
convention = "rok zakończenia ciągu, jak w climdex.pcic 1.1-11 (domyślnie spells.can.span.years = TRUE) i ECA&D; definicja ETCCDI czytana dosłownie dzieli ciąg na początku roku (ADR-0044)"

[rules.spell_summaries]
en_sha256 = "88891568c5dfd354e51d77576bcd889ec146af58b26551ce69ba6dd4bc773d0d"
title = "Podsumowania ciągów dni bezopadowych i z opadem"
definition = "dla każdego roku z wartością w każdym dniu: ciągi, które się w nim kończą, najdłuższy z nich (CDD, CWD) z jego dniami oraz ciągi trwające co najmniej 10, 15 i 20 dni; dla okresu: ich średnie z tych lat oraz rozkład długości tych ich ciągów, które nie są otwarte, w przeliczeniu na rok"
convention = "rok wymaga każdego dnia (climdex.pcic dopuszcza do 15 brakujących dni); ciąg otwarty, przylegający do dnia z brakiem danych lub do końca serii, pomija się tylko w rozkładzie długości; `min_duration_days` skraca listę ciągów, a nie podsumowania"

[rules.precipitation_sums]
en_sha256 = "77cfa3d39b5eab19317835691d7edf52025ebb74492a8febf7edd7d249be1ef4"
title = "Sumy opadu miesięczne, półroczne, sezonowe i roczne"
definition = "suma opadu dobowego miesiąca, wymagająca kompletu dni albo opadów zbiorczych obejmujących brakujące dni; suma półrocza (XI–IV, V–X), pory roku (DJF z poprzedzającym grudniem, MAM, JJA, SON) i roku jako suma sum miesięcznych wchodzących w ich skład, wymagająca każdej z nich; suma w % swojej normy, 100 P / N"
convention = "każda suma opadu dobowego zaokrąglona do 1e-6 mm (`round_sums`); brak odsetka, gdy brak normy lub norma wynosi 0"

[rules.precipitation_normals]
en_sha256 = "c7530f8645ea93e498dd38597b173541e85efca86075c1add2c389195fc710f0"
title = "Normy opadu miesięczne, półroczne, sezonowe i roczne"
definition = "norma miesiąca kalendarzowego: średnia jego sum z lat okresu odniesienia, w których suma istnieje, o ile stanowią one co najmniej 80 % lat okresu; norma półrocza, pory roku lub roku: suma norm miesięcy, które obejmuje"
convention = "okresem odniesienia są domyślnie lata analizy; jego lata bez danych liczą się do jego lat"

[rules.precipitation_normals.constants]
normal_share = "Najmniejszy udział lat okresu odniesienia z wartością"

[rules.precipitation_maxima]
en_sha256 = "c24c663842a7e74a301d40d598155fde184a40960cd0a2965bad488ad08e7d20"
title = "Największe sumy opadu dobowe i wielodniowe"
definition = "Rx1day i największe sumy n-dniowe (Rx5day dla 5): suma n-dniowa danego dnia to suma n dni kończących się tym dniem, przypisana do roku jej ostatniego dnia i brakująca, jeśli nie są znane wszystkie n dni; maksimum miesiąca liczy się z dni, które ma, a maksimum roku wymaga kompletu dni roku"
convention = "pierwsze z równych maksimów, wraz z jego datami; climdex.pcic 1.1-11 przypisuje okno 5-dniowe do jego środkowego dnia, a brakujący dzień przyjmuje jako 0"

[rules.precipitation_days]
en_sha256 = "c553b6f7cbb028ac3a61401cd72b9e8f548194e7e4b71fecd02006cc693d54f0"
title = "Liczba dni z opadem nie mniejszym od progu"
definition = "dni z P równym progowi lub większym, dla każdego progu (R10mm i R20mm dla 10 i 20 mm); liczba w miesiącu przeliczona na wszystkie jego dni, gdy brakuje mniej niż 11 dni i mniej niż 5 kolejnych; liczba w roku jako suma jego dwunastu miesięcy"
convention = "P >= próg; przy lukach liczba w miesiącu nie jest liczbą całkowitą (climdex.pcic liczy dni, które ma)"

[rules.precipitation_intensity]
en_sha256 = "b3ef94000baa411d852f2dcf0357ba8293261a3243c7d1636408209929dd2b37"
title = "Intensywność opadu dni z opadem (SDII) miesięcy i lat"
definition = "`sdii` każdego miesiąca i roku z kompletem dni oraz każdego miesiąca kalendarzowego z tych miesięcy okresu łącznie; średnia suma roczna i średni SDII lat, które go mają"
convention = "opad zbiorczy jest dla `sdii` dniem z brakiem danych i wlicza się do sumy rocznej; PRCPTOT zaokrąglony do 1e-6 mm; miesiąc lub rok bez dnia z opadem ma W = 0 i nie ma SDII"

[rules.heavy_precipitation_thresholds]
en_sha256 = "ccc974c8ce7d162aabd105bfc71e945e776d5eff4cd8eab4b2c4ecf1d1de3234"
title = "Progi opadu bardzo dużego i udział opadu powyżej progu"
definition = "progi: `wet_day_percentile` dni z opadem okresu odniesienia dla każdego percentyla, z co najmniej 100 dni z opadem; dla każdego roku z kompletem dni: `heavy_precipitation_share` dla każdego progu oraz średni udział z tych lat"
convention = "okresem odniesienia są domyślnie lata analizy (okres bazowy ETCCDI to 1961-1990); minimum 100 dni z opadem przyjął Hydrolog (ADR-0032), żadne źródło go nie podaje"

[rules.precipitation_regime]
en_sha256 = "034aa1642422dcf4502eab9a2ba9332ccf7b5fdb9d10ddeee348a6edb090955a"
title = "Reżim opadowy: udziały miesięcy, koncentracja i sezonowość opadu"
definition = "każda norma miesięczna okresu odniesienia w % ich sumy i w stosunku do ich średniej; `precipitation_concentration_index` i `seasonality_index` wraz z klasami dla dwunastu norm i dla każdego roku z kompletem dwunastu sum miesięcznych oraz średnie wskaźników rocznych"
convention = "wskaźniki norm i średnie wskaźników rocznych różnią się i podaje się oba (Sumner i in. 2001); suma równa 0 nie ma wskaźnika"

[rules.hydrothermal_months]
en_sha256 = "3ab5cd3f2c9b3fb0585a1f96d14212318bb67ce12e70b5a78047656529f72dd0"
title = "Miesięczne współczynniki hydrotermiczne Sielianinowa"
definition = "`sielianinov_coefficient` każdego miesiąca od kwietnia do września: P – jego suma opadu, sum t – jego średnia dobowa temperatura pomnożona przez liczbę jego dni, dla miesiąca z obiema wartościami i średnią powyżej 0 °C"
convention = "miesiące od kwietnia do września (Radzka 2014); sumy opadu zaokrąglane do 1e-6 mm"

[rules.hydrothermal_season]
en_sha256 = "6cebd306d748077e955f5060f3be2629a6a617f831f78b082d04f44855fbee88"
title = "Sezonowy współczynnik hydrotermiczny Sielianinowa"
definition = "`sielianinov_coefficient` z dni od kwietnia do września ze średnią temperaturą powyżej 10 °C: P i sum t sumowane po tych dniach, w roku, w którym każdy dzień od kwietnia do września ma obie wartości"
convention = "filtr dni z praktyki polskiej (Miś 2026), a nie okres między trwałymi przejściami temperatury przez 10 °C z praktyki rosyjskiej; opad zbiorczy liczy się jako dzień brakujący w sezonie"

[rules.hydrothermal_period]
en_sha256 = "6bf762607041dac526c101a4341bef4a0b9b07abb73cf349e3f2b9ef3c78dd8d"
title = "Współczynniki hydrotermiczne Sielianinowa z wielolecia"
definition = "dla każdego miesiąca od kwietnia do września: średni współczynnik z lat, w których on istnieje, i liczba przypadków każdej klasy; średni współczynnik sezonowy i jego klasa"
convention = "klasa średniej, a nie najczęstsza klasa"

[rules.snow_cover_day]
en_sha256 = "35b0ef926678bf47a157efd8de656faabc923aa430ce57ae8b5fb9d7f2fa4b45"
title = "Dzień z pokrywą śnieżną"
definition = "dzień z pokrywą śnieżną to dzień, w którym jej grubość wynosi co najmniej 1 cm; liczbę takich dni w miesiącu przeskalowuje się do liczby jego dni, gdy brakuje mniej niż 11 dni i mniej niż 5 dni z rzędu; liczba dni w zimie to suma z jej miesięcy"
convention = "co najmniej 1 cm, jak w rocznikach IMGW-PIB i we wskaźniku SD1 ECA&D; normy IMGW-PIB liczą dni z pokrywą > 0 cm (SNIEG_0, to samo przy pełnych centymetrach) i > 1 cm (SNIEG_1)"

[rules.snow_cover_day.constants]
snow_cover_cm = "Najmniejsza grubość pokrywy śnieżnej w dniu z pokrywą"

[rules.snow_season]
en_sha256 = "13e11c68928f568c140765cfdbac3e9f79ea7e2eb9c14a78a71bb719427eefcd"
title = "Sezon pokrywy śnieżnej (zima)"
definition = "zima to sezon pokrywy śnieżnej od 1 sierpnia do 31 lipca, nazwany rokiem, w którym się kończy; jest kompletna, gdy każdy miesiąc od października do maja ma dostatecznie wiele dni z danymi"
convention = "cała chłodna pora roku łącznie: śnieg z końca października rozpoczyna swoją zimę (w badaniach polskich stosuje się też sezony X–V, XI–III lub XII–II)"

[rules.snow_season_extremes]
en_sha256 = "585eb12c44faf4c85029871430e20dbecb99d3e035bb4bde67faebf7c34c18d9"
title = "Charakterystyki skrajne pokrywy śnieżnej zimy"
definition = "największa grubość pokrywy z dniem jej wystąpienia, pierwszy i ostatni dzień z pokrywą śnieżną oraz suma grubości śniegu świeżego w zimie, z tych dni, które są dostępne"
convention = "pierwsza z równych największych grubości"

[rules.snow_season_medians]
en_sha256 = "d9fb81b2405b01f16dc3aed7b746c55a5466ddafc1e039def16db24ea9f8e9d6"
title = "Mediany dat pierwszego i ostatniego dnia z pokrywą śnieżną"
definition = "mediana pierwszego i ostatniego dnia z pokrywą śnieżną z kompletnych zim: każda data jako numer dnia sezonu w kalendarzu bez 29 lutego, a mediana tych numerów z powrotem zamieniona na datę"
convention = "29 lutego liczy się jako 28 lutego, więc data jest tym samym dniem w każdej zimie; mediana wypadająca między dwoma dniami jest zaokrąglana do parzystego numeru dnia"

[rules.wmo_monthly_mean]
en_sha256 = "b9d268886efb3f17deb0b15bebf655948959a503dd8d8a50618b4340a2b9eae0"
title = "Średnia miesięczna według reguły WMO"
definition = "średnia wartości dobowych miesiąca, w którym brakuje mniej niż 11 dni i mniej niż 5 kolejnych, a co najmniej jedna wartość istnieje"
convention = "dzień siatki dat bez rekordu z tą datą liczy się jako brakujący"

[rules.wmo_monthly_mean.constants]
missing_days = "Liczba brakujących dni, od której nie liczy się średniej miesięcznej"
missing_run = "Liczba kolejnych brakujących dni, od której nie liczy się średniej miesięcznej"

[rules.wmo_monthly_count]
en_sha256 = "6419ebf9446fb28e9471acc4b133cee4dd92dbf030e7e75c8e3e242fbb8ab045"
title = "Liczba dni ze zjawiskiem w miesiącu według WMO"
definition = "liczba dni ze zjawiskiem w miesiącu, dla którego można było obliczyć średnią, przeliczona na liczbę dni miesiąca: liczba dni ze zjawiskiem podzielona przez liczbę dni z wartością i pomnożona przez liczbę dni miesiąca"
convention = "przeliczenie dotyczy każdego takiego miesiąca (WMO-No. 1203 podaje ten stosunek dla norm); liczba nie jest wtedy liczbą całkowitą"

[rules.wmo_monthly_sum]
en_sha256 = "7953d61c03ba7cc8514df7f37c4caf8fa3e47e47cddf0c450dff63a4bd90485f"
title = "Suma miesięczna z kompletu dni"
definition = "suma wartości dobowych miesiąca z kompletem dni"
convention = "miesiąc z brakującym dniem nie ma sumy"

[rules.accumulated_totals]
en_sha256 = "7198974dd8346d0c052d61c5d700ca13f0bee4363914f033a30a10c843036a43"
title = "Opady zbiorcze w sumach miesięcznych"
definition = "suma oznaczona jako opad zbiorczy zastępuje brakujące dni bezpośrednio ją poprzedzające, gdy wraz z jej własnym dniem jest ich mniej niż 5; suma miesięczna uwzględnia takie opady zbiorcze, gdy obejmują mniej niż 11 dni miesiąca"
convention = "blok obejmujący początek miesiąca ocenia się według całej jego długości; opad zbiorczy wlicza się do miesiąca swojego dnia"

[rules.wmo_normal]
en_sha256 = "ddf7e57230d56638159ad64807d33a89593f8373f268741b9234804b21e95ac4"
title = "Norma miesięczna według WMO"
definition = "norma miesiąca kalendarzowego: średnia jego wartości z lat okresu odniesienia, w których wartość istnieje, o ile stanowią one co najmniej 80 % lat okresu"
convention = "liczy się każdy rok okresu odniesienia, także lata bez danych; bez kryterium kolejnych lat"

[rules.wmo_normal.constants]
normal_share = "Najmniejszy udział lat okresu odniesienia z wartością"

[rules.multimonth_normal]
en_sha256 = "663375f1a91b7948d07001947782d29e13e3fd0ac54995a3bd072a62e673133f"
title = "Norma roczna, półroczna i sezonowa z norm miesięcznych"
definition = "norma roku, półrocza lub pory roku: suma norm miesięcy, które obejmuje, dla sumy lub liczby dni, a ich średnia dla średniej"
convention = "z norm miesięcznych, nie z wartości rocznych (WMO-No. 1203, 4.3.3: wyniki identyczne, gdy nie brakuje miesięcy)"

[rules.block_extreme]
en_sha256 = "81989439721edb951d0c3badac6f9a561e7cbb2243d3f4889d57aa3a5c6c7535"
title = "Ekstremum miesięczne i data jego wystąpienia"
definition = "ekstremum miesiąca z dni, które mają wartość, wraz z pierwszą datą jego wystąpienia"
convention = "funkcja dla serii wyznacza ekstremum roczne statystyki wymagającej kompletu dni tylko z pełnych lat"

[rules.rounded_sums]
en_sha256 = "6d6b24b94507393b13022da103db40b6daef0e589fb6a2fbe426b429887d78f9"
title = "Zaokrąglanie sum opadu dobowego"
definition = "każda suma opadu dobowego zaokrąglona do 1e-6 mm"
convention = "dane z dokładnością 0,1 mm sumowane w arytmetyce binarnej zależą od kolejności dodawania; po zaokrągleniu sumy równe w zapisie dziesiętnym są równymi liczbami (wartości wiązane w teście Manna–Kendalla, pierwsze z równych okien); najwyżej 5e-7 mm na sumę"

[rules.years_of_a_series]
en_sha256 = "d8dd2d6ff49ecc84980777d38ef507f51c8a6691ed61280a5dadb613448fb96a"
title = "Rok kalendarzowy, rok hydrologiczny i sezon śnieżny serii"
definition = "rok kalendarzowy (styczeń–grudzień), polski rok hydrologiczny (listopad–październik) nazwany od roku, w którym się kończy, albo sezon śnieżny (sierpień–lipiec) nazwany od roku, w którym się kończy"
convention = "rok nakłada się na siatkę dat w całości, a jego dni bez wartości są brakami"

[rules.trend_decision]
en_sha256 = "e1d75fd26a7cc39d363c4a0a2436974174608b57bb05f41caa893f1f9b2db988"
title = "Decyzja o istnieniu i kierunku trendu w teście Manna–Kendalla"
definition = "`trend_detected` to p < alpha; `trend_direction` to `increasing` dla S > 0 i `decreasing` dla S < 0, gdy wykryto trend, w przeciwnym razie `none`; przedział Sena jest podawany od dziesięciu wartości, a poniżej nich lub gdy ranga wypada poza zakres nachyleń — null"
convention = "test dwustronny na poziomie alpha podanym przez wywołującego, przedział na poziomie 1 - alpha; czasy muszą ściśle rosnąć (jedna wartość na krok czasowy)"

[rules.trend_times]
en_sha256 = "3e59cef52238ff97ecd2faa1376f86acd198e4cbd921e782c0dca7cde735b17c"
title = "Czasy wartości w teście Manna–Kendalla i nachyleniu Sena"
definition = "czasy wartości: ich lata (`years`, `year_column`) albo, bez nich, kroki 0, 1, 2 … szeregu; brakująca wartość jest pomijana, ale zachowuje swój krok"
convention = "nachylenie Sena na rok przy podanych latach, na krok bez nich"

[rules.homogeneity_split]
en_sha256 = "72b5bdc843539649868e2b4701d38b5d4af1b31bb1988f45d92ab1aff7573ba8"
title = "Podział szeregu na dwie części w testach jednorodności"
definition = "pierwsza część to pierwsze n // 2 wartości albo wartości z lat przed `split_year`; druga część to pozostałe"
convention = "`split_year` oraz `change_point_year` testu Pettitta wskazują rok pierwszej wartości drugiej części (ADR-0022)"

[rules.homogeneity_decision]
en_sha256 = "e359772d2089693ba4cef317eb36f843bedafda2ad0ed30f325629113f241d17"
title = "Decyzja o jednorodności szeregu"
definition = "test uznaje szereg za jednorodny, gdy jego wartość p wynosi co najmniej alpha; U Manna–Whitneya to `mannwhitneyu` z scipy, wartość p Kołmogorowa–Smirnowa — `ks_2samp` z scipy bez wiązań lub przy m n >= 10000, w przeciwnym razie specyfikacja `ks_exact`"
convention = "testy dwustronne na poziomie alpha podanym przez wywołującego"

[rules.duration_curve_days]
en_sha256 = "02a06196d021b5d796b0ef82cca7e8490c24475aac6bcab49ee88873ee2edced"
title = "Dni ujęte w krzywej sum czasów trwania"
definition = "dni, z których liczy się krzywą i klasy: wszystkie dni z wartością albo tylko dni jednego miesiąca kalendarzowego (`month`); ich liczba `n_values`, minimum, maksimum, średnia i mediana, krzywa w punktach `CURVE_PERCENTS` i tabela dla `exceedance_percents` (specyfikacja `exceedance_values`) oraz lata hydrologiczne tych dni (1 listopada – 31 października, nazwane rokiem ich końca): `first_year`, `last_year` i `period_years`"
convention = "krzywa z całego okresu, ze wszystkich dni zapisu (Searcy 1959, s. 3; WMO-No. 1029, § 6.1); dzień, którego wartość jest NaN lub nie jest liczbą skończoną, nie ma wartości i jest pomijany, a nie uzupełniany; krzywa miesiąca obejmuje ten miesiąc kalendarzowy z każdego roku; daty ściśle rosną, jedna wartość na dobę"

[rules.duration_classes]
en_sha256 = "d3ef4c23e03bc50b59adb993fc02060cd2bbb06d59cd2180f87fa1e0994571d9"
title = "Klasy wartości i liczby dni w klasach krzywej sum czasów trwania"
definition = "klasy o równej szerokości w, [k w, (k + 1) w), od wielokrotności w równej najmniejszej wartości lub leżącej poniżej niej do klasy wartości największej, albo `bin_count` klas o równych krokach log10 między najmniejszą wartością dodatnią a największą, których skrajnymi granicami są te wartości i które liczą tylko wartości dodatnie; wartość v należy do klasy, dla której lower <= v < upper, przy czym klasa najwyższa obejmuje też swoją górną granicę; dla każdej klasy, od najwyższej w dół: jej dni, ich udział w liczonych dniach [%], dni tej klasy i wszystkich wyższych (wraz z wyższymi) oraz tej klasy i wszystkich niższych (wraz z niższymi), a także jej dni w poszczególnych miesiącach hydrologicznych, od listopada do października; klasa modalna ma najwięcej dni, a przy równych liczebnościach jest nią najniższa z nich"
convention = "dni liczone od klasy najwyższej w dół, przy czym klasa obejmuje dni równe jej dolnej granicy lub większe od niej i mniejsze od granicy następnej (Searcy 1959, rys. 4–5); granice klas o równej szerokości oblicza się w arytmetyce dziesiętnej na najkrótszych zapisach dziesiętnych wartości i szerokości, tak że wartość zapisana na granicy klasy rozpoczyna swoją klasę (0,3 przy szerokości 0,1 należy do [0,3; 0,4); ADR-0048); granicami są liczby zmiennoprzecinkowe najbliższe tym granicom"

[rules.threshold_runs]
en_sha256 = "89e285769a86914d8781a7fc72d0f061734b384692f447bc774560d865f598b9"
title = "Ciągi dni poza progiem i ich łączenie"
definition = "ciągi kolejnych dni oznaczonych jako leżące poza progiem; dwa ciągi rozdzielone mniej niż `max_gap_days` dniami (bez wartości lub nieleżącymi poza progiem) łączy się w jeden, razem z dniami między nimi; ciągi krótsze niż `min_duration_days`, liczone z dołączonymi dniami, są odrzucane; każdy ciąg to pozycje jego pierwszego i ostatniego dnia, włącznie, w porządku czasowym"
convention = "łączenie metodą czasu między zdarzeniami (inter-event time): ciągi łączy się, gdy przerwa jest krótsza niż t_min = `max_gap_days` dni (WMO-No. 1029, s. 72; `pool_it` z pakietu lfstat, 'inter-event time is less than tmin'), podczas gdy Fleig i in. (2006) piszą tau_i <= t_c we wzorze, wbrew „mniej niż” w tekście; `max_gap_days` 4 łączy przerwy od 1 do 3 dni, tak jak program NIŻÓWKA łączy niżówki przedzielone 3 dniami (Tokarczyk 2010, s. 34), a Tomaszewski (2012, s. 68–69) przerwy co najwyżej 3-dniowe; czas trwania połączonego ciągu obejmuje przerwę, jak pełny czas trwania suszy u Fleiga i in. (2006, wzór 1) i duration w lfstat, natomiast WMO-No. 1029 (wzór 8.1(a)), NIŻÓWKA (Tokarczyk 2010, s. 34) i Tomaszewski (2012, rys. 14) sumują czasy trwania ciągów bez przerwy (rzeczywisty czas trwania, `days_beyond` w `threshold_events`); minimalny czas trwania stosuje się do pełnego czasu trwania po połączeniu (Fleig i in. stosują d_min do rzeczywistego); 0 nie łączy niczego"

[rules.threshold_events]
en_sha256 = "b994a9b726b7625336d2c27c768afdafb677594996c0437fcd38a307085f2557"
title = "Zdarzenia progowe w szeregu dobowym"
definition = "szereg umieszczony w kalendarzu jego dni; dzień leży poza progiem, gdy jego wartość jest >= threshold (above, powyżej) lub < threshold (below, poniżej); zdarzenia to `threshold_runs` tych dni; dla każdego zdarzenia: jego pierwszy i ostatni dzień, czas trwania w dniach kalendarzowych (łącznie z dniami dołączonymi), dni poza progiem, dni bez wartości, ekstremum (największa wartość dla above, najmniejsza dla below, datowane pierwszym dniem jego wystąpienia), rok hydrologiczny jego pierwszego dnia oraz to, czy dzień przed nim (po nim) nie ma wartości; dla każdego roku hydrologicznego z wartością: jego dni poza progiem, zdarzenia rozpoczynające się w nim, dni z wartością i dni kalendarzowe (365 lub 366); sumy dla całego okresu"
convention = "dzień równy progowi leży poza nim dla above, a nie dla below; dzień, którego daty brak lub którego wartość jest NaN lub nie jest liczbą skończoną, nie ma wartości i nigdy nie leży poza progiem; zdarzenie liczy się w roku hydrologicznym (1 listopada – 31 października, nazwanym rokiem jego końca), w którym się zaczyna; daty ściśle rosną"

[rules.low_flow_sequences]
en_sha256 = "4e35c18d8c4432dc79df90a174b4cda6f917d409b3489f682a6973ac9af573a8"
title = "Niżówki wyznaczane metodą progową"
definition = "przepływy umieszczone w kalendarzu ich dat; ciągi dni z wartością poniżej progu T, Q < T (`threshold_runs`, domyślnie `min_duration_days` 5 i `max_gap_days` 4); dla każdej niżówki: czas trwania w dniach kalendarzowych (łącznie z dniami przerw), minimum i średnia z jej dni z wartością, niedobór (deficyt) sum(max(T - Q, 0)) po jej dniach z wartością w jednostce szeregu pomnożonej przez dobę, jej dni bez wartości oraz to, czy dzień przed nią (po niej) nie ma wartości; suma niedoborów, najdłuższy czas trwania i liczba niżówek"
convention = "poniżej oznacza Q < T, jak podają WMO-No. 1029 (s. 71) i słownik IMGW-PIB (hasło 29, „niższe od”), a nie Q <= T według Yevjevicha u Tokarczyka (2010, s. 33) ani według lfstat; niedobór połączonej niżówki jest sumą niedoborów jej ciągów, bez odejmowania nadwyżki dni między nimi (Fleig i in. 2006, wzór 2; WMO-No. 1029, wzór 8.1(b); vbt w lfstat, podczas gdy volume w lfstat ją odejmuje); dzień bez wartości nie dodaje niedoboru i jest dniem przerwy; wartości domyślne to minimum 5 dni programu NIŻÓWKA i łączenie przez 3 dni (Tokarczyk 2010, s. 34); dowolny skończony próg, a więc także stan wody poniżej zera wodowskazu"

[rules.low_flow_deficit_volumes]
en_sha256 = "e14618c082305c8d6bf064488f0432672b5da9b4caba8cbece58ab50efd498b1"
title = "Objętość niedoboru odpływu w niżówkach"
definition = "niedobór szeregu przepływów w m³/s wyrażony jako objętość, `deficit_volume_m3` = deficit x 86 400 s/d [m³], dla każdej niżówki, każdego roku hydrologicznego i całego okresu; None dla stanów wody (parametr H); niżówka liczy się w roku hydrologicznym swojego pierwszego dnia, z całym czasem trwania i niedoborem"
convention = "doba trwająca 86 400 s (jednostka spoza SI akceptowana do użytku z SI, BIPM 2019, tab. 8, z tabeli jednostek `nogat_formulas`): dobowe niedobory [m³/s] pomnożone przez dni dają m³, objętość niedoboru według WMO-No. 1029 (§ 8.3 (c)(iii), „suma dobowych przepływów niedoboru pomnożona przez czas trwania w dniach”); Tokarczyk (2010, s. 34, wzór 1) sumuje (Q0 - Q_t) Δt, gdzie Δt to doba"

[rules.low_flow_deficit_volumes.constants]
day = "Liczba sekund w dobie"

[rules.runoff_volumes]
en_sha256 = "7b3c30cce627793e9f24f983feec37adb234074c78506f5c7b9003db03d935c5"
title = "Objętości odpływu dobowe, miesięczne i roczne"
definition = "objętość dnia V = Q x 86 400 s [m³] dla jego średniego przepływu Q [m³/s]; objętość miesiąca i roku hydrologicznego: suma objętości jego dni z wartością; kompletny: każdy jego dzień ma wartość; średnia objętość roczna z lat kompletnych i średnia objętość każdego miesiąca (od listopada do października) z jego kompletnych miesięcy; objętość skumulowana roku na koniec każdego jego dnia oraz średnia objętości skumulowanych lat kompletnych z ich pierwszych 365 dni"
convention = "doba trwająca 86 400 s (BIPM 2019, tab. 8, z tabeli jednostek `nogat_formulas`); rok hydrologiczny 1 listopada – 31 października, nazwany rokiem jego końca, liczy 366 dni, gdy obejmuje 29 lutego; dzień, którego wartość jest NaN lub nie jest liczbą skończoną albo którego daty brak, nic nie dodaje i czyni swój miesiąc i rok niekompletnymi; 366. dzień roku przestępnego nie wchodzi do średniej objętości skumulowanej; daty ściśle rosną"

[rules.runoff_volumes.constants]
day = "Liczba sekund w dobie"

[rules.baseflow_spans]
en_sha256 = "2d6a1c6632f2d3427c710032440a743bf3502dbb04886c0af6c4ff5528139b01"
title = "Przepływ podstawowy szeregu dobowego z lukami, filtrowany odcinkami"
definition = "szereg dobowy umieszcza się w kalendarzu kolejnych dni (brakująca data to dzień bez wartości); każdy odcinek bez luk o długości co najmniej 60 dni jest filtrowany osobno (specyfikacja `lyne_hollick`), z odbiciem na obu jego końcach; dzień krótszego odcinka nie ma przepływu podstawowego; `series_baseflow` to przepływ podstawowy każdego dnia roku `series_year`, domyślnie ostatniego pełnego roku hydrologicznego"
convention = "odcinki co najmniej 60-dniowe są własną regułą Hydrologa; Ladson i in. (2013, rozdz. 2.4) filtrują każdy odcinek wartości niebrakujących, a ich BFI.R każdy dłuższy niż 30 wartości odbitych"

[rules.baseflow_spans.constants]
min_span_days = "Najmniejsza długość odcinka bez luk filtrowanego osobno"

[rules.baseflow_index_by_year]
en_sha256 = "f92733ffe4d531e84c6fff7575adbe541893e6030cb9f96fc9e8034f3f017139"
title = "Wskaźnik odpływu podziemnego BFI okresu i poszczególnych lat hydrologicznych"
definition = "wskaźnik odpływu podziemnego okresu i każdego roku hydrologicznego (1 listopada – 31 października, nazywanego od roku jego końca) jest wskaźnikiem (specyfikacja `baseflow_index`) ich dni z przepływem podstawowym; rok potrzebuje 300 takich dni, aby mieć własny wskaźnik, a rok bez przepływu w tych dniach go nie ma (null); okres bez przepływu w tych dniach jest odrzucany"
convention = "iloraz objętości z dni z przepływem podstawowym (Ladson i in., rozdz. 2.4; WMO-No. 1029, rozdz. 5.2), a nie średnia wskaźników odcinków ważona ich długościami z BFI.R; 300 dni w roku to własna reguła Hydrologa"

[rules.baseflow_index_by_year.constants]
min_year_days = "Najmniejsza liczba dni z przepływem podstawowym w roku, dla którego podaje się własny wskaźnik"

[rules.recession_without_segment]
en_sha256 = "aaf0a998c784df31a469e39df8d32968462ebe1d36f293e025d58b03c94e78fb"
title = "Stała recesji szeregu bez odcinka recesji"
definition = "stała recesji szeregu (specyfikacja `recession_constant`), z k i czasem połowicznego spadku równymi null i bez odcinków, gdy szereg nie ma żadnego odcinka recesji"
convention = "recesja w `baseflow_separation` jest liczona dla całego kalendarza dobowego szeregu, a luki są w nim końcami odcinków"

[rules.flow_regime_of_a_daily_series]
en_sha256 = "12daaecc4b165a9900b427fb49aca044060bd3f46d999e2dba7996ff4a51953a"
title = "Reżim odpływu szeregu dobowego"
definition = "Miesiąc kalendarzowy każdej daty; współczynniki Pardégo, udział wiosenny i typ reżimu szeregu według Dynowskiej (specyfikacje `parde_coefficients`, `spring_share`, `dynowska_regime_type`), wskaźnik Walsha i Lawlera objętości miesięcznych (średnie razy liczba dni miesiąca, luty 28,25 dnia) oraz pierwszy i ostatni rok hydrologiczny z wartością i liczba takich lat"
convention = "miesiące kalendarza gregoriańskiego; listy od listopada do października; dzień bez wartości (NaN) jest pomijany; rok hydrologiczny trwa od listopada do października i nosi numer roku, w którym się kończy (IMGW-PIB)"

[rules.flow_regime_of_a_daily_series.constants]
february_days = "Liczba dni lutego w roku średnim"

[rules.circular_mean_of_dates]
en_sha256 = "0d70bcbd9184dd27ccd4d896bdcf2fb3879de9401660268a7f2b49b147b8d988"
title = "Średni termin i koncentracja dat"
definition = "Czas każdej daty, czyli jej dzień roku kalendarzowego (1 = 1 stycznia) minus połowa, i długość jej roku, 365 lub 366 dni; ich `circular_mean`; średni dzień 365,25 f + 0,5 i jego MM-DD w roku zwykłym 2001"
convention = "lata przestępne według reguły gregoriańskiej; kierunek przeliczany z powrotem na dzień w roku średnim 365,25 dnia (m u Halla i Blöschla; Bayliss i Jones przyjmują 365, co pod koniec roku daje termin wcześniejszy nawet o ćwierć dnia); data średniego dnia zaokrąglana funkcją round Pythona (połowa do dnia parzystego), dzień powyżej 365 przypada na 31 grudnia"

[rules.circular_mean_of_dates.constants]
mean_year_days = "Średnia liczba dni w roku"

[rules.extremes_of_complete_years]
en_sha256 = "c7ca1497f2ca893152da3cb219b807c90f03e13fe22d2da0258af2a692172e36"
title = "Ekstrema pełnych lat hydrologicznych szeregu dobowego"
definition = "Maksimum lub minimum każdego pełnego roku hydrologicznego szeregu dobowego, datowane pierwszym dniem jego wystąpienia"
convention = "rok liczy się tylko wtedy, gdy ma wartość dla każdego dnia, tak jak IMGW-PIB nie podaje charakterystyki dla okresu z przerwą; ekstrema są z wartości dobowych, a nie ze wszystkich obserwacji"

[rules.extremes_of_half_years]
en_sha256 = "4ddcf47a4a3141a5942c3506ed26edf9a0696136ef215bc60ca29f59133f4238"
title = "Ekstrema roczne z ekstremów półroczy"
definition = "Maksimum roczne według IMGW-PIB, czyli większe z maksimów półrocznych (zimowe, gdy są równe), lub minimum, czyli mniejsze z minimów, z datą ekstremum tego półrocza"
convention = "rok bez obu półroczy nie ma ekstremum; rok, którego ekstremum nie ma daty, jest pomijany i wymieniany"

[rules.seasonality_of_extremes]
en_sha256 = "f73775d46a47a591a8b95aec41e491765d76df9172565ece269912540805c0b1"
title = "Sezonowość ekstremów rocznych"
definition = "Kołowy średni termin i koncentracja datowanych ekstremów rocznych oraz ich udziały w półroczu zimowym (listopad–kwiecień) i letnim (maj–październik)"
convention = "półrocza IMGW-PIB według miesiąca kalendarzowego każdej daty"

[rules.annual_cycle_of_a_daily_series]
en_sha256 = "f8603a0fd80dda61c17114d8dc1e73d7005b9c22a5a21d32758f5083fd70d7dc"
title = "Cykl roczny szeregu dobowego"
definition = "Dzień roku hydrologicznego każdej daty (1 = 1 listopada); `harmonic_fit` wszystkich dni okresu, czyli średni cykl roczny, oraz każdego roku hydrologicznego z co najmniej 300 dniami z wartością, który spełnia warunki wstępne dopasowania"
convention = "rok hydrologiczny trwa od listopada do października i nosi numer roku, w którym się kończy (IMGW-PIB); rok, którego wartości dopasowanie odrzuca (wszystkie równe albo luka zbyt długa dla harmonik), nie ma własnego dopasowania"

[rules.annual_cycle_of_a_daily_series.constants]
min_year_values = "Najmniejsza liczba wartości w roku hydrologicznym, który ma własne dopasowanie"

[rules.characteristic_first_degree]
en_sha256 = "1b453de7638ce5731d469ffd531153ecd6ab4fa82be1fdcd3d7fecee872151e2"
title = "Wartości charakterystyczne I stopnia"
definition = "Wartości I stopnia każdego roku hydrologicznego i jego półroczy z szeregu dobowego: minimum, średnia i maksimum z dni, które mają wartość; każde ekstremum jest datowane pierwszym dniem, w którym wystąpiło."
convention = "Zima XI–IV, lato V–X, rok XI–X. Ekstrema są ekstremami wartości dobowych, z reguły łagodniejszymi niż ekstrema IMGW-PIB ze wszystkich obserwacji (Kłodzko 2010: WQ 96,0 wobec 145 m³/s); rok z dniami bez wartości pozostaje, z tymi dniami, które ma, i jest wymieniony w `incomplete_years`, podczas gdy IMGW-PIB nie publikuje dla takiego okresu charakterystyk."

[rules.characteristic_first_degree.constants]
summer_first_month = "Pierwszy miesiąc półrocza letniego"

[rules.characteristic_second_degree]
en_sha256 = "3231d1efa2372e4636193d4a21ae1e8551ca364557029d24918f271c99191e37"
title = "Wartości charakterystyczne II stopnia"
definition = "Wartości II stopnia roku i każdego półrocza: największa (W), średnia (S), mediana (Z) i najmniejsza (N) z wielolecia spośród maksimów, średnich i minimów I stopnia (WWQ ... NNQ), każda z tych lat, które daną wartość mają."
convention = "SWQ to średnia z maksimów rocznych, nigdy z połączonych maksimów półroczy; mediany (ZWQ, ZSQ, ZNQ) oraz WSQ, NSQ, WNQ, NWQ tworzy się według schematu Byczkowskiego (1996, źródło dostarczone przez autora); W, S, N stanu wody to WWW ... NNW, a temperatury wody WWT ... NNT."

[rules.characteristic_from_half_years]
en_sha256 = "ddde7cb953e2e1cf40d91c347cdfba2dec546acd84089a22171123b7411f01c1"
title = "Wartości charakterystyczne z opublikowanych charakterystyk półroczy"
definition = "Wartości I stopnia z charakterystyk półroczy publikowanych przez IMGW-PIB: półrocza zachowują swoje minimum, średnią i maksimum z datami; maksimum roczne to większe z maksimów półroczy, a minimum roczne mniejsze z minimów, z datą z tego półrocza; średnia roczna to wartość opublikowana."
convention = "Przy równości przyjmuje się wartość zimową; ekstremum roczne przy brakującym półroczu (przerwa w obserwacjach) jest nieznane; rok bez żadnej wartości jest pomijany; wartości II stopnia jak z szeregu dobowego."

[rules.half_year_annual_extremes]
en_sha256 = "dc7b2ea8908f81264acfb52a1839c27663b341e368d189274efcdbf8893320ef"
title = "Ekstrema roczne z charakterystyk półroczy"
definition = "Maksima (minima) roczne z charakterystyk półroczy IMGW-PIB: większa (mniejsza) z wartości półrocza zimowego i letniego każdego roku, który ma obie."
convention = "Przy równości przyjmuje się wartość zimową, z datą z jej półrocza; rok z tylko jednym półroczem jest pomijany i wymieniony w `incomplete_years`."

[rules.daily_statistics]
en_sha256 = "de73feadbc80a07169ec44d17b23c01c2b91d887d1daae907fb2db016dcbfd63"
title = "Statystyki poszczególnych dni roku hydrologicznego"
definition = "Maksimum, średnia, mediana, minimum i liczba wartości każdego dnia roku hydrologicznego z wielolecia."
convention = "Dni liczone od 1 listopada (Tier B `hydrological_day_of_year`): po 28 lutego dzień łączy dwie sąsiednie daty kalendarzowe lat przestępnych i zwykłych (dzień 121: 29 lutego i 1 marca), a dzień 366 obejmuje tylko lata przestępne; liczy się każda wartość, a NaN daje NaN w statystykach swojego dnia."

[rules.monthly_statistics]
en_sha256 = "fc990cb071602f68c08bf2725757e1a0410ee286745bff9aaf440659c3caa13d"
title = "Statystyki miesięcy kalendarzowych"
definition = "Maksimum, średnia, mediana i minimum wszystkich wartości każdego miesiąca kalendarzowego; ich odchylenie standardowe, współczynnik zmienności i skośność według odpowiednich specyfikacji; przedział średniej wieloletniej miesiąca: jego średnia +- połowa szerokości ze specyfikacji `mean_interval_half_width`, obliczona ze średnich rocznych tego miesiąca."
convention = "Miesiące i lata kalendarzowe; oszacowanie, którego specyfikacja odrzuca wartości miesiąca, to NaN; przedział jest wyśrodkowany na średniej wszystkich wartości miesiąca (ADR-0049) i nie jest obcinany."

[rules.hydrological_year]
en_sha256 = "7d329c6923075f4a7945f7dfa5d90fb4f1ca21d26eac405ec821e626e0b35f80"
title = "Rok hydrologiczny daty"
definition = "Rok hydrologiczny daty: jej rok kalendarzowy, a dla listopada i grudnia rok następny."
convention = "Rok IMGW-PIB trwa od 1 listopada do 31 października i nosi nazwę roku kalendarzowego, w którym się kończy (2016 = 1.11.2015–31.10.2016); w ČHMÚ tak samo (Hydrologická ročenka České republiky 2010, wstęp)."

[rules.hydrological_year.constants]
first_month = "Pierwszy miesiąc roku hydrologicznego"

[rules.hydrological_day_of_year]
en_sha256 = "ee51229b9125bd2dd769dcf400d3fb629fa1f2d696681367b6c852ec7634ecc3"
title = "Numer dnia w roku hydrologicznym"
definition = "Numer dnia daty w jej roku hydrologicznym: liczba dni od 1 listopada plus jeden."
convention = "1 listopada to dzień 1, a 29 lutego dzień 121; od 1 marca dni roku przestępnego mają numer o jeden większy niż w roku zwykłym (1 marca to dzień 122 albo 121, 31 października dzień 366 albo 365): numer dnia nie wskazuje daty kalendarzowej."

[rules.hydrological_day_of_year.constants]
first_month = "Pierwszy miesiąc roku hydrologicznego"

[rules.days_in_hydrological_year]
en_sha256 = "fe4e1041a7c79df55aab1e2233b828a43b994ca36b79705f0e7633c0e07b6144"
title = "Liczba dni roku hydrologicznego"
definition = "Liczba dni kalendarzowych roku hydrologicznego: 366, gdy jego nazwa jest rokiem przestępnym, w przeciwnym razie 365."
convention = "Rok obejmuje 29 lutego roku kalendarzowego, od którego bierze nazwę; lata przestępne kalendarza gregoriańskiego to wielokrotności 4, które nie są wielokrotnościami 100, chyba że są wielokrotnościami 400 (2000 przestępny, 2100 zwykły)."

[rules.hydrological_year_start]
en_sha256 = "e659e61d756c18be620a5927e0006949bf0f0e74f60f3c57d82cb141efa752ef"
title = "Początek roku hydrologicznego"
definition = "Pierwszy dzień roku hydrologicznego: 1 listopada roku kalendarzowego poprzedzającego rok jego nazwy."
convention = "Rok nosi nazwę roku kalendarzowego, w którym się kończy."

[rules.hydrological_year_start.constants]
first_month = "Pierwszy miesiąc roku hydrologicznego"

[rules.daily_calendar]
en_sha256 = "3164669075adc8587d6e59e8edbcd71986275b032a9320b5b3754348d2e2a9ed"
title = "Szereg na pełnym kalendarzu dobowym"
definition = "Każdy dzień od pierwszej do ostatniej daty szeregu, z jego wartością."
convention = "Dzień, którego daty brak w szeregu albo którego wartość to NaN, nie ma wartości (NaN); żadna wartość nie jest uzupełniana."

[rules.complete_year_extremes]
en_sha256 = "86c3fa126262f39567b59962f563c58e55bdb6574551ce3aaace692a0a3df37f"
title = "Ekstrema roczne lat kompletnych"
definition = "Maksimum albo minimum każdego kompletnego roku hydrologicznego, czyli takiego, który ma wartość w każdym ze swoich 365 albo 366 dni."
convention = "Rok z dniem bez wartości jest pomijany i zgłaszany (jego ekstremum mogło przypaść na ten dzień); data podana dwukrotnie liczy się raz."

[rules.water_level_frequency]
en_sha256 = "47c60ee65c0c917c0c44602dd96e2b13413c908b47d11f7dbcfcbb95bb8e04f6"
title = "Rozkład częstości i czasu trwania stanów wody"
definition = "Klasy o szerokości `bin_width` od najniższego stanu zaokrąglonego w dół do pełnej jednostki aż do pierwszej granicy powyżej najwyższego stanu zaokrąglonego w górę; liczebność każdej klasy, jej częstość 100 n_i / n %, częstość skumulowana od najniższej klasy i czas trwania D_i = 100 - częstość skumulowana poniżej klasy i, czyli udział stanów równych dolnej granicy klasy lub wyższych."
convention = "Klasy [dolna, górna) jak w numpy.histogram, ostatnia domknięta; pierwsza granica to pełna jednostka stanów (cm albo m), więc klasy zależą od jednostki; czas trwania jako udział wartości osiągniętych lub przekroczonych."

[rules.rating_curve_start]
en_sha256 = "0d9456ace60de99a8a8a4681141a752faa88bf7f1be477a709d5ebe41e311625"
title = "Punkt startowy poszukiwania stanu przepływu zerowego krzywej natężenia przepływu"
definition = "Bez `h0_initial` poszukiwanie zaczyna się od H0 = min(H) - max(1, 0.1 (max(H) - min(H))), poniżej każdego stanu niezależnie od znaku stanów."
convention = "Co najmniej jedna jednostka stanów (1 cm albo 1 m), więc punkt startowy zależy od jednostki; w teście porównawczym Hydrologa na syntetycznych krzywych starty od 0,1 do 1 rozstępu poniżej najniższego stanu prowadziły do tego samego minimum metody najmniejszych kwadratów."

[rules.rating_curve_start.constants]
start_fraction = "Ułamek rozstępu stanów, o który start poszukiwania stanu przepływu zerowego leży poniżej najniższego stanu"

[rules.rating_curve_outlier_screening]
en_sha256 = "2d83be0d151dd1903f84691a5e7be4ca4ed435fbf5fa121f40d9229a77fe05f8"
title = "Odrzucanie pomiarów odstających przy dopasowaniu krzywej natężenia przepływu"
definition = "Przy `remove_outliers` pary, których reszta z pierwszego dopasowania przekracza `outlier_std` odchyleń standardowych reszt (n - 1), są pomijane, a krzywa jest dopasowywana ponownie do pozostałych, jeden raz, gdy zostają co najmniej 3 pary."
convention = "Jedno przejście: pary z |r| > k s są pomijane, a z |r| = k s zachowywane; start drugiego dopasowania jest taki sam jak pierwszego; własna reguła Hydrologa, podczas gdy WMO-No. 1044 (rozdz. 1.12.1) sprawdza pomiar przepływu odbiegający od krzywej o więcej niż 5 procent pomiarem kontrolnym."

[rules.depth_duration_interpolation]
en_sha256 = "ef91c6ea195dcac630877617d488889d7376581e850b3281b7a1c9092526f3ad"
title = "Interpolacja krzywej wysokość–czas trwania"
definition = "wysokość krzywej wysokość–czas trwania dla czasu trwania między dwoma jej punktami D_i <= D <= D_(i+1): h = h_i + (h_(i+1) - h_i) ln(D / D_i) / ln(D_(i+1) / D_i); czas trwania odległy od punktu o mniej niż 1e-9 przyjmuje jego wysokość; poza krzywą wartości nie ma"
convention = "liniowo względem ln D (ADR-0042): tak odtwarza się wydruki itwh KOSTRA-DWD 2010R dla Göllheim z dokładnością 0,07 mm z wysokości drukowanych z dokładnością 0,1 mm, a interpolacja liniowa względem D chybia o 0,16 mm; narzędzie DWA MDMS interpoluje liniowo względem D, a HEC-HMS w skali log-log; niczego się nie ekstrapoluje"

[rules.pmaxtp_depth]
en_sha256 = "ee544c315fdf83412e0f9577d9bffd502e7dbca00dc180d3be8e18bc391d90bb"
title = "Wysokość opadu z tablic PMAXTP"
definition = "wysokość z tablicy PMAXTP IMGW-PIB dla punktu, czasu trwania i prawdopodobieństwa przewyższenia z tablic, metodą POT albo AMP, wraz z wysokościami 16 czasów trwania przy tym prawdopodobieństwie: krzywa wysokość–czas trwania dla `euler_ii_hyetograph`; nic nie jest liczone ani interpolowane"
convention = "p to prawdopodobieństwo przewyższenia w procentach (w praktyce odczytuje się T = 100 / p lat; IMGW-PIB nie dokumentuje przeliczenia POT na prawdopodobieństwa roczne); wysokość zwracana jest tak, jak podaje ją IMGW-PIB (0,01 mm); tylko czasy trwania i prawdopodobieństwa z tablic; domyślnie POT, które IMGW-PIB zaleca dla p >= 50 % i poniżej uznaje za równoważne AMP (s. 23). Wiersz jest zadeklarowany tutaj: hydrolog._pmaxtp nie importuje żadnej biblioteki numerycznej"

[rules.idw_grid_mean]
en_sha256 = "cf6c7022ec4b749c9f5b03c63638a70c8f6284c70204b9bf0a3970c76a7dae2f"
title = "Opad obszarowy jako średnia oszacowań IDW w węzłach siatki"
definition = "opad obszarowy zlewni jako średnia arytmetyczna oszacowań IDW (`idw_precipitation`) w punktach siatki"
convention = "średnia z punktów jest średnią w zlewni tylko dla regularnej siatki punktów leżących w jej granicach; w każdym punkcie używa się każdego posterunku"
