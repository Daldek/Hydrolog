[formulas.spi_gamma_fit]
en_sha256 = "13af6af20c0d9ee80318d638a9036b05e75fb69c885e4dffe899f99042881bb8"
title = "Rozkład gamma sum opadu według przybliżenia Thoma"
validation = "Estymator Thoma przybliża estymator największej wiarygodności parametru kształtu: jego błąd względny wynosi 1e-4 przy A = 0,1 (alpha bliskie 5), 2e-3 przy A = 0,3 i 2,7 % przy A = 1 (alpha 0,62) w porównaniu z dokładnym rozwiązaniem równania ln(alpha) - digamma(alpha) = A (audyt z 2026-11-18); źródła nie podają testu dopasowania do obserwacji"
conventions = [
    "sumy jednego miesiąca kalendarzowego i jednej skali czasowej z lat okresu odniesienia; wywołujący pomija lata bez sumy",
    "q = m / n, udział sum zerowych wśród wszystkich n sum (Edwards i McKee 1997, w ujęciu Naresha Kumara i in. 2009, wzór A9); parametry kształtu i skali tylko z sum dodatnich",
    "przybliżenie Thoma, a nie dokładny estymator największej wiarygodności, jak w climate_indices 3.2.0 i xclim 1.0.0 (metoda APP)",
    "A liczone jako średnia z d - ln(1 + d), gdzie d = x / (średnia x) - 1, co jest równe ln(średnia x) - średnia(ln x), lecz bez utraty dokładności przy odejmowaniu (ln x - ln(średnia x) dla sumy mniejszej od połowy średniej)",
]

[formulas.spi_gamma_fit.variables]
sums_mm = "Sumy opadu jednego miesiąca kalendarzowego i jednej skali czasowej, po jednej na każdy rok okresu odniesienia"

[formulas.spi_gamma_fit.outputs]
alpha = "Parametr kształtu rozkładu gamma sum dodatnich"
beta_mm = "Parametr skali tego rozkładu"
zero_probability = "Udział sum zerowych"

[formulas.spi_gamma_fit.constants]
thom_ratio = "Współczynnik przy A pod pierwiastkiem w przybliżeniu Thoma"
thom_denominator = "Mnożnik A w mianowniku przybliżenia Thoma"

[formulas.spi_gamma_fit.constraints]
three_positive_sums = "co najmniej trzy sumy są dodatnie"
positive_sums_differ = "sumy dodatnie nie są wszystkie równe (A > 0)"

[formulas.spi]
en_sha256 = "1a38fda9050a4d3c645f39e087a57ebe33fc18022b3d64413683edd5e117c183"
title = "Standaryzowany wskaźnik opadu (SPI) dla sum opadu"
validation = "brak: SPI jest przekształceniem dopasowanego rozkładu"
conventions = [
    "klasyczne traktowanie sum zerowych, H(0) = q (Edwards i McKee 1997; climate_indices, `zero_handling` 'classic'); środek masy zer, Phi^-1(q / 2), nie jest stosowany",
    "wartości ograniczone do przedziału od -3,09 do 3,09, czyli kwantyli rzędu 0,001 i 0,999, jak w climate_indices; WMO-No. 1090 i xclim nie wprowadzają ograniczenia",
    "górny ogon liczony z 1 - H = (1 - q) Q(alpha, x / beta), gdzie Q to regularyzowana górna niekompletna funkcja gamma, tam gdzie H > 0,5",
    "SPI nie jest przypisywany do klas (WMO-No. 1090, tab. 1 podaje klasy od -2 do 2)",
]

[formulas.spi.variables]
sums_mm = "Sumy opadu z miesiąca kalendarzowego i skali czasowej rozkładu; NaN pozostaje NaN"
