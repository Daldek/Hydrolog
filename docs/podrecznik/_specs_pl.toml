title = "Hydrogram jednostkowy Clarka dla czasu trwania opadu: krzywa czas–powierzchnia i zbiornik liniowy"
validation = "brak: Clark (1945) i HEC-HMS podają model; jego parametry tc i R kalibruje się na wezbraniach obserwowanych (HEC-HMS), a źródła nie podają żadnej statystyki błędu"
