times_in_order = "t[i+1] >= t[i]: wartości uporządkowane w czasie, dopuszczalne kilka wartości z jednego czasu"
two_times = "t[-1] > t[0]: nachylenie wymaga dwóch wartości o różnych czasach"
slopes_in_float64 = "2 (max x - min x) / (najmniejszy krok t) oraz prosta (max x - min x) / (najmniejszy krok t) max|t| + max|x| są skończone w float64: tak samo każde nachylenie, różnica dwóch nachyleń i wyraz wolny"
