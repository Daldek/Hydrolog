[formulas.clark_lag]
en_sha256 = "191d5ff2aa74f08d67e4ae90db0bb918b20190f37b954ca94890aa500f113c33"
title = "Czas opóźnienia modelu Clarka: środek ciężkości krzywej czas–powierzchnia plus R"
validation = "brak: dokładna własność modelu; parametry tc i R Clarka kalibruje się na wezbraniach obserwowanych (HEC-HMS), a źródła nie podają żadnej statystyki błędu"
conventions = [
    "opóźnienie od chwili jednostki opadu do środka ciężkości odpowiedzi, w min; hydrogram jednostkowy dla D jest opóźniony o dalsze D / 2 względem początku opadu",
    "środek ciężkości eliptycznej krzywej czas–powierzchnia z HEC-HMS leży w tc / 2 niezależnie od jej współczynnika (1,414): pola, które jej dwie połówki odcinają od prostej A = 1, są równe",
]
assumptions = [
    "krzywa czas–powierzchnia zlewni eliptycznej (specyfikacja `clark`); inna krzywa ma inny środek ciężkości",
]

[formulas.clark_lag.variables]
tc_min = "Czas koncentracji, czyli czas translacji zlewni"
r_min = "Stała retencji zbiornika liniowego, S = R O"

[formulas.clark_lag.outputs]
lag_time_min = "Czas opóźnienia, pierwszy moment hydrogramu jednostkowego chwilowego Clarka liczony od chwili opadu"

[formulas.clark_lag.constants]
centroid_share = "Względne położenie środka ciężkości krzywej czas–powierzchnia, ułamek tc"

[formulas.uh_convolution]
en_sha256 = "5823a28edc36af513cb73cd927569a9c8bb3b8e7b8b3b580b76ebc50a67cb47b"
title = "Odpływ bezpośredni z opadu efektywnego przez splot dyskretny z hydrogramem jednostkowym"
validation = "brak: splot jest superpozycją, którą zakłada hydrogram jednostkowy; jego źródła nie podają własnej oceny zgodności z obserwacjami"
conventions = [
    "jednostki SI: wysokości w mm, rzędne w m³/s na mm, przepływy w m³/s",
    "Pe_m to opad efektywny przedziału od m dt do (m + 1) dt, a U_0 — rzędna w t = 0: Q_n w t = n dt to odpowiedź na końcu przedziału n, zgodnie z ustawieniem we wzorze 6.12 KZGW i w przykładzie 16-1 NEH (Q(0,6 h) = 0,12 in x UH(0,3 h))",
    "hydrogram jednostkowy dotyczy czasu trwania dt, równego krokowi opadu",
    "V = dt sum(Q_n), sumę liczy się dokładnie (`math.fsum`)",
]
assumptions = [
    "liniowość i niezmienność w czasie odpowiedzi zlewni na opad efektywny równomierny na całej zlewni",
]

[formulas.uh_convolution.variables]
effective_precip_mm = "Opad efektywny w każdym kroku"
unit_hydrograph_m3s = "Rzędne hydrogramu jednostkowego dla czasu trwania równego krokowi, pierwsza w t = 0"
timestep_min = "Krok czasowy opadu i hydrogramu jednostkowego"

[formulas.uh_convolution.outputs]
peak_discharge_m3s = "Największa rzędna hydrogramu"
time_to_peak_min = "Chwila pierwszej największej rzędnej"
total_volume_m3 = "Objętość hydrogramu, sum(Q_n) dt"
discharge_m3s = "Odpływ bezpośredni w chwili t_n"
times_min = "Chwile rzędnych"

[formulas.uh_convolution.constraints]
length_bounded = "hydrogram ma najwyżej milion rzędnych, M + K - 1"

[formulas.muskingum]
en_sha256 = "b25d4b2dc0a699e43050a6e2ae1f327759bfb323c9c5e1e87ec07a36772ae461"
title = "Transformacja fali metodą Muskingum w N jednakowych pododcinkach (retencja McCarthy'ego, ciągłość wzorem trapezów)"
validation = "brak: K i X kalibruje się na wezbraniach obserwowanych na odcinku (HEC-HMS TRM, model Muskingum; EM 1110-2-1417 rozdz. 9); źródła nie podają oceny zgodności samego schematu z obserwacjami"
conventions = [
    "jednostki SI: przepływ w m³/s, czas w min, retencja w m³ (K w min razy przepływ w m³/s razy 60 s minuty z tabeli jednostek)",
    "wagi nazwano według tego, co mnożą: `c_current` — I[t], `c_previous` — I[t-1], `c_outflow` — O[t-1]; NEH 630 i HEC-HMS nazywają je C2, C1 i C3, przykłady z Iowa i NPTEL — C1, C2 i C3",
    "ciągłość wzorem trapezów, (S[t] - S[t-1]) / dt = (I[t] + I[t-1]) / 2 - (O[t] + O[t-1]) / 2, przy S = k [X I + (1 - X) O] w każdym pododcinku",
    "N jednakowych pododcinków o stałej K / N połączonych szeregowo, z tym samym X (HEC-HMS); każdy pododcinek startuje w stanie ustalonym z odpływem O0, więc w pierwszej rzędnej wszystkie poza pierwszym są zasilane przez O0",
    "w granicach tolerancji okna waga, którą zaokrąglenie sprowadza poniżej zera, jest zerowana, a pozostałe dzieli się przez ich sumę (`hydrolog.routing._kernels.nonnegative_coefficients`)",
    "transformowane są tylko podane rzędne: `MuskingumReach` dobiera N (zaokrąglone K / dt) oraz podkroki kroku, dla którego nie ma okna, interpoluje między nimi dopływ liniowo i wydłuża oś czasu (Tier B, ADR-0008)",
]
assumptions = [
    "retencja odcinka jest liniową funkcją ważonego przepływu, S = K [X I + (1 - X) O], przy K i X stałych w czasie wezbrania",
    "brak cofki: odpływ nie zależy od wody poniżej odcinka",
]

[formulas.muskingum.variables]
inflow_m3s = "Dopływ w chwilach t = 0, dt, 2 dt, ...: hydrogram wpływający do odcinka, liniowy między rzędnymi"
timestep_min = "Krok czasowy dopływu i odpływu"
k_min = "Czas przepływu przez cały odcinek, stała retencji K"
x = "Waga dopływu w retencji: 0 — zbiornik liniowy, 0,5 — fala nietłumiona"
subreaches = "Liczba jednakowych pododcinków o stałej K / N połączonych szeregowo"
initial_outflow_m3s = "Odpływ w pierwszej rzędnej; odcinek startuje z nim w stanie ustalonym"

[formulas.muskingum.outputs]
outflow_m3s = "Odpływ w rzędnych dopływu"
c_current = "Waga I[t] w jednym pododcinku"
c_previous = "Waga I[t-1] w jednym pododcinku"
c_outflow = "Waga O[t-1] w jednym pododcinku"
storage_start_m3 = "Objętość wody w pododcinkach w pierwszej rzędnej"
storage_end_m3 = "Objętość wody w pododcinkach w ostatniej rzędnej"
storage_steady_m3 = "Objętość wody w pododcinkach w stanie ustalonym przy ostatnim dopływie, K I[-1]"

[formulas.muskingum.constraints]
representable = "dt, K / N i dt / (K / N) >= 2,2e-308, najmniejsza liczba znormalizowana float64, a 2 K [s] i objętość wody K max(I, O0) [m³] są skończone: poniżej tej granicy wagi zaokrąglają się do mniejszej liczby cyfr albo wagi dopływu ulegają niedomiarowi i wpływająca woda ginie; powyżej wagi są NaN"
nonnegative_weights = "2 K X / N <= dt <= 2 K (1 - X) / N, każdy koniec z dokładnością do 1e-9 swojej wartości: każda waga jest nieujemna, więc nieujemny dopływ daje nieujemny odpływ"

[formulas.linear_reservoir_cascade]
en_sha256 = "093fe776e06ff87714542323cf35650ccaf565c5b5ef1cdb0297aaa1bd0d82a4"
title = "Kaskada n jednakowych zbiorników liniowych, ścisła dla dopływu liniowego między rzędnymi (Nash)"
validation = "brak: n i K kalibruje się na obserwowanych wezbraniach lub wyznacza z cech odcinka (Kalinin–Milukow); źródła nie podają oceny zgodności samej kaskady z obserwacjami"
conventions = [
    "jednostki SI: przepływ w m³/s, czas w min, retencja w m³ (K w min razy przepływ w m³/s razy 60 s minuty z tabeli jednostek)",
    "dopływ jest liniowy między rzędnymi, a przed pierwszą z nich równy odpływowi początkowemu: każdy zbiornik startuje w stanie ustalonym z odpływem O0, a w pierwszej rzędnej dopływ skacze do I[0]",
    "odpływ w rzędnej jest ścisłą odpowiedzią na taki dopływ, a nie krokiem metody trapezów czy Eulera; między rzędnymi nie jest liniowy, więc objętość odpływu liczona wzorem trapezów różni się od jego całki",
    "waga, którą zaokrąglenie sprowadza poniżej zera, jest zerowana; tak samo reszta n - V i odpływ, które zaokrąglenie sprowadza poniżej zera",
    "n nie musi być całkowite: Gamma(n) i P(n, x) z funkcji `gammainc` i `gammaincc` biblioteki SciPy",
    "transformowane są tylko podane rzędne: `CascadeReach` przyjmuje K albo K = L / (n c) z długości odcinka i prędkości fali oraz wydłuża oś czasu (Tier B, ADR-0008)",
]
assumptions = [
    "każdy zbiornik jest liniowy, S = K O, przy K stałym w czasie wezbrania",
    "brak cofki: odpływ nie zależy od wody poniżej odcinka",
]

[formulas.linear_reservoir_cascade.variables]
inflow_m3s = "Dopływ w chwilach t = 0, dt, 2 dt, ...: hydrogram wpływający do odcinka, liniowy między rzędnymi"
timestep_min = "Krok czasowy dopływu i odpływu"
n = "Liczba jednakowych zbiorników połączonych szeregowo; nie musi być całkowita"
k_min = "Stała retencji jednego zbiornika"
initial_outflow_m3s = "Odpływ w pierwszej rzędnej; odcinek startuje z nim w stanie ustalonym"

[formulas.linear_reservoir_cascade.outputs]
outflow_m3s = "Odpływ w rzędnych dopływu"
storage_start_m3 = "Objętość wody w zbiornikach w pierwszej rzędnej"
storage_end_m3 = "Objętość wody w zbiornikach w ostatniej rzędnej"
storage_steady_m3 = "Objętość wody w zbiornikach w stanie ustalonym przy ostatnim dopływie, n K I[-1]"

[formulas.linear_reservoir_cascade.constraints]
representable = "n >= 2,2e-308, 0 < dt / K, a siatka N dt / K, największy przepływ podzielony przez dt / K i retencja n K max(I, O0) są skończone w float64"

[formulas.lag]
en_sha256 = "da694affce24dc5c03c738967739d52ac556dc872e7e322ca2f6c5d5611f43c2"
title = "Przesunięcie w czasie (lag): dopływ przesunięty o stały czas, liniowy między rzędnymi"
validation = "brak: przesunięcie to czas przepływu przez odcinek, ustalany z jego długości i prędkości fali albo kalibrowany (HEC-HMS TRM, model Lag); źródło nie podaje oceny zgodności z obserwacjami"
conventions = [
    "jednostki SI: przepływ w m³/s, czas w min, retencja w m³ (przesunięcie w min razy przepływ w m³/s razy 60 s minuty z tabeli jednostek)",
    "przed pierwszą rzędną dopływ jest równy odpływowi początkowemu (odcinek w stanie ustalonym, ADR-0008); HEC-HMS TRM, model Lag, wzór 1 przyjmuje zamiast tego O_t = I_t dla t < lag",
    "przesunięcie niebędące całkowitą liczbą kroków interpoluje dopływ liniowo między dwiema rzędnymi otaczającymi t - lag, co spłaszcza ostre kulminacje; jeden krok przed pierwszą rzędną dopływ wynosi O0, więc rzędne odpływu odpowiadają dopływowi rosnącemu liniowo od O0 do I[0] w tym kroku, podczas gdy objętości retencji przyjmują O0 aż do pierwszej rzędnej",
    "przesunięcie różniące się od całkowitej liczby kroków o nie więcej niż 1e-9 kroku liczy się jako całkowite (`LAG_ROUNDING`); objętości retencji zachowują przesunięcie w podanej postaci",
    "transformowane są tylko podane rzędne: `LagReach` wydłuża oś czasu o przesunięcie (Tier B, ADR-0008) i dodaje uwagę `lag_interpolated` dla przesunięcia niebędącego całkowitą liczbą kroków",
]
assumptions = [
    "odcinek przesuwa falę bez tłumienia, a czas przepływu jest stały w czasie wezbrania",
    "brak cofki: odpływ nie zależy od wody poniżej odcinka",
]

[formulas.lag.variables]
inflow_m3s = "Dopływ w chwilach t = 0, dt, 2 dt, ...: hydrogram wpływający do odcinka, liniowy między rzędnymi"
timestep_min = "Krok czasowy dopływu i odpływu"
lag_min = "Przesunięcie, czas przepływu przez odcinek"
initial_outflow_m3s = "Odpływ w pierwszej rzędnej; odcinek startuje z nim w stanie ustalonym"

[formulas.lag.outputs]
outflow_m3s = "Odpływ w rzędnych dopływu"
storage_start_m3 = "Objętość wody w drodze przez odcinek w pierwszej rzędnej, lag O0"
storage_end_m3 = "Objętość wody w drodze przez odcinek w ostatniej rzędnej, dopływ z ostatnich lag minut"
storage_steady_m3 = "Objętość wody w drodze przez odcinek w stanie ustalonym przy ostatnim dopływie, lag I[-1]"
lag_steps = "Przesunięcie podzielone przez krok czasowy"
lag_fraction = "Waga wcześniejszej rzędnej: część kroku, o którą przesunięcie odbiega od całkowitej liczby kroków"

[formulas.lag.constraints]
representable = "lag / dt i objętość wody w drodze lag max(I, O0) są skończone w float64"

[formulas.manning_normal_flow]
en_sha256 = "03cfb9c14b76e3d8d8c1de2df091eb7cc81a59b01b88dea63d32b331f9c09b79"
title = "Przepływ normalny w korycie trapezowym, prostokątnym lub trójkątnym ze wzoru Manninga, z kinematyczną prędkością fali dQ/dA"
validation = "brak: źródła podają wzór Manninga jako praktykę obliczeń ustalonego przepływu jednostajnego w korytach otwartych i nie podają własnej oceny zgodności z obserwacjami; n dobiera się z tabel albo kalibruje (USGS WSP 2339)"
conventions = [
    "jednostki SI: Q w m³/s, długości w m, n w s/m^(1/3); postać w jednostkach amerykańskich mnoży przez 1,486, zaokrąglony pierwiastek sześcienny z liczby stóp w metrze (1,4859), tak jak HEC-RAS (USGS WSP 2339, wzór 1)",
    "spadek dna jest spadkiem linii energii (spadkiem tarcia): przepływ jest jednostajny",
    "prędkość fali to lokalna kinematyczna prędkość fali dQ/dA przy danej głębokości (HEC-HMS, wzór 4; NEH, wzór 17-25 z m = d ln Q / d ln A); przykład 17-4 z NEH przyjmuje m krzywej natężenia przepływu ważone przepływem od zera do Q (wzory 17-29, 17-30a), o 2 % większe od lokalnego (przypadek `mc_neh17_example17_4_from_section`)",
    "jedna szorstkość dla całego obwodu zwilżonego; trapez z obiema skarpami o nachyleniu z:1, prostokąt przy z = 0 i trójkąt przy b = 0; bez terenów zalewowych",
    "głębokość normalną wyznacza się metodą Brenta względem ln y (`scipy.optimize.brentq`, delegowane, CMP-1.2) w przedziale wyznaczonym z nachylenia ln K względem ln y, mieszczącego się między 1 a 10/3, z dokładnością do czterech jednostek 1e-16 wartości max(1, |ln y|)",
]
assumptions = [
    "przepływ ustalony jednostajny: głębokość jest głębokością normalną danego przepływu",
    "koryto pryzmatyczne, którego n nie zmienia się z głębokością",
    "przepływ mieści się w przekroju, który nie ma górnego ograniczenia",
]

[formulas.manning_normal_flow.variables]
discharge_m3s = "Przepływ, dla którego wyznacza się przepływ normalny"
slope_m_per_m = "Spadek dna, równy spadkowi linii energii przy przepływie jednostajnym"
bottom_width_m = "Szerokość dna przekroju; zero dla trójkąta"
side_slope_m_per_m = "Odległość pozioma w metrach na metr wysokości obu skarp; zero dla prostokąta"
manning_n = "Współczynnik szorstkości Manninga dla całego obwodu zwilżonego"

[formulas.manning_normal_flow.outputs]
depth_m = "Głębokość normalna"
area_m2 = "Pole przekroju przepływu przy głębokości normalnej"
top_width_m = "Szerokość zwierciadła wody przy głębokości normalnej"
velocity_m_per_s = "Prędkość średnia Q / A"
celerity_m_per_s = "Prędkość kinematycznej fali wezbraniowej, dQ/dA przy stałym spadku"

[formulas.manning_normal_flow.constants]
radius_exponent = "Wykładnik promienia hydraulicznego"
slope_exponent = "Wykładnik spadku linii energii"

[formulas.manning_normal_flow.constraints]
has_width = "b + z > 0: przekrój ma dno lub skarpy; bez żadnego z nich nie mieści wody"
representable_flow = "2,2e-308 <= y, A, T, V, c < inf: float64 przechowuje przepływ normalny z dokładnością do szesnastu cyfr; przekrój tak wąski, płaski lub szorstki albo przepływ tak duży lub mały, że któraś z tych wielkości przekracza zakres lub trafia między liczby subnormalne, nie ma przepływu normalnego"

[formulas.muskingum_cunge]
en_sha256 = "6cac6856b5f5830a000b172a34dca9de394d99f30d15b4d44764375b0b395634"
title = "Transformacja fali metodą Muskingum-Cunge ze stałymi współczynnikami na N jednakowych krokach przestrzennych (K i X według Cunge'a)"
validation = "brak: źródła porównują schemat z modelami przepływu nieustalonego, a nie z obserwacjami (NEH 630 przykłady 17-4 i 17-5 w porównaniu z HEC-RAS: kulminacje zgodne w granicach 0,2 i 2,5 %); NRCS dopasował swoją granicę dokładności do 140 testowych transformacji (NEH 630 załącznik 17B)"
conventions = [
    "jednostki SI: przepływ w m³/s, czas w min, odcinek w km, krok przestrzenny i długość dyfuzji w m, prędkość fali w m/s, retencja w m³",
    "wagi nazwano według tego, co mnożą: `c_current` — I[t], `c_previous` — I[t-1], `c_outflow` — O[t-1]; NEH 630 i HEC-HMS nazywają je C2, C1 i C3",
    "jeden przepływ odniesienia, jedna prędkość fali i jedna szerokość zwierciadła dla wszystkich kroków przestrzennych i czasowych, więc współczynniki są stałe: WinTR-20 z NRCS przyjmuje kulminację na górnym końcu każdego kroku przestrzennego (NEH 630 przykład 17-5), a HEC-HMS przelicza współczynniki w każdym kroku czasu i drogi (metoda o zmiennych współczynnikach, Ponce 1986): przypadek `mc_neh17_example17_5_reach`",
    "X może być ujemne (NEH 630 przykład 17-4, X = -0,254); siatkę z ujemną wagą, którą NEH dopuszcza (przykład 17-5, C1 = -0,187), odrzuca warunek wstępny `nonnegative_weights` (Hydrolog ADR-0008)",
    "w granicach tolerancji okna waga, którą zaokrąglenie sprowadza poniżej zera, jest zerowana, a pozostałe dzieli się przez ich sumę (`hydrolog.routing._kernels.nonnegative_coefficients`)",
    "Dg oblicza się jako D / dx (NEH wzór 17-34), co z dokładnością do zaokrągleń równa się 1 - 2X (wzór 17-35); granicę dokładności exp(2,3 Cg) ogranicza się do exp(700), co przewyższa każde Dg <= 1 + Cg z okna",
    "brak dopływu bocznego: człon C4 q dx we wzorze 7 HEC-HMS jest równy zeru",
    "transformowana jest tylko podana siatka: `MuskingumCungeReach` przyjmuje kulminację dopływu jako przepływ odniesienia, o ile nie podano innego, dobiera N i podkroki kroku według reguł NEH 630 w obrębie okna, interpoluje między nimi dopływ liniowo, a tam, gdzie siatka nie istnieje, przechodzi na zbiorniki liniowe (Tier B, ADR-0008, ADR-0026)",
]
assumptions = [
    "fala dyfuzyjna: człony bezwładności w równaniu ruchu są pomijane, a równanie adwekcji–dyfuzji linearyzuje się przy przepływie odniesienia ze stałymi c i mu = Q / (2 T S0) (HEC-HMS wzory 1 do 5)",
    "odcinek pryzmatyczny o jednym spadku; brak cofki",
]

[formulas.muskingum_cunge.variables]
inflow_m3s = "Dopływ w chwilach t = 0, dt, 2 dt, ...: hydrogram wpływający do odcinka, liniowy między rzędnymi"
timestep_min = "Krok czasowy dopływu i odpływu"
length_km = "Długość odcinka"
slope_m_per_m = "Spadek dna odcinka"
