[formulas.scs_cn_retention]
en_sha256 = "73745089e03352bbdf22c7b0f984fa6fd2a5b3a2e0b8316d892e9bdb333604ab"
title = "Retencja maksymalna S w metodzie SCS-CN"
validation = "brak: S jest definicją liczby CN (NEH 630-10, wzór 10-12)"
conventions = [
    "S w mm z calowej postaci wzoru 10-12 NEH 630-10 przez dokładny przelicznik 25,4 mm/cal z tabeli jednostek, co daje wzór 10-13 (S = 25400/CN - 254)",
    "CN dla warunków wilgotnościowych poprzedzających przyjętych w obliczeniu: ARC (AMC) II, chyba że przeliczono ją przez `scs_cn_amc`",
]

[formulas.scs_cn_retention.variables]
cn = "Liczba CN dla warunków wilgotnościowych poprzedzających przyjętych we wzorze"

[formulas.scs_cn_retention.outputs]
retention_mm = "Retencja maksymalna po rozpoczęciu odpływu"

[formulas.scs_cn_retention.constants]
s_scale = "Licznik ilorazu przez CN (w calach)"
s_offset = "Składnik odejmowany od ilorazu (w calach)"

[formulas.scs_cn_runoff]
en_sha256 = "018322ca110ada2df39c72c577c82a98d70e907a72300eb57082fe7cc1131981"
title = "Odpływ bezpośredni z opadu według metody SCS-CN"
validation = "NEH 630-9 (s. 9-1) wyprowadza liczby CN swoich tablic z rocznych wezbrań małych zlewni rolniczych o powierzchni na ogół poniżej 1 mili kwadratowej i z opadów trwających najwyżej jeden dzień; źródła nie podają żadnej miary błędu równania"
conventions = [
    "jednostki SI: wysokości w mm",
    "równanie stosuje się do sumy narastającej opadu, a odpływ w każdym kroku to różnica sum narastających odpływu (NEH 630-10, przykład 10-6; KZGW 2017, wzór 6.2); sumę opadu traktuje się jak opad o jednym kroku",
    "Ia = lambda S przy zadanym lambda; S z CN według `scs_cn_retention`",
    "CN dla ARC (AMC) II, chyba że przeliczono ją przez `scs_cn_amc`",
    "C = Q / P dla całego opadu, 0 przy braku opadu",
]
assumptions = [
    "wartości CN z tablic NRCS zakładają lambda = 0,2; inna wartość lambda wymaga CN dopasowanych do niej (NEH 630-10 s. 10-4; Woodward i in. 2003), a polecenie `scs effective` wydaje wtedy uwagę `ia_coefficient_nonstandard`",
    "odpływ bezpośredni z jednego opadu, a nie model infiltracji ani symulacja ciągła (NEH 630-10 s. 10-19); nie dla topnienia śniegu ani deszczu na zamarzniętym gruncie (TR-55 s. 2-11)",
    "TR-55 (s. 2-11) uznaje metodę za mniej dokładną dla odpływu poniżej 0,5 cala (12,7 mm); wynik poniżej tej granicy nie wywołuje uwagi",
]

[formulas.scs_cn_runoff.variables]
precipitation_mm = "Wysokość opadu w każdym kroku czasowym (suma to jeden krok)"
cn = "Liczba CN dla warunków wilgotnościowych poprzedzających przyjętych we wzorze"
ia_coefficient = "Współczynnik strat początkowych Ia / S"

[formulas.scs_cn_runoff.outputs]
total_effective_mm = "Odpływ bezpośredni z całego opadu"
effective_mm = "Odpływ bezpośredni w każdym kroku"
runoff_coefficient = "Stosunek odpływu bezpośredniego do opadu"
retention_mm = "Retencja maksymalna S"
initial_abstraction_mm = "Straty początkowe Ia"

[formulas.scs_cn_amc]
en_sha256 = "aacbc03cc8d7fa31d7a0d2b9590abcebecfa49445388217f02e13d79adcba14f"
title = "Liczba CN dla warunków wilgotnościowych poprzedzających I lub III (Hawkins i in. 1985)"
validation = "Ponce i Hawkins (1996, s. 15) podają dopasowania S_I = 2,281 S_II (r2 0,999, błąd standardowy 0,206 cala) i S_III = 0,427 S_II (r2 0,994, 0,088 cala) do tab. 10-1 NEH oraz błędy standardowe 1,0 CN (wzór 15) i 0,7 CN (wzór 16); względem tej tablicy przy CN od 55 do 95 zaokrąglone przeliczenie różni się najwyżej o 2 CN dla ARC I i o 1 CN dla ARC III (bez zaokrąglenia najwyżej 2,45 CN dla ARC I przy CN 92 i 1,19 CN dla ARC III przy CN 79)"
conventions = [
    "dopasowanie Hawkinsa i in. (1985) do krzywych NRCS, a nie sama tab. 10-1 NEH 630-10 (NEH 630-10 s. 10-6; podaje tę tablicę) ani wzory 5.5.7-5.5.8 Chowa i in. (1988), będące innym dopasowaniem",
    "zaokrąglana do najbliższej liczby całkowitej, tak jak drukuje je tab. 10-1, połowa do liczby parzystej; co najmniej 1",
    "dla ARC II CN pozostaje taka, jak podano: bez wzoru",
]
assumptions = [
    "NEH 630-10 (s. 10-5, 10-7) nie stwierdził związku między opadem z pięciu poprzedzających dni a CN: warunki wybiera inżynier",
]

[formulas.scs_cn_amc.variables]
cn = "Liczba CN dla warunków wilgotnościowych poprzedzających przyjętych we wzorze"
amc = "Warunki wilgotnościowe poprzedzające, na które przelicza się CN: I suche, III wilgotne"

[formulas.scs_cn_amc.outputs]
cn_adjusted = "Liczba CN dla tych warunków"

[formulas.scs_cn_amc.constants]
ratio_i = "Stosunek retencji maksymalnej w warunkach I do retencji w warunkach II"
ratio_iii = "Stosunek retencji maksymalnej w warunkach III do retencji w warunkach II"
cn_scale = "Liczba CN przy zerowej retencji maksymalnej"

[formulas.tr55_cn]
en_sha256 = "3fa6cdadd2622d9dcf640e6114435f9170b4a4e0bab861a9e34898ab65d1da11"
title = "Liczba CN kompleksu glebowo-roślinnego z tablic TR-55"
validation = "NEH 630-9 (s. 9-1) wyprowadza CN swoich kompleksów z rocznych wezbrań małych zlewni rolniczych o jednej grupie glebowej i jednym pokryciu; tablica nie podaje żadnej miary błędu"
conventions = [
    "ARC (AMC) II i Ia = 0,2 S (TR-55, tab. 2-2a do 2-2c, przypis 1)",
    "`herbaceous` to wiersz „pastwisko, łąka lub wypas ekstensywny” (pasture, grassland or range) z tab. 2-2c, jak każe przypis 1 tab. 2-2d dla wypasu ekstensywnego w regionach wilgotnych; samej tab. 2-2d (pastwiska ekstensywne obszarów suchych i półsuchych) się nie używa",
    "uprawy rzędowe i zboża to wiersze „rzędy proste” (straight row) z tab. 2-2b, tylko w stanie złym i dobrym: TR-55 nie ma dla nich stanu średniego",
    "woda ma CN 98 (NEH 630-9 s. 9-1), a nie 100 jak w niektórych opracowaniach",
]

[formulas.tr55_cn.variables]
hsg = "Hydrologiczna grupa gleby"
land_cover = "Klasa pokrycia terenu w Hydrologu"
condition = "Stan hydrologiczny; brak dla pokrycia o jednym wierszu"

[formulas.tr55_cn.outputs]
cn = "Liczba CN dla ARC II i Ia = 0,2 S"

[formulas.tr55_cn.constraints]
row_in_table = "tablica ma wiersz danego pokrycia terenu w danym stanie hydrologicznym"

[formulas.kirpich]
en_sha256 = "ddac9a62c12346874ad7b8e6195e6a221f358a6f4c00f7d01f30a08d3a75ef0a"
title = "Czas koncentracji według wzoru Kirpicha (postać z Tennessee)"
validation = "Kirpich (1940) opublikował krzywe dla sześciu zlewni Ramsera (1927) koło Jackson w stanie Tennessee (z siedmiu pominięto zlewnię 2), a nie wzór; Mota i Kobiyama (2015, s. 57-58) otrzymują z własnego dopasowania do tych danych wyniki odbiegające od wzoru o 2 do 9 % w zakresie L 350-4 000 ft i S 0,025-0,1, a poza nim do 30 %"
conventions = [
    "postać z Tennessee w jednostkach źródła: L w stopach przez dokładny przelicznik 0,3048 m/ft z tabeli jednostek, tc w minutach; stałe SI 0,0195 (L w m; Roussel i in. 2005, TxDOT 2019) i 0,01947 (WR-D-71-1, 2023) są zaokrągleniami 0,0078 (1/0,3048)^0,77 = 0,019472, a stała Hydrologu 3,981 (L w km) do wersji 0.8.1 była o 0,136 % większa od dokładnej 3,97560",
    "L wzdłuż cieku od przekroju do najdalszego punktu zlewni, czyli najdłuższa droga spływu, a S to różnica wysokości jej końców podzielona przez L (Fang i in. 2005, wzór 3.14) — ani koryto do jego początku, ani średni spadek zlewni; Kirpich (1940) mierzył L do najwyższego punktu zlewni (Mota i Kobiyama 2015, s. 56)",
    "S w m/m (ft/ft), nie w procentach",
    "sam wzór nie ma poprawki małych spadków; Kerby–Kirpich stosuje ją w swojej części korytowej (Cleveland i in. 2012)",
]
assumptions = [
    "małe zlewnie wiejskie z wyraźnymi korytami, 1,25-112 akrów (0,005-0,45 km², sprawdzane przez `WatershedParameters.calculate_tc`), a więc głównie przepływ korytem; Kirpich stosował wzór do ok. 200 akrów (Roussel i in. 2005, s. 5); mnożniki 0,4 dla spływu po stoku po betonie lub asfalcie i 0,2 dla koryt betonowych z praktyki amerykańskiej (Fang i in. 2005, s. 22) nie są stosowane",
    "zlewnie Hydrografu (drogi spływu 0,05-30 km) leżą w większości poza zakresem danych Kirpicha (0,107-1,22 km): ich wyniki są ekstrapolacją, z uwagą",
]

[formulas.kirpich.variables]
length_km = "Długość najdłuższej drogi spływu, od przekroju do punktu zlewni najdalszego hydraulicznie"
slope_m_per_m = "Spadek najdłuższej drogi spływu: wysokość jej początku minus wysokość przekroju, podzielona przez jej długość"

[formulas.kirpich.outputs]
tc_min = "Czas koncentracji"

[formulas.kirpich.constants]
kirpich_coefficient = "Współczynnik wzoru Kirpicha"
kirpich_length_exponent = "Wykładnik długości drogi spływu"
kirpich_slope_exponent = "Wykładnik spadku drogi spływu"

[formulas.nrcs]
en_sha256 = "63de1b1db4f63f94b06923c34a051efb52cca47c524b85ec6e8418496f67cdeb"
title = "Czas koncentracji z równania opóźnienia zlewni NRCS (Mockus 1961)"
validation = "NEH 630-15 (s. 15-6) podaje dane równania: 24 zlewnie od 1,3 akra do 9,2 mili kwadratowej, w większości poniżej 2 000 akrów (Mockus 1961), oraz to, że Folmar i Miller (2000) uznali za rozsądną górną granicę do 19 mil kwadratowych; tab. 15-4 pokazuje, że opóźnienie jednej zlewni zmienia się od opadu do opadu (Jones Falls, Maryland: od 4,16 do 6,91 h)"
conventions = [
    "wzór 15-4b w jednostkach źródła: l w stopach i S w calach przez dokładne przeliczniki 0,3048 m/ft i 25,4 mm/cal z tabeli jednostek, Y w procentach (100 na m/m), Tc w godzinach, przeliczany na minuty; w SI ma postać 100 l[m]^0,8 (S[mm] + 25,4)^0,7 / (7068,86 Y^0,5), gdzie 100/7068,86 = 0,0141466, podczas gdy Hydrolog do wersji 0.8.1 stosował 0,01416 (+0,095 %, TRIAGE T8)",
    "Tc = lag / 0,6 (wzór 15-3, Mockus 1957; Simas 1996); hydrogram jednostkowy przyjmuje tp = D/2 + 0,6 Tc (USACE HEC-HMS Technical Reference Manual, hydrogram jednostkowy SCS, wzory 1 i 3); TR-55 (1986) nie podaje zależności dla opóźnienia",
    "l to najdłuższa droga spływu od działu wodnego do przekroju (s. 15-5); Y to średni spadek terenu zlewni, „nie mylić ze spadkiem drogi spływu” (s. 15-5)",
    "współczynnik oporu cn' to CN dla AMC II (s. 15-6: CN służy jako zamiennik cn'); S = 0 przy CN 100; ułamkowa CN, będąca średnią ważoną, jest używana bez zmian",
]
assumptions = [
    "przeciętne naturalne warunki zlewni z w przybliżeniu równomiernym rozkładem odpływu (wzór 15-3); powierzchnię 24 zlewni, 0,005-24 km², sprawdza `WatershedParameters.calculate_tc`",
    "drogi spływu Hydrografu (0,05-30 km) i CN jego zlewni (51,8-81,4) leżą w zakresie CN równania; CN poniżej 50 lub powyżej 95 daje uwagę",
]

[formulas.nrcs.variables]
length_km = "Długość spływu: najdłuższa droga, którą woda spływa od działu wodnego do przekroju"
slope_m_per_m = "Średni spadek terenu zlewni, nie spadek drogi spływu"
cn = "Liczba CN dla AMC II, zastępująca współczynnik oporu cn'"

[formulas.nrcs.outputs]
tc_min = "Czas koncentracji"

[formulas.nrcs.constants]
tc_denominator = "Mianownik wzoru na opóźnienie zlewni"
length_exponent = "Wykładnik długości spływu"
retention_exponent = "Wykładnik członu z retencją maksymalną"
retention_shift = "Składnik dodawany do retencji maksymalnej"
s_scale = "Licznik ilorazu przez cn' w retencji maksymalnej (w calach)"
s_offset = "Składnik odejmowany od ilorazu w retencji maksymalnej (w calach)"
percent = "Przelicznik spadku z m/m na procenty"

[formulas.giandotti]
en_sha256 = "291d7cdf05011dd1b6fa47b2b141c91e13fb246bf3ea872cf9ccb70e251fdfb6"
title = "Czas koncentracji według wzoru Giandottiego (1934)"
validation = "brak w otwartych źródłach (Giandotti 1934 nie jest dostępny otwarcie)"
conventions = [
    "A w km², L w km i H w m, jak podają źródła; tc w godzinach przeliczany na minuty",
    "H to średnia wysokość zlewni minus wysokość przekroju, a nie deniwelacja (maksimum minus minimum) ani sama średnia wysokość",
    "L to ciek główny, pole `channel_length_km`, za Grimaldim i in. (2012, wzór 5); Autorità di bacino del Po (2001, §6.1: „percorso idraulicamente più lungo”) i Michailidi i in. (2018) przyjmują najdłuższą drogę spływu, dłuższą o odcinek spływu po stoku (Kamiennik: 14,78 wobec 15,88 km, +3,5 % w tc)",
]
assumptions = [
