# Polish texts of the formula specs for the handbook (docs/podrecznik/), read by
# scripts/generate_handbook.py; the equations, units, ranges and constants themselves
# come from the specs and are never written here.
#
# [units]          the Polish name of each unit of the specs; a unit spelt with a word
#                  (day, years) has its Polish symbol too
# [words]          the Polish words of the \text{...} of the specs' equations
# [columns]        the Polish headers of the columns of the specs' published tables
# [formulas.NAME]  a Tier A spec: title, the meaning of each input (variables), output
#                  and constant, the constraints, conventions, assumptions, validation
# [rules.NAME]     a Tier B formula of docs/FORMULAS.md: title, definition, convention
#                  and the meaning of each constant
#
# An entry of a formula carries en_sha256, the SHA-256 of the English texts of the
# spec it translates, and each translated text keeps the numbers of its English one;
# the generator stops when either differs. `uv run scripts/generate_handbook.py
# --template NAME` prints the entry of a formula to translate.

