var_s = "Wariancja statystyki S Kendalla, na której opiera się przedział: wariancja z testu Manna–Kendalla tych wartości, z poprawką na wiązania (wzór 16.3 Gilberta albo wzór 16.5 przy kilku wartościach z jednego czasu)"
