[formulas.mann_kendall]
en_sha256 = "27c8d11839e29ec3966376f51c5cfb40f87461799d720587943e3f1d57375a09"
title = "Test trendu Manna–Kendalla: S, Var(S) z poprawką na wiązania, Z i dwustronne p"
validation = "brak: test hipotezy o braku trendu; jego źródła nie porównują go z obserwacjami"
conventions = [
    "wartości są wiązane, gdy są dokładnie równe (szereg liczony w arytmetyce zmiennoprzecinkowej należy najpierw zaokrąglić do jego dokładności); sgn(0) = 0, jak definiuje KZGW (2017) we wzorze 1.2, choć w podanych tam przykładach obliczeniowych parę wiązaną liczy się jako -1",
    "Var(S) z poprawką na grupy wartości wiązanych (Gilbert, wzór 16.3; Hirsch i in., wzór 3b; pakiet R trend); KZGW (2017, s. 11) pomija tę poprawkę",
    "Z z poprawką na ciągłość o jeden w stronę 0 oraz Z = 0 dla S = 0 (Gilbert, wzór 16.4; KZGW, wzór 1.4)",
    "wartość p jest dwustronna: poniżej n0 wartości — dokładne P(|S'| >= |S|) po wszystkich różnych uporządkowaniach wartości, jednakowo prawdopodobnych przy braku trendu, z uwzględnieniem wiązań (współczynniki q-wielomianowe, MacMahon 1916); od n0 wartości — 2 P(Z' > |Z|) z górnego ogona rozkładu normalnego (`norm.sf` z scipy, jak pakiet R trend), co zachowuje cyfry znaczące przy silnym trendzie",
    "wartość p mniejszą od najmniejszej dodatniej liczby zmiennoprzecinkowej (|Z| powyżej około 38,5) zastępuje się tą liczbą, końcem fizycznego przedziału (0, 1]",
    "szereg w dowolnej jednostce: statystyki są bezwymiarowe",
]
assumptions = [
    "wartości są niezależne i mają jednakowy rozkład przy braku trendu (Gilbert 1987, s. 213; KZGW 2017, s. 10): autokorelacja, np. przepływów dobowych lub miesięcznych, sprawia, że test zbyt często odrzuca hipotezę",
    "wartości są uporządkowane w czasie, po jednej na krok czasowy; luki w zapisie nie wchodzą do testu",
]

[formulas.mann_kendall.variables]
values = "Szereg uporządkowany w czasie, po jednej wartości na krok czasowy: maksima, średnie lub minima roczne, sumy lub liczebności, w dowolnej jednostce"

[formulas.mann_kendall.outputs]
s = "Statystyka S Kendalla: liczba par rosnących pomniejszona o liczbę par malejących"
var_s = "Wariancja S przy braku trendu, z poprawką na grupy wartości równych; 0 dla szeregu wartości równych"
z = "Standaryzowana statystyka z poprawką na ciągłość równą jeden"
p_value = "Dwustronna wartość p hipotezy braku trendu; wartość mniejszą od najmniejszej dodatniej liczby zmiennoprzecinkowej zastępuje się tą liczbą"
p_value_method = "Sposób wyznaczenia p: dokładny poniżej n0 wartości, przybliżenie normalne od n0"

[formulas.mann_kendall.constants]
exact_below = "Liczba wartości, od której wartość p wyznacza się z przybliżenia normalnego"

[formulas.mann_kendall.constraints]
enough_values = "n >= 3"

[formulas.sen_slope]
en_sha256 = "532bbd8b6a2fa099dc2d6496418394d6854ae29e03e659cd87ef86af766e7508"
title = "Nachylenie Sena szeregu z wyrazem wolnym Conovera"
validation = "brak: estymator nachylenia trendu monotonicznego; jego źródła nie porównują go z obserwacjami"
conventions = [
    "nachylenia tylko par o różnych czasach: kilka wartości z jednego czasu (przypadek wzoru 16.5 Gilberta) nie daje nachylenia między sobą",
    "na jednostkę podanych czasów: na rok przy latach, na krok przy krokach 0, 1, 2 … szeregu; pakiety R trend i modifiedmk liczą nachylenia na krok indeksu, co daje to samo, gdy lata następują po sobie",
    "mediana parzystej liczby nachyleń jest średnią dwóch środkowych",
    "wyraz wolny Conovera median(x) - b median(t) (Helsel i in. 2020, wzór 10.3), czyli wartość prostej w t = 0; alternatywą w winiecie pakietu trend jest mediana reszt",
    "co najwyżej 5 000 wartości: wszystkie nachylenia są przechowywane w pamięci, po osiem bajtów każde, 100 MB przy 5 000 wartości; estymator jest przeznaczony dla wartości niezależnych, rocznych lub miesięcznych, których najdłuższe serie liczą kilkaset lat",
]
assumptions = [
    "liniowy trend wartości w czasie; estymator jest odporny na wartości odstające, nie na autokorelację wartości (podobnie jak test Manna–Kendalla)",
]

[formulas.sen_slope.variables]
values = "Szereg, po jednej wartości na każdy czas z times, w dowolnej jednostce; nachylenie ma jednostkę szeregu na jednostkę czasu"
times = "Czas każdej kolejnej wartości: jej rok albo krok 0, 1, 2 … szeregu; kilka wartości może mieć ten sam czas. Nachylenie jest wyrażone na jednostkę tych czasów"

[formulas.sen_slope.outputs]
slope = "Nachylenie Sena: mediana nachyleń par o różnych czasach, w jednostce wartości na jednostkę czasu"
intercept = "Wyraz wolny Conovera: wartość prostej w czasie 0 (w roku 0 przy latach)"
n_slopes = "Liczba par o różnych czasach"

[formulas.sen_slope.constraints]
same_length = "jeden czas na każdą wartość"
times_in_order = "t[i+1] >= t[i]: wartości uporządkowane w czasie, dopuszczalne kilka wartości z jednego czasu"
two_times = "t[-1] > t[0]: nachylenie wymaga dwóch wartości o różnych czasach"
slopes_in_float64 = "2 (max x - min x) / (najmniejszy krok t) oraz prosta (max x - min x) / (najmniejszy krok t) max|t| + max|x| są skończone w float64: tak samo każde nachylenie, różnica dwóch nachyleń i wyraz wolny"

