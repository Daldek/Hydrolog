[formulas.level_pool]
en_sha256 = "8946791291e738c61179f802ee307c16213b618a3bc9acbec5de0173f43ce788"
title = "Transformacja fali metodą zbiornikową z krzywą roboczą (zmodyfikowana metoda Pulsa) przez N jednakowych zbiorników"
validation = "brak: zależność retencja–odpływ odcinka lub zbiornika pochodzi z profili zwierciadła wody, topografii zbiornika lub obserwowanych wezbrań (HEC-HMS TRM, Modified Puls; NEH 630 rozdz. 17); źródła nie podają oceny zgodności samego schematu z obserwacjami"
conventions = [
    "jednostki SI: przepływ w m³/s, retencja w m³, krok w min (S / dt z 60 s minuty z tabeli jednostek)",
    "odpływ odczytuje się z krzywej roboczej S / (N dt) + O / 2 interpolacją liniową między wierszami tabeli, bo tabela jest między nimi liniowa (NEH 630 interpoluje swoją tabelę roboczą, HEC-HMS rozwiązuje to samo równanie metodą prób i błędów)",
    "każdy z N zbiorników połączonych szeregowo mieści S / N przy tym samym odpływie (pododcinki HEC-HMS); każdy zbiornik startuje w stanie ustalonym z odpływem O0, przy największej retencji, dla której tabela daje ten odpływ, więc zbiornik ze strefą martwą poniżej korony przelewu startuje napełniony do korony",
    "poziom odniesienia kolumny retencji jest dowolny: do odpływu wchodzą tylko różnice retencji, a podawane retencje mierzy się od tego poziomu",
    "stan, który zaokrąglenie wyprowadza poza koniec tabeli o co najwyżej 1e-9 górnej wartości krzywej roboczej, utrzymuje się na tym końcu; przy większym przekroczeniu zbiornik wychodzi poza tabelę, co odrzucają warunki wstępne `flood_below_table_top` i `flood_above_table_bottom`",
    "retencję w stanie ustalonym przy ostatniej rzędnej dopływu odczytuje się w skrajnym wierszu tabeli, gdy przepływ wykracza poza ten wiersz",
    "transformowane są tylko podane rzędne: `LevelPoolReach` dzieli dłuższy krok na podkroki przy dopływie liniowym między rzędnymi, wydłuża oś czasu i odczytuje stan wody w ostatnim zbiorniku (Tier B, ADR-0008)",
]
assumptions = [
    "retencja jest jednoznaczną funkcją odpływu: poziome zwierciadło wody albo odcinek, którego retencja nadąża za odpływem, bez histerezy (NEH 630: zwierciadło wody jest poziome lub prawie poziome)",
    "dla koryta NEH 630 wymaga czasu przepływu przez odcinek nie większego niż około połowa czasu wznoszenia dopływu (nie jest to dana wejściowa: nie jest sprawdzane)",
    "dopływ jest liniowy między rzędnymi (wzór trapezów)",
]

[formulas.level_pool.variables]
inflow_m3s = "Dopływ w chwilach t = 0, dt, 2 dt, ...: hydrogram wpływający do odcinka, liniowy między rzędnymi"
timestep_min = "Krok czasowy dopływu i odpływu"
table_storage_m3 = "Retencja w każdym wierszu tabeli retencja–odpływ, niemalejąca; do odpływu wchodzą tylko jej różnice, więc jej poziom odniesienia jest dowolny"
table_outflow_m3s = "Odpływ w każdym wierszu tabeli, niemalejący; zero poniżej korony przelewu"
subreaches = "Liczba zbiorników połączonych szeregowo, z których każdy mieści S / N z tabeli przy tym samym odpływie"
initial_outflow_m3s = "Odpływ w pierwszej rzędnej; odcinek startuje z nim w stanie ustalonym"

[formulas.level_pool.outputs]
outflow_m3s = "Odpływ w rzędnych dopływu"
storage_m3 = "Objętość wody we wszystkich zbiornikach w każdej rzędnej"
last_pool_storage_m3 = "Objętość wody w ostatnim zbiorniku w każdej rzędnej, cała objętość przy N = 1"
storage_peak_m3 = "Największa objętość wody we wszystkich zbiornikach"
storage_steady_m3 = "Objętość wody, jaką zbiorniki mieściłyby w stanie ustalonym przy ostatniej rzędnej dopływu"

[formulas.level_pool.constraints]
table_columns_paired = "kolumny retencji i odpływu mają tyle samo wierszy"
table_not_decreasing = "S[i] <= S[i+1] i O[i] <= O[i+1]: retencja i odpływ rosną razem z poziomem wody"
table_rows_distinct = "żaden wiersz nie powtarza poprzedniego: krzywa robocza rośnie z wiersza na wiersz"
initial_outflow_in_table = "O[0] <= O0 <= O[-1]: zbiorniki startują w stanie ustalonym odpowiadającym stanowi z tabeli"
storage_where_outflow_rises = "dS > 0 na każdym odcinku tabeli, na którym rośnie odpływ, od stanu ustalonego przy najmniejszym przepływie obliczenia do pierwszego wiersza, który osiąga przepływ największy: na odcinku bez retencji żaden krok nie spełnia warunku kroku"
timestep_within_limit = "dt <= 2 min(dS/dO) / N po odcinkach, do których obliczenie może dojść (od stanu ustalonego przy najmniejszym przepływie obliczenia do pierwszego wiersza, który osiąga przepływ największy), z dokładnością do 1e-9 swojej wartości: waga (2K - dt) / (2K + dt) stanu poprzedniego nie jest ujemna na żadnym z nich, więc odpływ pozostaje między najmniejszym a największym przepływem obliczenia"
working_curve_rises = "S / (N dt) + O / 2 jest skończone i rośnie z wiersza na wiersz w float64: z tej krzywej odczytuje się odpływ"
flood_below_table_top = "żaden zbiornik nie napełnia się powyżej ostatniego wiersza (jego krzywa robocza nie przekracza wartości ostatniego wiersza o więcej niż 1e-9 tej wartości): tabela obejmuje wezbranie, nigdy nie stosuje się ekstrapolacji"
flood_above_table_bottom = "żaden zbiornik nie opróżnia się poniżej pierwszego wiersza (jego krzywa robocza nie spada poniżej wartości pierwszego wiersza o więcej niż 1e-9 wartości ostatniego wiersza): dopływ mniejszy niż pierwszy odpływ z tabeli nie może opróżnić zbiornika"

