schema = "nogat-formula-card/1"
name = "mann_kendall"
title = "Mann-Kendall test of a monotonic trend: S, Var(S) with ties, Z and the two-sided p"
function = "hydrolog.statistics.stationarity.mann_kendall"
family = "statistic"
formula_version = 1
status = "referenced"
equation = "S = sum_{i<j} sgn(x_j - x_i); Var(S) = [n (n - 1) (2n + 5) - sum_p t_p (t_p - 1) (2 t_p + 5)] / 18 over the groups of t_p equal values; Z = (S - 1) / sqrt(Var(S)) for S > 0, 0 for S = 0, (S + 1) / sqrt(Var(S)) for S < 0; p = P(|S'| >= |S|) of the exact distribution of S below n0 values, else 2 P(Z' > |Z|) of the standard normal"
latex = "S = \\sum_{i<j} \\operatorname{sgn}(x_j - x_i),\\quad \\operatorname{Var}(S) = \\frac{n(n-1)(2n+5) - \\sum_p t_p(t_p-1)(2t_p+5)}{18},\\quad Z = \\frac{S - \\operatorname{sgn} S}{\\sqrt{\\operatorname{Var}(S)}},\\quad p = \\begin{cases} P(|S'| \\ge |S|) & n < n_0 \\\\ 2\\,P(Z' > |Z|) & n \\ge n_0 \\end{cases}"
validation = "none: a test of the hypothesis of no trend; its sources compare it with no observations"
conventions = ["values tie when exactly equal (round a series computed in floating point to its precision first); sgn(0) = 0, as KZGW (2017) eq. 1.2 defines it, though its worked examples count a tied pair as -1", "Var(S) corrected for the groups of ties (Gilbert eq. 16.3, Hirsch et al. eq. 3b, R's trend); KZGW (2017, p. 11) leaves the correction out", "Z with a continuity correction of one toward 0 and Z = 0 for S = 0 (Gilbert eq. 16.4, KZGW eq. 1.4)", "the p-value is two-sided: below n0 values the exact P(|S'| >= |S|) over every distinct ordering of the values, equally likely under no trend, ties respected (the q-multinomial coefficients, MacMahon 1916); from n0 values 2 P(Z' > |Z|) from the upper tail of the normal distribution (scipy's norm.sf, as R's trend), which keeps its digits for a strong trend", "a p-value below the smallest positive float (|Z| above about 38.5) is set to it, the end of the physical range (0, 1]", "the series in any unit: the statistics have none"]
assumptions = ["the values are independent and identically distributed under no trend (Gilbert 1987, p. 213; KZGW 2017, p. 10): serial correlation, as of daily or monthly flows, makes the test reject too often", "the values are in time order, one per time step; gaps of the record do not enter the test"]
notices = []
reference_cases = ["tests/fixtures/formulas/trend-cases.json"]
tables = []

