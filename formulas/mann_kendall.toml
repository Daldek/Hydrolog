[[variables]]
name = "values"
symbol = "x_i"
unit = "m3/s"
kind = "real_array"
description = "The series in time order, one value per time step: annual maxima, means or minima, sums or counts, in any unit."
applicability = "unstated"
gaps_allowed = false
dims = 1
min_length = 1

[variables.physical]
test_low = -1000000.0
test_high = 1000000.0
test_reason = "the test counts the signs of differences and Sen's slope scales with the unit of the series, so any bound tests their arithmetic: a million m3/s exceeds the discharge of every river, and a stage or a temperature may lie below 0, so the same bound holds below 0"

[variables.typical]
low = 0.81
low_inclusive = true
high = 111.0
high_inclusive = true

[variables.typical.source]
citation = "KZGW (2017). Aktualizacja metodyki obliczania przepływów i opadów maksymalnych o określonym prawdopodobieństwie przewyższenia dla zlewni kontrolowanych i niekontrolowanych, załącznik 2 do OPZ (wersja ujednolicona)"
access = "open"
locator = "examples 1.1, 1.2, 3.3 and 3.4, tables 1.1 (pp. 11-12), 1.2 (pp. 13-14), 3.10 (p. 48) and 3.13 (pp. 55-56): the Mann-Kendall test of the annual maxima of the Bóbr at Bukówka, the Czarna at Polana, the Rypienica at Rypin and the Świślina at Rzepin: annual maxima of 0.81 to 111 m3/s"
url = "https://kzgw.gov.pl/files/zam-pub/20170402-przeglad-i-aktualizacja-map/zal-2-do-OPZ-ujednolicony-1.pdf"

[[constraints]]
name = "enough_values"
class = "precondition"
text = "n >= 3"

[constraints.source]
citation = "Pohlert, T. trend: Non-Parametric Trend Tests and Change-Point Detection, R package version 1.1.10, CRAN"
access = "open"
locator = "R/mk.test.R: at least 3 values ('x' must have at least 3 elements), S, varS corrected for ties, z = sgn(S) (|S| - 1) / sigma, the two-sided p 2 min(0.5, P(Z > |z|))"
url = "https://cran.r-project.org/package=trend"

[[constants]]
name = "exact_below"
value = 10.0
unit = "values"
symbol = "n_0"
exact = "10"

[constants.source]
citation = "Gilbert, R.O. (1987). Statistical Methods for Environmental Pollution Monitoring. Van Nostrand Reinhold, New York"
access = "open"
locator = "section 16.4.2, p. 211: the normal approximation from n = 10 after Kendall (1975, p. 55), as KZGW (2017, p. 11) and Hirsch et al. (1981, PDF p. 7) state it; section 16.4.1 and table A18: the exact probabilities below"
url = "https://digital.library.unt.edu/ark:/67531/metadc1197046/m2/1/high_res_d/7037501.pdf"

[[outputs]]
name = "s"
unit = "-"
kind = "integer"
symbol = "S"
description = "Kendall's score: the pairs in ascending order less the pairs in descending order."

[outputs.physical]

[[outputs]]
name = "var_s"
unit = "-"
kind = "real"
symbol = "\\operatorname{Var}(S)"
description = "The variance of S under no trend, corrected for the groups of equal values; 0 for a series of equal values."

[outputs.physical]
low = 0.0
low_inclusive = true

[[outputs]]
name = "z"
unit = "-"
kind = "real"
symbol = "Z"
description = "The standardised score with a continuity correction of one."

[outputs.physical]

[[outputs]]
name = "p_value"
unit = "-"
kind = "real"
symbol = "p"
description = "Two-sided p-value of no trend; one below the smallest positive float is set to it."

[outputs.physical]
low = 0.0
low_inclusive = false
high = 1.0
high_inclusive = true

[[outputs]]
name = "p_value_method"
unit = "-"
kind = "choice"
description = "exact below n0 values, normal from n0."
choices = ["exact", "normal"]

[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "sqrt(Var(S)) at Var(S) = 0, a series of equal values: Z = 0 by S = 0, limit equal_values"

[[traps]]
name = "exp_overflow"
description = "exp of a scaled input at its test bound."
test = "the normal tail exp(-z^2/2) of a strong trend: 50 increasing values keep p = 1.3e-24 and 10,000 give the smallest positive float, not 0 (test_a_strong_trend_keeps_a_p_value_above_zero)"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type case values-nan_element: a gap is refused"

[[traps]]
name = "many_small_terms"
description = "A sum of many small terms that loses precision."
test = "S sums n(n - 1)/2 signs in integers and Var(S) is one division of integers (test_s_of_a_long_series_is_exact)"

[[oracles]]
kind = "exact"
description = "the null distribution of S by every ordering of the series (the permutation test's definition), with Fraction probabilities: p and the variance of the distribution, which is Var(S) with ties"
test = "tests/unit/test_formulas_trend.py (test_the_exact_p_and_var_s_are_those_of_every_ordering)"
conventions = []

[[oracles]]
kind = "exact"
description = "the Mahonian numbers of the inversions of the permutations of n by the recurrence M(n, k) = M(n, k - 1) + M(n - 1, k) - M(n - 1, k - n), not the product of the q-factorial"
test = "tests/unit/test_formulas_trend.py (test_the_exact_p_without_ties_is_that_of_the_mahonian_numbers)"
conventions = []

[[oracles]]
kind = "established"
description = "scipy.stats.kendalltau of the series against its times (SciPy 1.18.1): S from tau-b and, without ties below n0 values, the exact p"
test = "tests/unit/test_formulas_trend.py (test_s_and_the_exact_p_are_scipys_kendalltau)"
conventions = ["kendalltau(method='exact') is the two-sided p of the permutation distribution of the inversions without ties, the p of the spec below n0 values", "tau-b times sqrt(n0 (n0 - n1)), n0 = n (n - 1)/2 and n1 the tied pairs of the values, is S"]

[[oracles]]
kind = "frozen"
description = "R 4.4.3 trend 1.1.10 mk.test, modifiedmk 1.6 mkttest and Kendall 2.2.2 MannKendall on 13 series"
test = "tests/oracles/trend_regime/r_oracle_outputs_headed.csv (tests/unit/test_formulas_trend.py, test_mann_kendall_is_rs)"
conventions = ["trend::mk.test: S, varS corrected for ties, z with the continuity correction, p = 2 min(0.5, P(Z > |z|)) for every n; Hydrolog's p below n0 values is exact, so only S, Var(S) and Z are compared there", "Kendall::MannKendall copies the data to single precision; the series of the oracle tie in both precisions"]
