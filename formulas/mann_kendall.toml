[properties.scalings.inputs]
values = 1.0

[properties.scalings.outputs]

[properties.scalings.tolerance]
reason = "the statistics count signs of differences and groups of equal values, which doubling, negating or reversing the series keeps or mirrors exactly"
abs = 0.0

[[properties.limits]]
name = "equal_values"
text = "a series of equal values: S = 0, Var(S) = 0, Z = 0 (Gilbert's eq. 16.4 for S = 0) and p = 1, every ordering being the same"

[properties.limits.source]
citation = "Gilbert, R.O. (1987). Statistical Methods for Environmental Pollution Monitoring. Van Nostrand Reinhold, New York"
access = "open"
locator = "eqs. 16.1 to 16.4, pp. 209-211: S, Var(S) corrected for ties, Z with a continuity correction of one; section 16.4.1 and table A18: the exact probabilities of S below n = 10"
url = "https://digital.library.unt.edu/ark:/67531/metadc1197046/m2/1/high_res_d/7037501.pdf"

[[properties.limits]]
name = "monotone_series_exact"
text = "a strictly monotone series below n0 values has the exact p 2/n!"

[[properties.limits]]
name = "normal_tail"
text = "from n0 values p equals erfc(|Z| / sqrt(2)), the normal tail of another algorithm"

[[properties.symmetries]]
