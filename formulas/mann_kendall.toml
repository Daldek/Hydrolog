abs = 0.0

[[properties.symmetries]]
name = "reversed_series"
text = "the series in reverse order has the negated S and Z, the same Var(S) and p"

[properties.symmetries.tolerance]
reason = "the statistics count signs of differences and groups of equal values, which doubling, negating or reversing the series keeps or mirrors exactly"
abs = 0.0

