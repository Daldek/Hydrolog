locator = "the data Kartograf downloads for Hydrolog's soil hsg: integers 0 to 1000 g/kg; soil texture takes percent (0 to 100) or g/kg"
url = "https://www.isric.org/explore/soilgrids/faq-soilgrids"

[[constraints]]
name = "positive_total"
class = "precondition"
text = "clay + sand + silt > 0"

[constraints.source]
citation = "Soil Science Division Staff (2017). Soil Survey Manual. USDA Agriculture Handbook No. 18 (minor amendments February 2018). USDA-NRCS, Washington, DC"
access = "open"
locator = "ch. 3, 'Definitions of Soil Texture Classes and Subclasses', pp. 122-124 (sands and loamy sands p. 122, sandy loams p. 123, loam to clay p. 124); the textural triangle, Fig. 3-7, p. 125"
url = "https://www.govinfo.gov/content/pkg/GOVPUB-A-PURL-gpo113168/pdf/GOVPUB-A-PURL-gpo113168.pdf"

[[outputs]]
name = "texture_class"
unit = "-"
kind = "choice"
symbol = "\\mathrm{class}"
description = "USDA texture class, one of the twelve of the Soil Survey Manual."
choices = ["sand", "loamy_sand", "sandy_loam", "loam", "silt_loam", "silt", "sandy_clay_loam", "clay_loam", "silty_clay_loam", "sandy_clay", "silty_clay", "clay"]

[[traps]]
name = "class_limit"
description = "A value exactly at a limit of a published class or table."
test = "tests/unit/test_formulas_texture.py::test_every_row_of_the_table_at_its_limit_and_just_beyond: each row's limit on the integer percent and g/kg grids and one g/kg beyond, against the Manual's inclusive or exclusive wording; clay 20 and 27 % moved by math.nextafter"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "tests/unit/test_formulas_texture.py::test_a_gap_is_refused_or_kept_as_no_data: NaN is refused (outside_physical_range); a NaN or infinite amount of the array variant gives its cell the loam placeholder and classify_hsg masks it as no data"

[[oracles]]
kind = "frozen"
description = "Kartograf 0.8.2, kartograf.hydrology.hsg.classify_usda_texture_array (its own copy of the rules), on all 5,151 integer percent and 501,501 integer g/kg compositions"
test = "tests/oracles/kartograf_0_8_2_texture_percent.csv and tests/oracles/kartograf_0_8_2_texture_gkg.csv (written once by tests/oracles/kartograf_texture_oracle.py), compared by tests/unit/test_formulas_texture.py"
conventions = ["both: amounts compared with their total in float64, no division", "both classify a composition, not a share; the grids have no zero total"]

[[oracles]]
kind = "exact"
description = "the package table evaluated in exact rationals (fractions.Fraction) on both integer grids and on drawn integer compositions"
test = "tests/unit/test_formulas_texture.py::test_the_table_in_rationals_agrees"
conventions = []

