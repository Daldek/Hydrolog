symbol = "m_\\mathrm{silt}"
unit = "shared unit"
kind = "real"
description = "Amount of silt (0.002 to 0.05 mm) of the fine earth, in any unit the three amounts share (percent, g/kg); they need not sum to 100."
applicability = "unstated"

[variables.physical]
low = 0.0
low_inclusive = true
test_high = 10000.0
test_reason = "ten times the largest amount of the ecosystem's data, 1000 g/kg of SoilGrids; the class depends on the shares only"

