[[constraints]]
name = "shape_of_the_distribution"
class = "physical"
text = "shape > 0 for the log-normal (s) and Weibull (k)"

[constraints.source]
citation = "Virtanen, P. et al. (2020). SciPy 1.0: fundamental algorithms for scientific computing in Python. Nature Methods 17, 261-272"
access = "open"
locator = "scipy.stats.lognorm, shape s > 0, and scipy.stats.weibull_min, shape c > 0"
url = "https://docs.scipy.org/doc/scipy/reference/stats.html"

[[constants]]
name = "cdf_clip"
value = 1e-10
unit = "-"
symbol = "\\epsilon"

[constants.source]
citation = "Hydrolog (2026). ADR-0048: Anderson-Darling critical values by a parametric bootstrap"
access = "open"
locator = "decision 1: A² keeps its form, F clipped to [1e-10, 1 - 1e-10]"
url = "https://github.com/Daldek/Hydrolog/blob/main/docs/decisions/0048-anderson-darling-critical-values-by-a-parametric-bootstrap.md"

[[outputs]]
name = "a_squared"
unit = "-"
kind = "real"
symbol = "A^2"
description = "The statistic: n times the integral of the squared distance of the empirical and the fitted distribution functions, weighted by 1 / (F (1 - F))."

[outputs.physical]
low = 0.0
low_inclusive = true

[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "limit integral_form: ln F at a value outside the support, where F = 0, is ln cdf_clip"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type case annual_maxima-nan_element: a gap is refused"

[[oracles]]
kind = "exact"
description = "the integral form of the definition, n times the integral of (F_n(u) - u)² / (u (1 - u)) du, in closed pieces at 50 digits (decimal)"
test = "tests/unit/test_formulas_flood_frequency.py (limit integral_form)"
conventions = []

[[oracles]]
kind = "established"
description = "scipy.stats.anderson for the normal distribution (Pearson III of skewness 0) and the Gumbel distribution (the GEV of c = 0)"
test = "tests/unit/test_formulas_flood_frequency.py (test_the_a_squared_is_scipys)"
conventions = ["scipy.stats.anderson estimates the parameters itself (the mean and the standard deviation of ddof 1; the Gumbel's by maximum likelihood): they are given to the formula", "scipy takes ln F and ln(1 - F) as logcdf and logsf, unclipped"]
