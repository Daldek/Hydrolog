[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "range case return_periods_years-physical_low_inside: T just above 1 puts the quantiles of the refits in the far lower tail, finite"

[[traps]]
name = "exp_overflow"
description = "exp of a scaled input at its test bound."
test = "range case shape-physical_high_test_bound is refused by enough_refits or gives finite quantiles: the refits keep the shapes of fit_l_moments"

[[oracles]]
kind = "frozen"
description = "R lmomco 2.5.8 qua2ci.simple (called by genci.simple per probability): the empirical limits of 20000 samples of 34 values drawn from the L-moments fits of the Polana maxima and refitted by L-moments, T = 2 to 1000 years, c = 0.95 and 0.68; R 4.5.3, 2026-11-25"
test = "tests/oracles/interval_lmomco_r.csv (tests/unit/test_interval_oracles.py)"
conventions = ["lmomco's empdist limits are the empirical quantiles (1 -+ c)/2 of its simulated quantiles by R's quantile type 6, Hydrolog's numpy method weibull; its lwr/upr, of a generalized normal fitted to them by L-moments (edist gno), are another convention, within 2.9 % of them", "lmomco redraws a sample it cannot fit, Hydrolog leaves it out (none of either here)", "different generators: lmomco's limit lies within Hydrolog's quantiles at the tail probabilities q -+ 4 sqrt(q (1 - q) (1/B + 1/nsim))", "lmomco's gev (xi, alpha, kappa), pe3 (mu, sigma, gamma), ln3 (0, mulog, sigmalog) and wei (zeta, beta, delta) are scipy's genextreme(kappa, xi, alpha), pearson3(gamma, mu, sigma), lognorm(sigmalog, 0, exp(mulog)) and weibull_min(delta, -zeta, beta)"]
