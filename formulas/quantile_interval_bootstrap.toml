schema = "nogat-formula-card/1"
name = "quantile_interval_bootstrap"
title = "Interval of the quantiles of an L-moments fit by a parametric bootstrap (percentile interval)"
function = "hydrolog.statistics.intervals.quantile_interval_bootstrap"
family = "statistic"
formula_version = 1
status = "oracle only"
equation = "B samples of n values drawn from the fitted distribution F(shape, loc, scale) with numpy's default_rng(seed), each sorted and refitted by L-moments (fit_l_moments), a sample whose L-moments the distribution cannot take left out; the K kept refits give per return period T the quantiles Q*_b(T) = F^-1(1 - 1/T; refit b); lower = q6((1 - c) / 2), upper = q6((1 + c) / 2), q6(P) the empirical quantile of type 6: h = (K + 1) P, Q*(j) + (h - j) (Q*(j + 1) - Q*(j)) with j = floor(h) of the ascending Q*, Q*(1) for h < 1 and Q*(K) for h >= K; K < K_min is refused"
latex = "\\hat{Q}^{*}_{b}(T) = F^{-1}\\left(1 - \\tfrac{1}{T};\\ \\hat\\theta^{*}_{b}\\right),\\ b = 1 \\dots K;\\qquad [L, U] = \\left[\\hat{Q}^{*}_{((K + 1)(1 - c)/2)},\\ \\hat{Q}^{*}_{((K + 1)(1 + c)/2)}\\right]"
validation = "none: an interval of an estimator; its coverage, simulated from the distributions it fits at 30 and 60 values, is reported under the formula (CMP-6.11)"
conventions = ["two-sided and central at each confidence level c, each tail (1 - c) / 2; the upper bound at c = 0.68 is KZGW's one-sided upper bound at beta = 84 % (c = 2 beta - 1); every level of one call from one computation", "a parametric bootstrap, the percentile interval of Efron and Tibshirani (1993, ch. 13): B = 999 samples of n values from the fitted distribution, numpy's default_rng with the seed 20261118, the same samples and refits as the critical values of A² of the fit (ADR-0048)", "the empirical quantile of type 6 of Hyndman and Fan (1996), positions i / (K + 1): numpy's method 'weibull', R's quantile type 6 (lmomco's empirical limits); with K = 999 the bounds at c = 0.95 are the 25th refit from each end and at 0.68 the 160th, Efron and Tibshirani's ((B + 1) alpha)th value; a level beyond the reach of K refits, (K + 1)(1 - c) / 2 < 1, takes the smallest and the largest", "a sample whose L-moments the distribution cannot take is left out, not drawn again (lmomco's qua2ci.simple draws again), and counted: samples is the K kept; fewer than 990 is refused (enough_refits)", "the refits of fit_l_moments, the quantiles by scipy's isf at the exceedance 1/T as the quantile specs; scipy's parameters (the GEV c is -xi of Coles)", "variable discharge (a discharge or another quantity never below 0, such as a precipitation depth): a bound below 0 is a gap, with the notice interval_not_computed (below_physical_range) naming its return periods and levels; stage: no such rule"]
assumptions = ["the fitted distribution stands for the parent: the interval is the spread of the L-moments estimator over samples of n values from it", "the annual extremes are independent and identically distributed"]
notices = []
reference_cases = []
tables = []

[properties]
units = "homogeneous"
conservation = []
symmetries = []

[properties.monotonic]

[[properties.scalings]]
name = "unit_of_the_sample"

[properties.scalings.inputs]
loc = 1.0
scale = 1.0

[properties.scalings.outputs]
lower = 1.0
upper = 1.0

[properties.scalings.tolerance]
reason = "the samples, the L-moments and the quantiles are loc + scale times those of the standard distribution, and doubling loc and scale rounds alike"
abs = 1e-300
rel = 4.5e-16

[[properties.limits]]
name = "nested_levels"
text = "lower <= upper, and the interval of a smaller level lies inside that of a larger one"

[[properties.limits]]
name = "order_of_the_levels"
text = "the rows follow the levels in the order given, from the same refits"

[[sources]]
citation = "Efron, B. and Tibshirani, R.J. (1993). An Introduction to the Bootstrap. Chapman and Hall"
access = "author-provided"
locator = "ch. 6 (the parametric bootstrap), ch. 13 (the percentile interval, the empirical (B + 1) alpha-th value of the B replications)"

[[sources]]
citation = "Hosking, J.R.M. and Wallis, J.R. (1997). Regional Frequency Analysis: An Approach Based on L-Moments. Cambridge University Press"
access = "author-provided"
locator = "appendix A.5 (GEV), A.8 (log-normal), A.9 (Pearson type III, the rational approximations of alpha from |t3|)"

[[sources]]
citation = "Kyselý, J. (2008). A cautionary note on the use of nonparametric bootstrap for estimating uncertainties in extreme-value models. Journal of Applied Meteorology and Climatology 47, 3236-3251"
access = "author-provided"
locator = "the parametric bootstrap before the nonparametric one for short samples of extremes"
url = "https://doi.org/10.1175/2008JAMC1763.1"

[[sources]]
citation = "R Core Team. R: A Language and Environment for Statistical Computing, stats::quantile, Sample Quantiles (Hyndman and Fan 1996, types 1 to 9)"
access = "open"
locator = "type 6: m = p, p_k = k / (n + 1), the plotting position of Weibull"
url = "https://stat.ethz.ch/R-manual/R-devel/library/stats/html/quantile.html"

[[sources]]
citation = "Hydrolog (2026). ADR-0048: Anderson-Darling critical values by a parametric bootstrap"
access = "open"
locator = "decision 1: 999 samples of n values drawn from the fitted distribution, each refitted by the same method, seed 20261118; a sample the method cannot fit is left out"
url = "https://github.com/Daldek/Hydrolog/blob/main/docs/decisions/0048-anderson-darling-critical-values-by-a-parametric-bootstrap.md"

[[variables]]
name = "distribution"
symbol = "F"
unit = "-"
kind = "choice"
description = "The distribution: the log-normal of location 0, the GEV, Pearson type III or the three-parameter Weibull distribution of scipy.stats."
choices = ["log_normal", "gev", "pearson3", "weibull"]

[[variables]]
name = "shape"
symbol = "k"
unit = "-"
kind = "real"
description = "Shape: s of the log-normal, c of the GEV (scipy's sign, k of Hosking, -xi of Coles), the skewness of Pearson III, the Weibull shape."
applicability = "unstated"

[variables.physical]
test_low = -9.0
test_high = 50.0
test_reason = "the shapes of Hydrolog's estimators: a Pearson III skewness above -9 by least squares, a GEV c and a Weibull shape of at most 50"

