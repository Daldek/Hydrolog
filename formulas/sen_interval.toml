class = "precondition"
text = "1 <= M1 and M2 + 1 <= N': both ranks lie among the N' ordered slopes (C <= N' - 2)"

[constraints.source]
citation = "Gilbert, R.O. (1987). Statistical Methods for Environmental Pollution Monitoring. Van Nostrand Reinhold, New York"
access = "open"
locator = "section 16.5, steps 1 to 4, p. 218: C = Z(1 - alpha/2) [Var(S)]^(1/2), M1 = (N' - C)/2, M2 = (N' + C)/2, the limits the M1-th and the (M2 + 1)-th of the ordered slopes, 'for n as small as 10 unless there are many ties'; Example 16.5, p. 219, interpolates between ranks, as subroutine CONINT, appendix B, p. 289"
url = "https://digital.library.unt.edu/ark:/67531/metadc1197046/m2/1/high_res_d/7037501.pdf"

[[outputs]]
name = "lower"
unit = "m3/s/a"
kind = "real"
symbol = "b_L"
description = "The lower limit of the slope's interval."

[outputs.physical]

[[outputs]]
name = "upper"
unit = "m3/s/a"
kind = "real"
symbol = "b_U"
description = "The upper limit of the slope's interval."

[outputs.physical]

[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "sqrt(Var(S)) at Var(S) = 0: the middle slopes, limit holds_the_slope; ranks outside the slopes are refused by the precondition ranks_within_slopes"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type cases values-nan_element and times-nan_element: a gap is refused"

[[oracles]]
kind = "algorithm"
description = "the ordered slopes sorted in full (numpy.sort) and the ranks interpolated on the whole ladder of ranks (numpy.interp), as Hydrolog 0.9.0.dev2 computed them"
test = "tests/unit/test_formulas_trend.py (test_the_interval_is_the_interpolation_of_the_sorted_slopes)"
conventions = []

[[oracles]]
kind = "frozen"
description = "R 4.4.3 trend 1.1.10 sens.slope at 90 and 95 % on 13 series"
test = "tests/oracles/trend_regime/r_oracle_outputs_headed.csv (tests/unit/test_formulas_trend.py, test_sens_interval_rounds_as_rs)"
conventions = ["R takes the slope of the rounded rank, the spec interpolates between the slopes of the ranks around it: R's limit is one of those two"]
