[[traps]]
name = "moment_cancellation"
description = "Cancellation in moments computed as E[x^2] - E[x]^2."
test = "limit normal_limit: Pearson III's eq. 3.27 cancels terms of order lambda = 4 / G**2 as G -> 0; the rearranged form at G = 1e-9 and 0 gives the normal interval"

[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "constraint cases regular_likelihood and shape_of_a_likelihood_maximum at their bounds: c = 0.5 and |G| = 2 are refused"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type case values-nan_element: a gap is refused"

[[oracles]]
kind = "exact"
description = "Pearson III: KZGW's eq. 3.27, phi(p, lambda) / (alpha sqrt(N)) with phi**2 = (lambda t'**2 - 2 t' t + psi'(lambda) t**2) / (lambda psi'(lambda) - 1), t by Newton's method on mpmath's regularized incomplete gamma and t' = -(dP/dlambda) / (dP/dt) by mpmath.diff, at 50 digits, G = +-0.009 to +-1.9"
test = "tests/unit/test_interval_oracles.py::test_pearson3_sigma_is_kzgw_phi_in_mpmath"
conventions = ["lambda = 4 / G**2, alpha = 2 / (scale |G|), the bound loc - 2 scale / G held; a negative G mirrored, t at the gamma's non-exceedance 1/T"]

[[oracles]]
kind = "exact"
description = "Weibull: the delta method of the two-parameter Weibull above its bound with the inverse of its expected information, the moments of the unit exponential as derivatives of Gamma by mpmath.diff, at 50 digits (eq. 3.57 is its closed form), k = 1.05 to 20"
test = "tests/unit/test_interval_oracles.py::test_weibull_sigma_is_the_delta_method_of_its_expected_information"
conventions = ["the bound loc held, (beta, k) estimated; p = 1/T"]

[[oracles]]
kind = "exact"
description = "log-normal: exp(mu + s u_p -+ z sqrt(g' V g)), V the inverse expected information of the normal (mu, s) with the divisor N, u_p and z by mpmath's erfinv at 50 digits, s = 0.1 to 1.5"
test = "tests/unit/test_interval_oracles.py::test_log_normal_interval_is_eq_3_41_in_mpmath"
conventions = []

[[oracles]]
kind = "exact"
description = "GEV: the observed information as the Hessian of Coles's log-likelihood (eq. 3.7) and the gradient of the return level by mpmath.diff at 50 digits, at extRemes's estimates of floods11, portpirie and the negated minima of station 223207 (xi 0.43, -0.05, -0.45)"
test = "tests/unit/test_interval_oracles.py::test_the_gev_observed_information_is_mpmaths"
conventions = ["Coles's xi is -c of scipy's genextreme"]

[[oracles]]
kind = "frozen"
