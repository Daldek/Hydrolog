schema = "nogat-formula-card/1"
name = "quantile_interval_delta"
title = "Interval of the quantiles of a maximum-likelihood fit by the delta method (KZGW 2017)"
function = "hydrolog.statistics.intervals.quantile_interval_delta"
family = "statistic"
formula_version = 1
status = "referenced"
equation = "z = Phi^-1((1 + c) / 2), p = 1/T, N values; log-normal: loc + (Q_T - loc) exp(-+ z s / sqrt(N) sqrt(1 + u_p**2 / 2)), u_p = Phi^-1(1 - p) (eq. 3.41, 2.9); Pearson III: Q_T -+ z sigma_T, sigma_T**2 = phi**2 / (alpha**2 N), phi**2 = (lambda t'**2 - 2 t' t + psi'(lambda) t**2) / (lambda psi'(lambda) - 1) with lambda = 4 / G**2, alpha = 2 / (scale |G|), t the standard gamma quantile and t' its derivative in lambda (eq. 3.26-3.27), evaluated as sigma_T**2 = scale**2 / N [(1 + G K / 2)**2 + (K + G dK/dG)**2 / (4 lambda (lambda psi'(lambda) - 1))], K = (Q_T - loc) / scale, at G = 0 scale**2 / N (1 + u_p**2 / 2); Weibull: Q_T -+ z (Q_T - loc) / (k sqrt(N)) sqrt(1 + (Gamma'(2) - ln(-ln p))**2 / (pi**2 / 6)) (eq. 3.56-3.57); GEV: Q_T -+ z sqrt(g' V g), V the inverse of the observed information of (c, loc, scale), the negative Hessian of the log-likelihood by central differences, g the gradient of Q_T; minima: the GEV of the negated minima, its bounds negated and swapped; a bound of a discharge below 0 is a gap"
latex = "Q_T \\mp z\\,\\sigma_T,\\quad z = \\Phi^{-1}\\left(\\tfrac{1 + c}{2}\\right);\\quad\\sigma_T^2 = \\frac{\\varphi^2(p, \\lambda)}{\\alpha^2 N},\\ \\varphi^2 = \\frac{\\lambda t'^2 - 2 t' t + \\psi'(\\lambda) t^2}{\\lambda\\psi'(\\lambda) - 1};\\quad \\sigma_T = \\frac{Q_T - \\varepsilon}{k\\sqrt{N}}\\sqrt{1 + \\frac{(\\Gamma'(2) - \\ln(-\\ln p))^2}{\\pi^2/6}};\\quad \\varepsilon + (Q_T - \\varepsilon)\\,e^{\\mp z \\frac{s}{\\sqrt{N}}\\sqrt{1 + u_p^2/2}};\\quad \\sigma_T^2 = \\nabla Q_T^{\\top} I_o^{-1} \\nabla Q_T"
validation = "none: an interval of an estimator; its coverage, simulated from the distributions it fits at 30 and 60 values, is reported under the formula (CMP-6.11)"
conventions = ["two-sided and central at each confidence level c, each tail (1 - c) / 2; the upper bound at c = 0.68 is KZGW's one-sided upper bound at beta = 84 % (c = 2 beta - 1); every level of one call from one computation", "the delta method as KZGW (2017) applies it: the bound of the support held at its estimate (Pearson III's loc - 2 scale / G, the Weibull's loc, the log-normal's loc, 0 in Hydrolog's fits) and the expected information of the two other parameters in closed form: Pearson III of the gamma's lambda and alpha, the Weibull of ln(x - loc) as the Gumbel distribution of minima, the log-normal of the normal mean and standard deviation of ln(x - loc), the interval taken on that scale; the GEV by the observed information of its three parameters", "the parameters of fit_maximum_likelihood: the log-normal's s with the divisor N (KZGW's eq. 2.6 divides by N - 1); N the number of values", "KZGW's u_beta = 0.994 at beta = 84 % is z at c = 0.68, 0.99446 unrounded", "Pearson III's eq. 3.27 rearranged without its cancellation of order lambda as G -> 0: dK/dG by central differences of scipy's pearson3.isf in G, steps 1e-3 and 5e-4 combined by Richardson's extrapolation, for |G| >= 0.01, below by the Cornish-Fisher expansion of the gamma quantile to G**3; lambda (lambda psi'(lambda) - 1) by its asymptotic series above lambda = 10; a negative G by the mirror distribution, the same expression", "the Weibull's eq. 3.57 applied to the quantile above the bound, Q_T - loc (the two-parameter quantile it is derived for); KZGW's ex. 3.4 applies it to Q_T (5.24 against 4.88 m3/s at p = 10 %), so ex. 3.4 is no reference case until Heo et al. (2001), the source of eq. 3.57, are read (CMP-5.2; closed access on 2026-11-25)", "the GEV's observed information by central differences of the log-likelihood of the standardised sample (the search's of fit_maximum_likelihood), steps 1e-4 of c and loc and 1e-4 of the scale times the scale, 19 evaluations; scipy's genextreme with c = -xi; regular where c < 0.5 and the information is positive definite (Smith 1985), else refused (regular_likelihood)", "where KZGW reads the bound from a graph (ex. 3.2, 3.4) or from its quantile formula (eq. 3.36), Hydrolog holds its own estimate; KZGW's eqs. 2.9 and 3.41 multiply the whole quantile of its three-parameter log-normal (its bound 19.6 mm in table 2.3, 0.384 m3/s in ex. 3.3), Hydrolog's log-normal has the bound 0, where both agree (the reference cases take loc 0 and the scale of the printed quantile)", "minima (stats low-flow): the GEV of the negated minima with the location of fisher_tippett_minima, the quantile of the minima at the non-exceedance 1/T", "variable discharge (a discharge or another quantity never below 0, such as a precipitation depth): a bound below 0 is a gap, with the notice interval_not_computed (below_physical_range) naming its return periods and levels; stage: no such rule"]
assumptions = ["the estimator is near normal with the variance of the asymptotic theory: an approximation for 30 to 60 values whose coverage is simulated (CMP-6.11)", "the annual extremes are independent and identically distributed"]
notices = []
reference_cases = ["tests/fixtures/formulas/flood-interval-cases.json"]
tables = []

[properties]
units = "homogeneous"
conservation = []
symmetries = []

[properties.monotonic]

[[properties.scalings]]
name = "unit_of_the_sample"

[properties.scalings.inputs]
values = 1.0
loc = 1.0
scale = 1.0

[properties.scalings.outputs]
lower = 1.0
upper = 1.0

[properties.scalings.tolerance]
reason = "the closed forms scale with loc and scale, and the GEV's information is that of the sample divided by a power of two; the quantile and sigma round alike within a few ulp"
abs = 1e-300
rel = 4.5e-15

[[properties.limits]]
name = "nested_levels"
text = "lower <= upper, and the interval of a smaller level lies inside that of a larger one"

[[properties.limits]]
name = "order_of_the_levels"
text = "the rows follow the levels in the order given, from one sigma"

[[properties.limits]]
name = "normal_limit"
text = "Pearson III at G = 0 (and 1e-9) is the normal distribution's interval, sigma**2 / N (1 + u_p**2 / 2)"

