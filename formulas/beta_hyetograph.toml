schema = "nogat-formula-card/1"
name = "beta_hyetograph"
title = "Beta design hyetograph: block integrals of the Beta density"
function = "hydrolog.precipitation.hietogram.beta_hyetograph"
family = "scheme"
formula_version = 1
status = "oracle only"
equation = "P_j = P (I_(j / n)(alpha, beta) - I_((j - 1) / n)(alpha, beta)), n = Td / dt, I the regularised incomplete Beta function: the integral of the density u**(alpha - 1) (1 - u)**(beta - 1) / B(alpha, beta) over the step, u = t / Td"
latex = "P_j = P\\left[I_{j/n}(\\alpha, \\beta) - I_{(j-1)/n}(\\alpha, \\beta)\\right],\\quad I_u(\\alpha, \\beta) = \\frac{1}{B(\\alpha, \\beta)}\\int_0^u s^{\\alpha - 1}(1 - s)^{\\beta - 1}\\,ds"
validation = "KZGW (2017, p. 26) fits alpha and beta so that the peak of the hydrograph of the storm equals the flow of the same probability; the sources give no error statistic of the shape against observed storms"
conventions = ["depths in mm per step; t_j the end of step j", "each step holds the integral of the density over it (ADR-0046); KZGW (2017, eq. 2.20) evaluates the density at the ends of the steps, which shifts the storm by half a step and is not followed", "the storm is made of whole steps: Td = n dt (ADR-0046)"]
assumptions = ["KZGW (2017) splits a daily total into hourly steps of a hypothetical flood; Hydrolog takes any duration and step"]
notices = []
reference_cases = []
constants = []
tables = []

[properties]
units = "homogeneous"

[properties.monotonic]
total_mm = 1

[[properties.scalings]]
name = "depth"

[properties.scalings.inputs]
total_mm = 1.0

[properties.scalings.outputs]
intensities_mm = 1.0

[properties.scalings.tolerance]
reason = "doubling a total or a time is exact in binary; one rounding of a quotient but for subnormal values"
abs = 1e-300
rel = 1e-15

[[properties.scalings]]
name = "time"

[properties.scalings.inputs]
duration_min = 1.0
timestep_min = 1.0

[properties.scalings.outputs]
times_min = 1.0

[properties.scalings.tolerance]
reason = "doubling a total or a time is exact in binary; one rounding of a quotient but for subnormal values"
abs = 1e-300
rel = 1e-15

[[properties.limits]]
name = "uniform"
text = "alpha = beta = 1 gives the block storm"

[[properties.limits]]
name = "exact_integrals"
text = "the steps equal the integrals of the density in exact arithmetic: rational for whole alpha and beta, a closed form at 50 digits for alpha = 1/2"

[[properties.conservation]]
name = "steps_add_up"
text = "the steps hold the total"

[properties.conservation.tolerance]
reason = "the steps are rounded products or differences of a total below 2 m; their exact sum (fsum) differs from it by a few units in its last place per million steps"
abs = 1e-09

[[properties.symmetries]]
name = "swap"
text = "swapping alpha and beta gives the steps in reverse order"

[properties.symmetries.tolerance]
reason = "I_u(a, b) = 1 - I_(1-u)(b, a) holds to SciPy's precision of the incomplete Beta function, a few units in the last place"
abs = 1e-09

[[sources]]
citation = "KZGW (2017). Aktualizacja metodyki obliczania przepływów i opadów maksymalnych o określonym prawdopodobieństwie przewyższenia dla zlewni kontrolowanych i niekontrolowanych, załącznik 2 do OPZ (wersja ujednolicona)"
access = "open"
locator = "ch. II.3, eqs. 2.20-2.22, p. 25 (after Węglarczyk 1993); Fig. 2.7, p. 26"
url = "https://kzgw.gov.pl/files/zam-pub/20170402-przeglad-i-aktualizacja-map/zal-2-do-OPZ-ujednolicony-1.pdf"

[[sources]]
citation = "Węglarczyk, S. (1993), as cited by KZGW (2017)"
access = "author-provided"

