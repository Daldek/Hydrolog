[[constraints]]
name = "step_within_duration"
class = "precondition"
text = "dt <= Td: the storm holds at least one step"

[constraints.source]
citation = "Chow, V.T., Maidment, D.R. and Mays, L.W. (1988). Applied Hydrology. McGraw-Hill, New York"
access = "open"
locator = "sec. 14.4, p. 466: a design hyetograph gives the depth of n successive intervals of duration dt over the total duration Td = n dt"
url = "https://ponce.sdsu.edu/Applied_Hydrology_Chow_1988.pdf"

[[constraints]]
name = "steps_representable"
class = "precondition"
text = "Td / dt <= 1,000,000: at most a million steps"

[constraints.source]
citation = "Hydrolog, ADR-0067: the precipitation formulas by specs"
access = "open"
locator = "docs/decisions/0067-the-precipitation-formulas-by-specs.md, point 3"

[[constraints]]
name = "whole_steps"
class = "precondition"
text = "Td = n dt for a whole n, to 1e-9 of Td: the storm is made of whole steps"

[constraints.source]
citation = "Chow, V.T., Maidment, D.R. and Mays, L.W. (1988). Applied Hydrology. McGraw-Hill, New York"
access = "open"
locator = "sec. 14.4, p. 466: a design hyetograph gives the depth of n successive intervals of duration dt over the total duration Td = n dt"
url = "https://ponce.sdsu.edu/Applied_Hydrology_Chow_1988.pdf"

[[outputs]]
name = "intensities_mm"
unit = "mm"
kind = "real_array"
symbol = "P_j"
description = "Depth of each step (the field keeps its name of earlier versions; the result's intensity_mm_per_h is the rate)."
boundary_tolerance = 1e-09
gaps_allowed = false

[outputs.physical]
low = 0.0
low_inclusive = true

[[outputs]]
name = "times_min"
unit = "min"
kind = "real_array"
symbol = "t_j"
description = "End of each step from the start of the storm."
gaps_allowed = false

[outputs.physical]
low = 0.0
low_inclusive = false

[[traps]]
name = "many_small_terms"
description = "A sum of many small terms that loses precision."
test = "conservation steps_add_up and test_a_storm_of_a_million_steps_holds_its_total"

[[oracles]]
kind = "exact"
description = "the block integrals in exact rational arithmetic for whole alpha and beta (the binomial sum of I_u) and in closed form at 50 digits (decimal) for alpha = 1/2"
test = "tests/unit/test_formulas_hyetographs.py (limit exact_integrals)"
conventions = []
