schema = "nogat-formula-card/1"
name = "nrcs"
title = "Time of concentration by the NRCS watershed lag equation (Mockus 1961)"
function = "hydrolog.time.concentration.ConcentrationTime.nrcs"
family = "empirical"
formula_version = 1
status = "referenced"
equation = "tc = l**0.8 * (S + 1)**0.7 / (1140 * Y**0.5) [h], l in ft, S = 1000 / CN - 10 in, Y = 100 * slope in percent; the lag is 0.6 tc"
latex = "T_c = \\frac{\\ell^{0.8}\\,(S + 1)^{0.7}}{1140\\,Y^{0.5}},\\quad S = \\frac{1000}{CN} - 10,\\quad \\ell\\ \\mathrm{[ft]},\\ S\\ \\mathrm{[in]},\\ Y\\ [\\%]"
validation = "NEH 630-15 (p. 15-6) reports the equation's data, 24 watersheds of 1.3 acres to 9.2 square miles, mostly under 2,000 acres (Mockus 1961), and that Folmar and Miller (2000) found a reasonable upper limit of up to 19 square miles; table 15-4 shows the lag of one watershed varying from storm to storm (Jones Falls, Maryland: 4.16 to 6.91 h)"
conventions = ["eq. 15-4b in its source units: l in feet and S in inches by the exact 0.3048 m/ft and 25.4 mm/in of the units table, Y in percent (100 per m/m), Tc in hours, converted to minutes; in SI it is 100 l[m]^0.8 (S[mm] + 25.4)^0.7 / (7068.86 Y^0.5) with 100/7068.86 = 0.0141466, where Hydrolog up to 0.8.1 used 0.01416 (+0.095 %, TRIAGE T8)", "Tc = lag / 0.6 (eq. 15-3, Mockus 1957; Simas 1996); a unit hydrograph takes tp = D/2 + 0.6 Tc (USACE HEC-HMS Technical Reference Manual, SCS unit hydrograph, eqs. 1 and 3); TR-55 (1986) has no lag relation", "l the longest flow path from the divide to the outlet (p. 15-5); Y the average land slope of the watershed, 'not to be confused with the slope of the flow path' (p. 15-5)", "the retardance factor cn' is the CN of AMC II (p. 15-6: CN is used as a surrogate for cn'); S = 0 at CN 100; a fractional CN, a weighted mean, is used as given"]
assumptions = ["average natural watershed conditions with an approximately uniform distribution of runoff (eq. 15-3); the area of the 24 watersheds, 0.005-24 km2, is checked by WatershedParameters.calculate_tc", "Hydrograf's flow paths (0.05-30 km) and the CN of its catchments (51.8-81.4) lie inside the equation's CN range; a CN below 50 or above 95 gives the notice"]
notices = ["outside_applicability"]
reference_cases = ["tests/fixtures/formulas/tc-cases.json"]
constraints = []
tables = []

[properties]
units = "unit_specific"
scalings = []
conservation = []
symmetries = []

[properties.monotonic]
length_km = 1
slope_m_per_m = -1
cn = -1

[[properties.limits]]
name = "exact_metric_constant"
text = "tc equals 100 l[m]^0.8 (S[mm] + 25.4)^0.7 / (7068.86 Y^0.5) with 7068.86 = 1900 0.3048^0.8 25.4^0.7 unrounded, in decimal arithmetic at 50 digits (TRIAGE T8)"

[[properties.limits]]
name = "power_law"
text = "doubling l multiplies tc by 2^0.8, doubling Y by 2^-0.5"

[[sources]]
citation = "USDA-NRCS (2010). National Engineering Handbook, Part 630 Hydrology, Chapter 15: Time of Concentration (210-VI-NEH, May 2010)"
access = "open"
locator = "eqs. 15-3, 15-4a and 15-4b and their variables, pp. 15-3 to 15-6; the example of the lag method, p. 15-12"
url = "https://directives.nrcs.usda.gov/sites/default/files2/1712930617/14081.pdf"

[[sources]]
citation = "USDA-NRCS (2025). 210 NEH Part 630 Hydrology, Subpart F: Time of Concentration (amended June 2025)"
access = "open"
locator = "eqs. 630.15-3, 630.15-4a and 630.15-4b, the same equations and limits"
url = "https://directives.nrcs.usda.gov/sites/default/files2/1749749287/Subpart%20F%20%E2%80%93%20Time%20of%20Concentration.pdf"

[[variables]]
name = "length_km"
symbol = "\\ell"
unit = "km"
kind = "real"
description = "Flow length: the longest path along which water flows from the watershed divide to the outlet."
applicability = "unstated"

[variables.physical]
low = 0.0
low_inclusive = false
test_high = 1000.0
test_reason = "1,000 km, about the length of the Vistula, the longest river of Poland: no flow path of a Polish watershed is longer"

[variables.typical]
low = 0.05
low_inclusive = true
high = 30.0
high_inclusive = true

[variables.typical.source]
citation = "Hydrograf's watersheds handed to Hydrolog (Hydrograf 0.5.0.dev0, November 2026): the hand-offs recorded in Hydrolog's tests, Kamiennik to Świerzawa (134.97 km2), a network of 8 subcatchments and the Nysa Szalona network of 18, and the guide's Kamiennik to Świerzawa (37.22 km2)"
access = "open"
locator = "tests/fixtures/handoff_hydrograf*.json and tests/fixtures/kamiennik.json: flow paths of 0.0566 to 28.88 km"

[[variables]]
name = "slope_m_per_m"
symbol = "Y"
unit = "m/m"
kind = "real"
description = "Average land slope of the watershed, not the slope of the flow path."
applicability = "unstated"

[variables.physical]
low = 0.0
low_inclusive = false
test_high = 1.0
test_reason = "a mean slope of 1 m/m (45 degrees), steeper than any flow path or land surface of a watershed on average"

[variables.typical]
low = 0.04
low_inclusive = true
high = 0.19
high_inclusive = true

[variables.typical.source]
citation = "Hydrograf's watersheds handed to Hydrolog (Hydrograf 0.5.0.dev0, November 2026): the hand-offs recorded in Hydrolog's tests, Kamiennik to Świerzawa (134.97 km2), a network of 8 subcatchments and the Nysa Szalona network of 18, and the guide's Kamiennik to Świerzawa (37.22 km2)"
access = "open"
locator = "tests/fixtures/handoff_hydrograf*.json and tests/fixtures/kamiennik.json: mean land slopes of 0.0500 to 0.1831 m/m"

[[variables]]
name = "cn"
symbol = "CN"
unit = "-"
kind = "real"
description = "Curve number of AMC II, the surrogate of the retardance factor cn'."

[variables.physical]
low = 1.0
low_inclusive = true
high = 100.0
high_inclusive = true

[variables.applicability]
low = 50.0
low_inclusive = true
high = 95.0
high_inclusive = true

[variables.applicability.source]
citation = "USDA-NRCS (2010). National Engineering Handbook, Part 630 Hydrology, Chapter 15: Time of Concentration (210-VI-NEH, May 2010)"
access = "open"
locator = "p. 15-6: a CN of less than 50, or greater than 95 should not be used in the solution of equations 15-4a and 15-4b (Mockus 1961)"
url = "https://directives.nrcs.usda.gov/sites/default/files2/1712930617/14081.pdf"

[variables.typical]
low = 51.8
low_inclusive = true
high = 81.4
high_inclusive = true

[variables.typical.source]
citation = "Hydrograf ADR-0075 (2026-11-08), the CN of soil-cover complexes of the 223 catchments of the Hydroni run h07 (2,941 km2)"
access = "open"
locator = "Consequences: CN of AMC II 51.8 to 81.4, median 70.8"
url = "https://github.com/Daldek/Hydrograf/blob/develop/docs/decisions/0075-cn-of-soil-cover-complexes.md"

[[constants]]
name = "tc_denominator"
value = 1140.0
unit = "ft^0.8 in^0.7 h^-1 %^0.5"
symbol = "1140"

[constants.source]
citation = "USDA-NRCS (2010). National Engineering Handbook, Part 630 Hydrology, Chapter 15: Time of Concentration (210-VI-NEH, May 2010)"
access = "open"
locator = "eq. 15-4b, p. 15-5: eq. 15-4a (1,900) with L = 0.6 Tc"
url = "https://directives.nrcs.usda.gov/sites/default/files2/1712930617/14081.pdf"

[[constants]]
name = "length_exponent"
value = 0.8
unit = "-"
symbol = "0.8"

[constants.source]
citation = "USDA-NRCS (2010). National Engineering Handbook, Part 630 Hydrology, Chapter 15: Time of Concentration (210-VI-NEH, May 2010)"
access = "open"
locator = "eqs. 15-4a and 15-4b, p. 15-5"
url = "https://directives.nrcs.usda.gov/sites/default/files2/1712930617/14081.pdf"

[[constants]]
name = "retention_exponent"
value = 0.7
unit = "-"
symbol = "0.7"

[constants.source]
citation = "USDA-NRCS (2010). National Engineering Handbook, Part 630 Hydrology, Chapter 15: Time of Concentration (210-VI-NEH, May 2010)"
access = "open"
locator = "eqs. 15-4a and 15-4b, p. 15-5"
url = "https://directives.nrcs.usda.gov/sites/default/files2/1712930617/14081.pdf"

[[constants]]
name = "retention_shift"
value = 1.0
unit = "in"
symbol = "1"

[constants.source]
citation = "USDA-NRCS (2010). National Engineering Handbook, Part 630 Hydrology, Chapter 15: Time of Concentration (210-VI-NEH, May 2010)"
access = "open"
locator = "eqs. 15-4a and 15-4b, p. 15-5: S + 1"
url = "https://directives.nrcs.usda.gov/sites/default/files2/1712930617/14081.pdf"

[[constants]]
name = "s_scale"
value = 1000.0
unit = "in"
symbol = "1000"

[constants.source]
citation = "USDA-NRCS (2010). National Engineering Handbook, Part 630 Hydrology, Chapter 15: Time of Concentration (210-VI-NEH, May 2010)"
access = "open"
locator = "p. 15-5: S = 1,000 / cn' - 10"
url = "https://directives.nrcs.usda.gov/sites/default/files2/1712930617/14081.pdf"

[[constants]]
name = "s_offset"
value = 10.0
unit = "in"
symbol = "10"

[constants.source]
citation = "USDA-NRCS (2010). National Engineering Handbook, Part 630 Hydrology, Chapter 15: Time of Concentration (210-VI-NEH, May 2010)"
access = "open"
locator = "p. 15-5: S = 1,000 / cn' - 10"
url = "https://directives.nrcs.usda.gov/sites/default/files2/1712930617/14081.pdf"

[[constants]]
name = "percent"
value = 100.0
unit = "% per m/m"
symbol = "100"

[constants.source]
citation = "BIPM (2019). The International System of Units (SI), 9th edition, version 4.01"
access = "open"
locator = "section 5.4.7: the symbol % (percent) is the number 0.01"
url = "https://www.bipm.org/documents/20126/41483022/SI-Brochure-9-EN.pdf"

[[outputs]]
name = "tc_min"
unit = "min"
kind = "real"
symbol = "t_c"
description = "Time of concentration."

[outputs.physical]
low = 0.0
low_inclusive = false

[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "range cases slope_m_per_m-physical_low_*: tc grows as Y^-0.5 when Y tends to 0 and stays finite down to the smallest positive float; cn-physical_low: CN = 1 gives S = 990 in, finite"

[[oracles]]
kind = "exact"
description = "the SI form with S in mm and the unrounded 1900 0.3048^0.8 25.4^0.7, evaluated with the decimal module at 50 digits"
test = "tests/unit/test_formulas_tc.py (limit exact_metric_constant)"
conventions = []
