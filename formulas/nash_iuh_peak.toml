schema = "nogat-formula-card/1"
name = "nash_iuh_peak"
title = "Time to peak and peak ordinate of Nash's instantaneous unit hydrograph"
function = "hydrolog.runoff.nash_iuh.nash_iuh_peak"
family = "empirical"
formula_version = 1
status = "referenced"
equation = "tp = (n - 1) K; up = (n - 1)^(n - 1) e^-(n - 1) / (K Gamma(n)), n > 1"
latex = "t_p = (n - 1) K;\\quad u_p = \\frac{(n-1)^{n-1} e^{-(n-1)}}{K\\,\\Gamma(n)}"
validation = "none: exact properties of the gamma density of Nash (1957); the sources give no error statistic"
conventions = ["tp in min from the instant of the rainfall, up in 1/min", "NashIUH.time_to_peak_min and peak_ordinate_per_min are null for n <= 1, with the notice iuh_peak_undefined, where versions up to 0.8.1 gave 0 and 1 / K"]
assumptions = ["the IUH of a cascade of n equal linear reservoirs (spec nash_iuh)"]
notices = []
reference_cases = ["tests/fixtures/formulas/unit-hydrographs-cases.json"]
constants = []
tables = []

[properties]
units = "homogeneous"
conservation = []
symmetries = []

[properties.monotonic]
n = 1
k_min = 1

[[properties.scalings]]
name = "time"

[properties.scalings.inputs]
k_min = 1.0

[properties.scalings.outputs]
time_to_peak_min = 1.0
peak_ordinate_per_min = -1.0

[properties.scalings.tolerance]
reason = "doubling K doubles (n - 1) K and halves the density exactly in binary, but for subnormal values"
abs = 1e-300
rel = 0.0

[[properties.limits]]
name = "gamma_mode"
text = "tp is the mode of the gamma density of shape n and scale K and up its value there (scipy.stats.gamma); the density is lower on either side"

[[properties.limits]]
name = "table_c2"
text = "tp up = (N - 1)^N e^-(N - 1) / Gamma(N), KZGW's f(N), matches Table C.2 from N = 1.10 to 7.99"

[properties.limits.source]
citation = "KZGW (2017). Aktualizacja metodyki obliczania przepływów i opadów maksymalnych o określonym prawdopodobieństwie przewyższenia dla zlewni kontrolowanych i niekontrolowanych, załącznik 2 do OPZ (wersja ujednolicona)"
access = "open"
locator = "Table C.2, pp. 132-133"
url = "https://kzgw.gov.pl/files/zam-pub/20170402-przeglad-i-aktualizacja-map/zal-2-do-OPZ-ujednolicony-1.pdf"

[[sources]]
citation = "KZGW (2017). Aktualizacja metodyki obliczania przepływów i opadów maksymalnych o określonym prawdopodobieństwie przewyższenia dla zlewni kontrolowanych i niekontrolowanych, załącznik 2 do OPZ (wersja ujednolicona)"
access = "open"
locator = "annex 2, section 3.1.2, p. 96: eqs. 6.14 (tp) and 6.16 (up)"
url = "https://kzgw.gov.pl/files/zam-pub/20170402-przeglad-i-aktualizacja-map/zal-2-do-OPZ-ujednolicony-1.pdf"

[[sources]]
citation = "Sikorska, A.E., Scheidegger, A., Banasik, K., Rieckermann, J. (2012). Bayesian uncertainty assessment of flood predictions in ungauged urban basins for conceptual rainfall-runoff models. Hydrology and Earth System Sciences 16, 1221-1236"
access = "open"
locator = "eqs. 9-10, p. 1225: tp and up of the IUH of the cascade"
url = "https://hess.copernicus.org/articles/16/1221/2012/hess-16-1221-2012.pdf"

[[variables]]
name = "n"
symbol = "n"
unit = "-"
kind = "real"
description = "Number of reservoirs of the cascade, the shape parameter; need not be whole."
applicability = "unstated"

[variables.physical]
low = 0.0
low_inclusive = false
test_high = 100.0
test_reason = "a hundred reservoirs, more than ten times the last row of KZGW's Table C.2 (N = 7.99)"

[variables.typical]
low = 1.1
low_inclusive = true
high = 8.0
high_inclusive = true

[variables.typical.source]
citation = "KZGW (2017). Aktualizacja metodyki obliczania przepływów i opadów maksymalnych o określonym prawdopodobieństwie przewyższenia dla zlewni kontrolowanych i niekontrolowanych, załącznik 2 do OPZ (wersja ujednolicona)"
access = "open"
locator = "Table C.2, pp. 132-133: N from 1.10 to 7.99, the cascades the method reads off"
url = "https://kzgw.gov.pl/files/zam-pub/20170402-przeglad-i-aktualizacja-map/zal-2-do-OPZ-ujednolicony-1.pdf"

[[variables]]
name = "k_min"
symbol = "K"
unit = "min"
kind = "real"
description = "Storage constant of each reservoir."
applicability = "unstated"

[variables.physical]
low = 0.0
low_inclusive = false
test_high = 2700.0
test_reason = "ten times the largest K the estimations give for the hand-offs (264 min)"

[variables.typical]
low = 0.8
low_inclusive = true
high = 270.0
high_inclusive = true

[variables.typical.source]
citation = "Hydrograf's watersheds handed to Hydrolog (Hydrograf 0.5.0.dev0, November 2026): the hand-offs recorded in Hydrolog's tests, Kamiennik to Świerzawa (134.97 km2), a network of 8 subcatchments and the Nysa Szalona network of 18, and the guide's Kamiennik to Świerzawa (37.22 km2)"
access = "open"
locator = "tests/fixtures/handoff_hydrograf*.json and tests/fixtures/kamiennik.json: K of 0.87 to 264.3 min by the spec lutz for the shortest and the longest flow path, 23.7 to 107.4 min by the spec nash_urban_regression for its points; KZGW Ex. 6.2: 42 min"

[[constraints]]
name = "peak_defined"
class = "precondition"
text = "n > 1: for n <= 1 the IUH decreases from t = 0, where it is 1 / K (n = 1) or unbounded (n < 1), so it has no peak inside t > 0"

[constraints.source]
citation = "KZGW (2017). Aktualizacja metodyki obliczania przepływów i opadów maksymalnych o określonym prawdopodobieństwie przewyższenia dla zlewni kontrolowanych i niekontrolowanych, załącznik 2 do OPZ (wersja ujednolicona)"
access = "open"
locator = "p. 96, eq. 6.14: tp = (N - 1) k, positive for N > 1"
url = "https://kzgw.gov.pl/files/zam-pub/20170402-przeglad-i-aktualizacja-map/zal-2-do-OPZ-ujednolicony-1.pdf"

[[constraints]]
name = "representable"
class = "precondition"
text = "K is a normal number and float64 holds 1 / K, the bound of the peak"

[constraints.source]
citation = "IEEE 754 double precision (float64)"
access = "open"
locator = "normal numbers from 2.2e-308 to 1.8e308"

[[outputs]]
name = "time_to_peak_min"
unit = "min"
kind = "real"
symbol = "t_p"
description = "Time of the peak of the instantaneous unit hydrograph, its mode."

[outputs.physical]
low = 0.0
low_inclusive = false

[[outputs]]
name = "peak_ordinate_per_min"
unit = "1/min"
kind = "real"
symbol = "u_p"
description = "Peak ordinate of the instantaneous unit hydrograph."

[outputs.physical]
low = 0.0
low_inclusive = false

[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "range cases n-physical_low_* and the constraint case peak_defined at n = 1: (n - 1) ln(n - 1) tends to 0 as n tends to 1, and n <= 1 is refused by the precondition peak_defined"

[[oracles]]
kind = "established"
description = "scipy.stats.gamma (SciPy 1.18.1): the density of shape n and scale K at its mode (n - 1) K"
test = "tests/unit/test_formulas_unit_hydrographs.py (limit gamma_mode)"
conventions = ["scale K in min, the density in 1/min"]
