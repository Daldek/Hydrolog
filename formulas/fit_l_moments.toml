[[outputs]]
name = "shape"
unit = "-"
kind = "real"
symbol = "k"
description = "Shape: s of the log-normal, c of the GEV (scipy's sign, k of Hosking, -xi of Coles), the skewness of Pearson III, the Weibull shape."

[outputs.physical]

[[outputs]]
name = "loc"
unit = "m3/s"
kind = "real"
symbol = "\\xi"
description = "Location: 0 for the log-normal, the mean of Pearson III, the lower bound of Weibull."

[outputs.physical]

[[outputs]]
name = "scale"
unit = "m3/s"
kind = "real"
symbol = "\\alpha"
description = "Scale; one that would underflow is the smallest float64 (its boundary tolerance)."

[outputs.physical]
low = 0.0
low_inclusive = false

[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "constraint case l_moments_within_distribution-violated and test_l_skewness_near_one_clamps_the_gev_shape: |t3| = 1 is refused, a t3 within rounding of it gives the end of the bracket"

[[traps]]
name = "unbounded_iteration"
description = "An iteration without a bounded count (root finding, fit)."
test = "test_l_skewness_near_one_clamps_the_gev_shape: brentq runs in a bracket, its ends clamped (at most 100 iterations)"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type case annual_maxima-nan_element: a gap is refused"

[[traps]]
name = "moment_cancellation"
description = "Cancellation in moments computed as E[x^2] - E[x]^2."
test = "test_a_large_mean_shifts_the_fits: a mean of 1e9 with the spread of the Polana maxima over 1000"

[[oracles]]
kind = "algorithm"
description = "the L-moments of the fitted distribution by quadrature of its quantile function"
test = "tests/unit/test_formulas_flood_frequency.py (limit l_moments_of_the_fit)"
conventions = []

[[oracles]]
kind = "frozen"
description = "lmom 3.3 pelgev, pelpe3, pelwei, pelln3 (bound 0) and lmomco 2.5.8 pargev (useHosking=FALSE) on seven samples, R 4.5.3, 2026-11-18"
test = "tests/oracles/frequency_lmom_r.csv"
conventions = ["GEV (xi, alpha, k) of Hosking is scipy's (loc, scale, c)", "Pearson III (mu, sigma, gamma) is scipy's (loc, scale, skew)", "LN3 (zeta 0, mu, sigma) is scipy's lognorm(s = sigma, scale = exp(mu))", "Weibull (zeta, beta, delta) is scipy's weibull_min(delta, loc = zeta, scale = beta)"]
