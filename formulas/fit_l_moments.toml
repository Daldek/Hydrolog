schema = "nogat-formula-card/1"
name = "fit_l_moments"
title = "Parameters of a distribution of annual maxima by the method of L-moments"
function = "hydrolog.statistics.frequency.fit_l_moments"
family = "statistic"
formula_version = 1
status = "oracle only"
equation = "the distribution whose L-moments are the sample's l1, l2 and t3: log-normal (loc 0) s = 2 erfinv(l2 / l1), scale = l1 exp(-s**2 / 2); GEV: c solves t3 = 2 (1 - 3**-c) / (1 - 2**-c) - 3, scale = l2 c / ((1 - 2**-c) Gamma(1 + c)), loc = l1 - scale (1 - Gamma(1 + c)) / c; Pearson III: alpha = 4 / G**2 from |t3| (rational approximations), G = 2 sign(t3) / sqrt(alpha), scale = l2 sqrt(pi alpha) Gamma(alpha) / Gamma(alpha + 1/2), loc = l1; Weibull: the GEV (c, xi, a) of (-l1, l2, -t3), shape = 1/c, loc = -xi - a/c, scale = a/c"
latex = "\\tau_3 = \\frac{2(1 - 3^{-c})}{1 - 2^{-c}} - 3,\\quad \\alpha = \\frac{\\lambda_2 c}{(1 - 2^{-c})\\Gamma(1 + c)},\\quad \\xi = \\lambda_1 - \\alpha\\frac{1 - \\Gamma(1 + c)}{c};\\qquad s = 2\\,\\mathrm{erf}^{-1}\\frac{\\lambda_2}{\\lambda_1};\\qquad \\sigma = \\lambda_2\\sqrt{\\pi a}\\,\\frac{\\Gamma(a)}{\\Gamma(a + 1/2)},\\ G = \\frac{2\\,\\mathrm{sign}\\,\\tau_3}{\\sqrt{a}}"
validation = "none: the estimator gives the distribution of the sample's L-moments; Hosking and Wallis (1997) report its efficiency on simulated samples"
conventions = ["the unbiased sample L-moments of sample_l_moments", "scipy's parameters: the GEV shape c is Hosking's k and -xi of Coles; Pearson III (loc, scale, shape) are its mean, standard deviation and skewness; the log-normal has location 0", "the GEV shape solved exactly by brentq in -1 < c <= 50 (lmom's pelgev uses Donaldson's approximation, within 2e-7 of it); a t3 beyond the L-skewness of an end of that bracket gives the end", "Weibull as the GEV of the negated L-moments, as lmom's pelwei"]
assumptions = ["the annual maxima are independent and identically distributed"]
notices = []
reference_cases = []
tables = []

[properties]
units = "homogeneous"
conservation = []
symmetries = []

[properties.monotonic]

[[properties.scalings]]
name = "unit_of_the_sample"

[properties.scalings.inputs]
annual_maxima = 1.0

[properties.scalings.outputs]
loc = 1.0
scale = 1.0

[properties.scalings.tolerance]
reason = "the estimators run on the sample divided by a power of two, so doubling it changes no rounding: the shape is the same and loc and scale double exactly; a scale below the normal floats keeps fewer bits"
abs = 1e-300
rel = 4.5e-16

[[properties.limits]]
name = "l_moments_of_the_fit"
text = "the fitted distribution has the sample's l1, l2 and t3 (l1 and l2 for the log-normal), by quadrature of its quantile function"

[[sources]]
citation = "Hosking, J.R.M. lmom: L-moments, R package version 3.3, CRAN (the Fortran routines of Hosking and Wallis 1997)"
access = "open"
locator = "lmoments.f, routines PELGEV (the GEV of the L-moments), PELPE3 (Pearson III: alpha from |t3| by rational approximations, relative accuracy better than 3e-5) and PELLN3 (the log-normal of a given bound); R pelwei, the GEV of the negated L-moments"
url = "https://cran.r-project.org/package=lmom"

[[sources]]
citation = "Hosking, J.R.M. and Wallis, J.R. (1997). Regional Frequency Analysis: An Approach Based on L-Moments. Cambridge University Press"
access = "author-provided"
locator = "appendix A.5 (GEV), A.8 (log-normal), A.9 (Pearson type III, the rational approximations of alpha from |t3|)"

[[sources]]
citation = "Hosking, J.R.M. (1990). L-moments: analysis and estimation of distributions using linear combinations of order statistics. Journal of the Royal Statistical Society, Series B 52(1), 105-124"
access = "author-provided"
locator = "sect. 2: probability-weighted moments and the sample L-moments of their unbiased estimators"

[[variables]]
name = "annual_maxima"
symbol = "x_i"
unit = "m3/s"
kind = "real_array"
description = "The sample: annual maxima, or any sample of the distribution."
applicability = "unstated"
gaps_allowed = false
dims = 1
min_length = 1

[variables.physical]
test_low = -1000000.0
test_high = 1000000.0
test_reason = "the formulas are homogeneous in the unit of the sample (their scalings), so any bound tests their arithmetic: a million m3/s exceeds the discharge of every river, and a stage may lie below its gauge's zero, so the same bound holds below 0"

[variables.typical]
low = 0.81
low_inclusive = true
high = 111.0
high_inclusive = true

[variables.typical.source]
citation = "KZGW (2017). Aktualizacja metodyki obliczania przepływów i opadów maksymalnych o określonym prawdopodobieństwie przewyższenia dla zlewni kontrolowanych i niekontrolowanych, załącznik 2 do OPZ (wersja ujednolicona)"
access = "open"
locator = "examples 3.2 to 3.4, tables 3.5, 3.10 and 3.13 (pp. 39-55): annual maxima of 0.81 m3/s (Rypienica at Rypin) to 111 m3/s (Czarna at Polana)"
url = "https://kzgw.gov.pl/files/zam-pub/20170402-przeglad-i-aktualizacja-map/zal-2-do-OPZ-ujednolicony-1.pdf"

[[variables]]
name = "distribution"
symbol = "F"
unit = "-"
kind = "choice"
description = "The distribution: the log-normal of location 0, the GEV, Pearson type III or the three-parameter Weibull distribution of scipy.stats."
choices = ["log_normal", "gev", "pearson3", "weibull"]

[[constraints]]
name = "enough_values"
class = "precondition"
text = "n >= 3"

[constraints.source]
citation = "Hosking, J.R.M. lmom: L-moments, R package version 3.3, CRAN (the Fortran routines of Hosking and Wallis 1997)"
access = "open"
locator = "samlmu: t3 needs 3 values"
url = "https://cran.r-project.org/package=lmom"

[[constraints]]
name = "values_not_all_equal"
class = "precondition"
text = "min(x) < max(x)"

[constraints.source]
citation = "Hosking, J.R.M. lmom: L-moments, R package version 3.3, CRAN (the Fortran routines of Hosking and Wallis 1997)"
access = "open"
locator = "pelgev, pelpe3: l2 must be positive"
url = "https://cran.r-project.org/package=lmom"

[[constraints]]
name = "positive_values"
class = "precondition"
text = "min(x) > 0 for the log-normal (location 0)"

[constraints.source]
citation = "Hosking, J.R.M. lmom: L-moments, R package version 3.3, CRAN (the Fortran routines of Hosking and Wallis 1997)"
access = "open"
locator = "pelln3 with bound 0: the distribution of ln(x - 0), defined for x > 0"
url = "https://cran.r-project.org/package=lmom"

[[constraints]]
name = "l_moments_within_distribution"
class = "precondition"
text = "l2 < l1 (log-normal); -1 < t3 < 1 (GEV, Pearson III); -0.1699 < t3 < 1 (Weibull)"

