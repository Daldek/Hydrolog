access = "open"
locator = "examples 3.2 to 3.4 (the Czarna at Polana, the Rypienica at Rypin, the Świślina at Rzepin, tables 3.5, 3.10 and 3.13): the parameters Hydrolog's four estimators give their annual maxima, with the log-normal and Weibull parameters the examples print (pp. 47-48 and 53-54)"
url = "https://kzgw.gov.pl/files/zam-pub/20170402-przeglad-i-aktualizacja-map/zal-2-do-OPZ-ujednolicony-1.pdf"

[[variables]]
name = "scale"
symbol = "\\alpha"
unit = "m3/s"
kind = "real"
description = "Scale."
applicability = "unstated"

[variables.physical]
low = 0.0
low_inclusive = false
test_high = 1000000.0
test_reason = "the formulas are homogeneous in the unit of loc and scale (their scalings), so any bound tests their arithmetic: a million m3/s exceeds the discharge of every river"

[variables.typical]
low = 1.0
low_inclusive = true
high = 37.0
high_inclusive = true

[variables.typical.source]
citation = "KZGW (2017). Aktualizacja metodyki obliczania przepływów i opadów maksymalnych o określonym prawdopodobieństwie przewyższenia dla zlewni kontrolowanych i niekontrolowanych, załącznik 2 do OPZ (wersja ujednolicona)"
access = "open"
locator = "examples 3.2 to 3.4 (the Czarna at Polana, the Rypienica at Rypin, the Świślina at Rzepin, tables 3.5, 3.10 and 3.13): the parameters Hydrolog's four estimators give their annual maxima, with the log-normal and Weibull parameters the examples print (pp. 47-48 and 53-54)"
url = "https://kzgw.gov.pl/files/zam-pub/20170402-przeglad-i-aktualizacja-map/zal-2-do-OPZ-ujednolicony-1.pdf"

[[constraints]]
name = "shape_of_the_distribution"
class = "physical"
text = "shape > 0 for the log-normal (s) and Weibull (k)"

[constraints.source]
citation = "Virtanen, P. et al. (2020). SciPy 1.0: fundamental algorithms for scientific computing in Python. Nature Methods 17, 261-272"
access = "open"
locator = "scipy.stats.lognorm, shape s > 0, and scipy.stats.weibull_min, shape c > 0"
url = "https://docs.scipy.org/doc/scipy/reference/stats.html"

[[constraints]]
name = "values_within_support"
class = "precondition"
text = "ln f(x_i) is finite for every value, and so is their sum: each value inside the support of the distribution, where its density is positive and finite"

[constraints.source]
citation = "WMO (2009). Guide to Hydrological Practices, 6th ed., Volume II: Management of Water Resources and Application of Hydrological Practices, WMO-No. 168"
access = "open"
locator = "sect. 5.6.3, eq. 5.31: the logarithm of the likelihood, -inf where a value has no density"
url = "https://www.hydrology.nl/images/docs/hwrp/WMO_Guide_168_Vol_II_en.pdf"

[[outputs]]
name = "aic"
unit = "-"
kind = "real"
symbol = "\\mathrm{AIC}"
description = "The criterion: the lower, the better the fit for its number of parameters."

[outputs.physical]

[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "constraint case values_within_support-violated: ln f of a value outside the support is refused before the sum"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type case annual_maxima-nan_element: a gap is refused"

[[traps]]
name = "many_small_terms"
description = "A sum of many small terms that loses precision."
test = "symmetry order: the log-likelihood is summed exactly rounded, in any order"

[[oracles]]
kind = "algorithm"
description = "the log-likelihood with the densities of the GEV, the log-normal, Pearson III and Weibull written out (math)"
test = "tests/unit/test_formulas_flood_frequency.py (limit closed_form)"
conventions = []
