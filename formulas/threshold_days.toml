schema = "nogat-formula-card/1"
name = "threshold_days"
title = "Frost, freeze-thaw, ice, summer and hot days and tropical nights of a day"
function = "hydrolog.statistics.meteo_temperature.threshold_days"
family = "classification"
formula_version = 1
status = "referenced"
equation = "frost: Tmin < Tf; freeze-thaw: Tmin < Tf and Tmax > Ti; ice: Tmax < Ti; summer: Tmax > Ts; hot: Tmax > Th; tropical night: Tmin > Tt; 1 when it holds, else 0 (the ETCCDI: Tf = Ti = 0, Ts = 25, Tt = 20 °C; Th = 30 °C)"
latex = "\\mathrm{FD} = [T_{n} < T_f],\\ \\mathrm{FT} = [T_{n} < T_f][T_{x} > T_i],\\ \\mathrm{ID} = [T_{x} < T_i],\\ \\mathrm{SU} = [T_{x} > T_s],\\ \\mathrm{HD} = [T_{x} > T_h],\\ \\mathrm{TR} = [T_{n} > T_t]"
validation = "none: a classification of a day"
conventions = ["strict signs as the ETCCDI: a day exactly at a threshold is none of these days; IMGW-PIB's yearbooks count Tmin <= 0 and Tmax >= 25 or 30 °C", "the freeze-thaw day is the „dzień przymrozkowy” of the Słownik meteorologiczny and of IMGW-PIB's normals (PRZYMROZKI); the frost day is FD", "a flag is missing (NaN) where a temperature it needs is; the series function gives an all-missing series for one it lacks"]
assumptions = []
notices = []
reference_cases = ["tests/fixtures/formulas/meteo-indices-cases.json"]
constants = []
tables = []

[properties]
units = "unit_specific"
scalings = []
symmetries = []

[properties.monotonic]
tmin_c = -1
frost_tmin_c = 1

[[properties.limits]]
name = "counting_oracle"
text = "every flag equals the comparison made day by day in a loop, at the ETCCDI's thresholds and beside them, with gaps"

[[properties.conservation]]
name = "a_freeze_thaw_day_is_a_frost_day"
text = "no freeze-thaw day without a frost day"

[properties.conservation.tolerance]
reason = "counts of 0 and 1"
abs = 0.0

[[sources]]
citation = "ETCCDI (2009). Climate Change Indices: definitions of the 27 core indices. Expert Team on Climate Change Detection and Indices"
access = "open"
locator = "FD: days with TN < 0 °C; SU: TX > 25 °C; ID: TX < 0 °C; TR: TN > 20 °C; DTR: the monthly mean of TX - TN"
url = "https://etccdi.pacificclimate.org/list_27_indices.shtml"

[[sources]]
citation = "Kossowska-Cezak, U. (2014). Zmiany wieloletnie liczby termicznych dni charakterystycznych w Warszawie (1951-2010). Prace Geograficzne 136, 9-30"
access = "open"
locator = "p. 14, after the Słownik meteorologiczny (2003): a hot day („upalny”) has tmax > 30 °C, a freeze-thaw day („przymrozkowy”) tmin < 0 °C and tmax > 0 °C"

[[sources]]
citation = "IMGW-PIB: Normy klimatyczne 1991-2020"
access = "open"
locator = "product PRZYMROZKI, „Liczba dni przymrozkowych (TMAX>0 & TMIN<0)”"
url = "https://klimat.imgw.pl"

