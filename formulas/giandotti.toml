citation = "Autorità di bacino del fiume Po (2001). Piano stralcio per l'assetto idrogeologico (PAI), Direttiva sulla piena di progetto"
access = "open"
locator = "§6.1, p. 9: tempo di corrivazione di Giandotti (1934, 1937)"
url = "https://www.adbpo.it/PAI/7%20-%20Norme%20di%20attuazione/7.2%20-%20Direttive%20di%20Piano/Direttiva2/DIRETTIVA/DIRETTIVA.PDF"

[[constants]]
name = "length_factor"
value = 1.5
unit = "h km^-1 m^0.5"
symbol = "1.5"

[constants.source]
citation = "Autorità di bacino del fiume Po (2001). Piano stralcio per l'assetto idrogeologico (PAI), Direttiva sulla piena di progetto"
access = "open"
locator = "§6.1, p. 9: tempo di corrivazione di Giandotti (1934, 1937)"
url = "https://www.adbpo.it/PAI/7%20-%20Norme%20di%20attuazione/7.2%20-%20Direttive%20di%20Piano/Direttiva2/DIRETTIVA/DIRETTIVA.PDF"

