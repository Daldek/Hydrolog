[[outputs]]
name = "tc_min"
unit = "min"
kind = "real"
symbol = "t_c"
description = "Time of concentration."

[outputs.physical]
low = 0.0
low_inclusive = false

[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "range cases elevation_diff_m-physical_low_*: tc grows as H^-0.5 when H tends to 0 (a flat watershed) and stays finite; H = 0 is refused"

[[oracles]]
kind = "exact"
description = "the formula in minutes, 75 (4 A^0.5 + 1.5 L) / H^0.5, evaluated with the decimal module at 50 digits"
test = "tests/unit/test_formulas_tc.py (limit decimal)"
conventions = []
