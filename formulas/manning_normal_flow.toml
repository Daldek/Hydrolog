[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "ln b and ln z of a triangle (b = 0) and of a rectangle (z = 0) are minus infinity, which logaddexp takes: range cases bottom_width_m-physical_low and side_slope_m_per_m-physical_low give finite flows; ln Q and S^(1/2) at their open lower ends: range cases discharge_m3s-physical_low_inside and slope_m_per_m-physical_low_inside, a finite flow or the precondition representable_flow"

[[traps]]
name = "exp_overflow"
description = "exp of a scaled input at its test bound."
test = "y = e^u beyond the largest float: the violated point of representable_flow and test_a_depth_beyond_a_float_is_refused; the range cases at the test bounds give finite flows"

[[oracles]]
kind = "exact"
description = "the closed form of a triangle, y = (Q n P'^(2/3) / (S^(1/2) z^(5/3)))^(3/8), and its c = 4/3 V"
test = "tests/unit/test_formulas_muskingum_cunge.py (limit triangle_closed_form)"
conventions = []

[[oracles]]
kind = "algorithm"
description = "Manning's equation written as S^(1/2) / n (A^5 / P^2)^(1/3) in decimal arithmetic at 50 digits, its depth by bisection and dQ/dA by a central difference"
test = "tests/unit/test_formulas_muskingum_cunge.py (limit decimal_oracle)"
conventions = []
