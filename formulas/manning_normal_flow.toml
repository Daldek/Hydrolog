[[constraints]]
name = "representable_flow"
class = "precondition"
text = "2.2e-308 <= y, A, T, V, c < inf: float64 holds the normal flow to sixteen digits; a section so narrow, flat or rough, or a discharge so large or small, that one of them overflows or falls among the subnormal floats has none"

[constraints.source]
citation = "IEEE 754-2019, binary64: normal numbers of magnitude about 2.2e-308 to 1.8e308, with 53 significant bits; below them the subnormal numbers keep fewer"
access = "open"
locator = "the depth, the area, the top width, the velocity and the celerity of a flow must be normal numbers to hold their sixteen digits"

