schema = "nogat-formula-card/1"
name = "circular_mean"
title = "Mean direction and concentration of times on the circles of their years (Bayliss and Jones)"
function = "hydrolog.statistics.seasonality.circular_mean"
family = "statistic"
formula_version = 1
status = "oracle only"
equation = "theta_i = 2 pi t_i / L_i; xbar = sum(cos theta_i) / n, ybar = sum(sin theta_i) / n; f = (atan2(ybar, xbar) mod 2 pi) / (2 pi); r = sqrt(xbar^2 + ybar^2)"
latex = "\\theta_i = \\frac{2\\pi t_i}{L_i},\\quad \\bar{x} = \\frac{1}{n}\\sum_i \\cos\\theta_i,\\quad \\bar{y} = \\frac{1}{n}\\sum_i \\sin\\theta_i,\\quad f = \\frac{\\operatorname{atan2}(\\bar{y}, \\bar{x}) \\bmod 2\\pi}{2\\pi},\\quad r = \\sqrt{\\bar{x}^2 + \\bar{y}^2}"
validation = "none: a description of the timing of floods; Bayliss and Jones (1992) and the FEH map it for British rivers, Hall and Blöschl (2018) for Europe"
conventions = ["the times and the lengths of their years in one unit of time, days for dates; the angle 2 pi t / L of a time t from the start of its year of L", "for dates t is the day of the year minus a half, the middle of the day, and L 365 or 366 (Bayliss and Jones's ADJUST, FEH's day no. - 0.5); Hall and Blöschl (2018) take the day itself, D 2 pi / m_i", "the mean direction atan2(ybar, xbar) taken into [0, 2 pi): Bayliss and Jones and the FEH add pi or 2 pi to arctan(ybar / xbar) by the signs, the same angle; at xbar = ybar = 0 the direction is undefined (Hall and Blöschl) and the formula gives 0, as scipy.stats.circmean does", "near r = 0 the direction is ill-conditioned: a rounding moves it; read the mean with r (Bayliss and Jones, section 3.3; the FEH)"]
assumptions = ["the times are the dates of independent events, one annual extreme per year; Hall and Blöschl keep the stations where a Rayleigh test rejects uniform dates, which Hydrolog does not compute"]
notices = []
reference_cases = []
constants = []
tables = []

[properties]
units = "homogeneous"
conservation = []

[properties.monotonic]

[[properties.scalings]]
name = "time_in_another_unit"

[properties.scalings.inputs]
elapsed_days = 1.0
year_days = 1.0

[properties.scalings.outputs]

[properties.scalings.tolerance]
reason = "t / L is the same float when both double, but for a subnormal angle"
abs = 1e-300

[[properties.limits]]
name = "one_time"
text = "a single time is its own mean, with r = 1"

[[properties.limits]]
name = "opposite_times"
text = "two times half a year apart have no direction: r = 0"

[[properties.limits]]
name = "quadrant_rules"
text = "the direction and length equal Bayliss and Jones's arctan with the quadrant rules and their r, of sums by math.fsum"

[[properties.symmetries]]
name = "reversed_order"
text = "the times in reverse order give the same concentration"

[properties.symmetries.tolerance]
reason = "the same terms summed in another order"
abs = 1e-15

[[sources]]
citation = "Bayliss, A.C. and Jones, R.C. (1992). The peaks-over-threshold database at the Institute of Hydrology. Report to MAFF, Institute of Hydrology, Wallingford, March 1992 (published as IH Report No. 121, 1993)"
access = "open"
locator = "section 3.2, pp. 18-19: theta_i = day 2 pi / LENYR - ADJUST with ADJUST = (1/2)(2 pi / 365) for the middle of the day, LENYR 365 or 366; xbar, ybar the means of cos and sin; tan(thetabar) = ybar / xbar with pi or 2 pi added by their signs; MPD = thetabar 365 / (2 pi) + 0.5; section 3.3, p. 21: r = sqrt(xbar^2 + ybar^2), MPD less meaningful when r is close to zero"
url = "https://nora.nerc.ac.uk/id/eprint/14407/"

[[sources]]
citation = "Robson, A. and Reed, D. (1999). Flood Estimation Handbook, Volume 3: Statistical procedures for flood frequency estimation. Institute of Hydrology, Wallingford"
access = "open"
locator = "Additional Note 16.1, pp. 177-179: theta = (day no. - 0.5) 2 pi / LENYR, LENYR 365 or 366, the 0.5 for the middle of the day; XFLOOD and YFLOOD the means of cos theta and sin theta; thetabar by their quadrant, r their length; when r is small the direction is less meaningful"
url = "https://www.ceh.ac.uk/sites/default/files/2021-11/Flood-Estimation-Handbook-3-Statistical-Procedures-For-Flood-Frequency-Estimation_Alice-Robson_Duncan-Reed.pdf"

[[sources]]
citation = "Hall, J. and Blöschl, G. (2018). Spatial patterns and characteristics of flood seasonality in Europe. Hydrology and Earth System Sciences 22, 3883-3901"
access = "open"
locator = "eqs. 1-5: theta_i = D_i 2 pi / m_i (D_i = 1 on 1 January, m_i 365 or 366); the mean date by the quadrant rules times m / (2 pi), m the mean number of days per year, undefined for xbar = ybar = 0; R = sqrt(xbar^2 + ybar^2)"
url = "https://hess.copernicus.org/articles/22/3883/2018/hess-22-3883-2018.pdf"

[[sources]]
citation = "Burn, D.H. (1997). Catchment similarity for regional flood frequency analysis using seasonality measures. Journal of Hydrology 202, 212-230"
access = "author-provided"
locator = "the seasonality measures of flood dates; not opened"

[[variables]]
name = "elapsed_days"
symbol = "t_i"
unit = "day"
kind = "real_array"
description = "Time of each date from the start of its year: the day of the year minus a half, the middle of the day."
applicability = "unstated"
gaps_allowed = false
dims = 1
min_length = 1

[variables.physical]
low = 0.0
low_inclusive = true
test_high = 1000000000.0
test_reason = "a year in seconds is about 3.2e7: the bound leaves room for times in any unit down to the second"

[variables.typical]
low = 2.5
low_inclusive = true
high = 336.5
high_inclusive = true

[variables.typical.source]
citation = "IMGW-PIB, public hydrological data: the half-year characteristics of discharge at station 150160180 Kłodzko on the Nysa Kłodzka, hydrological years 1971-2015 but 1997"
access = "open"
locator = "the dates of the 44 annual maxima, the larger of the half-year maxima: days 3 to 337 of their calendar years"
url = "https://danepubliczne.imgw.pl/data/dane_pomiarowo_obserwacyjne/dane_hydrologiczne/"

[[variables]]
name = "year_days"
symbol = "L_i"
unit = "day"
kind = "real_array"
description = "Length of the year of each date, in the unit of the times."
applicability = "unstated"
gaps_allowed = false
dims = 1
min_length = 1

[variables.physical]
low = 0.0
low_inclusive = false
test_high = 1000000000.0
test_reason = "a year in seconds is about 3.2e7: the bound leaves room for times in any unit down to the second"

[variables.typical]
low = 365.0
low_inclusive = true
high = 366.0
high_inclusive = true

[variables.typical.source]
citation = "Robson, A. and Reed, D. (1999). Flood Estimation Handbook, Volume 3: Statistical procedures for flood frequency estimation. Institute of Hydrology, Wallingford"
access = "open"
locator = "Additional Note 16.1: LENYR, 365 or 366 days"
url = "https://www.ceh.ac.uk/sites/default/files/2021-11/Flood-Estimation-Handbook-3-Statistical-Procedures-For-Flood-Frequency-Estimation_Alice-Robson_Duncan-Reed.pdf"

[[constraints]]
name = "same_length"
class = "physical"
text = "one year length per time"

[constraints.source]
citation = "Robson, A. and Reed, D. (1999). Flood Estimation Handbook, Volume 3: Statistical procedures for flood frequency estimation. Institute of Hydrology, Wallingford"
access = "open"
locator = "Additional Note 16.1, pp. 177-179: theta = (day no. - 0.5) 2 pi / LENYR, LENYR 365 or 366, the 0.5 for the middle of the day; XFLOOD and YFLOOD the means of cos theta and sin theta; thetabar by their quadrant, r their length; when r is small the direction is less meaningful"
url = "https://www.ceh.ac.uk/sites/default/files/2021-11/Flood-Estimation-Handbook-3-Statistical-Procedures-For-Flood-Frequency-Estimation_Alice-Robson_Duncan-Reed.pdf"

[[constraints]]
name = "within_its_year"
class = "physical"
text = "0 <= t_i < L_i: each time lies in its year"

[constraints.source]
citation = "Robson, A. and Reed, D. (1999). Flood Estimation Handbook, Volume 3: Statistical procedures for flood frequency estimation. Institute of Hydrology, Wallingford"
access = "open"
locator = "Additional Note 16.1, pp. 177-179: theta = (day no. - 0.5) 2 pi / LENYR, LENYR 365 or 366, the 0.5 for the middle of the day; XFLOOD and YFLOOD the means of cos theta and sin theta; thetabar by their quadrant, r their length; when r is small the direction is less meaningful"
url = "https://www.ceh.ac.uk/sites/default/files/2021-11/Flood-Estimation-Handbook-3-Statistical-Procedures-For-Flood-Frequency-Estimation_Alice-Robson_Duncan-Reed.pdf"

[[outputs]]
name = "mean_fraction"
unit = "-"
kind = "real"
symbol = "f"
description = "Direction of the mean vector as the fraction of the year."

[outputs.physical]
low = 0.0
low_inclusive = true
high = 1.0
high_inclusive = true

[[outputs]]
name = "concentration"
unit = "-"
kind = "real"
symbol = "r"
description = "Length of the mean vector: 1 for one time, near 0 when the times spread over the year."
boundary_tolerance = 1e-13

[outputs.physical]
low = 0.0
low_inclusive = true
high = 1.0
high_inclusive = true

[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "atan2 at xbar = ybar = 0 has no direction: limit opposite_times and test_no_direction_gives_the_start_of_the_year"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type cases elapsed_days-nan_element and year_days-nan_element: a gap is refused"

[[traps]]
name = "many_small_terms"
description = "A sum of many small terms that loses precision."
test = "test_many_dates_keep_their_sums: 100,000 dates against math.fsum of the cosines and sines"

[[oracles]]
kind = "algorithm"
description = "Bayliss and Jones's (1992) and the FEH's arctan(ybar / xbar) with pi or 2 pi added by the signs, and r, of sums by math.fsum"
test = "tests/unit/test_formulas_regime.py (limit quadrant_rules)"
conventions = []

[[oracles]]
kind = "established"
description = "scipy.stats.circmean of the angles (SciPy 1.18)"
test = "tests/unit/test_formulas_regime.py (test_the_mean_direction_is_scipys)"
conventions = ["circmean returns the mean angle in [low, high) = [0, 2 pi), the formula's direction; it takes the angles as given, so both sides get Bayliss and Jones's half-day offset", "Hall and Blöschl's D 2 pi / m_i without the offset moves the mean day by 0.5 (1 - 365.25 / L) of a day, at most 0.001 day"]
