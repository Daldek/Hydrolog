schema = "nogat-formula-card/1"
name = "muskingum_cunge"
title = "Muskingum-Cunge routing with constant coefficients on N equal distance steps (Cunge's K and X)"
function = "hydrolog.routing.formulas.cunge.muskingum_cunge_route"
family = "scheme"
formula_version = 1
status = "referenced"
equation = "D = Q / (T S0 c), dx = L / N, K = dx / c, X = (1 - D / dx) / 2; in each of N distance steps in series O[t] = c0 I[t] + c1 I[t-1] + c2 O[t-1] with the Muskingum weights of K, X and dt; Cg = c dt / dx, Dg = D / dx = 1 - 2X and NEH's accuracy limit exp(2.3 Cg)"
latex = "D = \\frac{Q}{T S_0 c},\\ \\Delta x = \\frac{L}{N},\\ K = \\frac{\\Delta x}{c},\\ X = \\frac{1}{2}\\left(1 - \\frac{D}{\\Delta x}\\right);\\quad O_t = c_0 I_t + c_1 I_{t-1} + c_2 O_{t-1};\\quad C_g = \\frac{c \\Delta t}{\\Delta x},\\ D_g = \\frac{D}{\\Delta x} = 1 - 2X"
validation = "none: the sources compare the scheme with unsteady flow models, not with observations (NEH 630 examples 17-4 and 17-5 against HEC-RAS: peaks within 0.2 and 2.5 %); NRCS fitted its accuracy limit to 140 test routings (NEH 630 appendix 17B)"
conventions = ["SI units: discharge in m3/s, time in min, the reach in km, the distance step and the diffusion length in m, the celerity in m/s, storage in m3", "the weights are named by what they multiply: c_current I[t], c_previous I[t-1], c_outflow O[t-1]; NEH 630 and HEC-HMS call them C2, C1 and C3", "one reference discharge, celerity and top width for every distance and time step, so the coefficients are constant: NRCS's WinTR-20 takes the peak at the upstream end of each distance step (NEH 630 example 17-5) and HEC-HMS recomputes the coefficients at every time and distance step (a variable-coefficient method, Ponce 1986): case mc_neh17_example17_5_reach", "X may be negative (NEH 630 example 17-4, X = -0.254); a grid with a negative weight, which NEH accepts (example 17-5, C1 = -0.187), is refused by the precondition nonnegative_weights (Hydrolog ADR-0008)", "within the window's slack a weight that rounding puts below zero is set to zero and the others are divided by their sum (hydrolog.routing._kernels.nonnegative_coefficients)", "Dg is computed as D / dx (NEH eq. 17-34), equal to 1 - 2X (eq. 17-35) to rounding; the accuracy limit exp(2.3 Cg) is capped at exp(700), above every Dg <= 1 + Cg of the window", "no lateral inflow: the term C4 q dx of HEC-HMS eq. 7 is zero", "only the given grid is routed: MuskingumCungeReach takes the inflow peak as the reference unless one is given, chooses N and the sub-steps of a step by NEH 630's rules inside the window, interpolates the inflow linearly between them and falls back to linear reservoirs where no grid exists (Tier B, ADR-0008, ADR-0026)"]
assumptions = ["the diffusion wave: the inertia terms of the momentum equation are neglected, and the convective diffusion equation is linearised at the reference discharge with c and mu = Q / (2 T S0) constant (HEC-HMS eqs. 1 to 5)", "a prismatic reach of one slope; no backwater"]
notices = []
reference_cases = ["tests/fixtures/formulas/muskingum-cunge-cases.json"]
tables = []

