[[constraints]]
name = "nonnegative_weights"
class = "precondition"
text = "|c dt - D| <= L / N <= c dt + D with D = Q / (T S0 c), each end to 1e-9 of itself: every weight is non-negative, so a non-negative inflow gives a non-negative outflow"

[constraints.source]
citation = "the signs of the numerators of the weights (Hydrolog ADR-0008); Ponce's form |C - D| <= 1 <= C + D"
access = "open"
locator = "c_current >= 0 iff dx <= c dt + D, c_previous >= 0 iff dx >= D - c dt, c_outflow >= 0 iff dx >= c dt - D"

[[constraints]]
name = "finite_grid"
class = "precondition"
text = "L / c, c dt / dx, D / dx and N K (1 + 2|X|) max(I, O0) are finite: float64 holds the grid and the water it can hold; a wave so slow, a step so short or a flood so large that one overflows has none"

[constraints.source]
citation = "IEEE 754-2019, binary64: finite numbers of magnitude about 4.9e-324 to 1.8e308"
access = "open"
locator = "the grid's scalars and the water it holds must be among them; exp(700), about 1.0e304, is one"

