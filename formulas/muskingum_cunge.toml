[[properties.limits]]
name = "steady_state"
text = "an inflow equal to the initial outflow passes unchanged: the weights sum to 1"

[[properties.limits]]
name = "exact_recurrence"
text = "the grid and every outflow equal Ponce's form of the weights, (C + D - 1, 1 + C - D, 1 - C + D) / (1 + C + D), and the recurrence in exact rational arithmetic"

[[properties.limits]]
name = "moments"
text = "the impulse response has the moments of the diffusion wave, the mean L / c and the variance 2 mu L / c^3 = D L / c^2, whatever dt and N"

[[properties.limits]]
name = "bounded_by_its_inputs"
text = "every outflow lies between the least and the largest of the inflow and the initial outflow"

[[properties.limits]]
name = "inside_the_accuracy_limit"
text = "on every grid the window accepts Dg <= exp(2.3 Cg), to the window's slack: |Cg - Dg| <= 1 gives Dg <= 1 + Cg <= exp(2.3 Cg)"

[[properties.conservation]]
name = "volume"
text = "the trapezoid continuity holds in every distance step: inflow volume - outflow volume = storage at the end - storage at the start"

[properties.conservation.tolerance]
reason = "relative to the largest volume or storage, or to the smallest normal float below which volumes round absolutely: the recurrence rounds at 1e-16 per step; a weight that rounding put below zero on a border of the window is set to zero, which moves the others by at most the window's slack of 1e-9"
abs = 1e-09

