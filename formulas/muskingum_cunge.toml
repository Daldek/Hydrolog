[[traps]]
name = "difference_denominator"
description = "A denominator that is a difference of inputs."
test = "the window's top L / |c dt - D| divides by a difference: when the wave travels exactly its diffusion length in a step it has no top (test_a_wave_as_long_as_its_diffusion_length_has_no_top); the weights' 1 + Cg + Dg never vanishes"

[[traps]]
name = "stability_bound"
description = "The stability bound of a numerical scheme (a Courant number, Muskingum's 2KX <= dt <= 2K(1-X))."
test = "the window |c dt - D| <= dx <= c dt + D: constraint nonnegative_weights with its satisfied, boundary and violated points, and test_a_border_of_the_window_rounds_to_zero_weights"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type cases inflow_m3s-nan_element and inflow_m3s-inf_element: a gap is refused, the recurrence would carry it to every later ordinate"

[[traps]]
name = "many_small_terms"
description = "A sum of many small terms that loses precision."
test = "test_a_long_steady_inflow_stays_steady: 200,000 ordinates of a constant inflow stay constant to 1e-14"

[[oracles]]
kind = "exact"
description = "Ponce's form of the weights, (C + D - 1, 1 + C - D, 1 - C + D) / (1 + C + D), and the recurrence of the distance steps in exact rational arithmetic (fractions)"
test = "tests/unit/test_formulas_muskingum_cunge.py (limit exact_recurrence)"
conventions = []

[[oracles]]
kind = "exact"
description = "the moments of the impulse response against those of the diffusion wave of HEC-HMS eq. 3, mean L / c and variance 2 mu L / c^3 with mu = Q / (2 T S0), which Cunge's K and X reproduce exactly"
test = "tests/unit/test_formulas_muskingum_cunge.py (limit moments)"
conventions = []
