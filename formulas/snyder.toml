schema = "nogat-formula-card/1"
name = "snyder"
title = "Snyder's synthetic unit hydrograph: lag, peak, time base and widths"
function = "hydrolog.runoff.snyder_uh.snyder_parameters"
family = "empirical"
formula_version = 1
status = "referenced"
equation = "tL = Ct (L Lc)^0.3 [h, L and Lc in km, Ct in SI units]; tD = tL / 5.5; tLR = tL + (D - tD) / 4; tpR = tLR + D / 2; qp = 0.275 Cp A / tL, qpR = 0.275 Cp A / tLR [m3/s per mm, A in km2, times in h]; tb = 0.556 A / qpR [h]; W50 = 770 (qpR / A)^-1.08 and W75 = 440 (qpR / A)^-1.08 [h, qpR / A in ft3/s per mi2 and in], 0.17829 and 0.10188 with qpR / A in m3/s per km2 and mm; times given in min"
latex = "t_L = C_t\\,(L\\,L_c)^{0.3},\\quad t_D = \\frac{t_L}{5.5},\\quad t_{LR} = t_L + \\frac{D - t_D}{4},\\quad t_{pR} = t_{LR} + \\frac{D}{2},\\quad q_{pR} = \\frac{0.275\\,C_p\\,A}{t_{LR}},\\quad t_b = \\frac{0.556\\,A}{q_{pR}},\\quad W_{50} = 770 \\left(\\frac{q_{pR}}{A}\\right)^{-1.08}"
validation = "Snyder (1938) derived the relations from watersheds of the Appalachian Highlands of 10 to 10,000 square miles (Chow et al. 1988 after Rajagopalan's notes, p. 76); Ct and Cp are regional and best found by calibration (HEC-HMS); the sources give no error statistic"
conventions = ["SI units: A in km2, L and Lc in km; Ct in SI units holds Snyder's 0.75 (HEC-HMS: tp = C Ct (L Lc)^0.3, C = 0.75 in SI), so that its 1.35 to 1.65 is 0.75 times Snyder's 1.8 to 2.2 (KZGW 2017 p. 90)", "peaks in m3/s per mm of runoff: 0.275 and 0.556 per mm are Chow's 2.75 and 5.56 per cm (KZGW 2017 eqs. 6.7 and 6.11)", "times from the beginning of the unit rainfall, given in min: the lag tL is Snyder's tp of HEC-HMS and Chow, the time to peak is KZGW's tp = tL + tD / 2 for D = tD and tpR = tLR + D / 2 for another D", "tb is the base of the triangle of the peak qpR that holds 1 mm (KZGW 2017 eq. 6.11, Chow's C3 / qpR), not the end of the curve of snyder_shape", "the widths are those of Chow et al. (1988), from qpR per unit area, with Snyder's 770 and 440 converted exactly from ft3/s per mi2 and in (1 / 2323.2 m3/s per km2 and mm, the units table): 0.17829 and 0.10188; Chow's SI 2.14 and 1.22 per cm round them (0.17800 and 0.10148 per mm, 0.2 % and 0.4 % lower)", "L is the length of the main stream from the outlet to the divide, Lc the length along it to the point nearest the centroid (KZGW 2017 p. 90)"]
assumptions = ["the coefficients Ct and Cp are those of the region, best calibrated on gauged watersheds of it (HEC-HMS); KZGW 2017 gives 1.35 to 1.65 and 0.4 to 0.8", "most watersheds of the ecosystem (the hand-offs' areas up to 250 km2) are smaller than Snyder's, 30 to 30,000 km2: they get the notice outside_typical_range of snyder.area_km2"]
notices = ["outside_applicability"]
reference_cases = ["tests/fixtures/formulas/unit-hydrographs-cases.json"]
tables = []

[properties]
units = "unit_specific"
scalings = []
symmetries = []

[properties.monotonic]
length_km = 1
centroid_length_km = 1
ct = 1

[[properties.limits]]
name = "standard_duration"
text = "the rainfall of the standard duration D = tD keeps the lag tL and the peak qp, with tpR = tL + tD / 2 (KZGW 2017 eqs. 6.4 and 6.8 to 6.10)"

[properties.limits.source]
citation = "KZGW (2017). Aktualizacja metodyki obliczania przepływów i opadów maksymalnych o określonym prawdopodobieństwie przewyższenia dla zlewni kontrolowanych i niekontrolowanych, załącznik 2 do OPZ (wersja ujednolicona)"
access = "open"
locator = "eqs. 6.4 and 6.8 to 6.10, pp. 90-91"
url = "https://kzgw.gov.pl/files/zam-pub/20170402-przeglad-i-aktualizacja-map/zal-2-do-OPZ-ujednolicony-1.pdf"

[[properties.limits]]
name = "decimal_oracle"
text = "every output equals the equations in decimal arithmetic of fifty digits, the widths from 770 and 440 in foot-pound units"

[[properties.conservation]]
name = "triangle_volume"
text = "the triangle of the peak qpR and the base tb holds 1 mm over the watershed, qpR tb / 2 = A x 1 mm, within the rounding of 0.556"

[properties.conservation.tolerance]
reason = "0.556 rounds 2 x 1000 / 3600 = 0.5556 (KZGW 2017 eq. 6.11): the triangle holds 0.556 x 1.8 = 1.0008 mm"
abs = 0.001

