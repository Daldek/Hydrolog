description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "the powers (L Lc)^0.3 and (qpR / A)^-1.08 at the bounds 0 of the inputs: range cases *-physical_low_inside, refused by the precondition representable where an output leaves the normal numbers"

[[oracles]]
kind = "exact"
description = "every output in decimal arithmetic of fifty digits, the widths from Snyder's 770 and 440 in foot-pound units and the exact conversion of ft3/s per mi2 and in"
test = "tests/unit/test_formulas_unit_hydrographs.py (limit decimal_oracle)"
conventions = []
