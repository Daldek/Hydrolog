schema = "nogat-formula-card/1"
name = "pearson3_quantiles"
title = "Quantiles of the Pearson type III distribution for return periods"
function = "hydrolog.statistics.frequency.pearson3_quantiles"
family = "statistic"
formula_version = 1
status = "referenced"
equation = "Q_T = loc + K(skew, T) scale, K the frequency factor: the standardised Pearson III quantile of the non-exceedance 1 - 1/T (a gamma of shape 4 / skew**2 shifted and scaled to the mean 0 and standard deviation 1)"
latex = "Q_T = \\mu + K_{\\gamma}\\!\\left(1 - \\frac{1}{T}\\right)\\sigma"
validation = "none: the quantile function of the distribution"
conventions = ["scipy's pearson3(skew, loc, scale) is parameterised by the mean, standard deviation and skewness, as Bulletin 17B and lmom's PE3 (mu, sigma, gamma); KZGW 2017's (epsilon, alpha, lambda) give skew = 2 / sqrt(lambda), loc = epsilon + lambda / alpha and scale = sqrt(lambda) / alpha", "a positive skewness has the lower bound loc - 2 scale / skew, a negative one the upper bound loc - 2 scale / skew", "the quantile of the return period T at the annual exceedance probability 1/T, the non-exceedance 1 - 1/T (Polish Q_p% with p = 100/T %, KZGW 2017 eq. 3.7; WMO-No. 168 sect. 5.6.1), computed as the inverse survival function at 1/T, which keeps its digits for long return periods", "loc and scale in the unit of the sample; the formula is homogeneous"]
assumptions = []
notices = []
reference_cases = ["tests/fixtures/formulas/flood-frequency-cases.json"]
constraints = []
constants = []
tables = []

[properties]
units = "homogeneous"
conservation = []

[properties.monotonic]
return_periods_years = 1
loc = 1

[[properties.scalings]]
name = "unit_of_the_sample"

[properties.scalings.inputs]
loc = 1.0
scale = 1.0

[properties.scalings.outputs]
quantiles = 1.0

[properties.scalings.tolerance]
reason = "the quantile is loc + scale times that of the standard distribution, and doubling loc and scale rounds alike"
abs = 1e-300
rel = 4.5e-16

[[properties.limits]]
name = "normal"
text = "the skewness 0 gives the normal distribution"

[[properties.symmetries]]
name = "location"
text = "a location larger by 1 gives quantiles larger by 1"

[properties.symmetries.tolerance]
reason = "loc + 1 and the sum round within an ulp of the larger of loc and the quantile, below 1e-9 within the test bound of a million"
abs = 1e-09
rel = 4.5e-16

[[sources]]
citation = "Interagency Advisory Committee on Water Data (1982). Guidelines for Determining Flood Flow Frequency, Bulletin 17B of the Hydrology Subcommittee, U.S. Geological Survey, Reston, Virginia"
access = "open"
locator = "eq. 1, p. 9 (log Q = X + K S) and appendix 3, pp. 3-1 to 3-10 (the frequency factors K of Harter 1969 for skews of -9 to 9)"
url = "https://pubs.usgs.gov/unnumbered/70275162/report.pdf"

[[sources]]
citation = "KZGW (2017). Aktualizacja metodyki obliczania przepływów i opadów maksymalnych o określonym prawdopodobieństwie przewyższenia dla zlewni kontrolowanych i niekontrolowanych, załącznik 2 do OPZ (wersja ujednolicona)"
access = "open"
locator = "eqs. 3.1 and 3.3, p. 28 (Q_p = epsilon + the gamma quantile of 1 - p with lambda and 1/alpha); example 3.2, table 3.9, p. 44"
url = "https://kzgw.gov.pl/files/zam-pub/20170402-przeglad-i-aktualizacja-map/zal-2-do-OPZ-ujednolicony-1.pdf"

[[sources]]
citation = "Virtanen, P. et al. (2020). SciPy 1.0: fundamental algorithms for scientific computing in Python. Nature Methods 17, 261-272"
access = "open"
locator = "scipy.stats.genextreme, lognorm, pearson3 and weibull_min: isf, the inverse of the survival function"
url = "https://docs.scipy.org/doc/scipy/reference/stats.html"

[[variables]]
name = "skew"
symbol = "\\gamma"
unit = "-"
kind = "real"
description = "Skewness of the distribution."
applicability = "unstated"

[variables.physical]
test_low = -9.0
test_high = 9.0
test_reason = "Bulletin 17B appendix 3 tabulates the frequency factor for skews of -9 to 9"

[variables.typical]
low = 1.3
low_inclusive = true
high = 2.7
high_inclusive = true

[variables.typical.source]
citation = "KZGW (2017). Aktualizacja metodyki obliczania przepływów i opadów maksymalnych o określonym prawdopodobieństwie przewyższenia dla zlewni kontrolowanych i niekontrolowanych, załącznik 2 do OPZ (wersja ujednolicona)"
access = "open"
locator = "examples 3.2 to 3.4 (the Czarna at Polana, the Rypienica at Rypin, the Świślina at Rzepin, tables 3.5, 3.10 and 3.13): the parameters Hydrolog's four estimators give their annual maxima, with the log-normal and Weibull parameters the examples print (pp. 47-48 and 53-54)"
url = "https://kzgw.gov.pl/files/zam-pub/20170402-przeglad-i-aktualizacja-map/zal-2-do-OPZ-ujednolicony-1.pdf"

