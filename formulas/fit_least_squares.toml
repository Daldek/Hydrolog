schema = "nogat-formula-card/1"
name = "fit_least_squares"
title = "Parameters of a distribution of annual maxima by least squares on the plotting positions"
function = "hydrolog.statistics.frequency.fit_least_squares"
family = "statistic"
formula_version = 1
status = "oracle only"
equation = "the parameters that minimise sum_j (x(j) - Q(j / (n + 1)))**2 over the ascending sample x(1) <= ... <= x(n), Q the quantile function of the distribution: the quantiles at the Weibull plotting positions"
latex = "(\\hat{k}, \\hat{\\xi}, \\hat{\\alpha}) = \\arg\\min \\sum_{j=1}^{n}\\left(x_{(j)} - Q\\left(\\frac{j}{n + 1}; k, \\xi, \\alpha\\right)\\right)^2"
validation = "none: the estimator gives the distribution closest to the plotted sample"
conventions = ["the Weibull plotting positions j / (n + 1) of the ascending sample, unweighted residuals in the unit of the sample", "scipy's parameters, as fit_moments", "the search runs on the standardised sample (the log-normal, of location 0, only divided by its standard deviation) from the moments' estimate; Nelder-Mead (xatol 1e-10, fatol 1e-12) is run again from its end until a run gains at most 1e-9, at most 21 runs"]
assumptions = ["the annual maxima are independent and identically distributed"]
notices = []
reference_cases = []
tables = []

[properties]
units = "homogeneous"
conservation = []
symmetries = []

[properties.monotonic]

[[properties.scalings]]
name = "unit_of_the_sample"

[properties.scalings.inputs]
annual_maxima = 1.0

[properties.scalings.outputs]
loc = 1.0
scale = 1.0

[properties.scalings.tolerance]
reason = "the estimators run on the sample divided by a power of two, so doubling it changes no rounding: the shape is the same and loc and scale double exactly; a scale below the normal floats keeps fewer bits"
abs = 1e-300
rel = 4.5e-16

[[properties.limits]]
name = "local_minimum"
text = "no point a step of 1e-4 from the estimate has a smaller sum of squares"

[[sources]]
citation = "WMO (2009). Guide to Hydrological Practices, 6th ed., Volume II: Management of Water Resources and Application of Hydrological Practices, WMO-No. 168"
access = "open"
locator = "sect. 5.6.1, p. II.5-14: the Weibull plotting position i / (n + 1) of the graphical fit of a distribution to the ordered sample"
url = "https://www.hydrology.nl/images/docs/hwrp/WMO_Guide_168_Vol_II_en.pdf"

[[sources]]
citation = "KZGW (2017). Aktualizacja metodyki obliczania przepływów i opadów maksymalnych o określonym prawdopodobieństwie przewyższenia dla zlewni kontrolowanych i niekontrolowanych, załącznik 2 do OPZ (wersja ujednolicona)"
access = "open"
locator = "eq. 3.7: the empirical probability m / (N + 1) of the ordered annual maxima"
url = "https://kzgw.gov.pl/files/zam-pub/20170402-przeglad-i-aktualizacja-map/zal-2-do-OPZ-ujednolicony-1.pdf"

[[variables]]
name = "annual_maxima"
symbol = "x_i"
unit = "m3/s"
kind = "real_array"
description = "The sample: annual maxima, or any sample of the distribution."
applicability = "unstated"
gaps_allowed = false
dims = 1
min_length = 1

[variables.physical]
test_low = -1000000.0
test_high = 1000000.0
test_reason = "the formulas are homogeneous in the unit of the sample (their scalings), so any bound tests their arithmetic: a million m3/s exceeds the discharge of every river, and a stage may lie below its gauge's zero, so the same bound holds below 0"

[variables.typical]
low = 0.81
low_inclusive = true
high = 111.0
high_inclusive = true

[variables.typical.source]
citation = "KZGW (2017). Aktualizacja metodyki obliczania przepływów i opadów maksymalnych o określonym prawdopodobieństwie przewyższenia dla zlewni kontrolowanych i niekontrolowanych, załącznik 2 do OPZ (wersja ujednolicona)"
access = "open"
locator = "examples 3.2 to 3.4, tables 3.5, 3.10 and 3.13 (pp. 39-55): annual maxima of 0.81 m3/s (Rypienica at Rypin) to 111 m3/s (Czarna at Polana)"
url = "https://kzgw.gov.pl/files/zam-pub/20170402-przeglad-i-aktualizacja-map/zal-2-do-OPZ-ujednolicony-1.pdf"

[[variables]]
name = "distribution"
symbol = "F"
unit = "-"
kind = "choice"
description = "The distribution: the log-normal of location 0, the GEV, Pearson type III or the three-parameter Weibull distribution of scipy.stats."
choices = ["log_normal", "gev", "pearson3", "weibull"]

[[constraints]]
name = "enough_values"
class = "precondition"
text = "n >= 3"

[constraints.source]
citation = "Interagency Advisory Committee on Water Data (1982). Guidelines for Determining Flood Flow Frequency, Bulletin 17B of the Hydrology Subcommittee, U.S. Geological Survey, Reston, Virginia"
access = "open"
locator = "eq. 4a: the moments of the start divide by (N - 1)(N - 2)"
url = "https://pubs.usgs.gov/unnumbered/70275162/report.pdf"

[[constraints]]
name = "values_not_all_equal"
class = "precondition"
text = "min(x) < max(x)"

[constraints.source]
citation = "WMO (2009). Guide to Hydrological Practices, 6th ed., Volume II: Management of Water Resources and Application of Hydrological Practices, WMO-No. 168"
access = "open"
locator = "sect. 5.6.1: values all equal have no spread to fit"
url = "https://www.hydrology.nl/images/docs/hwrp/WMO_Guide_168_Vol_II_en.pdf"

[[constraints]]
name = "positive_values"
class = "precondition"
text = "min(x) > 0 for the log-normal (location 0)"

[constraints.source]
citation = "Hosking, J.R.M. lmom: L-moments, R package version 3.3, CRAN (the Fortran routines of Hosking and Wallis 1997)"
access = "open"
locator = "pelln3 with bound 0: the distribution of ln(x - 0), defined for x > 0"
url = "https://cran.r-project.org/package=lmom"

[[constraints]]
name = "skewness_within_distribution"
class = "precondition"
text = "G > -1.1395 for the Weibull distribution: the search starts from the moments' estimate"

[constraints.source]
citation = "WMO (2009). Guide to Hydrological Practices, 6th ed., Volume II: Management of Water Resources and Application of Hydrological Practices, WMO-No. 168"
access = "open"
locator = "table II.5.2, p. II.5-5: the Gumbel (EV1) distribution, of skewness 1.1396, 12 sqrt(6) zeta(3) / pi**3"
url = "https://www.hydrology.nl/images/docs/hwrp/WMO_Guide_168_Vol_II_en.pdf"

[[constraints]]
name = "squares_have_a_minimum"
class = "precondition"
text = "the sum of squares has a minimum inside the shapes searched (log-normal s < 5, GEV -1 < c < 50, Pearson III |G| < 9, Weibull shape < 50) on which the search settles"

[constraints.source]
citation = "Interagency Advisory Committee on Water Data (1982). Guidelines for Determining Flood Flow Frequency, Bulletin 17B of the Hydrology Subcommittee, U.S. Geological Survey, Reston, Virginia"
access = "open"
locator = "appendix 3: the frequency factors of Pearson type III, tabulated for skews of -9 to 9"
url = "https://pubs.usgs.gov/unnumbered/70275162/report.pdf"

[[constants]]
name = "gumbel_skewness"
value = 1.1395470994046488
unit = "-"
symbol = "\\gamma_G"

[constants.source]
citation = "WMO (2009). Guide to Hydrological Practices, 6th ed., Volume II: Management of Water Resources and Application of Hydrological Practices, WMO-No. 168"
access = "open"
locator = "table II.5.2, p. II.5-5: the Gumbel (EV1) distribution, of skewness 1.1396, 12 sqrt(6) zeta(3) / pi**3"
url = "https://www.hydrology.nl/images/docs/hwrp/WMO_Guide_168_Vol_II_en.pdf"

[[outputs]]
name = "shape"
unit = "-"
kind = "real"
symbol = "k"
description = "Shape: s of the log-normal, c of the GEV (scipy's sign, k of Hosking, -xi of Coles), the skewness of Pearson III, the Weibull shape."

[outputs.physical]

[[outputs]]
name = "loc"
unit = "m3/s"
kind = "real"
symbol = "\\xi"
description = "Location: 0 for the log-normal, the mean of Pearson III, the lower bound of Weibull."

[outputs.physical]

[[outputs]]
name = "scale"
unit = "m3/s"
kind = "real"
symbol = "\\alpha"
description = "Scale; one that would underflow is the smallest float64 (its boundary tolerance)."

[outputs.physical]
low = 0.0
low_inclusive = false

[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "constraint case skewness_within_distribution-violated: the Weibull start of a skewness below the reversed Gumbel's"

[[traps]]
name = "unbounded_iteration"
description = "An iteration without a bounded count (root finding, fit)."
test = "test_a_search_that_does_not_settle_is_refused: a search that does not settle in its bounded count of runs fails the precondition squares_have_a_minimum"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type case annual_maxima-nan_element: a gap is refused"

[[traps]]
name = "moment_cancellation"
description = "Cancellation in moments computed as E[x^2] - E[x]^2."
test = "test_a_large_mean_shifts_the_fits: a mean of 1e9 with the spread of the Polana maxima over 1000"

[[oracles]]
kind = "algorithm"
description = "the sum of squares at points a step of 1e-4 from the estimate, by math.fsum"
test = "tests/unit/test_formulas_flood_frequency.py (limit local_minimum)"
conventions = []

[[oracles]]
kind = "algorithm"
description = "Powell's method from the estimate finds no smaller sum of squares"
test = "tests/unit/test_formulas_flood_frequency.py (test_powell_finds_no_smaller_squares)"
conventions = []
