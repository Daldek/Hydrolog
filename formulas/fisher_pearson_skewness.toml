schema = "nogat-formula-card/1"
name = "fisher_pearson_skewness"
title = "Fisher-Pearson coefficient of skewness g1 of a sample"
function = "hydrolog.statistics.characteristic.fisher_pearson_skewness"
family = "statistic"
formula_version = 1
status = "oracle only"
equation = "g1 = m3 / m2**1.5 with m_k = sum((x - mean)**k) / n"
latex = "g_1 = \\frac{m_3}{m_2^{3/2}},\\quad m_k = \\frac{1}{n}\\sum_i (x_i - \\bar{x})^k"
validation = "none: the definition of a sample statistic"
conventions = ["the Fisher-Pearson coefficient g1 of NIST sect. 1.3.5.11, the moments with the divisor n (scipy.stats.skew with bias=True), not the adjusted G1 = sqrt(n (n - 1)) / (n - 2) g1 of flood frequency analysis (Bulletin 17B)", "the sample in any unit; the skewness without one", "the deviations from the mean, centred twice, on the sample divided by a power of two"]
assumptions = []
notices = []
reference_cases = []
constants = []
tables = []

[properties]
units = "homogeneous"
conservation = []

[properties.monotonic]

[[properties.scalings]]
name = "unit_of_the_sample"

[properties.scalings.inputs]
values = 1.0

[properties.scalings.outputs]

[properties.scalings.tolerance]
reason = "the statistics run on the sample scaled by a power of two, so doubling or negating it changes no rounding; a result below the normal floats keeps fewer bits"
abs = 1e-300
rel = 4.5e-16

[[properties.limits]]
name = "exact_rational"
text = "the skewness of the definition in exact rational arithmetic"

[[properties.limits]]
name = "symmetric_sample"
text = "a sample symmetric about its mean has no skewness"

[[properties.limits]]
name = "one_positive_value"
text = "one value apart from n - 1 equal ones has the largest skewness of n values, (n - 2) / sqrt(n - 1)"

[[properties.symmetries]]
name = "mirror"
text = "the negated sample has the negated skewness"

[properties.symmetries.tolerance]
reason = "the statistics run on the sample scaled by a power of two, so doubling or negating it changes no rounding; a result below the normal floats keeps fewer bits"
abs = 1e-300
rel = 4.5e-16

[[sources]]
citation = "NIST/SEMATECH (2012). e-Handbook of Statistical Methods, National Institute of Standards and Technology"
access = "open"
locator = "sect. 1.3.5.11, Measures of Skewness and Kurtosis: the Fisher-Pearson coefficient of skewness g1 = sum((Y - mean)**3) / N / s**3, s with the divisor N"
url = "https://www.itl.nist.gov/div898/handbook/eda/section3/eda35b.htm"

[[sources]]
citation = "Virtanen, P. et al. (2020). SciPy 1.0: fundamental algorithms for scientific computing in Python. Nature Methods 17, 261-272"
access = "open"
locator = "scipy.stats.skew with bias=True, its default: the Fisher-Pearson coefficient g1 = m3 / m2**1.5"
url = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.skew.html"

[[variables]]
name = "values"
symbol = "x_i"
unit = "m3/s"
kind = "real_array"
description = "The sample: the values of a calendar month over the years."
applicability = "unstated"
gaps_allowed = false
dims = 1
min_length = 1

[variables.physical]
test_low = -1000000.0
test_high = 1000000.0
test_reason = "the formulas are homogeneous in the unit of the sample (their scalings), so any bound tests their arithmetic: a million m3/s exceeds the discharge of every river, and a stage may lie below its gauge's zero, so the same bound holds below 0"

[variables.typical]
low = 4.93
low_inclusive = true
high = 96.0
high_inclusive = true

[variables.typical.source]
citation = "IMGW-PIB, public hydrological data: codz_2010_01..12.csv, station 150160180 Kłodzko (Nysa Kłodzka)"
access = "open"
locator = "the daily discharges of the hydrological year 2010, 4.93 to 96.0 m3/s (tests/oracles/characteristic/imgw_150160180_codz_2010.csv)"
url = "https://danepubliczne.imgw.pl/data/dane_pomiarowo_obserwacyjne/dane_hydrologiczne/"

[[constraints]]
name = "enough_values"
class = "precondition"
text = "n >= 2"

[constraints.source]
citation = "NIST/SEMATECH (2012). e-Handbook of Statistical Methods, National Institute of Standards and Technology"
access = "open"
locator = "sect. 1.3.5.11: a sample of one value has no s"
url = "https://www.itl.nist.gov/div898/handbook/eda/section3/eda35b.htm"

[[constraints]]
name = "values_not_all_equal"
class = "precondition"
text = "min(x) < max(x)"

[constraints.source]
citation = "NIST/SEMATECH (2012). e-Handbook of Statistical Methods, National Institute of Standards and Technology"
access = "open"
locator = "sect. 1.3.5.11: g1 divides by s**3, 0 for equal values"
url = "https://www.itl.nist.gov/div898/handbook/eda/section3/eda35b.htm"

[[outputs]]
name = "skewness"
unit = "-"
kind = "real"
symbol = "g_1"
description = "Fisher-Pearson coefficient of skewness."

[outputs.physical]

[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "constraint case values_not_all_equal-violated: m2 = 0 of equal values is refused before the division by m2**1.5"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type case values-nan_element: a gap is refused"

[[traps]]
name = "moment_cancellation"
description = "Cancellation in moments computed as E[x^2] - E[x]^2."
test = "limit exact_rational: a mean of 1e9 with a spread of 0.03"

[[oracles]]
kind = "exact"
description = "the skewness in exact rational arithmetic (fractions)"
test = "tests/unit/test_formulas_characteristic.py (limit exact_rational)"
conventions = []

[[oracles]]
kind = "established"
description = "scipy.stats.skew with bias=True"
test = "tests/unit/test_formulas_characteristic.py (test_the_estimators_are_numpys_and_scipys)"
conventions = ["scipy.stats.skew(bias=True) is the spec's g1"]
