[[traps]]
name = "difference_denominator"
description = "A denominator that is a difference of inputs."
test = "durations_increasing refuses equal durations, whose ln ratio is 0; a step end within 1e-9 of a point takes its depth"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type cases durations_min-nan_element and depths_mm-nan_element: a gap is refused"

[[traps]]
name = "many_small_terms"
description = "A sum of many small terms that loses precision."
test = "conservation steps_add_up and windows_hold_design_depths"

[[oracles]]
kind = "algorithm"
description = "the arrangement DWD describes (sorted increments) on a curve interpolated in ln D at 40 digits (decimal), for curves whose increments decrease"
test = "tests/unit/test_formulas_hyetographs.py (limit a118_sorted)"
conventions = []
