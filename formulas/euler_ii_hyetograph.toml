schema = "nogat-formula-card/1"
name = "euler_ii_hyetograph"
title = "Euler type II design storm of ATV-DVWK-A 118 from a depth-duration curve"
function = "hydrolog.precipitation.hietogram.euler_ii_hyetograph"
family = "scheme"
formula_version = 1
status = "referenced"
equation = "h(t) of the curve at t = j dt (depth_duration_interpolation); increments dh_j = h(j dt) - h((j - 1) dt), j = 1..n, n = Td / dt; peak block k = floor(0.3 n) (from 0, the interval from 0.3 Td rounded down to a step); block k holds dh_1, blocks k - 1 .. 0 hold dh_2 .. dh_(k+1), blocks k + 1 .. n - 1 hold dh_(k+2) .. dh_n; the total is h(Td)"
latex = "\\Delta h_j = h(j\\,\\Delta t) - h((j-1)\\,\\Delta t),\\quad k = \\lfloor 0.3\\,n \\rfloor,\\quad P_{k-i} = \\Delta h_{i+1}\\ (i = 0..k),\\quad P_{i-1} = \\Delta h_i\\ (i = k+2..n)"
validation = "none: a design storm of drainage design (A 118); Licznar and Szeląg (2014, abstract) find its shape departs from observed storms beyond 180 min"
conventions = ["depths in mm per step; t_j the end of step j", "the increments keep the order of their durations and are not sorted, so the m steps that end with the peak hold h(m dt) also where interpolation makes an increment grow (ADR-0042, as the itwh software); for a curve whose increments decrease this is the sorted arrangement of A 118 and DWD", "the peak starts at 0.3 Td rounded down to a whole step (A 118 as quoted: to a multiple of 5 min); the itwh software puts the peak of 15 min in the second step and Kaźmierczak and Kotowski (2012) end it at Td / 3, a step later for Td of 165 and 180 min", "the total is h(Td) of the curve; the curve is of one probability", "the storm is made of whole steps: Td = n dt (ADR-0046)"]
assumptions = ["A 118 asks for a duration of at least twice the longest flow time; the Polish models of Wartalska and Kotowski (2020) span 30 to 180 min; the sources state no range of the formula's inputs, so none gives a notice"]
notices = []
reference_cases = ["tests/fixtures/formulas/hyetographs-cases.json"]
tables = []

[properties]
units = "homogeneous"
symmetries = []

[properties.monotonic]

[[properties.scalings]]
name = "depth"

[properties.scalings.inputs]
depths_mm = 1.0

[properties.scalings.outputs]
intensities_mm = 1.0
total_mm = 1.0

[properties.scalings.tolerance]
reason = "doubling a total or a time is exact in binary; one rounding of a quotient but for subnormal values"
abs = 1e-300
rel = 1e-15

[[properties.scalings]]
name = "time"

[properties.scalings.inputs]
durations_min = 1.0
duration_min = 1.0
timestep_min = 1.0

[properties.scalings.outputs]
times_min = 1.0
peak_start_min = 1.0

[properties.scalings.tolerance]
reason = "the logarithms of doubled durations round differently; the interpolated depths move by a few units in the last place of a depth over the logarithm of a ratio of durations"
abs = 1e-09
rel = 1e-09

[[properties.limits]]
name = "a118_sorted"
text = "for a curve whose increments decrease, the storm DWD describes: the largest increment at the peak, the next larger ones before it in ascending order, the rest after it in descending order"

[properties.limits.source]
citation = "Malitz, G. (2009). Stark- und Extremniederschlag im Kurzzeitbereich. Deutscher Wetterdienst, Hydrometeorologie; slides of the 2. Trierer Workshop zur Niederschlag-Abfluss-Modellierung"
access = "open"
locator = "slide 17: the highest 5-min value at position 4, the three next higher to its left, the rest decreasing to its right, the sum of the three largest the depth of 15 min; slides 18 and 19: two storms of 60 min"
url = "https://www.uni-trier.de/fileadmin/fb6/prof/PHY/PDF-Dateien/AG_ModSim/N-A-Workshop_2009/Malitz.pdf"

[[properties.limits]]
name = "peak_start"
text = "the peak interval starts at 0.3 Td rounded down to a step: 0, 0, 15, 45, 45, 50 and 160 min for 5 to 540 min in steps of 5 min"

[properties.limits.source]
citation = "ATV-DVWK (2001). Arbeitsblatt ATV-DVWK-A 118, Kap. 5.2.2.1, as quoted by Thewes, K. (2005). Diplomarbeit, Fachhochschule Trier"
access = "open"
locator = "p. 10: the interval of the highest intensity begins at 0.3 of the duration rounded down to a multiple of 5 min; the next lower intervals follow to the left back to t = 0, the others to the right"
url = "https://www.hochschule-trier.de/fileadmin/Hauptcampus/Fachbereich_BL/BI/Personen/Erzmann/Abschlussarbeiten/DA-Thewes.pdf"

[[properties.conservation]]
name = "steps_add_up"
text = "the steps hold h(Td), the total"

[properties.conservation.tolerance]
reason = "the steps are rounded products or differences of a total below 2 m; their exact sum (fsum) differs from it by a few units in its last place per million steps"
abs = 1e-09

[[properties.conservation]]
name = "windows_hold_design_depths"
text = "the m steps around the peak (back to t = 0, then onward) hold h(m dt) of the curve for every m (Malitz 2009, slide 17)"

[properties.conservation.tolerance]
reason = "sums of up to a million differences of the interpolated depths against the interpolation in another form"
abs = 1e-09

