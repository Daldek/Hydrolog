low_inclusive = true

[[outputs]]
name = "annual_mean"
unit = "m3/s"
kind = "real"
symbol = "\\bar{Q}"
description = "Mean discharge of all days with a value."

[outputs.physical]
low = 0.0
low_inclusive = false

[[outputs]]
name = "parde"
unit = "-"
kind = "real_array"
symbol = "K_m"
description = "Pardé's coefficient of each month, November to October."
