[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "Qbar -> 0 divides every coefficient: the precondition positive_mean refuses a series without a positive day and a mean that underflows (test_a_tiny_or_vanishing_mean)"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type case values-nan_element and test_gaps_are_left_out_of_both_means: a NaN day is left out, never propagated"

[[traps]]
name = "many_small_terms"
description = "A sum of many small terms that loses precision."
test = "test_a_century_of_days_keeps_the_exact_means: 36,525 days of math.fsum against exact fractions"

[[oracles]]
kind = "exact"
description = "the monthly and annual means and the coefficients of the float inputs in exact rational arithmetic (fractions)"
test = "tests/unit/test_formulas_regime.py (limit exact_rational, trap many_small_terms)"
conventions = []
