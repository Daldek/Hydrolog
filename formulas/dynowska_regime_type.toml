[[traps]]
name = "class_limit"
description = "A value exactly at a limit of a published class or table."
test = "limit class_limits: 1.30, 1.80, 1.00 and 0.95 of spring, each exactly and just beyond (math.nextafter, or the next printed thousandth)"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type case parde-nan_element: a gap is refused, the twelve coefficients need values"

[[oracles]]
kind = "algorithm"
description = "the criteria applied to the printed decimals of the coefficients in exact fractions, 'nearly equal' as 20 L >= 19 S"
test = "tests/unit/test_formulas_regime.py (limit decision_table)"
conventions = ["the code compares floats with the floats of the limits, the oracle the decimals the floats print as with the rational limits"]
