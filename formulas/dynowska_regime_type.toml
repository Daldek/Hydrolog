schema = "nogat-formula-card/1"
name = "dynowska_regime_type"
title = "Dynowska's type of a Polish river regime from Pardé's coefficients"
function = "hydrolog.statistics.regime.dynowska_regime_type"
family = "classification"
formula_version = 1
status = "referenced"
equation = "S = max(K_III, K_IV), L = max(K_VI, K_VII, K_VIII); type 5 if L >= 0.95 S, else 4 if L >= 1.00, else 1 if S <= 1.30, 2 if S <= 1.80, 3 otherwise"
latex = "S = \\max(K_{III}, K_{IV}),\\ L = \\max(K_{VI}, K_{VII}, K_{VIII});\\ \\text{type} = \\begin{cases} 5 & L \\ge 0.95\\,S \\\\ 4 & L \\ge 1.00 \\\\ 1 & S \\le 1.30 \\\\ 2 & S \\le 1.80 \\\\ 3 & \\text{otherwise} \\end{cases}"
validation = "none: a typology; Wrzesiński (2017, 2018) classified 516 gauges of 1971-2010 and Perz (2019) the rivers of the Kłodzko basin by it, without a measure of agreement"
conventions = ["the coefficients are Pardé's of the months November to October, as 1.30 for 130 % of the mean annual flow", "the spring month is the larger of March and April (Perz 2019, p. 79), the summer month the largest of June to August (Hydrolog's reading); of equal coefficients the earlier month", "the types are tested in the order 5, 4, then 1 to 3: 'higher than or nearly equal' reads as at least 0.95 of the spring coefficient (Hydrolog's reading, no source gives a number); the sources' 'as a rule 130-180 %' of types 4 and 5 is not tested", "inclusive limits as the sources word them: 'at most 130 %' is type 1, 'above 180 %' type 3, so 180 % is type 2, 'at least 100 %' type 4; the limits are compared as the floats 1.3, 1.8 and 1.0, and summer with the float 0.95 times spring, which keeps every printed three-decimal tie inside its class"]
assumptions = ["the coefficients describe a long period, 30 to 40 years in the sources; the type of a few years or of coefficients near a limit is not robust: Kłodzko's June of 1971-2015 lies 0.05 % above 100 % (Perz's case)", "Wrzesiński's two classifications of the same 516 gauges of 1971-2010 count 24 (2017) and 33 (2018) pluvio-nival rivers: the reading of 'nearly equal' is not settled in the sources either"]
notices = []
reference_cases = ["tests/fixtures/formulas/regime-cases.json"]
constraints = []
tables = []

[properties]
units = "unit_specific"
scalings = []
conservation = []

[properties.monotonic]

[[properties.limits]]
name = "class_limits"
text = "a coefficient exactly at a limit of a class and just beyond it gives the class of the criteria's inclusive limit and the next one"

[[properties.limits]]
name = "decision_table"
text = "the type of three-decimal coefficients is that of the criteria applied to their printed decimals in exact fractions"

[[properties.symmetries]]
name = "months_that_do_not_decide"
text = "the coefficients of the months other than March, April and June to August leave the type as it is"

[properties.symmetries.tolerance]
reason = "a class"
abs = 0.0

