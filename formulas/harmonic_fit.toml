low_inclusive = true
high = 1.0
high_inclusive = true

[[outputs]]
name = "r_squared"
unit = "-"
kind = "real"
symbol = "R^2"
description = "The share of the variance explained by the whole fit."
boundary_tolerance = 1e-12

[outputs.physical]
low = 0.0
low_inclusive = true
high = 1.0
high_inclusive = true

[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "atan2 of a harmonic without amplitude: the precondition values_not_all_equal refuses a constant series (test_a_constant_series_is_refused); a harmonic missing from the signal keeps a finite phase in range (test_a_missing_harmonic_has_a_finite_phase)"

[[traps]]
name = "unbounded_iteration"
description = "An iteration without a bounded count (root finding, fit)."
test = "the least squares are LAPACK's divide and conquer singular value decomposition (numpy.linalg.lstsq, delegated), bounded by its own count; the precondition year_covered keeps the design well conditioned (test_a_season_of_values_is_refused)"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "a NaN day is left out of the fit: type case values-nan_element and test_gaps_are_left_out_of_the_fit"

[[traps]]
name = "many_small_terms"
description = "A sum of many small terms that loses precision."
test = "test_thirty_years_of_temperature_match_the_normal_equations: 10,958 days of Warszawa-Okęcie"

[[traps]]
name = "moment_cancellation"
description = "Cancellation in moments computed as E[x^2] - E[x]^2."
test = "the fit runs on the deviations from the mean and SST is taken from them, not as E[x^2] - E[x]^2: test_a_large_offset_keeps_the_amplitudes, a signal on top of 1e6, and the pinned example of test_properties_of_annual_cycles, a cycle of 1e-14 on 2.0"

[[oracles]]
kind = "exact"
description = "exact signals of one or two harmonics recovered: their mean, amplitudes, phase days and R2 = 1"
test = "tests/unit/test_formulas_regime.py (limit two_harmonics)"
conventions = []

[[oracles]]
kind = "algorithm"
description = "the normal equations of the same design, summed by math.fsum and solved in exact fractions"
test = "tests/unit/test_formulas_regime.py (limit normal_equations, trap many_small_terms)"
conventions = []
