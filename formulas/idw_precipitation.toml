schema = "nogat-formula-card/1"
name = "idw_precipitation"
title = "Precipitation at a point by inverse distance weighting of the gauges"
function = "hydrolog.precipitation.interpolation.idw_precipitation"
family = "statistic"
formula_version = 1
status = "referenced"
equation = "P = sum(w_i P_i), w_i = d_i**-p / sum(d_j**-p), d_i the distance of gauge i from the point; at the point of a gauge (d_i < 1e-10 m) P is the mean of the gauges there"
latex = "P = \\sum_i w_i P_i,\\quad w_i = \\frac{d_i^{-p}}{\\sum_j d_j^{-p}},\\quad d_i = \\sqrt{(x_i - x)^2 + (y_i - y)^2}"
validation = "none: the sources give the method without an error statistic; HEC-HMS uses it for real-time forecasting"
conventions = ["coordinates in metres of one projected system (EPSG:2180 in Poland); the weights depend only on ratios of distances, so any one unit gives the same estimate but for the threshold of a gauge at the point, 1e-10 of the unit", "every gauge given is used: HEC-HMS's nearest gauge per quadrant and a largest distance are choices of the caller; gauges at the point share it equally", "the weights from ln d relative to the nearest gauge, so d**-p neither overflows nor underflows to a zero sum"]
assumptions = []
notices = []
reference_cases = ["tests/fixtures/formulas/areal-precipitation-cases.json"]
constants = []
tables = []

[properties]
units = "homogeneous"

[properties.monotonic]
precipitation_mm = 1

[[properties.scalings]]
name = "depth"

[properties.scalings.inputs]
precipitation_mm = 1.0

[properties.scalings.outputs]
point_precipitation_mm = 1.0

[properties.scalings.tolerance]
reason = "doubling the depths doubles every product exactly in binary; the sums round once, but for subnormal values"
abs = 1e-300
rel = 1e-15

[[properties.scalings]]
name = "coordinates"

[properties.scalings.inputs]
station_x_m = 1.0
station_y_m = 1.0
target_x_m = 1.0
target_y_m = 1.0

[properties.scalings.outputs]

[properties.scalings.tolerance]
reason = "doubling every coordinate doubles the distances exactly; the logarithms of the doubled distances round differently"
abs = 1e-12
rel = 1e-12

[[properties.limits]]
name = "exact_decimal"
text = "the estimate equals the weights d^-p computed at 50 digits"

[[properties.limits]]
name = "at_a_gauge"
text = "at a gauge the estimate is the gauge's depth (Shepard 1968)"

[[properties.conservation]]
name = "weights_add_up"
text = "the weights sum to one"

[properties.conservation.tolerance]
reason = "each weight is a quotient rounded once; a few units in the last place of one per weight, for up to a few hundred gauges"
abs = 1e-12

[[properties.symmetries]]
name = "order"
text = "the order of the gauges does not matter"

[properties.symmetries.tolerance]
reason = "the same terms summed in another order: correctly rounded sums of products that each round once"
abs = 1e-12
rel = 1e-12

[[sources]]
citation = "Indian Institute of Technology Roorkee, NPTEL course Hydrology (105107129), module 3, lecture 4, 3.6 Estimation of missing data"
access = "open"
locator = "eq. 3.12 (the distance power method, weights 1/D^2) and Example 3.7"
url = "https://archive.nptel.ac.in/content/storage2/courses/105107129/module3/lecture4/lecture4.pdf"

[[sources]]
citation = "US Army Corps of Engineers, Hydrologic Engineering Center. HEC-HMS Technical Reference Manual: Inverse distance gage weighting"
access = "open"
locator = "the weight of a gage, 1/d^2 over the sum of 1/d^2 of the gages"
url = "https://www.hec.usace.army.mil/confluence/hmsdocs/hmstrm/meteorology/precipitation/inverse-distance-gage-weighting"

[[sources]]
citation = "Chow, V.T., Maidment, D.R. and Mays, L.W. (1988). Applied Hydrology. McGraw-Hill, New York"
access = "open"
locator = "p. 79: the reciprocal-distance-squared method (Wei and McGuinness 1973); HEC-HMS's inverse distance gage weighting and Hydrolog's default use p = 2"
url = "https://ponce.sdsu.edu/Applied_Hydrology_Chow_1988.pdf"

[[sources]]
citation = "Shepard, D. (1968). A two-dimensional interpolation function for irregularly-spaced data. Proceedings of the 1968 23rd ACM National Conference, 517-524"
access = "author-provided"

