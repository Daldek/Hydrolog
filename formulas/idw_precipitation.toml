[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "limit at_a_gauge: a distance of 0 gives the gauge's depth, not 1/0"

[[traps]]
name = "exp_overflow"
description = "exp of a scaled input at its test bound."
test = "range case power-physical_high_test_bound: p = 100 over distances of kilometres stays finite"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type cases of every array, nan_element: a gap is refused"

[[traps]]
name = "many_small_terms"
description = "A sum of many small terms that loses precision."
test = "the sums by math.fsum"

[[oracles]]
kind = "exact"
description = "the weights d^-p from square roots and logarithms at 50 digits (decimal)"
test = "tests/unit/test_formulas_areal_precipitation.py (limit exact_decimal)"
conventions = []
