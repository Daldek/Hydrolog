schema = "nogat-formula-card/1"
name = "nash_urban_regression"
title = "Nash's n and K of an urbanized watershed by the regression of Rao, Delleur and Sarma (1972)"
function = "hydrolog.runoff.nash_iuh.urban_regression_parameters"
family = "empirical"
formula_version = 1
status = "oracle only"
equation = "LAG = 1.28 * A**0.46 * (1 + U)**-1.66 * H**-0.27 * D**0.37 [h]; k = 0.56 * A**0.39 * (1 + U)**-0.62 * H**-0.11 * D**0.22 [h]; N = LAG / k"
latex = "LAG = 1.28\\,A^{0.46}(1+U)^{-1.66}H^{-0.27}D^{0.37},\\quad k = 0.56\\,A^{0.39}(1+U)^{-0.62}H^{-0.11}D^{0.22},\\quad N = \\frac{LAG}{k}"
validation = "Rao et al. (1972) fitted the relations to storms on urbanizing watersheds near Indianapolis (as KZGW and Sikorska et al. 2012 report them, without error statistics); KZGW (2017, p. 107) recommends them only where the parameters cannot be fitted to measured rainfall and runoff"
conventions = ["A in km2, H in mm, D in h, U dimensionless; LAG and k in h, K returned in min by the exact 60 min/h: the constants 1.28 and 0.56 hold for these units only (KZGW 2017, p. 107)", "U is the fraction of impervious area (KZGW 2017, p. 107; Sikorska et al. 2012, Table 1), not the share of built-up land", "a product of powers of A, H and D: the scalings state it, and the constants carry the units (the property is not dimensional homogeneity)", "H and D are those of the storm: the parameters change with every storm"]
assumptions = ["urbanized watersheds of up to 52 km2 whose parameters cannot be fitted to measured rainfall and runoff (KZGW 2017, p. 107)"]
notices = ["outside_applicability"]
reference_cases = []
constraints = []
tables = []

[properties]
units = "homogeneous"
conservation = []
symmetries = []

[properties.monotonic]
area_km2 = 1
effective_precip_mm = -1
duration_h = 1
urban_fraction = -1

[[properties.scalings]]
name = "area"

[properties.scalings.inputs]
area_km2 = 1.0

[properties.scalings.outputs]
lag_time_h = 0.46
k_min = 0.39
n = 0.07

[properties.scalings.tolerance]
reason = "a product of powers: doubling A multiplies LAG by 2^0.46 and k by 2^0.39 but for a few units in the last place of the powers"
rel = 1e-14

[[properties.scalings]]
name = "rainfall"

[properties.scalings.inputs]
effective_precip_mm = 1.0
duration_h = 1.0

[properties.scalings.outputs]
lag_time_h = 0.1
k_min = 0.11
n = -0.01

[properties.scalings.tolerance]
reason = "doubling H and D multiplies LAG by 2^(0.37 - 0.27) and k by 2^(0.22 - 0.11) but for a few units in the last place"
rel = 1e-14

[[properties.limits]]
name = "decimal_equations"
text = "LAG, k and N equal eqs. 6.26-6.28 evaluated in decimal arithmetic at 50 digits"

[[sources]]
citation = "KZGW (2017). Aktualizacja metodyki obliczania przepływów i opadów maksymalnych o określonym prawdopodobieństwie przewyższenia dla zlewni kontrolowanych i niekontrolowanych, załącznik 2 do OPZ (wersja ujednolicona)"
access = "open"
locator = "eqs. 6.26-6.28, p. 107 (U the fraction of impervious area, dimensionless); the same in Sikorska et al. 2012"
url = "https://kzgw.gov.pl/files/zam-pub/20170402-przeglad-i-aktualizacja-map/zal-2-do-OPZ-ujednolicony-1.pdf"

[[sources]]
citation = "Sikorska, A.E., Scheidegger, A., Banasik, K., Rieckermann, J. (2012). Bayesian uncertainty assessment of flood predictions in ungauged urban basins for conceptual rainfall-runoff models. Hydrology and Earth System Sciences 16, 1221-1236"
access = "open"
locator = "Table 1, p. 1226: the same equations, U the fraction of the impervious area, Lag and k in h"
url = "https://hess.copernicus.org/articles/16/1221/2012/hess-16-1221-2012.pdf"

[[sources]]
citation = "Rao, A.R., Delleur, J.W. and Sarma, B.S.P. (1972). Conceptual hydrologic models for urbanizing basins. Journal of the Hydraulics Division, ASCE 98(HY7), 1205-1220"
access = "author-provided"

