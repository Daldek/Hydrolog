schema = "nogat-formula-card/1"
name = "equal_area_slope"
title = "Equal-area slope of a longitudinal profile (the line through the outlet with equal areas above and below it)"
function = "hydrolog.morphometry.profile.equal_area_slope"
family = "index"
formula_version = 1
status = "oracle only"
equation = "S = 2 A / L**2 with A = sum((x[i+1] - x[i]) * (h[i] + h[i+1]) / 2), h = z - z[0], L = x[-1] - x[0] [m/m]"
latex = "S = \\frac{2A}{L^2},\\quad A = \\sum_{i} \\frac{(x_{i+1} - x_i)\\,(h_i + h_{i+1})}{2},\\quad h_i = z_i - z_0,\\quad L = x_n - x_0"
validation = "none: the equal-area slope defines the mean slope of a profile (TM61, appendix A; KZGW 2017, p. 97); its sources compare it with no observations, and TM61 (p. 12) notes that in practice it gives results largely independent of the user"
conventions = ["the profile is ordered from the outlet upstream: x the distance along the flow path in m from any origin, as only differences count, z the elevation in m; L is the last distance minus the first", "the line passes through the first point, the outlet, at its elevation: TM61 draws it through the outlet A, KZGW (2017, p. 97) from the lowest point of the profile, which the outlet of a flow path on a filled DEM is; a stretch below the outlet counts as area below the line, so A is the signed area of z - z[0]", "A by the trapezoid rule, the profile straight between its points (Barbosa Jr., eq. 17); the triangle under the line, L (S L) / 2, equals A, so the areas of the profile above and below the line are equal (TM61, Sa = 2Ad/L^2)", "S in m/m, not in percent or per mille", "Lutz's Jg (KZGW 2017, p. 97) is this slope of the longitudinal profile of the main stream from the divide to the outlet, the longest flow path (WatershedParameters.flow_path_equal_area_slope_m_per_m); the slope between the ends of that path (flow_path_slope_m_per_m), Kirpich's S, is larger on a concave profile and no substitute for it"]
assumptions = ["the points are those of one flow path where the elevation is known: the cells of a D8 path on a filled DEM or surveyed points; a run of points of equal elevation may be thinned to its ends without changing A", "a profile from a filled DEM has no point below its outlet; a surveyed bed may have pools below it, which reduce A"]
notices = []
reference_cases = []
constants = []
tables = []

[properties]
units = "homogeneous"
conservation = []
symmetries = []

[properties.monotonic]

[[properties.scalings]]
name = "both_axes"

[properties.scalings.inputs]
distance_m = 1.0
elevation_m = 1.0

[properties.scalings.outputs]

[properties.scalings.tolerance]
reason = "the profile is divided by powers of two before it is summed, so a power of two scales the slope exactly, except a slope below the smallest normal float, 2.2e-308, which rounds to fewer digits"
abs = 2.2250738585072014e-308

[[properties.scalings]]
name = "elevation"

[properties.scalings.inputs]
elevation_m = 1.0

[properties.scalings.outputs]
slope_m_per_m = 1.0

[properties.scalings.tolerance]
reason = "the profile is divided by powers of two before it is summed, so a power of two scales the slope exactly, except a slope below the smallest normal float, 2.2e-308, which rounds to fewer digits"
abs = 2.2250738585072014e-308

[[properties.scalings]]
name = "distance"

[properties.scalings.inputs]
distance_m = 1.0

[properties.scalings.outputs]
slope_m_per_m = -1.0

[properties.scalings.tolerance]
reason = "the profile is divided by powers of two before it is summed, so a power of two scales the slope exactly, except a slope below the smallest normal float, 2.2e-308, which rounds to fewer digits"
abs = 2.2250738585072014e-308

[[properties.limits]]
name = "straight_profile"
text = "a straight profile gives its own slope"

[[properties.limits]]
name = "two_points"
text = "a profile of two points gives the drop over the length"

[[properties.limits]]
name = "exact_rational"
text = "S equals 2A/L^2 of the float inputs in exact rational arithmetic"

[[properties.limits]]
name = "equal_areas"
text = "the line through the outlet at slope S leaves equal areas of the profile above and below it, found by bisection"

[[sources]]
citation = "KZGW (2017). Aktualizacja metodyki obliczania przepływów i opadów maksymalnych o określonym prawdopodobieństwie przewyższenia dla zlewni kontrolowanych i niekontrolowanych, załącznik 2 do OPZ (wersja ujednolicona)"
access = "open"
locator = "p. 97, the legend of eq. 6.17: Jg, the averaged slope of the main stream, is the slope of the line from the lowest point of the longitudinal profile for which the areas between it and the profile, below and above it, are equal"
url = "https://kzgw.gov.pl/files/zam-pub/20170402-przeglad-i-aktualizacja-map/zal-2-do-OPZ-ujednolicony-1.pdf"

[[sources]]
citation = "Ministry of Works and Development, Water and Soil Division (1980). A method for estimating design peak discharge, Technical Memorandum No. 61, Wellington"
access = "open"
locator = "appendix A, pp. 12-13: the equal-area method, line AC through the outlet A with equal areas X and Y; the area under the profile Ad equals the triangle ABC, so Sa = 2Ad/L^2"
url = "https://web.archive.org/web/20170228021947/http://docs.niwa.co.nz/library/public/TM61_1980.pdf"

[[sources]]
citation = "Barbosa Jr., A.R. (2004). Hidrologia Aplicada CIV 226, Bacia Hidrográfica, Universidade Federal de Ouro Preto, lecture notes"
access = "open"
locator = "section 3.4.4, eqs. 17-18, p. 14: the area under the profile Ap as a sum of trapezoids and S2 = 2Ap/L^2 - 2z_foz/L"
url = "https://professor.pucgoias.edu.br/SiteDocente/admin/arquivosUpload/17403/material/Cap2%20-%20Bacia%20Hidrografica_UFOP.pdf"

[[variables]]
name = "distance_m"
symbol = "x"
unit = "m"
kind = "real_array"
description = "Distance along the profile from the outlet (the first point) upstream to each point; any origin, as only differences count."
applicability = "unstated"
gaps_allowed = false
dims = 1
min_length = 2

[variables.physical]
low = 0.0
low_inclusive = true
test_high = 1000000.0
test_reason = "1,000 km, about the length of the Vistula, the longest river of Poland: no flow path of a Polish watershed is longer"

[variables.typical]
low = 0.0
low_inclusive = true
high = 30000.0
high_inclusive = true

[variables.typical.source]
citation = "Hydrograf's watersheds handed to Hydrolog (Hydrograf 0.5.0.dev0, November 2026): the hand-offs recorded in Hydrolog's tests and the guide's Kamiennik to Świerzawa (37.22 km2)"
access = "open"
locator = "tests/fixtures/handoff_hydrograf*.json and tests/fixtures/kamiennik.json: flow paths of 0.0566 to 28.88 km"

[[variables]]
name = "elevation_m"
symbol = "z"
unit = "m"
kind = "real_array"
description = "Elevation of each point of the profile, the bed or the filled DEM along the flow path; the first is the outlet's."
applicability = "unstated"
gaps_allowed = false
dims = 1
min_length = 2

[variables.physical]
test_low = -431.0
test_high = 8849.0
test_reason = "the lowest and the highest land on Earth: the shore of the Dead Sea at -431 m and Mount Everest at 8,849 m (CIA, The World Factbook, 2025, field Elevation of Jordan and Nepal)"

[variables.typical]
low = 100.0
low_inclusive = true
high = 750.0
high_inclusive = true

[variables.typical.source]
citation = "Hydrograf's watersheds handed to Hydrolog (Hydrograf 0.5.0.dev0, November 2026): the hand-offs recorded in Hydrolog's tests and the guide's Kamiennik to Świerzawa (37.22 km2)"
access = "open"
locator = "tests/fixtures/handoff_hydrograf*.json and tests/fixtures/kamiennik.json: elevations of 100.0 to 722.68 m"

[[constraints]]
name = "same_length"
class = "physical"
text = "one elevation per distance"

[constraints.source]
citation = "Barbosa Jr., A.R. (2004). Hidrologia Aplicada CIV 226, Bacia Hidrográfica, Universidade Federal de Ouro Preto, lecture notes"
access = "open"
locator = "section 3.4.4, eqs. 17-18, p. 14: the area under the profile Ap as a sum of trapezoids and S2 = 2Ap/L^2 - 2z_foz/L"
url = "https://professor.pucgoias.edu.br/SiteDocente/admin/arquivosUpload/17403/material/Cap2%20-%20Bacia%20Hidrografica_UFOP.pdf"

[[constraints]]
name = "distance_not_decreasing"
class = "physical"
text = "x[i+1] >= x[i]: the profile runs from the outlet upstream; a repeated distance is a vertical step"

[constraints.source]
citation = "Barbosa Jr., A.R. (2004). Hidrologia Aplicada CIV 226, Bacia Hidrográfica, Universidade Federal de Ouro Preto, lecture notes"
access = "open"
locator = "section 3.4.4, eqs. 17-18, p. 14: the area under the profile Ap as a sum of trapezoids and S2 = 2Ap/L^2 - 2z_foz/L"
url = "https://professor.pucgoias.edu.br/SiteDocente/admin/arquivosUpload/17403/material/Cap2%20-%20Bacia%20Hidrografica_UFOP.pdf"

[[constraints]]
name = "positive_area"
class = "precondition"
text = "0 < 2 A / L**2 < inf: the profile lies above its outlet on the whole (A > 0) over a length L > 0, and float64 holds both"

[constraints.source]
citation = "Ministry of Works and Development, Water and Soil Division (1980). A method for estimating design peak discharge, Technical Memorandum No. 61, Wellington"
access = "open"
locator = "appendix A, pp. 12-13: the equal-area method, line AC through the outlet A with equal areas X and Y; the area under the profile Ad equals the triangle ABC, so Sa = 2Ad/L^2"
url = "https://web.archive.org/web/20170228021947/http://docs.niwa.co.nz/library/public/TM61_1980.pdf"

[[outputs]]
name = "slope_m_per_m"
unit = "m/m"
kind = "real"
symbol = "S"
description = "Slope of the line through the outlet that leaves equal areas of the profile above and below it."

[outputs.physical]
low = 0.0
low_inclusive = false

[[traps]]
name = "difference_denominator"
description = "A denominator that is a difference of inputs."
test = "L = x[-1] - x[0]: a profile of equal distances has L = 0 and is refused by the precondition positive_area (test_a_profile_without_length_is_refused)"

[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "S grows as 1/L^2: a profile of 1 mm is finite, one whose L^2 underflows is refused by the precondition positive_area (test_a_tiny_profile_is_finite_or_refused)"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type cases distance_m-nan_element and elevation_m-nan_element: a gap is refused, the spec allows none"

[[traps]]
name = "many_small_terms"
description = "A sum of many small terms that loses precision."
test = "test_a_profile_of_many_points_matches_its_exact_sum: 100,001 points against the exact rational sum"

[[oracles]]
kind = "exact"
description = "2A/L^2 of the float inputs in exact rational arithmetic (fractions), rounded once"
test = "tests/unit/test_formulas_equal_area_slope.py (limit exact_rational, the Kamiennik profile, trap many_small_terms)"
conventions = []

[[oracles]]
kind = "algorithm"
description = "the sources' construction: the line through the outlet whose slope bisection moves until the profile's areas above and below it, summed apart over the segments cut where they cross it, are equal"
test = "tests/unit/test_formulas_equal_area_slope.py (limit equal_areas, the Kamiennik profile)"
conventions = []
