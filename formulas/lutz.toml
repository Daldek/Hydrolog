[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "range cases slope_m_per_m-physical_low_*: tp grows without bound as Jg tends to 0 (Jg^-0.39), and as tp tends to 0 the target tp up = 0.66 tp^-0.04 grows; beyond the bracket of N the precondition root_in_bracket refuses, as for the smallest positive Jg, whose Jg^1.5 underflows"

[[traps]]
name = "exp_overflow"
description = "exp of a scaled input at its test bound."
test = "range cases urban_pct-physical_high and forest_pct-physical_high: exp(-0.016 U) and exp(0.004 W) at 100 % are 0.2019 and 1.4918"

[[oracles]]
kind = "exact"
description = "tp and up of eqs. 6.17-6.19 with the decimal constants, evaluated with the decimal module at 50 digits"
test = "tests/unit/test_formulas_lutz.py (limit decimal_steps)"
conventions = []

[[oracles]]
kind = "established"
description = "scipy.stats.gamma (SciPy 1.18.1): the density of shape N and scale K, Nash's IUH, at its mode (N - 1) K"
test = "tests/unit/test_formulas_lutz.py (limit cascade_peak)"
conventions = ["scale K in h, the density in 1/h; its mode (N - 1) K is tp and its value there up, by eqs. 6.14 and 6.16 of KZGW (2017, p. 96)"]
