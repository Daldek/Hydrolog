[[outputs]]
name = "tc_min"
unit = "min"
kind = "real"
symbol = "t_c"
description = "Time of concentration."

[outputs.physical]
low = 0.0
low_inclusive = false

[[traps]]
name = "difference_denominator"
description = "A denominator that is a difference of inputs."
test = "constraint flow_path_longer_than_overland: the channel segment L_fp - L_ov vanishes at the boundary point, which is refused, so Kirpich never takes a length of 0"

[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "range cases *_slope_m_per_m-physical_low_*: the offset keeps both parts finite as a slope tends to 0"

[[oracles]]
kind = "exact"
description = "the two SI forms with unrounded constants and the offset per segment, evaluated with the decimal module at 50 digits"
test = "tests/unit/test_formulas_tc.py (limit decimal)"
conventions = []
