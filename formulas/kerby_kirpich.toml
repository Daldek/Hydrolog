schema = "nogat-formula-card/1"
name = "kerby_kirpich"
title = "Time of concentration by the Kerby-Kirpich method (Roussel et al. 2005)"
function = "hydrolog.time.concentration.ConcentrationTime.kerby_kirpich"
family = "empirical"
formula_version = 1
status = "referenced"
equation = "tc = kerby(L_ov, S_ov, N) + kirpich(L_fp - L_ov, S_fp) [min], each slope below 0.002 taken as S + 0.0005"
latex = "t_c = \\left(\\frac{0.67\\,N\\,L_{ov}}{\\sqrt{S_{ov}}}\\right)^{0.467} + 0.0078\\,(L_{fp} - L_{ov})^{0.77}\\,S_{fp}^{-0.385},\\quad L\\ \\mathrm{[ft]}"
validation = "Roussel et al. (2005, supplement, p. 29) find the Kerby-Kirpich estimates 'consistent with watershed time values independently derived from real-world storms and runoff hydrographs' of their 92 Texas watersheds"
conventions = ["tc = t_overland + t_channel: kerby on the overland segment, kirpich on the channel segment, the flow path minus the overland segment, at the slope of the whole path from the divide to the outlet (Roussel et al. 2005, supplement, pp. 29-30), in the units and with the constants of those specs", "a deviation from Cleveland et al. (2012, pp. 1-2): the low-slope offset (S + 0.0005 below 0.002) is decided for each segment by its own slope, the overland slope for Kerby and the flow path slope for Kirpich, while Cleveland et al. decide it by the main-channel slope for both segments (below 0.002 both offset, above 0.003 neither) and leave 0.002-0.003 to the engineer ('if flow direction ambiguity is present, treat as low slope'); the two agree when both slopes lie on the same side of 0.002 and differ for a flat main channel under a steeper overland segment (Cleveland et al. offset it too), for a steep main channel under a flat overland segment (Hydrolog offsets it) and in the transitional band (Hydrolog never offsets the channel there)", "at a flow path slope of 0.002 the channel part rises by 8.97 %, at an overland slope of 0.002 the overland part by 5.35 %, as the offset is dropped: tc is not monotonic in either slope"]
assumptions = ["the 92 Texas watersheds of Roussel et al. (2005): 0.25-150 square miles (0.65-388 km2, checked by WatershedParameters.calculate_tc), main channels of 1-50 miles at 0.002-0.02; 'no watersheds with low topographic slopes are available in the underlying database' (supplement, p. 29)", "the overland segment up to 1,200 ft, Kerby's upper limit (supplement, p. 29); the method states no range of the overland slope, and its own example takes 2 %"]
notices = ["outside_applicability"]
reference_cases = ["tests/fixtures/formulas/tc-cases.json"]
tables = []

[properties]
units = "unit_specific"
scalings = []
conservation = []
symmetries = []

[properties.monotonic]
retardance = 1
flow_path_length_km = 1

[[properties.limits]]
name = "decimal"
text = "tc equals Kerby on the overland segment plus Kirpich on the rest of the flow path, each with its own offset, evaluated in decimal arithmetic at 50 digits"

[[properties.limits]]
name = "low_slope_step"
text = "the channel part rises by 1.25^0.385 - 1 = 8.97 % as the flow path slope reaches 0.002 and the offset is dropped"

[[sources]]
citation = "Roussel, M.C., Thompson, D.B., Fang, X., Cleveland, T.G. and Garcia, C.A. (2005). Time-parameter estimation for applicable Texas watersheds. TxDOT Research Report 0-4696-2, Lamar University"
access = "open"
locator = "supplement 'Guidance for estimation of time of concentration in Texas', pp. 29-30, and its example"
url = "https://rosap.ntl.bts.gov/view/dot/88540/dot_88540_DS1.pdf"

[[sources]]
citation = "Texas Department of Transportation (2019). Hydraulic Design Manual, chapter 4, section 11: Time of Concentration"
access = "open"
locator = "eqs. 4-13 to 4-15"
url = "https://www.txdot.gov/manuals/des/hyd/chapter-4--hydrology/section-11--time-of-concentration.html"

[[sources]]
citation = "Cleveland, T.G., Thompson, D.B., Fang, X. and Li, M.-H. (2012). Guidance for estimation of time of concentration in Texas for low-slope conditions. TxDOT Product 0-6382-P1, Texas Tech University"
access = "open"
locator = "low slope procedures, eqs. 1-3, pp. 1-3, and its example"
url = "https://rosap.ntl.bts.gov/view/dot/66537/dot_66537_DS1.pdf"

