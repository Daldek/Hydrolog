text = "n >= 2.2e-308, 0 < dt / K, and the grid of N dt / K, the largest discharge over dt / K and the storage n K max(I, O0) are finite in float64"

[constraints.source]
citation = "IEEE 754 binary64, the float64 of NumPy: largest finite number 1.8e308, smallest normal 2.2e-308; SciPy's scipy.special.gammainc and gammaincc (1.18.1) give P(a, x) = 0 and Q(a, x) <= 0 for a subnormal shape a"
access = "open"
locator = "x = m dt / K on the grid of the ordinates, the inflow over dt / K, the storage n K I, and n as the shape of P and Q"

