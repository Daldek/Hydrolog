schema = "nogat-formula-card/1"
name = "linear_reservoir_cascade"
title = "Cascade of n equal linear reservoirs, exact for an inflow linear between the ordinates (Nash)"
function = "hydrolog.routing.formulas.cascade.cascade_route"
family = "scheme"
formula_version = 1
status = "oracle only"
equation = "O(t) = O0 Q(n, t/K) + integral from 0 to t of u(t - s) I(s) ds, u(t) = (t/K)^(n-1) exp(-t/K) / (K Gamma(n)), I linear between the ordinates; at the ordinates O[j] = O0 (1 - P(n, x_j)) + I[0] (P(n, x_j) - (1 - (V(x_j) - V(x_(j-1))) / a)) + sum_(m < j) h_m I[j-m], x_j = j a, a = dt / K, V(x) = x Q(n, x) + n P(n+1, x), h_0 = 1 - V(a) / a, h_m = -(V((m+1)a) - 2 V(m a) + V((m-1)a)) / a; storage at the end K [sum over the segments of the water not yet released + O0 (n - V(x_N))] [m3]"
latex = "O(t) = O_0\\,Q\\!\\left(n, \\tfrac{t}{K}\\right) + \\int_0^t u(t-s)\\,I(s)\\,ds,\\quad u(t) = \\frac{1}{K\\,\\Gamma(n)}\\left(\\frac{t}{K}\\right)^{n-1}e^{-t/K},\\quad h_m = -\\frac{V((m+1)a) - 2V(ma) + V((m-1)a)}{a},\\ V(x) = x\\,Q(n, x) + n\\,P(n+1, x),\\ a = \\frac{\\Delta t}{K}"
validation = "none: n and K are calibrated on observed floods or follow from the reach (Kalinin-Milyukov); the sources report no agreement of the cascade itself with observations"
conventions = ["SI units: discharge in m3/s, time in min, storage in m3 (K in min times a discharge in m3/s times the 60 s of a minute of the units table)", "the inflow is linear between the ordinates and equal to the initial outflow before the first one: every reservoir starts at rest with O0, and the inflow jumps to I[0] at the first ordinate", "the outflow at an ordinate is the exact response to that inflow, not a trapezoid or Euler step; between the ordinates it is not linear, so the trapezoid volume of the outflow differs from its integral", "a weight that rounding puts below zero is set to zero, and so are a remainder n - V and an outflow that rounding puts below zero", "n need not be whole: Gamma(n) and P(n, x) of SciPy's gammainc and gammaincc", "only the given ordinates are routed: CascadeReach takes K or K = L / (n c) from the length and the celerity of a reach, and extends the time axis (Tier B, ADR-0008)"]
assumptions = ["each reservoir is linear, S = K O, with K constant over the flood", "no backwater: the outflow does not depend on the water downstream"]
notices = []
reference_cases = []
constants = []
tables = []

[properties]
units = "homogeneous"
symmetries = []

[properties.monotonic]
inflow_m3s = 1
initial_outflow_m3s = 1

[[properties.scalings]]
name = "discharge"

[properties.scalings.inputs]
inflow_m3s = 1.0
initial_outflow_m3s = 1.0

[properties.scalings.outputs]
outflow_m3s = 1.0
storage_start_m3 = 1.0
storage_end_m3 = 1.0
storage_steady_m3 = 1.0

[properties.scalings.tolerance]
reason = "a power of two scales every product, sum and convolution of the kernel exactly in binary, but for subnormal discharges, which round to fewer digits"
abs = 1e-300
rel = 0.0

[[properties.scalings]]
name = "time"

[properties.scalings.inputs]
timestep_min = 1.0
k_min = 1.0

[properties.scalings.outputs]
storage_start_m3 = 1.0
storage_end_m3 = 1.0
storage_steady_m3 = 1.0

[properties.scalings.tolerance]
reason = "a power of two scales every product, sum and convolution of the kernel exactly in binary, but for subnormal discharges, which round to fewer digits"
abs = 1e-300
rel = 0.0

[[properties.limits]]
name = "steady_state"
text = "an inflow equal to the initial outflow passes unchanged: the weights add up to one"

[[properties.limits]]
name = "step_response"
text = "a steady inflow into a cascade at rest at another outflow gives O0 + (I - O0) P(n, t / K), the gamma distribution function"

[properties.limits.source]
citation = "Ponce, V.M. (online). Linear reservoirs and numerical diffusion, San Diego State University"
access = "open"
locator = "the Nash cascade and the Kalinin-Milyukov method: n reservoirs of S = K O in series, impulse response of mean n K"
url = "https://ponce.sdsu.edu/linear_reservoirs_and_numerical_diffusion.html"

[[properties.limits]]
name = "matrix_exponential"
text = "for whole n the outflow and the storage equal the exact solution of the linear ODEs of the chain of reservoirs"

[[properties.limits]]
name = "moments"
text = "the response to a unit hat has the mass one and the mean delay n K exactly, and the variance n K^2 + dt^2 / 6"

[[properties.limits]]
name = "bounded_by_its_inputs"
text = "every outflow lies between the least and the largest of the inflow and the initial outflow"

[[properties.conservation]]
name = "volume"
text = "inflow volume - outflow volume - (storage at the end - storage at the start) lies within the error of the trapezoid rule on the outflow, (|I[0] - O0| / 2 + max |I[t] - I[t-1]| / 4) dt"

[properties.conservation.tolerance]
reason = "relative to the largest volume or storage: the storage follows from continuity of the exact solution, so only the trapezoid's error on the outflow, bounded by the law, separates the volumes; the second differences of V divided by dt / K lose digits like 1e-16 (K / dt)^2 for a short step"
abs = 1e-09

[[sources]]
citation = "Nash, J.E. (1957). The form of the instantaneous unit hydrograph, IAHS Publication 45, 114-121"
access = "author-provided"
locator = "the cascade of n equal linear reservoirs and its gamma impulse response"

[[sources]]
citation = "Ponce, V.M. (online). Linear reservoirs and numerical diffusion, San Diego State University"
access = "open"
locator = "the Nash cascade and the Kalinin-Milyukov method: n reservoirs of S = K O in series, impulse response of mean n K"
url = "https://ponce.sdsu.edu/linear_reservoirs_and_numerical_diffusion.html"

