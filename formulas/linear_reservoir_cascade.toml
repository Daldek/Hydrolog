[[traps]]
name = "difference_denominator"
description = "A denominator that is a difference of inputs."
test = "the weights divide second differences of V by dt / K, which underflows for a step far shorter than K: precondition representable refuses dt / K = 0, an inflow over it that overflows and a subnormal n, for which SciPy's P and Q fail (test_a_step_ratio_beyond_float64_is_refused, test_a_subnormal_number_of_reservoirs_is_refused)"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type cases inflow_m3s-nan_element and inflow_m3s-inf_element: a gap is refused, the convolution would carry it to every later ordinate"

[[traps]]
name = "many_small_terms"
description = "A sum of many small terms that loses precision."
test = "test_a_long_steady_inflow_stays_steady: 200,000 ordinates of a steady inflow, convolved by the FFT, stay steady to 1e-12"

[[oracles]]
kind = "established"
description = "the step response P(n, t / K) of SciPy's scipy.special.gammainc (regularised lower incomplete gamma function)"
test = "tests/unit/test_formulas_cascade.py (limit step_response)"
conventions = ["SciPy: gammainc(a, x) = P(a, x), shape first; the cascade: P(n, t / K) for an inflow that steps at the first ordinate"]

[[oracles]]
kind = "algorithm"
description = "for whole n, the linear ODEs of the chain solved over each step by the matrix exponential (scipy.linalg.expm), exact for an inflow linear over the step"
test = "tests/unit/test_formulas_cascade.py (limit matrix_exponential)"
conventions = []

[[oracles]]
kind = "exact"
description = "the moments of the impulse response, mean n K and variance n K^2, of the gamma density"
test = "tests/unit/test_formulas_cascade.py (limit moments)"
conventions = []
