[[traps]]
name = "difference_denominator"
description = "A denominator that is a difference of inputs."
test = "the fraction (Y - W[r]) / (W[r+1] - W[r]) of a segment of the working curve: rows whose working curve is equal in float64 are refused by the precondition working_curve_rises (test_rows_the_working_curve_cannot_tell_apart_are_refused); K = dS/dO of the step rule is taken only where the outflow rises"

[[traps]]
name = "stability_bound"
description = "The stability bound of a numerical scheme (a Courant number, Muskingum's 2KX <= dt <= 2K(1-X))."
test = "dt <= 2 min(dS/dO) / N on the segments the run reaches: precondition timestep_within_limit with its satisfied, boundary and violated points, limit bounded_by_its_flows (a kinked table on the step of its steep segment) and test_a_step_that_the_rule_for_the_whole_curve_allows_is_refused"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type cases inflow_m3s-nan_element, table_storage_m3-nan_element and table_outflow_m3s-nan_element: a gap is refused, the recurrence would carry it to every later ordinate"

[[traps]]
name = "many_small_terms"
description = "A sum of many small terms that loses precision."
test = "test_a_long_steady_inflow_stays_steady: 200,000 ordinates of a steady inflow stay steady to 1e-12"

[[oracles]]
kind = "exact"
description = "the recurrence of the pools and their state at rest in exact rational arithmetic (fractions), ordinate by ordinate"
test = "tests/unit/test_formulas_level_pool.py (limit exact_recurrence)"
conventions = []

[[oracles]]
kind = "algorithm"
description = "a table S = K O is the linear reservoir: the spec muskingum with X = 0 and the same K, N and step, its three-point recurrence (scipy.signal.lfilter)"
test = "tests/unit/test_formulas_level_pool.py (limit muskingum_without_weight)"
conventions = []

[[oracles]]
kind = "established"
description = "scipy.integrate.solve_ivp (RK45, rtol 1e-11) of dS/dt = I(t) - O(S) through a weir's table: the scheme's error falls as the step squared"
test = "tests/unit/test_formulas_level_pool.py::test_the_scheme_converges_to_the_integrated_equation"
conventions = ["both sides read O(S) from the same table, linear between its rows, and take the inflow linear between its ordinates", "the scheme is the trapezoid rule on the step; solve_ivp an adaptive Runge-Kutta method of order 5(4) in continuous time"]
