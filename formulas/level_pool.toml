[[constraints]]
name = "table_not_decreasing"
class = "physical"
text = "S[i] <= S[i+1] and O[i] <= O[i+1]: storage and outflow rise together with the water level"

[constraints.source]
citation = "USDA-NRCS (2014). National Engineering Handbook, Part 630 Hydrology, Chapter 17: Flood Routing (210-VI-NEH, Amendment 69, April 2014)"
access = "open"
locator = "tables 17-4 and 17-9 to 17-11: storage and discharge accumulated with the elevation, both rising with it"
url = "https://directives.nrcs.usda.gov/sites/default/files2/1712930634/Part%20630%20-%20Hydrology.pdf"

[[constraints]]
name = "table_rows_distinct"
class = "physical"
text = "no row repeats the one before it: the working curve rises from row to row"

[constraints.source]
citation = "USDA-NRCS (2014). National Engineering Handbook, Part 630 Hydrology, Chapter 17: Flood Routing (210-VI-NEH, Amendment 69, April 2014)"
access = "open"
locator = "eqs. 17-1 to 17-3, pp. 17-9 to 17-10 (a working curve of O2 against S2/dt + O2/2 is necessary); examples 17-1 and 17-2, tables 17-5 to 17-12, pp. 17-11 to 17-25"
url = "https://directives.nrcs.usda.gov/sites/default/files2/1712930634/Part%20630%20-%20Hydrology.pdf"

[[constraints]]
name = "initial_outflow_in_table"
class = "precondition"
text = "O[0] <= O0 <= O[-1]: the pools start at rest at a state of the table"

[constraints.source]
citation = "US Army Corps of Engineers, Hydrologic Engineering Center. HEC-HMS Technical Reference Manual, Channel Flow: Modified Puls Model"
access = "open"
locator = "Required Parameters: the storage vs. discharge relationship is a paired data object whose storages cover the entire range met in a simulation; the initial storage is computed from the initial outflow and that relationship"
url = "https://www.hec.usace.army.mil/confluence/hmsdocs/hmstrm/channel-flow/modified-puls-model"

[[constraints]]
name = "storage_where_outflow_rises"
class = "precondition"
text = "dS > 0 on every segment where the outflow rises, from the state at rest under the lowest flow of the run to the first row that reaches its largest: no step meets the step rule on a segment without storage"

[constraints.source]
citation = "USDA-NRCS (2014). National Engineering Handbook, Part 630 Hydrology, Chapter 17: Flood Routing (210-VI-NEH, Amendment 69, April 2014)"
access = "open"
locator = "pp. 17-10 to 17-11: negative outflows whenever dt > 2 S2/O2 (O2/2 > S2/dt); a working curve with any part left of the line of equal values is discarded and computed again with a smaller dt, as WinTR-20 does internally"
url = "https://directives.nrcs.usda.gov/sites/default/files2/1712930634/Part%20630%20-%20Hydrology.pdf"

[[constraints]]
name = "timestep_within_limit"
class = "precondition"
text = "dt <= 2 min(dS/dO) / N over the segments the run can reach (from the state at rest under its lowest flow to the first row that reaches its largest), to 1e-9 of itself: the weight (2K - dt) / (2K + dt) of the previous state is not negative on any of them, so the outflow stays between the lowest and the highest flow of the run"

[constraints.source]
citation = "Hydrolog ADR-0008: routing conventions"
access = "open"
locator = "docs/decisions/0008-routing-conventions.md, Stability: a level-pool step of at most twice the shortest dS/dO of the segments between the lowest and the highest flow of the run, over the number of sub-reaches; NEH's rule for the whole curve let the outflow exceed the inflow peak on 201 of 1,499 random tables"

[[constraints]]
name = "working_curve_rises"
class = "precondition"
text = "S / (N dt) + O / 2 is finite and rises from row to row in float64: the outflow is read from it"

[constraints.source]
citation = "USDA-NRCS (2014). National Engineering Handbook, Part 630 Hydrology, Chapter 17: Flood Routing (210-VI-NEH, Amendment 69, April 2014)"
access = "open"
locator = "eqs. 17-1 to 17-3, pp. 17-9 to 17-10 (a working curve of O2 against S2/dt + O2/2 is necessary); examples 17-1 and 17-2, tables 17-5 to 17-12, pp. 17-11 to 17-25"
url = "https://directives.nrcs.usda.gov/sites/default/files2/1712930634/Part%20630%20-%20Hydrology.pdf"

[[constraints]]
name = "flood_below_table_top"
class = "precondition"
text = "no pool fills beyond the last row (its working curve above the last row's by more than 1e-9 of it): the table covers the flood, never an extrapolation"

[constraints.source]
citation = "US Army Corps of Engineers, Hydrologic Engineering Center. HEC-HMS Technical Reference Manual, Channel Flow: Modified Puls Model"
access = "open"
locator = "Required Parameters: the storage vs. discharge relationship is a paired data object whose storages cover the entire range met in a simulation; the initial storage is computed from the initial outflow and that relationship"
url = "https://www.hec.usace.army.mil/confluence/hmsdocs/hmstrm/channel-flow/modified-puls-model"

[[constraints]]
name = "flood_above_table_bottom"
class = "precondition"
text = "no pool empties below the first row (its working curve below the first row's by more than 1e-9 of the last row's): an inflow below the first outflow of the table must not drain it"

[constraints.source]
citation = "US Army Corps of Engineers, Hydrologic Engineering Center. HEC-HMS Technical Reference Manual, Channel Flow: Modified Puls Model"
access = "open"
locator = "Required Parameters: the storage vs. discharge relationship is a paired data object whose storages cover the entire range met in a simulation; the initial storage is computed from the initial outflow and that relationship"
url = "https://www.hec.usace.army.mil/confluence/hmsdocs/hmstrm/channel-flow/modified-puls-model"

