schema = "nogat-formula-card/1"
name = "level_pool"
title = "Level-pool routing by storage indication (modified Puls) through N equal pools"
function = "hydrolog.routing.formulas.level_pool.level_pool_route"
family = "scheme"
formula_version = 1
status = "referenced"
equation = "in each of N pools in series, holding s = S(O) / N of the table for the same outflow: s[t] / dt + O[t] / 2 = (I[t-1] + I[t]) / 2 + s[t-1] / dt - O[t-1] / 2, O[t] read from the working curve s / dt + O / 2 of the table, linear between its rows; O[0] = O0 in every pool, at rest at the highest storage the table gives O0"
latex = "\\frac{s_t}{\\Delta t} + \\frac{O_t}{2} = \\frac{I_{t-1} + I_t}{2} + \\frac{s_{t-1}}{\\Delta t} - \\frac{O_{t-1}}{2},\\quad s = \\frac{S(O)}{N}"
validation = "none: the storage-outflow relation of a reach or a reservoir comes from water-surface profiles, the reservoir's topography or observed floods (HEC-HMS TRM, Modified Puls; NEH 630 ch. 17); the sources report no agreement of the scheme itself with observations"
conventions = ["SI units: discharge in m3/s, storage in m3, the step in min (S / dt with the 60 s of a minute of the units table)", "the outflow is read from the working curve S / (N dt) + O / 2 by linear interpolation between the rows of the table, as the table is linear between them (NEH 630 interpolates its working table, HEC-HMS solves the same equation by trial and error)", "N pools in series each hold S / N for the same outflow (HEC-HMS subreaches); every pool starts at rest with O0, at the highest storage the table gives that outflow, so a pool with a dead zone below a crest starts full to the crest", "the datum of the storage column is free: only differences of storage enter the outflow, and the storages reported are measured from it", "a state that rounding puts beyond an end of the table by at most 1e-9 of the working curve's top is held at that end; further beyond, the pool has left the table, which the preconditions flood_below_table_top and flood_above_table_bottom refuse", "the storage at rest under the last inflow ordinate is read at the end row of the table for a flow beyond it", "only the given ordinates are routed: LevelPoolReach divides a longer step into sub-steps, the inflow linear between the ordinates, extends the time axis and reads the stage of the last pool (Tier B, ADR-0008)"]
assumptions = ["the storage is a single-valued function of the outflow: a level water surface, or a reach whose storage follows its outflow, without hysteresis (NEH 630: the water surface is level or nearly level)", "for a channel NEH 630 asks for a travel time through the reach of about half the inflow's time of rise or less (not an input: not checked)", "the inflow is linear between its ordinates (the trapezoid rule)"]
notices = []
reference_cases = ["tests/fixtures/formulas/level-pool-cases.json"]
constants = []
tables = []

[properties]
units = "homogeneous"
symmetries = []

[properties.monotonic]

[[properties.scalings]]
name = "discharge"

[properties.scalings.inputs]
inflow_m3s = 1.0
table_storage_m3 = 1.0
table_outflow_m3s = 1.0
initial_outflow_m3s = 1.0

[properties.scalings.outputs]
outflow_m3s = 1.0
storage_m3 = 1.0
last_pool_storage_m3 = 1.0
storage_peak_m3 = 1.0
storage_steady_m3 = 1.0

[properties.scalings.tolerance]
reason = "a power of two scales every value of the working curve, of the state and of the interpolation exactly in binary, but for subnormal values, which round to fewer digits"
abs = 1e-300
rel = 0.0

[[properties.scalings]]
name = "time"

[properties.scalings.inputs]
timestep_min = 1.0
table_storage_m3 = 1.0

[properties.scalings.outputs]
storage_m3 = 1.0
last_pool_storage_m3 = 1.0
storage_peak_m3 = 1.0
storage_steady_m3 = 1.0

[properties.scalings.tolerance]
reason = "a power of two scales every value of the working curve, of the state and of the interpolation exactly in binary, but for subnormal values, which round to fewer digits"
abs = 1e-300
rel = 0.0

[[properties.limits]]
name = "steady_state"
text = "an inflow equal to the initial outflow passes unchanged, and the pools hold what the table gives it at rest"

[[properties.limits]]
name = "exact_recurrence"
text = "every outflow equals the recurrence of the pools in exact rational arithmetic"

[[properties.limits]]
name = "muskingum_without_weight"
text = "a table S = K O is the linear reservoir: the outflow and the storage of the spec muskingum with X = 0 and the same K, N and step"

[[properties.limits]]
name = "bounded_by_its_flows"
text = "every outflow lies between the least and the largest of the inflow and the initial outflow, a kinked table on the step its steep segment allows included; the scheme is non-decreasing in the inflow and the initial outflow to the rounding of its working curve, larger than four units in the last place of the outflow on a short step (test_the_outflow_rises_with_its_inflow_and_initial_outflow)"

[[properties.limits]]
name = "datum_free"
text = "a constant added to the storage column changes no outflow and adds itself to the storage"

[[properties.conservation]]
name = "volume"
text = "the trapezoid continuity holds in every pool: inflow volume - outflow volume = storage at the end - storage at the start"

[properties.conservation.tolerance]
reason = "relative to the largest volume or storage, at least the volume of the smallest normal discharge over the run (a subnormal flood rounds to its fewer digits): the state rounds at 1e-16 of the working curve per step, damped by the weight (2K - dt) / (2K + dt) < 1; a state that rounding puts beyond an end of the table, within 1e-9 of it, is held at the end"
abs = 1e-09

