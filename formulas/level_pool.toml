[[constraints]]
name = "table_columns_paired"
class = "physical"
text = "the storage and the outflow columns have as many rows"

[constraints.source]
citation = "US Army Corps of Engineers, Hydrologic Engineering Center. HEC-HMS Technical Reference Manual, Channel Flow: Modified Puls Model"
access = "open"
