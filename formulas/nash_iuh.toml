schema = "nogat-formula-card/1"
name = "nash_iuh"
title = "Nash's instantaneous unit hydrograph and its unit hydrograph of a duration"
function = "hydrolog.runoff.nash_iuh.nash_unit_hydrograph"
family = "scheme"
formula_version = 1
status = "referenced"
equation = "u(t) = (t / K)^(n - 1) e^(-t / K) / (K Gamma(n)) for t > 0, u(0) = 0; LAG = n K; S(t) = P(n, t / K), the regularized lower incomplete gamma function, 0 for t <= 0; U_D(t) = (S(t) - S(t - D)) / D; q_i = U_D(i dt) A x 1 mm per s; i = 0 to max(1, ceil(T / dt))"
latex = "u(t) = \\frac{1}{K\\,\\Gamma(n)}\\left(\\frac{t}{K}\\right)^{n-1} e^{-t/K};\\quad t_{lag} = n K;\\quad S(t) = P\\!\\left(n, \\frac{t}{K}\\right);\\quad U_D(t) = \\frac{S(t) - S(t - D)}{D}"
validation = "none: Nash (1957) gives the model; n and K are fitted to gauged floods or estimated (specs lutz and nash_urban_regression), and the sources give no error statistic of the shape"
conventions = ["times in min from the beginning of the rainfall; the IUH in 1/min; ordinates in m3/s per mm", "the IUH at t = 0 is 0 on the grid, also for n <= 1, where the density is 1 / K (n = 1) or unbounded (n < 1) as t tends to 0", "the unit hydrograph of D is the IUH averaged over D by the exact S-curve, KZGW's eqs. 6.22-6.23 for D = dt: D need not be a whole number of steps; a D far shorter than dt loses digits in S(t) - S(t - D)", "the grid ends at T (NashIUH: 5 n K + D, and max(5 n K, 10 K) for the IUH alone): the ordinates hold S(T) of the unit, short of 1 mm by the tail beyond T", "n outside 1 to 10 or K outside 10 to 200 min given to NashIUH gives the notice outside_unverified_range (nash.n, nash.k_min): no source publishes those ranges"]
assumptions = ["the watershed responds as a cascade of n equal linear reservoirs", "excess rainfall uniform over the watershed and in time over D"]
notices = []
reference_cases = ["tests/fixtures/formulas/unit-hydrographs-cases.json"]
constants = []
tables = []

[properties]
units = "homogeneous"
conservation = []
symmetries = []

[properties.monotonic]

[[properties.scalings]]
name = "time"

[properties.scalings.inputs]
k_min = 1.0
timestep_min = 1.0
duration_min = 1.0
total_duration_min = 1.0

[properties.scalings.outputs]
times_min = 1.0
iuh_ordinates_per_min = -1.0
ordinates_m3s = -1.0
lag_time_min = 1.0
time_to_peak_min = 1.0
peak_discharge_m3s = -1.0

[properties.scalings.tolerance]
reason = "doubling every time keeps t / K and D / dt and halves the ordinates exactly in binary, but for subnormal ordinates"
abs = 1e-300
rel = 1e-14

[[properties.scalings]]
name = "area"

[properties.scalings.inputs]
area_km2 = 1.0

[properties.scalings.outputs]
ordinates_m3s = 1.0
peak_discharge_m3s = 1.0

[properties.scalings.tolerance]
reason = "doubling the area doubles every ordinate exactly in binary, but for subnormal ordinates"
abs = 1e-300
rel = 1e-14

[[properties.limits]]
name = "erlang"
text = "for a whole n the S-curve is the Erlang distribution function 1 - e^-x sum_j<n x^j / j! and the IUH x^(n-1) e^-x / (K (n-1)!), x = t / K: the ordinates of D = 15, 60 and 90 min agree"

[[properties.limits]]
name = "quadrature"
text = "for a fractional n the S-curve is the integral of the IUH from 0 to t, by adaptive quadrature"

[[properties.limits]]
name = "telescoping_volume"
text = "the ordinates of D = dt hold S at the end of the grid in mm over the watershed"

[[sources]]
citation = "KZGW (2017). Aktualizacja metodyki obliczania przepływów i opadów maksymalnych o określonym prawdopodobieństwie przewyższenia dla zlewni kontrolowanych i niekontrolowanych, załącznik 2 do OPZ (wersja ujednolicona)"
access = "open"
locator = "annex 2, section 3.1.2, p. 96: eqs. 6.13 (the IUH) and 6.15 (LAG = N k); p. 99: eqs. 6.22-6.23, the ordinates of the unit hydrograph of dt as the IUH averaged over dt times A / 3.6"
url = "https://kzgw.gov.pl/files/zam-pub/20170402-przeglad-i-aktualizacja-map/zal-2-do-OPZ-ujednolicony-1.pdf"

[[sources]]
citation = "Sikorska, A.E., Scheidegger, A., Banasik, K., Rieckermann, J. (2012). Bayesian uncertainty assessment of flood predictions in ungauged urban basins for conceptual rainfall-runoff models. Hydrology and Earth System Sciences 16, 1221-1236"
access = "open"
locator = "eqs. 8-10, p. 1225: the IUH of the cascade, tp and up"
url = "https://hess.copernicus.org/articles/16/1221/2012/hess-16-1221-2012.pdf"

[[sources]]
citation = "Nash, J.E. (1957). The form of the instantaneous unit hydrograph. International Association of Scientific Hydrology, Publication 45(3): 114-121"
access = "open"
locator = "the IUH of a cascade of n equal linear reservoirs of storage constant K, a gamma density of shape n and scale K, and its first moment n K (not opened; the equations as KZGW 2017 and Sikorska et al. 2012 print them)"

