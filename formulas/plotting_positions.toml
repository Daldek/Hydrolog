schema = "nogat-formula-card/1"
name = "plotting_positions"
title = "Plotting positions of annual maxima: exceedance probabilities and return periods"
function = "hydrolog.statistics._types.compute_plotting_positions"
family = "statistic"
formula_version = 1
status = "referenced"
equation = "p_i = (i - a) / (n + 1 - 2a) and T_i = 1 / p_i of the value of rank i = 1 ... n, ranked from the largest (rank 1); a = 0 (Weibull, i / (n + 1)), 1/2 (Hazen, (i - 1/2) / n) or 2/5 (Cunnane, (i - 2/5) / (n + 1/5))"
latex = "p_i = \\frac{i - a}{n + 1 - 2a},\\qquad T_i = \\frac{1}{p_i}"
validation = "none: an estimate of the probability of each value of the ranked sample"
conventions = ["the exceedance probability of the ith largest value, rank 1 the largest (WMO-No. 168 sect. 5.6.1; KZGW 2017 eq. 3.7, Polish p_i = i / (N + 1)); the return period T = 1 / p, as of the quantiles of the maxima", "the general form (i - a) / (n + 1 - 2a) of WMO-No. 1029 eq. 7.3 with the a of WMO-No. 168 sect. 5.6.1; no Gringorten formula", "tied values keep consecutive ranks, each with its own position, as KZGW 2017 table 3.13 ranks its two values of 10.3 and of 7.88 m3/s", "the sample in any unit: the positions depend on the ranks only"]
assumptions = []
notices = []
reference_cases = ["tests/fixtures/formulas/flood-frequency-cases.json"]
constraints = []
tables = []

[properties]
units = "homogeneous"
conservation = []

[properties.monotonic]
values = 1

[[properties.scalings]]
name = "unit_of_the_sample"

[properties.scalings.inputs]
values = 1.0

[properties.scalings.outputs]
values_sorted = 1.0

[properties.scalings.tolerance]
reason = "sorting, negating and doubling a sample are exact, and the positions depend on its size only"
abs = 0.0

[[properties.limits]]
name = "exact_rational"
text = "the positions and return periods of the definition in exact rational arithmetic, for samples of 1 to 10,000 values"

[[properties.symmetries]]
name = "order"
text = "the sample in the reverse order has the same positions"

[properties.symmetries.tolerance]
reason = "sorting, negating and doubling a sample are exact, and the positions depend on its size only"
abs = 0.0

[[properties.symmetries]]
name = "mirror"
text = "the negated sample has the negated values in the reverse order and the same positions"

[properties.symmetries.tolerance]
reason = "sorting, negating and doubling a sample are exact, and the positions depend on its size only"
abs = 0.0

[[sources]]
citation = "WMO (2009). Guide to Hydrological Practices, 6th ed., Volume II: Management of Water Resources and Application of Hydrological Practices, WMO-No. 168"
access = "open"
locator = "sect. 5.6.1, p. II.5-14: the exceedance probability p_i of the ith largest flood x(i) by the Weibull formula i / (n + 1), the Cunnane formula (i - 0.40) / (n + 0.2) and the Hazen formula (i - 0.5) / n"
url = "https://www.hydrology.nl/images/docs/hwrp/WMO_Guide_168_Vol_II_en.pdf"

[[sources]]
citation = "KZGW (2017). Aktualizacja metodyki obliczania przepływów i opadów maksymalnych o określonym prawdopodobieństwie przewyższenia dla zlewni kontrolowanych i niekontrolowanych, załącznik 2 do OPZ (wersja ujednolicona)"
access = "open"
locator = "eq. 3.7, p. 29: p_i = i / (N + 1) 100 %, the empirical exceedance probability of the ith largest annual maximum; example 3.4, table 3.13, pp. 54-55"
url = "https://kzgw.gov.pl/files/zam-pub/20170402-przeglad-i-aktualizacja-map/zal-2-do-OPZ-ujednolicony-1.pdf"

[[sources]]
citation = "WMO (2008). Manual on Low-flow Estimation and Prediction, Operational Hydrology Report No. 50, WMO-No. 1029"
access = "open"
locator = "sect. 7.3, eq. 7.3, p. 59: P_i = (i - a) / (n + 1 - 2a), the non-exceedance probability of the ith smallest of n events; p. 60: the Weibull formula is a = 0; sect. 7.8, step I, p. 65: the AM(7) values ranked ascending, the smallest rank 1, and the Weibull formula"
url = "https://library.wmo.int/idurl/4/32176"

[[variables]]
name = "values"
symbol = "x_{(i)}"
unit = "m3/s"
kind = "real_array"
description = "The sample, annual maxima of a discharge or a stage."
applicability = "unstated"
gaps_allowed = false
dims = 1
min_length = 1

[variables.physical]
test_low = -1000000.0
test_high = 1000000.0
test_reason = "the formulas are homogeneous in the unit of the sample (their scalings), so any bound tests their arithmetic: a million m3/s exceeds the discharge of every river, and a stage may lie below its gauge's zero, so the same bound holds below 0"

[variables.typical]
low = 0.81
low_inclusive = true
high = 111.0
high_inclusive = true

[variables.typical.source]
citation = "KZGW (2017). Aktualizacja metodyki obliczania przepływów i opadów maksymalnych o określonym prawdopodobieństwie przewyższenia dla zlewni kontrolowanych i niekontrolowanych, załącznik 2 do OPZ (wersja ujednolicona)"
access = "open"
locator = "examples 3.2 to 3.4, tables 3.5, 3.10 and 3.13 (pp. 39-55): annual maxima of 0.81 m3/s (Rypienica at Rypin) to 111 m3/s (Czarna at Polana)"
url = "https://kzgw.gov.pl/files/zam-pub/20170402-przeglad-i-aktualizacja-map/zal-2-do-OPZ-ujednolicony-1.pdf"

[[variables]]
name = "method"
symbol = "a"
unit = "-"
kind = "choice"
description = "The plotting position formula: Weibull's, Hazen's or Cunnane's."
choices = ["weibull", "hazen", "cunnane"]

[[constants]]
name = "a_weibull"
value = 0.0
unit = "-"
symbol = "a"
exact = "0"

[constants.source]
citation = "WMO (2009). Guide to Hydrological Practices, 6th ed., Volume II: Management of Water Resources and Application of Hydrological Practices, WMO-No. 168"
access = "open"
locator = "sect. 5.6.1, p. II.5-14: the exceedance probability p_i of the ith largest flood x(i) by the Weibull formula i / (n + 1), the Cunnane formula (i - 0.40) / (n + 0.2) and the Hazen formula (i - 0.5) / n"
url = "https://www.hydrology.nl/images/docs/hwrp/WMO_Guide_168_Vol_II_en.pdf"

[[constants]]
name = "a_hazen"
value = 0.5
unit = "-"
symbol = "a"
exact = "1/2"

[constants.source]
citation = "WMO (2009). Guide to Hydrological Practices, 6th ed., Volume II: Management of Water Resources and Application of Hydrological Practices, WMO-No. 168"
access = "open"
locator = "sect. 5.6.1, p. II.5-14: the exceedance probability p_i of the ith largest flood x(i) by the Weibull formula i / (n + 1), the Cunnane formula (i - 0.40) / (n + 0.2) and the Hazen formula (i - 0.5) / n"
url = "https://www.hydrology.nl/images/docs/hwrp/WMO_Guide_168_Vol_II_en.pdf"

[[constants]]
name = "a_cunnane"
value = 0.4
unit = "-"
symbol = "a"
exact = "2/5"

[constants.source]
citation = "WMO (2009). Guide to Hydrological Practices, 6th ed., Volume II: Management of Water Resources and Application of Hydrological Practices, WMO-No. 168"
access = "open"
locator = "sect. 5.6.1, p. II.5-14: the exceedance probability p_i of the ith largest flood x(i) by the Weibull formula i / (n + 1), the Cunnane formula (i - 0.40) / (n + 0.2) and the Hazen formula (i - 0.5) / n"
url = "https://www.hydrology.nl/images/docs/hwrp/WMO_Guide_168_Vol_II_en.pdf"

[[outputs]]
name = "values_sorted"
unit = "m3/s"
kind = "real_array"
symbol = "x_{(i)}"
description = "The values in descending order."
gaps_allowed = false

[outputs.physical]

[[outputs]]
name = "exceedance_prob"
unit = "-"
kind = "real_array"
symbol = "p_i"
description = "The exceedance probability of each value."
gaps_allowed = false

[outputs.physical]
low = 0.0
low_inclusive = false
high = 1.0
high_inclusive = false

[[outputs]]
name = "return_periods"
unit = "years"
kind = "real_array"
symbol = "T_i"
description = "The return period of each value, exceeded once in T years."
gaps_allowed = false

[outputs.physical]
low = 1.0
low_inclusive = false

[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "limit exact_rational: the return period one over the smallest position, about 1 / n, of up to 10,000 values; the positions never reach 0 or 1"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type case values-nan_element: a gap is refused"

[[oracles]]
kind = "exact"
description = "the positions and return periods in exact rational arithmetic (fractions)"
test = "tests/unit/test_formulas_flood_frequency.py (limit exact_rational)"
conventions = []

[[oracles]]
kind = "established"
description = "scipy.stats.mstats.plotting_positions with alpha = beta = a"
test = "tests/unit/test_formulas_flood_frequency.py (test_the_plotting_positions_are_scipys)"
conventions = ["scipy gives (i - alpha) / (n + 1 - alpha - beta) of the ith smallest value, in the order of the sample", "the exceedance position of the ith largest value is the position of the ith smallest of the negated sample"]
