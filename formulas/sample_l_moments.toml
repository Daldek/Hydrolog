schema = "nogat-formula-card/1"
name = "sample_l_moments"
title = "L-moments and L-skewness of a sample (unbiased probability-weighted moments)"
function = "hydrolog.statistics.frequency.sample_l_moments"
family = "statistic"
formula_version = 1
status = "referenced"
equation = "b_r = n^-1 C(n - 1, r)^-1 sum_j C(j - 1, r) x(j) over the ascending sample x(1) <= ... <= x(n); l1 = b0; l2 = 2 b1 - b0; t3 = (6 b2 - 6 b1 + b0) / l2"
latex = "b_r = \\frac{1}{n}\\binom{n - 1}{r}^{-1}\\sum_{j=1}^{n}\\binom{j - 1}{r}x_{(j)},\\quad \\lambda_1 = b_0,\\quad \\lambda_2 = 2b_1 - b_0,\\quad \\tau_3 = \\frac{6b_2 - 6b_1 + b_0}{\\lambda_2}"
validation = "none: the definitions of the sample statistics"
conventions = ["the unbiased probability-weighted moments b_r of the ascending sample (Hosking 1990; lmom samlmu; lmomco pwm.ub), not the biased estimators of plotting positions", "the L-skewness t3 = lambda3 / lambda2 (WMO-No. 168 table II.5.4)", "the sample in any unit: l1 and l2 in its unit, t3 without one", "lambda2 and lambda3 as the weighted sums of the ordered deviations from the mean that the b_r make (their weights summed first), on the sample divided by a power of two; l1 the mean centred twice", "|t3| = 1 for values all equal but the largest or the smallest; the weighted sums of n values round by up to n ulp, so a t3 within 1e-9 beyond 1 or -1 is set to the bound (its boundary tolerance)"]
assumptions = []
notices = []
reference_cases = ["tests/fixtures/formulas/flood-frequency-cases.json"]
constants = []
tables = []

[properties]
units = "homogeneous"
conservation = []

[properties.monotonic]
values = 1

[[properties.scalings]]
name = "unit_of_the_sample"

[properties.scalings.inputs]
values = 1.0

[properties.scalings.outputs]
l1 = 1.0
l2 = 1.0

[properties.scalings.tolerance]
reason = "the statistics run on the sample scaled by a power of two, so doubling or negating it changes no rounding; a result below the normal floats keeps fewer bits"
abs = 1e-300
rel = 4.5e-16

[[properties.limits]]
name = "exact_rational"
text = "the L-moments of the definition in exact rational arithmetic"

[[properties.symmetries]]
name = "mirror"
text = "the negated sample has the negated l1 and t3 and the same l2"

[properties.symmetries.tolerance]
reason = "the negated sample has the negated mean exactly and sorts in the reverse order: l2 and l3 add the same terms in the other order, within n ulp of the mean absolute deviation, at most 2 l2, so t3 within 4 n ulp"
abs = 1e-13
rel = 1e-13

[[sources]]
citation = "Hosking, J.R.M. (1990). L-moments: analysis and estimation of distributions using linear combinations of order statistics. Journal of the Royal Statistical Society, Series B 52(1), 105-124"
access = "author-provided"
locator = "sect. 2: probability-weighted moments and the sample L-moments of their unbiased estimators"

[[sources]]
citation = "Hosking, J.R.M. lmom: L-moments, R package version 3.3, CRAN (the Fortran routines of Hosking and Wallis 1997)"
access = "open"
locator = "samlmu: the sample L-moments of Hosking (1990) from the unbiased probability-weighted moments"
url = "https://cran.r-project.org/package=lmom"

[[sources]]
citation = "Asquith, W.H. lmomco: L-moments, censored L-moments, trimmed L-moments, L-comoments, and many distributions, R package version 2.5.8, CRAN"
access = "open"
locator = "pwm.ub: beta_r = n^-1 C(n - 1, r)^-1 sum C(j - 1, r) x(j:n); lmoms"
url = "https://cran.r-project.org/package=lmomco"

[[sources]]
citation = "WMO (2009). Guide to Hydrological Practices, 6th ed., Volume II: Management of Water Resources and Application of Hydrological Practices, WMO-No. 168"
access = "open"
locator = "sect. 5.5.1, eqs. 5.25 to 5.27 and table II.5.4, pp. II.5-11 to II.5-12"
url = "https://www.hydrology.nl/images/docs/hwrp/WMO_Guide_168_Vol_II_en.pdf"

[[sources]]
citation = "WMO (2008). Manual on Low-flow Estimation and Prediction, Operational Hydrology Report No. 50, WMO-No. 1029"
access = "open"
locator = "sect. 7.6.2, eqs. 7.11 and 7.12, p. 64; table 7.1, p. 64"
url = "https://library.wmo.int/idurl/4/32176"

[[variables]]
name = "values"
symbol = "x_i"
unit = "m3/s"
kind = "real_array"
description = "The sample, annual maxima or minima."
applicability = "unstated"
gaps_allowed = false
dims = 1
min_length = 1

[variables.physical]
test_low = -1000000.0
test_high = 1000000.0
test_reason = "the formulas are homogeneous in the unit of the sample (their scalings), so any bound tests their arithmetic: a million m3/s exceeds the discharge of every river, and a stage may lie below its gauge's zero, so the same bound holds below 0"

[variables.typical]
low = 0.81
low_inclusive = true
high = 111.0
high_inclusive = true

[variables.typical.source]
citation = "KZGW (2017). Aktualizacja metodyki obliczania przepływów i opadów maksymalnych o określonym prawdopodobieństwie przewyższenia dla zlewni kontrolowanych i niekontrolowanych, załącznik 2 do OPZ (wersja ujednolicona)"
access = "open"
locator = "examples 3.2 to 3.4, tables 3.5, 3.10 and 3.13 (pp. 39-55): annual maxima of 0.81 m3/s (Rypienica at Rypin) to 111 m3/s (Czarna at Polana)"
url = "https://kzgw.gov.pl/files/zam-pub/20170402-przeglad-i-aktualizacja-map/zal-2-do-OPZ-ujednolicony-1.pdf"

[[constraints]]
name = "enough_values"
class = "precondition"
text = "n >= 3"

[constraints.source]
citation = "Asquith, W.H. lmomco: L-moments, censored L-moments, trimmed L-moments, L-comoments, and many distributions, R package version 2.5.8, CRAN"
access = "open"
locator = "pwm.ub: b2 divides by C(n - 1, 2), 0 for n < 3"
url = "https://cran.r-project.org/package=lmomco"

[[constraints]]
name = "values_not_all_equal"
class = "precondition"
text = "min(x) < max(x)"

[constraints.source]
citation = "WMO (2009). Guide to Hydrological Practices, 6th ed., Volume II: Management of Water Resources and Application of Hydrological Practices, WMO-No. 168"
access = "open"
locator = "table II.5.4: the L-skewness is lambda3 / lambda2, and lambda2 is 0 for equal values"
url = "https://www.hydrology.nl/images/docs/hwrp/WMO_Guide_168_Vol_II_en.pdf"

[[outputs]]
name = "l1"
unit = "m3/s"
kind = "real"
symbol = "\\lambda_1"
description = "First L-moment, the mean."

[outputs.physical]

[[outputs]]
name = "l2"
unit = "m3/s"
kind = "real"
symbol = "\\lambda_2"
description = "Second L-moment, half the mean difference of two values."

[outputs.physical]
low = 0.0
low_inclusive = true

[[outputs]]
name = "t3"
unit = "-"
kind = "real"
symbol = "\\tau_3"
description = "L-skewness; 1 (or -1) for values all equal but the largest (the smallest)."
boundary_tolerance = 1e-09

[outputs.physical]
low = -1.0
low_inclusive = true
high = 1.0
high_inclusive = true

[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "constraint case values_not_all_equal-violated: l2 = 0 of equal values is refused before the division by l2"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type case values-nan_element: a gap is refused"

[[traps]]
name = "many_small_terms"
description = "A sum of many small terms that loses precision."
test = "test_long_samples_keep_their_moments"

[[traps]]
name = "moment_cancellation"
description = "Cancellation in moments computed as E[x^2] - E[x]^2."
test = "limit exact_rational: a mean of 1e9 with a spread of 0.03 against rational arithmetic"

[[oracles]]
kind = "exact"
description = "the L-moments of the unbiased probability-weighted moments in exact rational arithmetic (fractions)"
test = "tests/unit/test_formulas_flood_frequency.py (limit exact_rational)"
conventions = []

[[oracles]]
kind = "frozen"
description = "lmom 3.3 samlmu (Hosking) and lmomco 2.5.8 lmoms (Asquith) on seven samples, R 4.5.3, 2026-11-18"
test = "tests/oracles/frequency_lmom_r.csv"
conventions = ["samlmu and lmoms give the L-moments of the unbiased probability-weighted moments, as the spec"]
