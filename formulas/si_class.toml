[[outputs]]
name = "index_class"
unit = "-"
kind = "choice"
description = "The class, the most equable first."
choices = ["very_equable", "equable_wetter_season", "rather_seasonal", "seasonal", "markedly_seasonal", "most_in_three_months", "extreme"]

[[traps]]
name = "class_limit"
description = "A value exactly at a limit of a published class or table."
test = "reference cases si-class-*: each limit and just below it"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type case si-nan: NaN is refused; a year without an index has no class"
