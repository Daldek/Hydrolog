schema = "nogat-formula-card/1"
name = "rating_curve_fit"
title = "Rating curve Q = a (H - H0)^b fitted to stage-discharge pairs by least squares on Q"
function = "hydrolog.hydrometrics.rating_curve.fit_rating_curve"
family = "statistic"
formula_version = 1
status = "oracle only"
equation = "(a, b, H0) minimise sum((Q_i - a * (H_i - H0)**b)**2) over a >= 0, b >= 0, H0 < min(H); R2 = 1 - SS_res / SS_tot with SS_tot = sum((Q_i - mean(Q))**2); s = sqrt(sum((r_i - mean(r))**2) / (n - 1)) of the residuals r_i"
latex = "(\\hat a, \\hat b, \\hat H_0) = \\arg\\min_{a \\ge 0,\\, b \\ge 0,\\, H_0 < \\min H} \\sum_{i=1}^{n} \\left(Q_i - a\\,(H_i - H_0)^{b}\\right)^2,\\quad R^2 = 1 - \\frac{SS_{res}}{SS_{tot}}"
validation = "none: the least squares give the curve closest to the gaugings on Q; WMO-No. 1044 (sect. 1.12.2) reports no statistic of the agreement of such a fit, and the research found no open worked example with gaugings and fitted parameters (WMO-No. 1044, Rantz 1982, Kennedy 1984)"
conventions = ["least squares on Q, the arithmetic residuals of every pair weighted equally; WMO-No. 1044 (sect. 1.12.2) fits the straight line on logarithmic paper, log Q on log(H - H0), which gives another curve (the catalog's six gaugings: b = 1.640 on Q, 1.820 in logarithms)", "bounds a >= 0, b >= 0 and H0 below the lowest level by 2^-30 of the levels' scale (the power of two that brings the largest |H| into [1/2, 1)), about 5e-7 cm for stages of a few metres", "the search: SciPy's curve_fit, the trust region reflective method with ftol, xtol and gtol of 1e-12 and at most 10,000 evaluations, from a = 1, b = 1.5 and H0 = h0_initial, on the levels and discharges divided exactly by the powers of two that bring their largest magnitudes into [1/2, 1); the curve is scaled back, so levels in cm or m and discharges scaled by a power of two give the same curve", "R2 = 1 - SS_res / SS_tot on Q; s the standard deviation of the residuals with n - 1 (numpy.std, ddof 1)", "H, H0 and h0_initial in one unit of the levels (cm or m); a in m3/s per (unit of H)^b; Q in m3/s"]
assumptions = ["the pairs follow one stage-discharge relation of one control over the period (no shift, hysteresis or variable backwater); the check of spec rating_curve_plausibility flags curves that do not", "errors in Q only, independent and of equal variance"]
notices = ["outside_applicability"]
reference_cases = []
tables = []

[properties]
units = "homogeneous"
conservation = []

[properties.monotonic]

[[properties.scalings]]
name = "discharges"

[properties.scalings.inputs]
discharges_m3s = 1.0

[properties.scalings.outputs]
a = 1.0
std_residuals = 1.0

[properties.scalings.tolerance]
reason = "the search runs on the discharges divided by a power of two, so doubled discharges give the same search and a doubled exactly, but below the smallest normal float"
abs = 2.2250738585072014e-308

[[properties.limits]]
name = "noise_free_power_law"
text = "pairs of an exact power law give back its a, b and H0, with levels in cm and in m"

[properties.limits.source]
citation = "WMO (2010). Manual on Stream Gauging, Volume II: Computation of Discharge, WMO-No. 1044, Geneva"
access = "open"
locator = "sect. 1.5.4, eq. 1.4, pp. II.1-6 to II.1-7: Q = C (h - e)^beta, h the gauge height, e the gauge height of zero flow for a control of regular shape, or of effective zero flow for a control of irregular shape, C the discharge when the head h - e equals 1, beta the slope of the rating on logarithmic paper"
url = "https://library.wmo.int/idurl/4/32726"

[[properties.limits]]
name = "local_minimum"
text = "no point a step of 1e-4 from the estimate has a smaller sum of squares"

[[properties.limits]]
name = "zero_flow_below_the_levels"
text = "H0 lies below every level of the pairs"

[[properties.symmetries]]
name = "levels_in_another_unit"
text = "levels and the start in a unit twice as small give the same curve: a times 2^-b, H0 doubled, b, R2 and s unchanged"

[properties.symmetries.tolerance]
reason = "the same search on the normalised levels; a is scaled back by 2^(-eH b), whose exponent rounds once: a few units in the last place times eH b"
abs = 1e-300
rel = 1e-12

[[sources]]
citation = "WMO (2010). Manual on Stream Gauging, Volume II: Computation of Discharge, WMO-No. 1044, Geneva"
access = "open"
locator = "sect. 1.5.4, eq. 1.4, pp. II.1-6 to II.1-7: Q = C (h - e)^beta, h the gauge height, e the gauge height of zero flow for a control of regular shape, or of effective zero flow for a control of irregular shape, C the discharge when the head h - e equals 1, beta the slope of the rating on logarithmic paper"
url = "https://library.wmo.int/idurl/4/32726"

[[sources]]
citation = "WMO (2010). Manual on Stream Gauging, Volume II: Computation of Discharge, WMO-No. 1044, Geneva"
access = "open"
locator = "sect. 1.12.2, p. II.1-20: the equation of the relation may be computed by the method of least squares, which assumes that the relation plots as a straight line on logarithmic paper"
url = "https://library.wmo.int/idurl/4/32726"

[[sources]]
citation = "ISO 1100-2:2010. Hydrometry - Measurement of liquid flow in open channels - Part 2: Determination of the stage-discharge relationship"
access = "author-provided"
locator = "the power-law rating equation and its fit to gaugings"

[[variables]]
name = "water_levels"
symbol = "H"
unit = "cm"
kind = "real_array"
description = "The water level H of each gauging, in one unit of the levels."
applicability = "unstated"
gaps_allowed = false
dims = 1
min_length = 1

[variables.physical]
test_low = -10000.0
test_high = 10000.0
test_reason = "100 m above or below a gauge's zero in cm: the stages of the largest rivers in flood range over a few tens of metres, so every stage of a gauge lies within"

[variables.typical]
low = -10.0
low_inclusive = true
high = 330.0
high_inclusive = true

[variables.typical.source]
citation = "Hydrolog's stage-discharge data: tests/fixtures/rating_curve_pairs.csv, tests/fixtures/station_daily.csv, the catalog's examples of hydrometrics rating-curve and IMGW-PIB 150170070 in ADR-0041"
access = "open"
locator = "stages of -10 cm (below the gauge zero, the catalog's example) to 329 cm (station_daily.csv); 6 to 161 cm at 150170070"

[[variables]]
name = "discharges_m3s"
symbol = "Q"
unit = "m3/s"
kind = "real_array"
description = "The discharge measured at each level."
applicability = "unstated"
gaps_allowed = false
dims = 1
min_length = 1

[variables.physical]
low = 0.0
low_inclusive = true
test_high = 1000000.0
test_reason = "a million m3/s, above the largest flood discharge of any river (the Amazon's, a few hundred thousand m3/s)"

[variables.typical]
low = 0.5
low_inclusive = true
high = 125.0
high_inclusive = true

[variables.typical.source]
citation = "Hydrolog's stage-discharge data: tests/fixtures/rating_curve_pairs.csv, tests/fixtures/station_daily.csv, the catalog's examples of hydrometrics rating-curve and IMGW-PIB 150170070 in ADR-0041"
