[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "the fractional power of a head at H0's bound below the lowest level: test_a_curve_at_its_bound_is_finite"

[[traps]]
name = "exp_overflow"
description = "exp of a scaled input at its test bound."
test = "the power of the head at the levels' test bounds: test_levels_at_their_test_bounds_fit_or_are_refused"

[[traps]]
name = "unbounded_iteration"
description = "An iteration without a bounded count (root finding, fit)."
test = "the search's bounded count of 10,000 evaluations: test_a_search_that_does_not_settle_is_refused (precondition least_squares_minimum)"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type cases water_levels-nan_element and discharges_m3s-nan_element: a gap is refused"

[[traps]]
name = "many_small_terms"
description = "A sum of many small terms that loses precision."
test = "test_many_pairs_keep_their_sums: 20,000 pairs against math.fsum"

[[traps]]
name = "moment_cancellation"
description = "Cancellation in moments computed as E[x^2] - E[x]^2."
test = "test_a_large_mean_discharge_keeps_r_squared: SS_tot of discharges near 1e6 against exact fractions"

[[oracles]]
kind = "frozen"
description = "R 4.4.3 stats::nls(algorithm = 'port') from a = 1, b = 1.5 and H0 = min(H) - max(1, 0.1 range), bounds a, b >= 0, H0 <= min(H) - 1e-6: tests/oracles/rating_curve/r_rating_outputs.csv"
test = "tests/unit/test_formulas_hydrometrics.py (test_the_fit_equals_r_nls_port; the cases of tests/fixtures/formulas/hydrometrics-cases.json)"
conventions = ["both: least squares on Q, every pair weighted equally", "R: the port algorithm (PORT library's nl2sol), Hydrolog: SciPy's trust region reflective method on the normalised pairs"]

[[oracles]]
kind = "exact"
description = "pairs of the exact power law Q = 0.012 (H - 32)^1.62 give back a, b and H0, with levels in cm and in m"
test = "tests/unit/test_formulas_hydrometrics.py (limit noise_free_power_law; case rating_curve_exact_power_law_and_units)"
conventions = []

[[oracles]]
kind = "algorithm"
description = "the sum of squares at points a step of 1e-4 from the estimate, by math.fsum"
test = "tests/unit/test_formulas_hydrometrics.py (limit local_minimum)"
conventions = []
