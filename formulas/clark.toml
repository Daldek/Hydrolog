schema = "nogat-formula-card/1"
name = "clark"
title = "Clark's unit hydrograph of a duration: time-area curve and linear reservoir"
function = "hydrolog.runoff.clark_iuh.clark_unit_hydrograph"
family = "scheme"
formula_version = 1
status = "oracle only"
equation = "A(t) / A = 1.414 (t / tc)^1.5 for t <= tc / 2 and 1 - 1.414 (1 - t / tc)^1.5 for tc / 2 < t < tc, 1 from tc; I_i = A(i dt) / A - A((i - 1) dt) / A; O_i = O_i-1 + C (I_i + I_i-1 - 2 O_i-1), C = dt / (2 R + dt), O and I 0 before the grid; u_i = O_i / (dt sum O); S(t) the S-curve of u, U_D(t) = (S(t) - S(t - D)) / D with S between grid points linear; q_i = U_D(i dt) A x 1 mm per s; i = 0 to max(1, ceil(T / dt))"
latex = "\\frac{A_t}{A} = 1.414\\left(\\frac{t}{t_c}\\right)^{1.5},\\ t \\le \\frac{t_c}{2};\\quad O_i = O_{i-1} + \\frac{\\Delta t}{2R + \\Delta t}\\,(I_i + I_{i-1} - 2\\,O_{i-1});\\quad U_D(t) = \\frac{S(t) - S(t - D)}{D}"
validation = "none: Clark (1945) and HEC-HMS give the model; its parameters tc and R are calibrated on gauged floods (HEC-HMS), and the sources give no error statistic"
conventions = ["times in min from the beginning of the rainfall; ordinates in m3/s per mm", "the time-area curve of HEC-HMS's elliptical watershed, 1.414 for the square root of 2 (the halves meet at 0.49992 and 0.50008, a step of 1.6e-4)", "the reservoir on the trapezoid rule, O_i = O_i-1 + C (I_i + I_i-1 - 2 O_i-1) with C = dt / (2 R + dt): HEC-HMS's O_t = CA I_t + CB O_t-1 and its mean of two outflows, the averaging moved from the outflow to the inflow, the same for a reservoir at rest", "the grid ends at T (ClarkIUH: tc + 5 R + D), where HEC-HMS stops at 0.995 of the volume; both divide the routed ordinates by their volume, one unit", "the unit hydrograph of D from the S-curve, S(t - D) read linearly between the grid points: D need not be a whole number of steps, and a D shorter than dt gives the hydrograph of D = dt", "R/tc outside 0.2 to 1.5 gives the notice outside_unverified_range of ClarkIUH (clark.r_tc_ratio): no source publishes that range, and the Polish calibrations of the Stobnica give 1.7 to 2.3 (Wałęga and Cupak 2013)"]
assumptions = ["tc is the translation time from the farthest point of the watershed; the time-area curve is that of an elliptical watershed unless one is known", "excess rainfall uniform over the watershed and in time over D"]
notices = []
reference_cases = []
tables = []

[properties]
units = "homogeneous"
conservation = []
symmetries = []

[properties.monotonic]

[[properties.scalings]]
name = "time"

[properties.scalings.inputs]
tc_min = 1.0
r_min = 1.0
duration_min = 1.0
timestep_min = 1.0
total_duration_min = 1.0

[properties.scalings.outputs]
times_min = 1.0
ordinates_m3s = -1.0
time_to_peak_min = 1.0
peak_discharge_m3s = -1.0

[properties.scalings.tolerance]
reason = "doubling every time keeps t / tc, the weights of the reservoir and D / dt and halves the ordinates exactly in binary, but for subnormal ordinates"
abs = 1e-300
rel = 1e-14

[[properties.scalings]]
name = "area"

[properties.scalings.inputs]
area_km2 = 1.0

[properties.scalings.outputs]
ordinates_m3s = 1.0
peak_discharge_m3s = 1.0

[properties.scalings.tolerance]
reason = "doubling the area doubles every ordinate exactly in binary, but for subnormal ordinates"
abs = 1e-300
rel = 1e-14

[[properties.limits]]
name = "hec_form"
text = "the ordinates of D = dt are HEC-HMS's recursion of the reservoir with the mean of two outflows, on the same grid"

[properties.limits.source]
citation = "USACE-HEC (2000). Hydrologic Modeling System HEC-HMS, Technical Reference Manual (CPD-74B, March 2000)"
access = "open"
locator = "eqs. 47-49, p. 58"
url = "https://www.hec.usace.army.mil/software/hec-hms/documentation/HEC-HMS_Technical%20Reference%20Manual_%28CPD-74B%29.pdf"

[[properties.limits]]
name = "hec_truncation"
text = "HEC-HMS's end of the hydrograph at 0.995 of its volume gives the same time to peak and the peak within 0.5 %"

[[properties.limits]]
name = "unit_volume"
text = "to the default length tc + 5 R + D the ordinates hold 1 mm over the watershed"

[[sources]]
citation = "USACE-HEC (2000). Hydrologic Modeling System HEC-HMS, Technical Reference Manual (CPD-74B, March 2000)"
access = "open"
locator = "Clark's unit hydrograph model, eqs. 47-50, pp. 58-59"
url = "https://www.hec.usace.army.mil/software/hec-hms/documentation/HEC-HMS_Technical%20Reference%20Manual_%28CPD-74B%29.pdf"

[[sources]]
citation = "USACE-HEC. HEC-HMS Technical Reference Manual (online, read 2026-11-19), chapter Transform"
access = "open"
locator = "Clark Unit Hydrograph Model: the time-area curve of an elliptical watershed, O_t = CA I_t + CB O_t-1, CA = dt / (R + 0.5 dt), the unit hydrograph the mean of two outflows"
url = "https://www.hec.usace.army.mil/confluence/hmsdocs/hmstrm/transform/clark-unit-hydrograph-model"

