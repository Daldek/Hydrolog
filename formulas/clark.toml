low_inclusive = false
test_high = 57600.0
test_reason = "ten times the longest default length of the typical ranges"

[variables.typical]
low = 7.0
low_inclusive = true
high = 5760.0
high_inclusive = true

[variables.typical.source]
citation = "Hydrolog: the default length tc + 5 R + D over the typical ranges of tc, R and D"
access = "open"
locator = "1 + 5 x 0.2 + 5 = 7 to 450 + 5 x 1050 + 60 = 5,760 min"

[[constraints]]
name = "step_stable"
class = "precondition"
text = "the time step is at most twice the storage constant, dt <= 2 R (to 1e-9 of 2 R for its rounding): beyond it the previous outflow has the negative weight (2 R - dt) / (2 R + dt) and the ordinates oscillate below 0"

[constraints.source]
citation = "Hydrolog ADR-0008, the conventions of routing: the window of non-negative weights of the Muskingum scheme"
access = "open"
locator = "dt <= 2 K (1 - X), here X = 0 and K = R"

[[constraints]]
name = "length_bounded"
class = "precondition"
text = "the grid has at most a million ordinates"

[constraints.source]
citation = "Hydrolog's bound of a hydrograph's length (hydrolog.routing.reach.MAX_ORDINATES)"
access = "open"
locator = "a million ordinates: the routing of a hydrograph refuses a longer one"

[[constraints]]
name = "representable"
class = "precondition"
text = "float64 holds the first outflow of the reservoir, C A(dt) / A, as a normal number and 1 mm over the watershed per second of D, A x 1 mm / D"

[constraints.source]
citation = "IEEE 754 double precision (float64)"
access = "open"
locator = "normal numbers from 2.2e-308 to 1.8e308"

[[constants]]
name = "time_area_factor"
value = 1.414
unit = "-"
symbol = "1.414"

[constants.source]
citation = "USACE-HEC (2000). Hydrologic Modeling System HEC-HMS, Technical Reference Manual (CPD-74B, March 2000)"
access = "open"
locator = "Clark's unit hydrograph model, eq. 50, p. 59: At / A = 1.414 (t / tc)^1.5 for t <= tc / 2 and 1 - 1.414 (1 - t / tc)^1.5 for t >= tc / 2"
url = "https://www.hec.usace.army.mil/software/hec-hms/documentation/HEC-HMS_Technical%20Reference%20Manual_%28CPD-74B%29.pdf"

[[constants]]
name = "time_area_exponent"
value = 1.5
unit = "-"
symbol = "1.5"

[constants.source]
citation = "USACE-HEC (2000). Hydrologic Modeling System HEC-HMS, Technical Reference Manual (CPD-74B, March 2000)"
access = "open"
locator = "Clark's unit hydrograph model, eq. 50, p. 59: At / A = 1.414 (t / tc)^1.5 for t <= tc / 2 and 1 - 1.414 (1 - t / tc)^1.5 for t >= tc / 2"
url = "https://www.hec.usace.army.mil/software/hec-hms/documentation/HEC-HMS_Technical%20Reference%20Manual_%28CPD-74B%29.pdf"

