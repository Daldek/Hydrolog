[[traps]]
name = "stability_bound"
description = "The stability bound of a numerical scheme (a Courant number, Muskingum's 2KX <= dt <= 2K(1-X))."
test = "test_clark_steps_at_and_beyond_the_stability_bound: dt = 2 R computes without a negative ordinate, dt beyond 2 R (1 + 1e-9) is refused by the precondition step_stable"

[[traps]]
name = "many_small_terms"
description = "A sum of many small terms that loses precision."
test = "test_clark_a_million_ordinates_hold_their_volume: the volume of up to a million ordinates by NumPy's pairwise sum and cumulative sums"

[[oracles]]
kind = "algorithm"
description = "HEC-HMS's recursion of the reservoir, O_t = CA I_t + CB O_t-1 with the mean of two outflows (HEC-HMS 2000 eqs. 47-49), on the formula's grid and time-area curve"
test = "tests/unit/test_formulas_unit_hydrographs.py (limit hec_form)"
conventions = []

[[oracles]]
kind = "algorithm"
description = "the same recursion ended at 0.995 of the volume as HEC-HMS ends it and rescaled to one unit: the research case clark-hec-hms-trm-oracle (tc 120 min, R 60 min, dt 10 min, A 45.3 km2), the peak within 0.5 %"
test = "tests/unit/test_formulas_unit_hydrographs.py (limit hec_truncation)"
conventions = []
