[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type cases first-nan_element and second-nan_element: a gap is refused"

[[traps]]
name = "many_small_terms"
description = "A sum of many small terms that loses precision."
test = "the paths are counted in Python integers, exact however many (C(198, 99) is about 2e58), and p is one quotient (limit every_split)"

