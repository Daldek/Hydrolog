schema = "nogat-formula-card/1"
name = "ks_exact"
title = "Exact two-sided p-value of the two-sample Kolmogorov-Smirnov D, ties respected"
function = "hydrolog.statistics.homogeneity.ks_exact"
family = "statistic"
formula_version = 1
status = "referenced"
equation = "D = max_x |F1(x) - F2(x)| of the empirical distribution functions; p = P(D' >= D) over the C(m + n, m) equally likely splits of the pooled values into samples of m and n, ties respected: 1 - (the lattice paths from (0, 0) to (m, n) that keep |i n - j m| < m n D wherever a group of equal values ends) / C(m + n, m)"
latex = "D = \\max_x |F_1(x) - F_2(x)|,\\quad p = 1 - \\frac{\\#\\{\\text{paths with } |i n - j m| < m n D \\text{ at the ends of the ties}\\}}{\\binom{m + n}{m}}"
validation = "none: the exact null distribution of a test statistic; its sources compare it with no observations"
conventions = ["two-sided; D taken only where a group of equal values ends, as the empirical distribution functions are steps there", "homogeneity_tests takes it for samples with ties and m n < 10000; scipy's ks_2samp, exact for a continuous distribution, without ties and beyond (conservative with ties: Helsel et al. 2020, Example 5.1, 0.0524 against 0.0478)", "the samples in any unit: D and p have none"]
assumptions = ["independent values; under homogeneity every split of the pooled values is equally likely"]
notices = []
reference_cases = ["tests/fixtures/formulas/trend-cases.json"]
tables = []

[properties]
units = "homogeneous"
conservation = []

[properties.monotonic]

[[properties.scalings]]
name = "unit_of_the_samples"

[properties.scalings.inputs]
first = 1.0
second = 1.0

[properties.scalings.outputs]

[properties.scalings.tolerance]
reason = "the statistics rank the values, which doubling or negating them keeps or mirrors exactly"
abs = 0.0

[[properties.limits]]
name = "complete_separation"
text = "three values all below four others: D = 1 and p = 2 / C(7, 3)"

[[properties.limits]]
name = "every_split"
text = "p equals P(D' >= D) counted over every split of the pooled values in rational arithmetic"

[[properties.symmetries]]
name = "swapped_samples"
text = "the samples swapped give the same D and p"

[properties.symmetries.tolerance]
reason = "the lattice transposed: the same whole numbers, quotients"
abs = 0.0

[[properties.symmetries]]
name = "negated_samples"
text = "the negated samples give the same D and p"

[properties.symmetries.tolerance]
reason = "the paths run backwards through the same ends of ties"
abs = 0.0

[[sources]]
citation = "R Core Team. R: A Language and Environment for Statistical Computing, version 4.4.3, package stats, function ks.test"
access = "open"
locator = "help page ks.test, Details: in the two-sample case an exact p-value is computed if the product of the sample sizes is less than 10000, with or without ties (the algorithm of Schröer and Trenkler 1995); Examples: with ties, D = 3/7, p = 8/33"
url = "https://stat.ethz.ch/R-manual/R-devel/library/stats/html/ks.test.html"

[[sources]]
citation = "Schröer, G., Trenkler, D. (1995). Exact and randomization distributions of Kolmogorov-Smirnov tests two or three samples. Computational Statistics & Data Analysis 20(2), 185-202"
access = "author-provided"

