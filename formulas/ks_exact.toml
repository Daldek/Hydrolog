name = "first"
symbol = "x"
unit = "m3/s"
kind = "real_array"
description = "The first sample, e.g. the values before a split."
applicability = "unstated"
gaps_allowed = false
dims = 1
min_length = 1

[variables.physical]
test_low = -1000000.0
