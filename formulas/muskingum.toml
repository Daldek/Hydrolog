schema = "nogat-formula-card/1"
name = "muskingum"
title = "Muskingum routing through N equal sub-reaches (McCarthy's storage, trapezoid continuity)"
function = "hydrolog.routing.formulas.muskingum.muskingum_route"
family = "scheme"
formula_version = 1
status = "referenced"
equation = "in each of N sub-reaches of k = K / N in series: O[t] = c0 I[t] + c1 I[t-1] + c2 O[t-1], c0 = (dt - 2 k X) / D, c1 = (dt + 2 k X) / D, c2 = (2 k (1 - X) - dt) / D, D = 2 k (1 - X) + dt; O[0] = O0 in every sub-reach; storage S = k sum_j [X I_j + (1 - X) O_j] [m3]"
latex = "O_t = c_0 I_t + c_1 I_{t-1} + c_2 O_{t-1},\\quad c_0 = \\frac{\\Delta t - 2kX}{D},\\ c_1 = \\frac{\\Delta t + 2kX}{D},\\ c_2 = \\frac{2k(1-X) - \\Delta t}{D},\\ D = 2k(1-X) + \\Delta t,\\ k = \\frac{K}{N}"
validation = "none: K and X are calibrated on observed floods of a reach (HEC-HMS TRM, Muskingum model; EM 1110-2-1417 ch. 9); the sources report no agreement of the scheme itself with observations"
conventions = ["SI units: discharge in m3/s, time in min, storage in m3 (K in min times a discharge in m3/s times the 60 s of a minute of the units table)", "the weights are named by what they multiply: c_current I[t], c_previous I[t-1], c_outflow O[t-1]; NEH 630 and HEC-HMS call them C2, C1 and C3, the Iowa and NPTEL examples C1, C2 and C3", "continuity by the trapezoid rule, (S[t] - S[t-1]) / dt = (I[t] + I[t-1]) / 2 - (O[t] + O[t-1]) / 2, with S = k [X I + (1 - X) O] in each sub-reach", "N equal sub-reaches of K / N in series with the same X (HEC-HMS); every sub-reach starts at rest with O0, so at the first ordinate all but the first are fed by O0", "within the window's slack a weight that rounding puts below zero is set to zero and the others are divided by their sum (hydrolog.routing._kernels.nonnegative_coefficients)", "only the given ordinates are routed: MuskingumReach chooses N (K / dt rounded) and the sub-steps of a step without a window, interpolates the inflow linearly between them, and extends the time axis (Tier B, ADR-0008)"]
assumptions = ["the storage of the reach is linear in a weighted discharge, S = K [X I + (1 - X) O], with K and X constant over the flood", "no backwater: the outflow does not depend on the water downstream"]
notices = ["outside_applicability"]
reference_cases = ["tests/fixtures/formulas/muskingum-cases.json"]
constants = []
tables = []

[properties]
units = "homogeneous"
symmetries = []

[properties.monotonic]
inflow_m3s = 1
initial_outflow_m3s = 1

[[properties.scalings]]
name = "discharge"

[properties.scalings.inputs]
inflow_m3s = 1.0
initial_outflow_m3s = 1.0

[properties.scalings.outputs]
outflow_m3s = 1.0
storage_start_m3 = 1.0
storage_end_m3 = 1.0
storage_steady_m3 = 1.0

[properties.scalings.tolerance]
reason = "a power of two scales every product and sum of the recurrence exactly in binary, but for subnormal discharges, which round to fewer digits"
abs = 1e-300
rel = 0.0

[[properties.scalings]]
name = "time"

[properties.scalings.inputs]
timestep_min = 1.0
k_min = 1.0

[properties.scalings.outputs]
storage_start_m3 = 1.0
storage_end_m3 = 1.0
storage_steady_m3 = 1.0

[properties.scalings.tolerance]
reason = "a power of two scales every product and sum of the recurrence exactly in binary, but for subnormal discharges, which round to fewer digits"
abs = 1e-300
rel = 0.0

[[properties.limits]]
name = "lag_of_one_step"
text = "X = 0.5 and K = N dt with N = 1: c0 = c2 = 0 and c1 = 1, the outflow is the inflow one step later (HEC-HMS: Muskingum with X = 0.5 and K = dt is the lag of one step)"

[[properties.limits]]
name = "steady_state"
text = "an inflow equal to the initial outflow passes unchanged: the weights sum to 1"

[[properties.limits]]
name = "exact_recurrence"
text = "every outflow equals the recurrence of the sub-reaches in exact rational arithmetic"

[[properties.limits]]
name = "moments"
text = "the impulse response has the mean delay K and the variance K^2 (1 - 2X) / N, whatever dt"

[[properties.limits]]
name = "bounded_by_its_inputs"
text = "every outflow lies between the least and the largest of the inflow and the initial outflow"

[[properties.conservation]]
name = "volume"
text = "the trapezoid continuity holds in every sub-reach: inflow volume - outflow volume = storage at the end - storage at the start"

[properties.conservation.tolerance]
reason = "relative to the largest volume or storage: the recurrence rounds at 1e-16 per step; a weight that rounding put below zero on a border of the window is set to zero, which moves the others by at most the window's slack of 1e-9"
abs = 1e-09

[[sources]]
citation = "US Army Corps of Engineers, Hydrologic Engineering Center. HEC-HMS Technical Reference Manual, Channel Flow: Muskingum Model"
access = "open"
locator = "equations of the storage and of the weights; X from 0 to 0.5; sub-reaches whose travel time is about the time step"
url = "https://www.hec.usace.army.mil/confluence/hmsdocs/hmstrm/channel-flow/muskingum-model"

[[sources]]
