[[traps]]
name = "difference_denominator"
description = "A denominator that is a difference of inputs."
test = "c_current = (dt - 2KX/N) / D vanishes on the window's lower end: limit lag_of_one_step gives it exactly 0; D = 2K(1 - X)/N + dt >= dt > 0 never vanishes"

[[traps]]
name = "stability_bound"
description = "The stability bound of a numerical scheme (a Courant number, Muskingum's 2KX <= dt <= 2K(1-X))."
test = "the window 2KX/N <= dt <= 2K(1 - X)/N: constraint nonnegative_weights with its satisfied, boundary and violated points, and test_a_border_of_the_window_rounds_to_zero_weights"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type cases inflow_m3s-nan_element and inflow_m3s-inf_element: a gap is refused, the recurrence would carry it to every later ordinate"

[[traps]]
name = "many_small_terms"
description = "A sum of many small terms that loses precision."
test = "test_a_long_steady_inflow_stays_steady: 200,000 ordinates of a constant inflow stay constant to 1e-14"

[[oracles]]
kind = "exact"
description = "the recurrence of the sub-reaches and its weights in exact rational arithmetic (fractions), loop by loop"
test = "tests/unit/test_formulas_muskingum.py (limit exact_recurrence)"
conventions = []

[[oracles]]
kind = "exact"
description = "the moments of the impulse response, mean K and variance K^2 (1 - 2X) / N, from the generating function (c0 + c1 s) / (1 - c2 s) of the scheme"
test = "tests/unit/test_formulas_muskingum.py (limit moments)"
conventions = []
