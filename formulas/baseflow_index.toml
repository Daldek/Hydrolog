schema = "nogat-formula-card/1"
name = "baseflow_index"
title = "Baseflow index: the volume of baseflow over the volume of flow"
function = "hydrolog.statistics.baseflow.baseflow_index"
family = "index"
formula_version = 1
status = "referenced"
equation = "BFI = sum(b_t) / sum(Q_t) over the days with both values"
latex = "\\mathrm{BFI} = \\frac{\\sum_t b_t}{\\sum_t Q_t}"
validation = "none: the definition of the index"
conventions = ["the volumes are the sums of the daily values (each day the same length), summed exactly once rounded (math.fsum)", "a day counts when it has both a discharge and a baseflow; with gaps the index is the ratio of the sums over the days with values (Ladson et al., sect. 2.4), not the mean of the spans' indices weighted by their lengths that BFI.R computes", "the series in any unit: the index has none"]
assumptions = []
notices = []
reference_cases = ["tests/fixtures/formulas/baseflow-cases.json", "tests/fixtures/formulas/camels-pl-cases.json"]
constants = []
tables = []

[properties]
units = "homogeneous"
conservation = []
symmetries = []

[properties.monotonic]
baseflow = 1
values = -1

[[properties.scalings]]
name = "unit_of_the_series"

[properties.scalings.inputs]
values = 1.0
baseflow = 1.0

[properties.scalings.outputs]
bfi = 0.0

[properties.scalings.tolerance]
reason = "doubling every value of a series doubles every term of the recursion and of the sums exactly, so no rounding changes; a result below the normal floats keeps fewer bits"
abs = 1e-300
rel = 4.5e-16

[[properties.limits]]
name = "all_baseflow"
text = "a flow that is all baseflow has BFI = 1"

[[properties.limits]]
name = "no_baseflow"
text = "a flow without baseflow has BFI = 0"

[[sources]]
citation = "Ladson, A.R., Brown, R., Neal, B. and Nathan, R. (2013). A standard approach to baseflow separation using the Lyne and Hollick filter. Australasian Journal of Water Resources 17(1), 25-34 (the authors' accepted manuscript)"
access = "open"
locator = "sect. 1.1, p. 5: 'the ratio of the baseflow volume (calculated from q_b) to the volume of streamflow (q) over a specified period'; sect. 2.4, p. 9: 'the sum of baseflow divided by the sum of total flow over the period of available raw data segments'"
url = "https://tonyladson.wordpress.com/2013/10/01/a-standard-approach-to-baseflow-separation-using-the-lyne-and-hollick-filter/"

[[sources]]
citation = "Ladson, A.R. (2013). BFI.R and BFI_example.R, the code of Ladson et al. (2013), github.com/TonyLadson/BaseflowSeparation_LyneHollick, commit 8d09646 (2014-02-12), copied into tests/oracles/baseflow/"
access = "open"
locator = "BFI.R, BFI.calc: BFI.value <- sum(Qbase)/sum(Qin)"
url = "https://github.com/TonyLadson/BaseflowSeparation_LyneHollick"

[[sources]]
citation = "WMO (2008). Manual on Low-flow Estimation and Prediction, Operational Hydrology Report No. 50, WMO-No. 1029"
access = "open"
locator = "sect. 5.2, pp. 43-44: 'BFI = V_baseflow/V_total'; annual BFI from the volumes of each year"
url = "https://library.wmo.int/idurl/4/32176"

[[variables]]
name = "values"
symbol = "Q_t"
unit = "m3/s"
kind = "real_array"
description = "Daily discharge; a gap (NaN) is a day without a value."
applicability = "unstated"
gaps_allowed = true
dims = 1
min_length = 1

[variables.physical]
low = 0.0
low_inclusive = true
test_high = 1000000.0
test_reason = "the formulas are homogeneous in the unit of the series (their scalings), so any bound tests their arithmetic: a million m3/s exceeds the discharge of every river (the Amazon's floods reach about 300,000 m3/s)"

[variables.typical]
low = 0.5
low_inclusive = true
high = 125.0
high_inclusive = true

[variables.typical.source]
citation = "IMGW-PIB, public hydrological data: daily discharge of the Nysa Kłodzka at Kłodzko (station 150160180) in 2010, files codz_2010_01 to codz_2010_12; and Hydrolog's synthetic station of the GUI guide, tests/fixtures/station_daily.csv"
access = "open"
locator = "Kłodzko 2010: 4.93 to 96.0 m3/s; station_daily.csv, 2018-11 to 2023-10: 0.52 to 122.34 m3/s"
url = "https://danepubliczne.imgw.pl/data/dane_pomiarowo_obserwacyjne/dane_hydrologiczne/"

[[variables]]
name = "baseflow"
symbol = "b_t"
unit = "m3/s"
kind = "real_array"
description = "Baseflow of the same days; a gap is a day without one."
applicability = "unstated"
gaps_allowed = true
dims = 1
min_length = 1

[variables.physical]
low = 0.0
low_inclusive = true
test_high = 1000000.0
test_reason = "the formulas are homogeneous in the unit of the series (their scalings), so any bound tests their arithmetic: a million m3/s exceeds the discharge of every river (the Amazon's floods reach about 300,000 m3/s)"

[variables.typical]
low = 0.5
low_inclusive = true
high = 125.0
high_inclusive = true

[variables.typical.source]
citation = "IMGW-PIB, public hydrological data: daily discharge of the Nysa Kłodzka at Kłodzko (station 150160180) in 2010, files codz_2010_01 to codz_2010_12; and Hydrolog's synthetic station of the GUI guide, tests/fixtures/station_daily.csv"
access = "open"
locator = "Kłodzko 2010: 4.93 to 96.0 m3/s; station_daily.csv, 2018-11 to 2023-10: 0.52 to 122.34 m3/s"
url = "https://danepubliczne.imgw.pl/data/dane_pomiarowo_obserwacyjne/dane_hydrologiczne/"

[[constraints]]
name = "baseflow_not_above_flow"
class = "physical"
text = "b_t <= Q_t on every day with both values"

[constraints.source]
citation = "Ladson, A.R., Brown, R., Neal, B. and Nathan, R. (2013). A standard approach to baseflow separation using the Lyne and Hollick filter. Australasian Journal of Water Resources 17(1), 25-34 (the authors' accepted manuscript)"
access = "open"
locator = "sect. 1.1, eq. 2: q_b = q - q_f with q_f >= 0"
url = "https://tonyladson.wordpress.com/2013/10/01/a-standard-approach-to-baseflow-separation-using-the-lyne-and-hollick-filter/"

[[constraints]]
name = "same_days"
class = "precondition"
text = "len(b) = len(Q)"

[constraints.source]
citation = "Ladson, A.R., Brown, R., Neal, B. and Nathan, R. (2013). A standard approach to baseflow separation using the Lyne and Hollick filter. Australasian Journal of Water Resources 17(1), 25-34 (the authors' accepted manuscript)"
access = "open"
locator = "sect. 2.4, p. 9: baseflow statistics 'only from time steps in which raw data were available'"
url = "https://tonyladson.wordpress.com/2013/10/01/a-standard-approach-to-baseflow-separation-using-the-lyne-and-hollick-filter/"

[[constraints]]
name = "positive_flow_volume"
class = "precondition"
text = "sum(Q_t) > 0"

[constraints.source]
citation = "Ladson, A.R., Brown, R., Neal, B. and Nathan, R. (2013). A standard approach to baseflow separation using the Lyne and Hollick filter. Australasian Journal of Water Resources 17(1), 25-34 (the authors' accepted manuscript)"
access = "open"
locator = "sect. 1.1, p. 5: a ratio to the volume of streamflow, undefined without flow"
url = "https://tonyladson.wordpress.com/2013/10/01/a-standard-approach-to-baseflow-separation-using-the-lyne-and-hollick-filter/"

[[outputs]]
name = "bfi"
unit = "-"
kind = "real"
symbol = "BFI"
description = "Share of the baseflow in the volume of flow."

[outputs.physical]
low = 0.0
low_inclusive = true
high = 1.0
high_inclusive = true

[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "constraint case positive_flow_volume-violated: no flow is refused before the division; test_a_trickle_has_a_finite_index: the smallest flows divide without underflow"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "test_a_day_without_a_value_is_left_out: a gap in either series leaves the day out of both sums"

[[traps]]
name = "many_small_terms"
description = "A sum of many small terms that loses precision."
test = "test_a_long_series_sums_exactly: 50,000 days against the exact rational sums"

[[oracles]]
kind = "exact"
description = "the ratio of the sums in exact rational arithmetic (fractions)"
test = "tests/unit/test_formulas_baseflow.py::test_the_index_is_the_exact_ratio"
conventions = []

[[oracles]]
kind = "frozen"
description = "the BFI that Ladson's BFI() of BFI.R reports, run by R 4.5.3, of the filter's baseflow"
test = "tests/oracles/baseflow/lyne_hollick_bfi_r.csv"
conventions = ["BFI.R: sum(Qbase)/sum(Qin) of a gapless series, the spec's ratio"]
