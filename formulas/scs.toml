[[constraints]]
name = "steps_representable"
class = "precondition"
text = "float64 holds tlag, Tp, the sub-step and the peaks as normal numbers, at most 2**53 sub-steps, and the grid of the step and of the sub-step have at most a million ordinates each"

[constraints.source]
citation = "Hydrolog's bound of a hydrograph's length (hydrolog.routing.reach.MAX_ORDINATES)"
access = "open"
locator = "a million ordinates: the routing of a hydrograph refuses a longer one"

[[constants]]
name = "lag_ratio"
value = 0.6
unit = "-"
symbol = "0.6"

[constants.source]
citation = "USDA-NRCS (2007). National Engineering Handbook, Part 630 Hydrology, Chapter 16: Hydrographs (210-VI-NEH, March 2007)"
access = "open"
locator = "eq. 16A-9, p. 16A-2: L = 0.6 Tc (after NEH 630 ch. 15); HEC-HMS 2000, eq. 38, p. 56"
url = "https://irrigationtoolbox.com/NEH/Part630_Hydrology/H_210_630_16.pdf"

[[constants]]
name = "peak_factor"
value = 2.08
unit = "m3 s^-1 km^-2 cm^-1 h"
symbol = "C"

[constants.source]
citation = "USACE-HEC (2000). Hydrologic Modeling System HEC-HMS, Technical Reference Manual (CPD-74B, March 2000)"
access = "open"
locator = "eq. 36, p. 55: C = 2.08 in SI and 484 in foot-pound units; Chow et al. 1988, after Rajagopalan's notes, p. 79: C = 2.08 (483.4 in English units)"
url = "https://www.hec.usace.army.mil/software/hec-hms/documentation/HEC-HMS_Technical%20Reference%20Manual_%28CPD-74B%29.pdf"

[[constants]]
name = "step_share"
value = 0.25
unit = "-"
symbol = "0.25"

[constants.source]
citation = "USDA-NRCS (2007). National Engineering Handbook, Part 630 Hydrology, Chapter 16: Hydrographs (210-VI-NEH, March 2007)"
access = "open"
locator = "p. 16A-3: the unit duration D is 0.2 Tp and no greater than 0.25 Tp; HEC-HMS 2000, p. 55: less than 29 % of tlag"
url = "https://irrigationtoolbox.com/NEH/Part630_Hydrology/H_210_630_16.pdf"

