[[traps]]
name = "stability_bound"
description = "The stability bound of a numerical scheme (a Courant number, Muskingum's 2KX <= dt <= 2K(1-X))."
test = "test_scs_steps_at_and_beyond_the_neh_bound: the step 0.25 Tp itself is sampled as it is, the next one is computed on sub-steps and keeps its volume"

[[traps]]
name = "unbounded_iteration"
description = "An iteration without a bounded count (root finding, fit)."
test = "the count of sub-steps is a closed form corrected at most twice for rounding; range case tc_min-physical_low_inside: a sub-step float64 cannot hold is refused by the precondition steps_representable"

[[traps]]
name = "many_small_terms"
description = "A sum of many small terms that loses precision."
test = "test_scs_a_day_step_keeps_its_volume: E5b-07, 93 sub-steps of a step of 1440 min summed by cumulative sums"

[[oracles]]
kind = "exact"
description = "the ordinates in exact rational arithmetic (fractions): Tp, qp, the linear interpolation of table 16-1 and the means over the sub-steps"
test = "tests/unit/test_formulas_unit_hydrographs.py (limit exact_table)"
conventions = []

