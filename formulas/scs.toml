schema = "nogat-formula-card/1"
name = "scs"
title = "SCS (NRCS) dimensionless unit hydrograph of a unit duration"
function = "hydrolog.runoff.unit_hydrograph.scs_unit_hydrograph"
family = "scheme"
formula_version = 1
status = "referenced"
equation = "tlag = 0.6 * tc; Tp = D / 2 + tlag; qp = C * A / Tp [m3/s per cm of runoff, A in km2, Tp in h], C = 2.08, per mm qp / 10; q(t) = qp * f(t / Tp), f table 16-1 of NEH 630 ch. 16 interpolated linearly, 0 beyond t / Tp = 5, so Tb = 5 Tp; the ordinates are q(k D). For D > 0.25 Tp the ordinate at k D is the mean of the ordinates q_d(j d) of the sub-step d = D / n over the n sub-steps ending at k D, d the longest with d <= 0.25 Tp(d)"
latex = "t_{lag} = 0.6\\,t_c,\\quad T_p = \\frac{D}{2} + t_{lag},\\quad q_p = \\frac{C\\,A}{T_p},\\quad q_k = q_p\\,f\\!\\left(\\frac{k\\,D}{T_p}\\right),\\quad T_b = 5\\,T_p"
validation = "Mockus (1957) derived the dimensionless unit hydrograph from many natural unit hydrographs of watersheds varying widely in size and geographical location (NEH 630-16, p. 16-2; HEC-HMS 2000, p. 55: small agricultural watersheds); the sources give no error statistic of its shape or peak"
conventions = ["SI units: A in km2, times in min, ordinates in m3/s per mm of runoff; C = 2.08 is per cm (HEC-HMS 2000 eq. 36), per mm by the exact 10 mm/cm", "C = 2.08 is NEH's peak rate factor 483.2 in foot-pound units, not 484: NEH 630 (p. 16A-2) gives table 16-1 the factor 483.4 from the rounding of its ratios; with 2.08 the continuous table holds 1.00036 mm", "times from the beginning of the unit excess; D is the time step", "table 16-1 interpolated linearly between its rows, as NEH 630 table 16-2 does (t/Tp 2.1 gives 0.2435), and 0 from t/Tp = 5 on", "the ordinates are the curve sampled at the step times (NEH 630 example 16-1, step 2)", "a step longer than 0.25 Tp is divided into sub-steps and the rain of the step spread evenly over them (notice uh_substeps): the volume stays 1 mm, while qp, Tp and Tb stay the formula's values for D, so qp then exceeds the largest ordinate (by 21 % for tc 90.7 min at a step of 60 min)"]
assumptions = ["excess rainfall uniform over the watershed and in time over D; subareas of at most 20 square miles, the largest at most 10 times the smallest (NEH 630 p. 16-4), larger watersheds divided and their hydrographs routed", "tlag = 0.6 tc, the average relation of NEH 630 ch. 15", "D = 0.2 Tp (D = 0.133 tc), at most 0.25 Tp (NEH 630 p. 16A-3); hydrograph generate warns outside_applicability of scs.timestep_min beyond it"]
notices = ["outside_applicability", "uh_substeps"]
reference_cases = ["tests/fixtures/formulas/unit-hydrographs-cases.json"]

[properties]
units = "homogeneous"
symmetries = []

[properties.monotonic]
area_km2 = 1
tc_min = -1
timestep_min = -1

[[properties.scalings]]
name = "area"

[properties.scalings.inputs]
area_km2 = 1.0

[properties.scalings.outputs]
peak_discharge_m3s = 1.0
ordinates_m3s = 1.0

[properties.scalings.tolerance]
reason = "doubling the area doubles every ordinate exactly in binary, but for values below 1e-300 that float64's subnormal numbers round on a fixed absolute step"
abs = 1e-300
rel = 1e-14

[[properties.scalings]]
name = "time"

[properties.scalings.inputs]
tc_min = 1.0
timestep_min = 1.0

[properties.scalings.outputs]
peak_discharge_m3s = -1.0
time_to_peak_min = 1.0
lag_time_min = 1.0
time_base_min = 1.0
times_min = 1.0
ordinates_m3s = -1.0

[properties.scalings.tolerance]
reason = "doubling every time keeps t / Tp and the sub-steps and halves qp exactly in binary, but for subnormal values"
abs = 1e-300
rel = 1e-14

[[properties.limits]]
name = "exact_table"
text = "the ordinates equal the equation in exact rational arithmetic, with and without sub-steps"

[[properties.limits]]
name = "recommended_duration"
text = "D = 2 tc / 15 gives D = 0.2 Tp and the peak ordinate qp at Tp (NEH 630 eqs. 16A-10 to 16A-13)"

[properties.limits.source]
citation = "USDA-NRCS (2007). National Engineering Handbook, Part 630 Hydrology, Chapter 16: Hydrographs (210-VI-NEH, March 2007)"
access = "open"
locator = "eqs. 16A-10 to 16A-13, p. 16A-3"
url = "https://irrigationtoolbox.com/NEH/Part630_Hydrology/H_210_630_16.pdf"

[[properties.conservation]]
name = "unit_volume"
text = "the ordinates hold 1 mm over the watershed, sum(q_k) D = A * 1 mm, within the sampling of the table"

[properties.conservation.tolerance]
reason = "the continuous table holds 1.00036 mm at C = 2.08 (area 1.33595 Tp qp); sampled at D or d of at most 0.25 Tp it holds 0.99772 to 1.00138 mm over 20,001 ratios D / Tp of (0, 0.25]"
abs = 0.003

[[sources]]
citation = "USDA-NRCS (2007). National Engineering Handbook, Part 630 Hydrology, Chapter 16: Hydrographs (210-VI-NEH, March 2007)"
access = "open"
locator = "table 16-1, p. 16-4; appendix 16A, eqs. 16A-6 to 16A-9 and 16A-13, pp. 16A-2 to 16A-3; example 16-1, pp. 16-7 to 16-13"
url = "https://irrigationtoolbox.com/NEH/Part630_Hydrology/H_210_630_16.pdf"

[[sources]]
citation = "USACE-HEC (2000). Hydrologic Modeling System HEC-HMS, Technical Reference Manual (CPD-74B, March 2000)"
access = "open"
locator = "SCS unit hydrograph model, eqs. 36-38, pp. 55-56"
url = "https://www.hec.usace.army.mil/software/hec-hms/documentation/HEC-HMS_Technical%20Reference%20Manual_%28CPD-74B%29.pdf"

[[sources]]
citation = "Rajagopalan, B. CVEN 5333 lecture notes, Unit Hydrographs, after Chow, V.T., Maidment, D.R. and Mays, L.W. (1988), Applied Hydrology, chapter 7, University of Colorado Boulder"
access = "open"
locator = "Snyder's synthetic UHG, pp. 76-78 (eqs. 7.7.2-7.7.4, C1 0.75, C2 2.75, C3 5.56, Cw 2.14 and 1.22 in SI, 770 and 440 in English units, areas of 30 to 30,000 km2); SCS dimensionless hydrograph, p. 79 (C = 2.08, 483.4 in English units)"
url = "https://civil.colorado.edu/~balajir/CVEN5333/Lectures/Unit-Hydrographs-Chow-Chap7.pdf"

[[variables]]
name = "area_km2"
symbol = "A"
unit = "km2"
kind = "real"
description = "Area of the watershed."

[variables.physical]
low = 0.0
low_inclusive = false
test_high = 1000000.0
test_reason = "a million km2, five times the basin of the Vistula (194,000 km2) and four thousand times the largest watershed Hydrograf hands over"

[variables.applicability]
low = 0.0
low_inclusive = true
high = 51.8
high_inclusive = true

[variables.applicability.source]
citation = "USDA-NRCS (2007). National Engineering Handbook, Part 630 Hydrology, Chapter 16: Hydrographs (210-VI-NEH, March 2007)"
access = "open"
locator = "p. 16-4: no subarea to exceed 20 square miles (51.8 km2), the largest no more than 10 times the smallest"
url = "https://irrigationtoolbox.com/NEH/Part630_Hydrology/H_210_630_16.pdf"

[variables.typical]
low = 0.0003
low_inclusive = true
high = 250.0
high_inclusive = true

[variables.typical.source]
