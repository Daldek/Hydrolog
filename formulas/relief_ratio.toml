schema = "nogat-formula-card/1"
name = "relief_ratio"
title = "Relief ratio: the relief of a watershed over a length (Schumm)"
function = "hydrolog.morphometry.terrain.relief_ratio"
family = "index"
formula_version = 1
status = "referenced"
equation = "Rh = (Hmax - Hmin) / L, L in m [m/m]"
latex = "R_h = \\frac{H_{max} - H_{min}}{L}"
validation = "none: a ratio of measured quantities, which its sources compare with no observations"
conventions = ["Rh in m/m (dimensionless), the relief in m over L converted from km to m by the units table; Baścik (2006) and Wartalska print it in m/km (per mille)", "the relief of the whole watershed, its highest point minus its outlet; Baścik (2006, p. 23) notes that hydrological practice may take the water level at the outlet", "L the length_km of the watershed for the relief ratio (Schumm's L is the longest dimension parallel to the main drainage line, Baścik's Lm the valley length); TerrainAnalysis gives the same ratio as the watershed slope, which is not the mean slope of the land, and over the channel length as the slope of the main channel, whose drop is then the watershed's relief, not the channel's head minus its mouth"]
assumptions = []
notices = []
reference_cases = ["tests/fixtures/formulas/morphometry-cases.json"]
tables = []

[properties]
units = "homogeneous"
conservation = []
symmetries = []

[properties.monotonic]
elevation_min_m = -1
elevation_max_m = 1
length_km = -1

[[properties.scalings]]
name = "units_of_length"

[properties.scalings.inputs]
elevation_min_m = 1.0
elevation_max_m = 1.0
length_km = 1.0

[properties.scalings.outputs]

[properties.scalings.tolerance]
reason = "elevations and length scaled by 2 are exact in binary, and so are their difference, the conversion and the quotient"
abs = 0.0

[[properties.limits]]
name = "exact_rational"
text = "Rh equals (Hmax - Hmin) / (1000 L) of the float inputs in exact rational arithmetic"

[[sources]]
citation = "Baścik, M. (2006). Parametry fizjograficzne. In: Pociask-Karteczka, J. (ed.), Zlewnia. Właściwości i procesy. Wydawnictwo Uniwersytetu Jagiellońskiego, Kraków, pp. 21-34"
access = "open"
locator = "eq. (1.2.12): wskaźnik rzeźby Cs = (Hmax - Hmin) / Lm; eq. (1.2.15): the slope of a river, the drop from its source to its mouth over its length"
url = "https://ruj.uj.edu.pl/server/api/core/bitstreams/c5c7e7e9-5f46-4b35-8758-05c7c8201f48/content"

[[sources]]
citation = "Wartalska, K. Hydrologia i ochrona wód, ćwiczenia, cz. 2: Podstawowe wskaźniki charakteryzujące zlewnię. Politechnika Wrocławska, course material"
access = "open"
locator = "section 2.3: wskaźnik rzeźby zlewni Strahlera Jd = dH / L"
url = "https://wis.pwr.edu.pl/download/IjJmY2BjNFWCQpYzskenQnH0gkIw4dLS8zLjlyTXULMRckZjYEKH0FdSl6CBQoKGAveTAPHAAqEWwVBThNdwtoXm5kPQ4,dGJn01DTQ1HGYZeTIYPzM9NWQ0IggOPCpufFZwKnZ7LB0lZjoJNX4YdRRgeAsnbyB0Iml_XkA/hydrologia_i_ochrona_wod_-_cz_2_10.pdf"

[[variables]]
name = "elevation_min_m"
symbol = "H_{min}"
unit = "m"
kind = "real"
description = "Lowest elevation of the watershed, its outlet's [m a.s.l.]."
applicability = "unstated"

[variables.physical]
test_low = -431.0
test_high = 8849.0
test_reason = "the lowest and the highest land on Earth: the shore of the Dead Sea at -431 m and Mount Everest at 8,849 m (CIA, The World Factbook, 2025, field Elevation of Jordan and Nepal)"

[variables.typical]
low = 100.0
low_inclusive = true
high = 750.0
high_inclusive = true

[variables.typical.source]
citation = "Hydrograf's watersheds handed to Hydrolog (Hydrograf 0.5.0.dev0, November 2026): the hand-offs recorded in Hydrolog's tests, Kamiennik to Świerzawa (134.97 km2), a network of 8 subcatchments and the Nysa Szalona network of 18, and the guide's Kamiennik to Świerzawa (37.22 km2)"
access = "open"
locator = "tests/fixtures/handoff_hydrograf*.json and tests/fixtures/kamiennik.json: elevations of 100.0 to 722.68 m"

[[variables]]
name = "elevation_max_m"
symbol = "H_{max}"
unit = "m"
kind = "real"
description = "Highest elevation of the watershed [m a.s.l.]."
applicability = "unstated"

[variables.physical]
test_low = -431.0
test_high = 8849.0
test_reason = "the lowest and the highest land on Earth: the shore of the Dead Sea at -431 m and Mount Everest at 8,849 m (CIA, The World Factbook, 2025, field Elevation of Jordan and Nepal)"

[variables.typical]
low = 100.0
low_inclusive = true
high = 750.0
high_inclusive = true

[variables.typical.source]
citation = "Hydrograf's watersheds handed to Hydrolog (Hydrograf 0.5.0.dev0, November 2026): the hand-offs recorded in Hydrolog's tests, Kamiennik to Świerzawa (134.97 km2), a network of 8 subcatchments and the Nysa Szalona network of 18, and the guide's Kamiennik to Świerzawa (37.22 km2)"
access = "open"
locator = "tests/fixtures/handoff_hydrograf*.json and tests/fixtures/kamiennik.json: elevations of 100.0 to 722.68 m"

[[variables]]
name = "length_km"
symbol = "L"
unit = "km"
kind = "real"
description = "Length of the watershed: the straight line from the outlet to the farthest point of the divide, or the longest flow path Hydrograf hands over."
applicability = "unstated"

[variables.physical]
low = 0.0
low_inclusive = false
test_high = 20000.0
test_reason = "20,000 km, half the circumference of the Earth (40,075 km at the equator): no two points of a watershed lie farther apart"

[variables.typical]
low = 0.05
low_inclusive = true
high = 30.0
high_inclusive = true

[variables.typical.source]
citation = "Hydrograf's watersheds handed to Hydrolog (Hydrograf 0.5.0.dev0, November 2026): the hand-offs recorded in Hydrolog's tests, Kamiennik to Świerzawa (134.97 km2), a network of 8 subcatchments and the Nysa Szalona network of 18, and the guide's Kamiennik to Świerzawa (37.22 km2)"
access = "open"
locator = "tests/fixtures/handoff_hydrograf*.json and tests/fixtures/kamiennik.json: lengths (longest flow paths) of 0.0566 to 28.88 km"

[[constraints]]
name = "rises_above_outlet"
class = "physical"
text = "Hmax > Hmin: a watershed drains to its outlet, so it rises above it"

[constraints.source]
citation = "Baścik, M. (2006). Parametry fizjograficzne. In: Pociask-Karteczka, J. (ed.), Zlewnia. Właściwości i procesy. Wydawnictwo Uniwersytetu Jagiellońskiego, Kraków, pp. 21-34"
access = "open"
locator = "eq. (1.2.12): wskaźnik rzeźby Cs = (Hmax - Hmin) / Lm; eq. (1.2.15): the slope of a river, the drop from its source to its mouth over its length"
url = "https://ruj.uj.edu.pl/server/api/core/bitstreams/c5c7e7e9-5f46-4b35-8758-05c7c8201f48/content"

[[constraints]]
name = "within_float64"
class = "precondition"
text = "(Hmax - Hmin) / L lies within float64: no relief is 10^300 times its length"

[constraints.source]
citation = "Baścik, M. (2006). Parametry fizjograficzne. In: Pociask-Karteczka, J. (ed.), Zlewnia. Właściwości i procesy. Wydawnictwo Uniwersytetu Jagiellońskiego, Kraków, pp. 21-34"
access = "open"
locator = "eq. (1.2.12): wskaźnik rzeźby Cs = (Hmax - Hmin) / Lm; eq. (1.2.15): the slope of a river, the drop from its source to its mouth over its length"
url = "https://ruj.uj.edu.pl/server/api/core/bitstreams/c5c7e7e9-5f46-4b35-8758-05c7c8201f48/content"

[[constants]]
name = "percent"
value = 100.0
unit = "% per m/m"
symbol = "100"

[constants.source]
citation = "BIPM (2019). The International System of Units (SI), 9th edition, version 4.01"
access = "open"
locator = "section 5.4.7: the symbol % (percent) is the number 0.01; the slopes of TerrainAnalysis in percent"
url = "https://www.bipm.org/documents/20126/41483022/SI-Brochure-9-EN.pdf"

[[outputs]]
name = "relief_ratio"
unit = "m/m"
kind = "real"
symbol = "R_h"
description = "Relief ratio: the relief over the length."

[outputs.physical]
low = 0.0
low_inclusive = false

[[traps]]
name = "difference_denominator"
description = "A denominator that is a difference of inputs."
test = "the relief Hmax - Hmin is a difference of inputs in the numerator: equal elevations are refused by the constraint rises_above_outlet (its boundary case)"

[[traps]]
name = "singular_at_bound"
description = "log, sqrt or a negative or fractional power of an input at a bound of its range."
test = "range cases length_km-physical_low_*: Rh grows as 1/L; a value beyond float64 is refused by the precondition within_float64"

[[traps]]
name = "gap_propagation"
description = "A gap (NaN) that propagates through a sum, a convolution or a moving window."
test = "type cases elevation_min_m-nan and the other inputs': a gap is refused"

[[oracles]]
kind = "exact"
description = "(Hmax - Hmin) / (1000 L) of the float inputs in exact rational arithmetic (fractions), rounded once"
test = "tests/unit/test_formulas_relief.py (limit exact_rational)"
conventions = []
