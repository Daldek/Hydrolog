schema = "nogat-formula-card/1"
name = "kerby"
title = "Overland flow time by Kerby's formula (1959)"
function = "hydrolog.time.concentration.ConcentrationTime.kerby"
family = "empirical"
formula_version = 1
status = "referenced"
equation = "tc = (0.67 * N * L / S**0.5)**0.467 [min], L in ft; S + 0.0005 for S below 0.002"
latex = "t_c = \\left(\\frac{0.67\\,N\\,L}{\\sqrt{S}}\\right)^{0.467},\\quad L\\ \\mathrm{[ft]},\\quad S \\to S + 0.0005\\ \\text{for}\\ S < 0.002"
validation = "none reported by the open sources (Kerby 1959 is not open)"
conventions = ["Kerby's form in its source units: L in feet by the exact 0.3048 m/ft of the units table, tc in minutes; the forms K (L N)^0.467 S^-0.235 of TxDOT (K 0.828 for ft, 1.44 for m) round 0.67^0.467 and the exponent 0.467/2 = 0.2335; Hydrolog's 36.37 for L in km up to 0.8.1 rounded 36.3699", "N Kerby's retardance of the overland surface (Roussel et al. 2005, supplement, p. 29), not Manning's n; NEH 630-15 appendix 15A eq. 15A-2 prints (2.2 n l / S^0.5)^0.324, a misprint of this formula", "the low-slope offset of Cleveland et al. (2012, eqs. 1-2): a slope below 0.002 is taken as S + 0.0005; the formula alone decides it by its own slope, where Cleveland et al. decide by the main-channel slope, which overland flow alone does not have; at 0.002 the offset is dropped, so tc rises by 5.35 % as S reaches 0.002 from below and is monotonic in S only on each side of 0.002"]
assumptions = ["Kerby's data: watersheds below 10 acres (0.04 km2, checked by WatershedParameters.calculate_tc), overland flow up to 1,200 ft, slopes below 1 %, N up to 0.8 (Roussel et al. 2005, p. 5); overland (sheet) flow only", "N from Kerby's table (Roussel et al. 2005, supplement, p. 29): pavement 0.02; smooth, bare, packed soil 0.10; poor grass, cultivated row crops or moderately rough packed surfaces 0.20; pasture, average grass 0.40; deciduous forest 0.60; dense grass, coniferous forest or deciduous forest with deep litter 0.80", "Hydrograf's overland segments (0.04-0.7 km at 0.005-0.19 m/m) are mostly steeper than Kerby's data: their results are extrapolations, with the notice"]
notices = ["outside_applicability"]
reference_cases = ["tests/fixtures/formulas/tc-cases.json"]
constraints = []
tables = []

[properties]
units = "unit_specific"
scalings = []
conservation = []
symmetries = []

[properties.monotonic]
length_km = 1
retardance = 1

[[properties.limits]]
name = "decimal"
text = "tc equals (0.67/0.3048)^0.467 (L[m] N)^0.467 S^(-0.467/2) with the offset, evaluated in decimal arithmetic at 50 digits"

[[properties.limits]]
name = "low_slope_step"
text = "tc rises by 1.25^0.2335 - 1 = 5.35 % as S reaches 0.002 from below and the offset is dropped: not monotonic in S"

[[properties.limits]]
name = "power_law"
text = "doubling L or N multiplies tc by 2^0.467"

[[sources]]
citation = "Fang, X., Cleveland, T.G., Garcia, C.A., Thompson, D.B. and Malla, R. (2005). Literature review on timing parameters for hydrographs. TxDOT Research Report 0-4696-1, Lamar University"
access = "open"
locator = "eq. 3.12 and table 3.3, p. 22"
url = "https://rosap.ntl.bts.gov/view/dot/88539/dot_88539_DS1.pdf"

[[sources]]
citation = "Roussel, M.C., Thompson, D.B., Fang, X., Cleveland, T.G. and Garcia, C.A. (2005). Time-parameter estimation for applicable Texas watersheds. TxDOT Research Report 0-4696-2, Lamar University"
access = "open"
locator = "eq. 3, p. 5; supplement, p. 29 (the form K (L N)^0.467 S^-0.235)"
url = "https://rosap.ntl.bts.gov/view/dot/88540/dot_88540_DS1.pdf"

[[sources]]
citation = "Indiana Department of Transportation. Indiana Design Manual (metric, archived), Part IV, chapter 29: Hydrology"
access = "open"
locator = "eq. 29-7.14, Kerby's formula in SI units with K = 1.44"
url = "https://www.in.gov/dot/div/contracts/standards/dm-Archived/07%20Metric/Part%204%20Vol.%201/Ch%2029/Ch29.pdf"

[[sources]]
citation = "Cleveland, T.G., Thompson, D.B., Fang, X. and Li, M.-H. (2012). Guidance for estimation of time of concentration in Texas for low-slope conditions. TxDOT Product 0-6382-P1, Texas Tech University"
access = "open"
locator = "low slope procedures and eq. 2, pp. 1-2"
url = "https://rosap.ntl.bts.gov/view/dot/66537/dot_66537_DS1.pdf"

[[variables]]
name = "length_km"
symbol = "L"
unit = "km"
kind = "real"
description = "Overland (sheet) flow length, from the most remote point to a defined channel or the inlet."

[variables.physical]
low = 0.0
low_inclusive = false
test_high = 1000.0
test_reason = "1,000 km, about the length of the Vistula, the longest river of Poland: no flow path of a Polish watershed is longer"

[variables.applicability]
low = 0.0
low_inclusive = true
high = 0.366
high_inclusive = true

[variables.applicability.source]
citation = "Roussel, M.C., Thompson, D.B., Fang, X., Cleveland, T.G. and Garcia, C.A. (2005). Time-parameter estimation for applicable Texas watersheds. TxDOT Research Report 0-4696-2, Lamar University"
access = "open"
locator = "supplement, p. 29: in the development of Kerby's equation the length of overland flow was as much as about 1,200 feet (366 meters), an upper limit"
url = "https://rosap.ntl.bts.gov/view/dot/88540/dot_88540_DS1.pdf"

[variables.typical]
