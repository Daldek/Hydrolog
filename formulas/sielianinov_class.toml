schema = "nogat-formula-card/1"
name = "sielianinov_class"
title = "Class of Sielianinov's hydrothermal coefficient (Skowera and Puła)"
function = "hydrolog.statistics.meteo_hydrothermal.sielianinov_class"
family = "classification"
formula_version = 1
status = "referenced"
equation = "k <= 0.4 extremely dry, (0.4, 0.7] very dry, (0.7, 1.0] dry, (1.0, 1.3] fairly dry, (1.3, 1.6] optimal, (1.6, 2.0] fairly wet, (2.0, 2.5] wet, (2.5, 3.0] very wet, above 3.0 extremely wet"
latex = "k \\le 0.4,\\ (0.4, 0.7],\\ (0.7, 1.0],\\ (1.0, 1.3],\\ (1.3, 1.6],\\ (1.6, 2.0],\\ (2.0, 2.5],\\ (2.5, 3.0],\\ > 3.0"
validation = "none: a classification"
conventions = ["each limit belongs to the class below it, as the source prints (k <= 0.4 extremely dry); the source's text speaks of ten classes and lists nine", "Miś (2026) and Chmist-Sikorska et al. (2022) use other limits"]
assumptions = []
notices = []
reference_cases = ["tests/fixtures/formulas/meteo-indices-cases.json"]
constraints = []
oracles = []
tables = []

[properties]
units = "unit_specific"
scalings = []
conservation = []
symmetries = []

[properties.monotonic]

[[properties.limits]]
name = "ordered_classes"
text = "a larger coefficient never gives a drier class"

[[sources]]
citation = "Skowera, B. and Puła, J. (2004). Skrajne warunki pluwiotermiczne w okresie wiosennym na obszarze Polski w latach 1971-2000. Acta Agrophysica 3(1), 171-177"
access = "open"
locator = "p. 172: k <= 0.4 extremely dry, 0.4 < k <= 0.7 very dry, 0.7 < k <= 1.0 dry, 1.0 < k <= 1.3 fairly dry, 1.3 < k <= 1.6 optimal, 1.6 < k <= 2.0 fairly wet, 2.0 < k <= 2.5 wet, 2.5 < k <= 3.0 very wet, k > 3.0 extremely wet"
url = "http://www.acta-agrophysica.org/pdf-108195-38985?filename=38985.pdf"

