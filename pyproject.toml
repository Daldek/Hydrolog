[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrolog"
dynamic = ["version"]
description = "Python library for hydrological calculations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Daldek"}
]
keywords = [
    "hydrology",
    "SCS-CN",
    "hydrograph",
    "runoff",
    "precipitation",
    "watershed"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
raster = [
    "rasterio>=1.3",
    "pyproj>=3.6",
]
mcp = [
    "mcp>=2.3,<3",
]
visualization = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
]
all = [
    "rasterio>=1.3",
    "pyproj>=3.6",
    "mcp>=2.3,<3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.scripts]
hydrolog = "hydrolog.cli.main:main"

[project.urls]
Homepage = "https://github.com/Daldek/Hydrolog"
Repository = "https://github.com/Daldek/Hydrolog.git"
Issues = "https://github.com/Daldek/Hydrolog/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hydrolog*"]

[tool.setuptools.package-data]
hydrolog = ["py.typed", "_data/agents/*.md"]

[tool.setuptools.dynamic]
version = {attr = "hydrolog.__version__"}

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.18",
]

[tool.ruff]
target-version = "py312"
line-length = 88
# Local Claude Code settings and temporary agent worktrees (also in .gitignore);
# notebooks and Markdown code blocks are documentation examples.
extend-exclude = [".claude", "*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = ['^\.claude/']

[[tool.mypy.overrides]]
# SciPy, seaborn and jsonschema ship neither a py.typed marker nor bundled stubs.
module = ["scipy", "scipy.*", "seaborn", "seaborn.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Shortfall of the tests (DEV-7.3; a deviation listed in CLAUDE.md)
module = ["tests", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false
check_untyped_defs = false
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# The default run and the gate exclude `live` (DEV-10.1); `-m live` replaces it.
addopts = "--strict-markers -m 'not live' --tb=short"
markers = [
    "live: real network services (none in this project); run on demand",
    "slow: more than ~10 s or Docker",
    "db: needs a database (none in this project)",
]

[tool.coverage.run]
source = ["hydrolog"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
