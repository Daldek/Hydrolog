[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrolog"
dynamic = ["version"]
description = "Watershed hydrology: SCS-CN, design hyetographs, time of concentration, unit hydrographs, morphometry, flow statistics, soil groups. Python library, CLI and MCP server; runs offline, except the PMAXTP depths it fetches from IMGW-PIB through Obserwator."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    {name = "Piotr de Bever", email = "git@debever.pl"}
]
keywords = [
    "hydrology",
    "scs-cn",
    "curve-number",
    "hydrograph",
    "unit-hydrograph",
    "hyetograph",
    "time-of-concentration",
    "runoff",
    "precipitation",
    "watershed",
    "flow-statistics",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
raster = [
    "rasterio>=1.3",
    "pyproj>=3.6",
]
# Capped below 3 (DEV-6.4): the server is written against the low-level Server API of
# MCP SDK v2, which implements MCP specification 2026-07-28; a major release may break
# it. The "all" extra repeats the requirement.
mcp = [
    "mcp>=2.3,<3",
]
viz = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
]
# The PMAXTP depths of IMGW-PIB (`precip pmaxtp`, ADR-0018), fetched through Obserwator:
# the only command that uses the network. Obserwator is a Git tag, not on PyPI, so
# `[tool.uv.sources]` pins its tag (REL-5.1), or the commit of Nogat's release set
# before its release (the release commit replaces it with a tag). The "gui" and "all"
# extras repeat it.
pmaxtp = [
    "obserwator>=3.1.0,<4",
]
# The web GUI (`hydrolog gui serve`, the `nogat.gui` module): Starlette's routing,
# StaticFiles and TestClient, served by uvicorn, and Obserwator for the PMAXTP depth of
# „Hydrogram zlewni”. The "all" extra repeats it.
gui = [
    "starlette>=1.10,<2",
    "uvicorn>=0.54,<1",
    "obserwator>=3.1.0,<4",
]
all = [
    "rasterio>=1.3",
    "pyproj>=3.6",
    "mcp>=2.3,<3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "starlette>=1.10,<2",
    "uvicorn>=0.54,<1",
    "obserwator>=3.1.0,<4",
]

[project.scripts]
hydrolog = "hydrolog.cli.main:main"
hydrolog-mcp = "hydrolog.mcp.server:main"

# The GUI as a hosted module of Nogat's GUI platform (plan 2026-11-02, D4).
[project.entry-points."nogat.gui"]
hydrolog = "hydrolog.gui:gui_module"

[project.urls]
Homepage = "https://github.com/Daldek/Hydrolog"
Source = "https://github.com/Daldek/Hydrolog.git"
Documentation = "https://github.com/Daldek/Hydrolog/blob/main/docs/USAGE.md"
Changelog = "https://github.com/Daldek/Hydrolog/blob/main/docs/CHANGELOG.md"
Issues = "https://github.com/Daldek/Hydrolog/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hydrolog*"]

[tool.setuptools.package-data]
hydrolog = ["py.typed", "_data/agents/*.md", "_data/tables/*.csv", "schemas/*.json", "gui/web/**/*"]

[tool.setuptools.dynamic]
version = {attr = "hydrolog.__version__"}

[tool.uv.sources]
# Obserwator 3.3.0 is not tagged yet: the commit of its `chore/release-3.3.0` in
# Nogat's release set candidate-16 (REL-5.3); its version 3.3.0 is within the
# declared range >=3.1.0,<4 (REL-5.6). Once Obserwator is released this branch
# replaces it with the tag v3.3.0.
obserwator = { git = "https://github.com/Daldek/Obserwator.git", rev = "2637350d009896d4554b3b252a725c7613897f5d" }

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.18",
    # Starlette's TestClient (tests/integration/gui), which uses httpx2 (httpx is
    # deprecated there), and the browser tests (tests/e2e; Chromium:
    # `uv run --no-sync playwright install chromium`).
    "httpx2>=2.16,<3",
    "playwright>=1.64,<2",
    # The generated range, type and property tests of the formulas (Hypothesis,
    # Nogat CMP-6.5, CMP-6.9) and their mutation testing (mutmut, CMP-7.1), at the
    # versions of Nogat's release set (CMP-8.3).
    "hypothesis>=6.170.15",
    "mutmut>=3.8.1",
    # The exact oracles of the interval specs, evaluated at 50 digits (Nogat CMP-6.2).
    "mpmath>=1.4.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88
# Local Claude Code settings and temporary agent worktrees (also in .gitignore);
# notebooks and Markdown code blocks are documentation examples.
extend-exclude = [".claude", "*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# The research script of a frozen oracle, kept byte for byte as it ran (Nogat CMP-6.4).
"tests/oracles/trend_regime/build_datasets.py" = ["E501", "SIM905"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = ['^\.claude/']

[[tool.mypy.overrides]]
# SciPy, seaborn, jsonschema and mpmath ship neither a py.typed marker nor bundled stubs.
module = ["scipy", "scipy.*", "seaborn", "seaborn.*", "jsonschema", "jsonschema.*", "mpmath", "mpmath.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Shortfall of the tests (DEV-7.3; a deviation listed in CLAUDE.md)
module = ["tests", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false
check_untyped_defs = false
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# The default run and the gate exclude `live` (DEV-10.1) and `nightly` (the coverage
# of the intervals, Nogat CMP-6.11); `-m live` or `-m nightly` replaces it.
addopts = "--strict-markers -m 'not live and not nightly' --tb=short"
markers = [
    "live: real network services (the PMAXTP of IMGW-PIB); run on demand",
    "slow: more than ~10 s or Docker",
    "db: needs a database (none in this project)",
    "formula: a test of a formula of the computation standard (Nogat CMP-6.8)",
    "nightly: the simulated coverage of an interval (Nogat CMP-6.11), nightly and before each release, never in the gate",
]

[tool.coverage.run]
source = ["hydrolog"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
