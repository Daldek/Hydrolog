name: CI debug platforms
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  debug:
    name: debug (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Setup
        run: |
          uv sync --locked --all-extras
          uv run --no-sync playwright install --with-deps chromium
      - name: Debug tests
        shell: bash
        run: >-
          uv run --no-sync pytest -p no:cacheprovider -v -s --tb=long --maxfail=3
          tests/e2e/test_zz_debug.py
          "tests/e2e/test_smoke.py::test_every_section_and_the_guide_open_cleanly"
          tests/e2e/test_polecenia.py::test_a_command_chosen_in_the_list_is_in_the_hash_and_a_hash_opens_it
